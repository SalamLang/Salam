---
name: 'Deploy over SSH'
description: 'Mirror a local directory to a path on a server over SSH (rsync, with a tar fallback). Keeps server-only files such as .well-known/ and .htaccess.'
author: 'SalamLang'

branding:
  icon: 'upload-cloud'
  color: 'green'

inputs:
  source:
    description: 'Local directory whose contents are published.'
    required: true
  target:
    description: 'Absolute directory on the server that receives the contents.'
    required: true
  host:
    description: 'Server host name or IP.'
    required: true
  port:
    description: 'SSH port.'
    required: false
    default: '22'
  username:
    description: 'SSH user.'
    required: true
  private-key:
    description: 'Private key for the SSH user. Preferred over password.'
    required: false
    default: ''
  password:
    description: 'Password for the SSH user, used only when no private key is given.'
    required: false
    default: ''
  known-hosts:
    description: 'known_hosts lines for the server. When empty, the host key is fetched with ssh-keyscan at deploy time and a warning shows its fingerprint.'
    required: false
    default: ''
  allowed-root:
    description: 'When set, the target must be a folder inside this directory (for example /hosts/).'
    required: false
    default: ''
  exclude:
    description: 'Space-separated rsync patterns that are not uploaded.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Check deploy inputs
      shell: bash
      env:
        SRC: ${{ inputs.source }}
        TARGET: ${{ inputs.target }}
        HOST: ${{ inputs.host }}
        PORT: ${{ inputs.port }}
        USER_NAME: ${{ inputs.username }}
        KEY: ${{ inputs.private-key }}
        PASS: ${{ inputs.password }}
        ROOT: ${{ inputs.allowed-root }}
      run: |
        set -euo pipefail
        fail() { echo "::error::$1"; exit 1; }
        [ -n "$HOST" ] || fail "deploy host is empty (is the SSH_HOST secret set?)"
        [ -n "$USER_NAME" ] || fail "deploy user is empty (is the SSH_USERNAME secret set?)"
        [ -n "$KEY" ] || [ -n "$PASS" ] || fail "neither a private key nor a password was given"
        case "$PORT" in '' | *[!0-9]*) fail "SSH port '$PORT' is not a number" ;; esac
        [ -d "$SRC" ] || fail "source directory '$SRC' does not exist"
        [ -n "$(ls -A "$SRC")" ] || fail "source directory '$SRC' is empty"
        case "$TARGET" in
          '' ) fail "target path is empty (is the path secret set?)" ;;
          /* ) ;;
          * ) fail "target path must be absolute" ;;
        esac
        case "$TARGET" in
          *..* | *[[:space:]]* | *\'* | *\"* | *\$* | *\`* ) fail "target path must not contain '..', whitespace, quotes, '$' or backticks" ;;
        esac
        trimmed="${TARGET%/}"
        depth=$(printf '%s' "$trimmed" | tr -cd '/' | wc -c)
        [ "$depth" -ge 2 ] || fail "refusing to deploy into a top-level directory ('$TARGET')"
        if [ -n "$ROOT" ]; then
          root="${ROOT%/}/"
          case "$trimmed/" in
            "$root"?*) ;;
            *) fail "target must be a folder inside $root" ;;
          esac
        fi

    - name: Prepare SSH
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        PORT: ${{ inputs.port }}
        KEY: ${{ inputs.private-key }}
        PASS: ${{ inputs.password }}
        KNOWN: ${{ inputs.known-hosts }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/deploy-ssh"
        mkdir -p "$dir"
        chmod 700 "$dir"
        if [ -n "$KNOWN" ]; then
          printf '%s\n' "$KNOWN" > "$dir/known_hosts"
        else
          ssh-keyscan -p "$PORT" -T 15 "$HOST" > "$dir/known_hosts" 2>/dev/null
        fi
        [ -s "$dir/known_hosts" ] || { echo "::error::could not get the server's host key"; exit 1; }
        if [ -z "$KNOWN" ]; then
          echo "::warning::the server's host key is not pinned; add an SSH_KNOWN_HOSTS secret to stop trusting whatever key the network returns"
          ssh-keygen -lf "$dir/known_hosts" || true
        fi
        opts="-p $PORT -o UserKnownHostsFile=$dir/known_hosts -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ConnectTimeout=20"
        if [ -n "$KEY" ]; then
          printf '%s\n' "$KEY" > "$dir/id"
          chmod 600 "$dir/id"
          opts="$opts -i $dir/id -o IdentitiesOnly=yes -o BatchMode=yes"
          echo "DEPLOY_SSH_PREFIX=" >> "$GITHUB_ENV"
        else
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
          echo "DEPLOY_SSH_PREFIX=sshpass -e" >> "$GITHUB_ENV"
          opts="$opts -o PubkeyAuthentication=no -o PreferredAuthentications=password"
        fi
        echo "DEPLOY_SSH_OPTS=$opts" >> "$GITHUB_ENV"

    - name: Upload files
      shell: bash
      env:
        SRC: ${{ inputs.source }}
        TARGET: ${{ inputs.target }}
        HOST: ${{ inputs.host }}
        USER_NAME: ${{ inputs.username }}
        SSHPASS: ${{ inputs.password }}
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        set -euo pipefail
        remote="$USER_NAME@$HOST"
        dest="${TARGET%/}"
        # shellcheck disable=SC2086
        run_ssh() { $DEPLOY_SSH_PREFIX ssh $DEPLOY_SSH_OPTS "$remote" "$@"; }
        run_ssh "mkdir -p '$dest'"
        excludes=(--exclude='.well-known/' --exclude='.htaccess' --exclude='.user.ini' --exclude='cgi-bin/')
        tar_excludes=()
        read -r -a extra <<< "$EXCLUDE"
        for pat in "${extra[@]}"; do
          excludes+=("--exclude=$pat")
          tar_excludes+=("--exclude=$pat")
        done
        if run_ssh "command -v rsync" >/dev/null 2>&1; then
          # shellcheck disable=SC2086
          $DEPLOY_SSH_PREFIX rsync -rlz --delete --delay-updates \
            --chmod=D755,F644 "${excludes[@]}" \
            -e "ssh $DEPLOY_SSH_OPTS" \
            "${SRC%/}/" "$remote:$dest/"
        else
          echo "::warning::rsync is not installed on the server; copying with tar, so files removed from the build stay on the server"
          tar -C "$SRC" "${tar_excludes[@]}" -czf - . | run_ssh "tar -xzf - -C '$dest'"
        fi
        echo "deployed $(find "$SRC" -type f | wc -l) files to $HOST:$dest"

    - name: Remove SSH credentials
      if: always()
      shell: bash
      run: rm -rf "$RUNNER_TEMP/deploy-ssh"
