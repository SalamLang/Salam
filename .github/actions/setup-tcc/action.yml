---
name: 'Setup tcc'
description: 'Build tcc from the TinyCC commit pinned in tools/ci/tinycc-ref.txt, cache it, and put it on PATH.'
author: 'SalamLang'

branding:
  icon: 'cpu'
  color: 'green'

inputs:
  prefix:
    description: 'Directory to install tcc into.'
    required: false
    default: ''
  add-to-path:
    description: 'Add the installed tcc to PATH for later steps.'
    required: false
    default: 'true'

outputs:
  tcc:
    description: 'Absolute path to the installed tcc binary.'
    value: ${{ steps.locate.outputs.tcc }}

runs:
  using: composite
  steps:
    - name: Resolve install prefix
      id: prefix
      shell: bash
      env:
        IN_PREFIX: ${{ inputs.prefix }}
      run: |
        set -eu
        p="$IN_PREFIX"
        [ -n "$p" ] || p="$HOME/.local/tcc"
        echo "prefix=$p" >> "$GITHUB_OUTPUT"

    - name: Restore cached tcc
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.prefix.outputs.prefix }}
        key: tcc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/tinycc-ref.txt') }}-v1

    - name: Build tcc from the pinned commit
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TCC_PREFIX: ${{ steps.prefix.outputs.prefix }}
      run: sh tools/ci/build-tcc.sh "$TCC_PREFIX"

    - name: Locate and verify
      id: locate
      shell: bash
      env:
        TCC_PREFIX: ${{ steps.prefix.outputs.prefix }}
        ADD_TO_PATH: ${{ inputs.add-to-path }}
      run:
        | # zizmor: ignore[github-env] the directory is derived from the action's own install prefix, not from attacker-controlled input
        set -eu
        p="$TCC_PREFIX"
        for cand in "$p/bin/tcc" "$p/tcc" "$p/tcc.exe"; do
          [ -x "$cand" ] && { echo "tcc=$cand" >> "$GITHUB_OUTPUT"; bin=$(dirname "$cand"); break; }
        done
        [ -n "${bin:-}" ] || { echo "::error::no tcc under $p"; exit 1; }
        "$bin"/tcc -v
        if [ "$ADD_TO_PATH" = 'true' ]; then
          echo "$bin" >> "$GITHUB_PATH"
        fi
