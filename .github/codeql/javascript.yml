---
name: Salam JavaScript/TypeScript analysis

# tests/en/apps/httpbench/bench holds the reference servers the HTTP benchmark
# measures Salam against: a node/express server, a PHP script, and nginx and
# apache configs. They are started on 127.0.0.1 by run.sh, measured, and killed
# again; nothing in there is shipped, deployed, or reachable from a network.
#
# Scanning them reports the properties that make them a usable baseline as
# vulnerabilities in Salam: /file reads a file on every request because that is
# the cost the route exists to measure, and /search echoes its query string
# back because main.salam's /search does. Rate-limiting the node server, or
# dropping the routes that reflect input, would leave the two columns of the
# benchmark measuring different work.
paths-ignore:
  - tests/en/apps/httpbench/bench
