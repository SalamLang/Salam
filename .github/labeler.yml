---
config:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - config/**/*
documentation:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - docs/**/*
              - '**/*.md'
tests:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - tests/**/*
github:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - .github/**/*
source-code:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '**/*.c'
scripts:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '**/*.sh'
repo:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '*'
