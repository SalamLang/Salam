title = "Salam gitleaks config"

# Extend the upstream gitleaks ruleset; the entries below only carve out
# checked-in test fixtures that are not credentials for anything.
[extend]
useDefault = true

[[allowlists]]
description = "Known public test vectors, not real secrets"
regexes = [
  '''dGhlIHNhbXBsZSBub25jZQ==''',
]
paths = [
  '''tests/fixtures/ssl/server\.key''',
]

[[allowlists]]
description = """
std/ssh self-test fixtures. Three throwaway 1024-bit RSA keys generated with
ssh-keygen for the sole purpose of exercising the PKCS#1 / PKCS#8 / OpenSSH
private-key parsers in std/ssh/privatekey.salam. They protect nothing, are
never used to authenticate anywhere, and are deliberately too weak to be
usable in production.
"""
targetRules = ["private-key"]
paths = [
  '''std/ssh/selftest_privatekey\.salam''',
]

[[allowlists]]
description = """
std/tls/privkey.salam quotes the PEM banner strings ("-----BEGIN RSA PRIVATE
KEY-----" and friends) in documentation comments and in the parser's own
marker table. No key material is present.
"""
targetRules = ["private-key"]
paths = [
  '''std/tls/privkey\.salam''',
]

[[allowlists]]
description = """
JWT test vectors for std/jwt. Two of these are the jwt.io sample token and the
"alg": "none" forgery, both quoted verbatim in every JWT tutorial ever written;
the rest are signed in the test itself with the dummy SECRET declared a few
lines above, and the expected string is checked back to catch a signing
regression. None of them authenticates anything.
"""
targetRules = ["jwt"]
paths = [
  '''tests/en/apps/auth/jwt_.*''',
  '''tests/en/stdlib/jwt_demo\.salam''',
]

[[allowlists]]
description = """
std/doc.html is the generated stdlib API documentation. It renders the source
of every pub declaration in std/, which includes the three std/ssh self-test
fixture keys allowlisted above. Nothing new is exposed here: the same throwaway
key material, reachable from a second, generated file.
"""
targetRules = ["private-key"]
paths = [
  '''std/doc\.html''',
]

[[allowlists]]
description = """
"AKIA1234567890ABCD" is a fake, AWS-key-shaped placeholder. std/env's masking
helpers and the layered .env loader take it as input, and the tests assert on
the masked form of that exact string ("AK****CD"), so the literal has to appear
verbatim. It grants nothing, and an AWS key that merely looks similar is still
reported - the allowlist matches this one string, not the shape.
"""
targetRules = ["generic-api-key"]
regexes = [
  '''AKIA1234567890ABCD''',
]

[[allowlists]]
description = """
tests/en/stdlib/google_demo.salam is a service-account document fed to
google.ParseServiceAccount. Its "private_key" field holds the two PEM banner
lines with "MIIEvQ==" (and, in a second document, a single "x") between them,
because the parser has to see something PEM-shaped to parse; the test asserts
the decoder unescaped the newlines and that the value starts with BEGIN
PRIVATE KEY. Nothing signs with it - that would need a real key, which is the
part the test deliberately does not do.
"""
targetRules = ["private-key"]
paths = [
  '''tests/en/stdlib/google_demo\.salam''',
]

[[allowlists]]
description = """
tests/en/stdlib/webpush_demo.salam is the RFC 8291 Appendix A test vector,
whole: subscription endpoint, p256dh, auth secret, the sender key pair and the
salt, all of them printed in the RFC so that an implementation can be checked
against it. Using those exact values is what makes the vector a vector.
"""
targetRules = ["generic-api-key"]
paths = [
  '''tests/en/stdlib/webpush_demo\.salam''',
]
