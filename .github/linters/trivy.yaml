---
# Trivy configuration for Super-Linter.
#
# This is Super-Linter's own TEMPLATES/trivy.yaml with one addition:
# "ignorefile", which points at the repository's .trivyignore.yaml. Trivy
# only auto-detects a plain .trivyignore (a bare list of rule IDs, with no
# way to scope an entry to a path), so the YAML ignore file has to be named
# explicitly here. Keep the rest of this file in sync with upstream.
exit-code: 1
exit-on-eol: 2
ignorefile: .trivyignore.yaml
scan:
  disable-telemetry: true
  scanners:
    - vuln
    - misconfig
    - secret
