---
name: 🤖 PR - Salam AI Review
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: # checkov:skip=CKV_GHA_7: a manual review has to name the pull request number
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: ai-pr-review-${{ github.event.inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    name: Review pull request
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # Check out the base branch only. Nothing from the pull request is ever
      # executed: the script reads the diff through the GitHub API.
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Ask Salam AI and comment on the pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr || github.event.pull_request.number }}
          SALAM_AI_API_KEY: ${{ secrets.SALAM_AI_API_KEY }}
          SALAM_AI_PROJECT: salam-github-review
        run: python3 .github/scripts/ai_pr_review.py
