---
name: 📱 Application - Signed Android build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and sign the AAB and APKs
    permissions:
      contents: read
    uses: ./.github/workflows/_reusable-android-build.yml # zizmor: ignore[self-repository]
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
