---
name: 📱 Android - Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Publish as a nightly/prerelease (uses version from VERSION file)'
        required: false
        default: false
        type: boolean
      nightly_date:
        description: 'Date suffix for nightly tag (YYYY-MM-DD, default: today UTC)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Resolve version
    if: |
      github.ref == 'refs/heads/main' &&
      github.repository == 'SalamLang/Salam' &&
      ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')) ||
       (github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      title: ${{ steps.v.outputs.title }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read version and compute release metadata
        id: v
        env:
          NIGHTLY: ${{ inputs.nightly }}
          NIGHTLY_DATE_INPUT: ${{ inputs.nightly_date }}
        run: |
          set -euo pipefail
          VERSION=$(sed 's/^[ \t]*//;s/[ \t]*$//' VERSION)
          [ -n "$VERSION" ] || { echo "::error::VERSION is empty"; exit 1; }
          if [ "${NIGHTLY:-false}" = "true" ]; then
            NIGHTLY_DATE="$NIGHTLY_DATE_INPUT"
            [ -n "$NIGHTLY_DATE" ] || NIGHTLY_DATE="$(date -u +%Y-%m-%d)"
            TAG="android-v${VERSION}-nightly-${NIGHTLY_DATE}"
            TITLE="Salam Android Nightly Release v${VERSION}-nightly-${NIGHTLY_DATE}"
            PRERELEASE=true
          else
            TAG="android-v${VERSION}"
            TITLE="Salam Android Release v${VERSION}"
            PRERELEASE=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "title=$TITLE"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and sign Android AAB + APKs
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/_reusable-android-build.yml # zizmor: ignore[self-repository]
    with:
      version_name: ${{ needs.version.outputs.version }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  release:
    name: Publish Android release
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE_TITLE: ${{ needs.version.outputs.title }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Download Android AAB + APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: salam-android-release
          path: ./release
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release
          files=(salam-*-android*.aab salam-*-android-*.apk)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no Android release files found"; exit 1; }
          : > SHA256SUMS
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256" >> SHA256SUMS
          done
          sha256sum -c SHA256SUMS
          {
            echo "### Salam Android $VERSION checksums (SHA-256)"
            echo ""
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete existing prerelease tag if found
        run: |
          set -euo pipefail
          pre=$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || true)
          if [ "$pre" = "false" ]; then
            echo "::error::$TAG is already published as a stable release; refusing to delete it."
            exit 1
          fi
          if gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null; then
            echo "Deleted existing release $TAG (and its tag)."
          else
            echo "No existing release $TAG."
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          git tag -d "$TAG" 2>/dev/null || true
      - name: Publish Salam Android release
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/salam-*-android*.aab release/salam-*-android-*.apk release/*.sha256 release/SHA256SUMS)
          [ "${#assets[@]}" -gt 0 ] || { echo "::error::no Android release assets found"; exit 1; }
          PRERELEASE_FLAG=""
          [ "$PRERELEASE" = "true" ] && PRERELEASE_FLAG="--prerelease"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Salam Android v${VERSION}" \
            ${PRERELEASE_FLAG:+"$PRERELEASE_FLAG"} \
            "${assets[@]}"
