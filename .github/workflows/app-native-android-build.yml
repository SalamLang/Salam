---
name: 📱 Native UI - Build (Android)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/_changes.yml # zizmor: ignore[self-repository]
    with:
      paths: |
        mobile/host/*
        std/gui/*
        tools/bash/build-android-app.sh
        .github/workflows/_changes.yml
        .github/workflows/app-native-android-build.yml
  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Build a page as an Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Salam
        id: salam
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]

      - name: Set up JDK 21 (Temurin) + Gradle cache
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/host/android/project/gradle/libs.versions.toml
            mobile/host/android/project/**/*.gradle.kts

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            >/dev/null 2>&1 || true

      - name: Build the counter page
        env:
          SALAM: ${{ steps.salam.outputs.salam }}
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          set -eu
          sh tools/bash/build-android-app.sh tests/en/ui/counter.salam \
            --out "$RUNNER_TEMP/native-android" --abi arm64-v8a,x86_64
          test -s "$RUNNER_TEMP/native-android/app.apk"
