---
name: 📱 Native UI - Build (iOS)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/_changes.yml # zizmor: ignore[self-repository]
    with:
      paths: |
        mobile/host/*
        std/gui/*
        tools/bash/build-ios-app.sh
        tools/bash/build-selfhost.sh
        .github/workflows/_changes.yml
        .github/workflows/app-native-ios-build.yml
  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Build a page as an iOS app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Salam
        id: salam
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]

      - name: Build the compiler from this checkout
        id: tree
        env:
          SEED: ${{ steps.salam.outputs.salam }}
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tree"
          sh tools/bash/build-selfhost.sh --seed "$SEED" --output "$RUNNER_TEMP/tree/salam"
          "$RUNNER_TEMP/tree/salam" --version
          echo "salam=$RUNNER_TEMP/tree/salam" >> "$GITHUB_OUTPUT"

      - name: Build the counter page
        env:
          SALAM: ${{ steps.tree.outputs.salam }}
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          set -eu
          sh tools/bash/build-ios-app.sh tests/en/ui/counter.salam \
            --out "$RUNNER_TEMP/native-ios"
          test -s "$RUNNER_TEMP/native-ios/App.app/App"
          test -s "$RUNNER_TEMP/native-ios/App.app/Info.plist"
          lipo -info "$RUNNER_TEMP/native-ios/App.app/App"

      - name: Run the smoke page on the simulator
        env:
          SALAM: ${{ steps.tree.outputs.salam }}
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          set -eu
          sh tools/bash/build-ios-app.sh mobile/host/ios/smoke.salam \
            --out "$RUNNER_TEMP/smoke-ios" --id app.salam.smoke
          dev=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          test -n "$dev"
          xcrun simctl boot "$dev"
          xcrun simctl bootstatus "$dev" -b
          xcrun simctl install "$dev" "$RUNNER_TEMP/smoke-ios/App.app"
          log="$RUNNER_TEMP/smoke.log"
          : > "$log"
          xcrun simctl launch --console-pty "$dev" app.salam.smoke \
            -salam-script "wait 3000;tap 200,300;wait 3000;tap 200,300;wait 3000;tap 200,300" > "$log" 2>&1 &
          pid=$!
          i=0
          while [ $i -lt 90 ]; do
            grep -q "smoke tapped" "$log" && break
            sleep 2
            i=$((i + 1))
          done
          kill "$pid" 2>/dev/null || true
          xcrun simctl shutdown "$dev" || true
          cat "$log"
          grep -q "smoke tapped" "$log"
