---
name: 📱 Native UI - Build (iOS)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/_changes.yml # zizmor: ignore[self-repository]
    with:
      paths: |
        mobile/host/*
        std/gui/*
        tools/bash/build-ios-app.sh
        .github/workflows/_changes.yml
        .github/workflows/app-native-ios-build.yml
  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Build a page as an iOS app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Salam
        id: salam
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]

      - name: Build the counter page
        env:
          SALAM: ${{ steps.salam.outputs.salam }}
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          set -eu
          sh tools/bash/build-ios-app.sh tests/en/ui/counter.salam \
            --out "$RUNNER_TEMP/native-ios"
          test -s "$RUNNER_TEMP/native-ios/App.app/App"
          test -s "$RUNNER_TEMP/native-ios/App.app/Info.plist"
          lipo -info "$RUNNER_TEMP/native-ios/App.app/App"
