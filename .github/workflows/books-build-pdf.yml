---
name: 📚 Books - Build & Validate PDFs

on:
  push:
    branches:
      - main
    paths:
      - 'books/**'
      - '.github/workflows/books-build-pdf.yml'
  pull_request:
    paths:
      - 'books/**'
      - '.github/workflows/books-build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & validate the ${{ matrix.lang }} book
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lang: [en, fa]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build books image (cached)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: books/docker
          file: books/docker/Dockerfile
          tags: salam-books:latest
          load: true
          cache-from: type=gha,scope=books
          cache-to: type=gha,mode=max,scope=books

      - name: Build the ${{ matrix.lang }} book (XeLaTeX in Docker)
        run: |
          set -euo pipefail
          # books/en has one book (intro-programming); books/fa now has
          # several (see build.sh, which builds every book.tex it finds
          # under books/<lang>/), and salam-programming is the current,
          # actively maintained one this job validates and uploads - keep
          # this mapping in sync if that changes.
          case "${{ matrix.lang }}" in
            en) book_dir=intro-programming ;;
            fa) book_dir=salam-programming ;;
            *) echo "::error::no book directory mapped for lang '${{ matrix.lang }}'"; exit 1 ;;
          esac
          echo "book_dir=$book_dir" >> "$GITHUB_ENV"
          rm -f "books/${{ matrix.lang }}/$book_dir/"book.{aux,log,out,toc,xdv,pdf,fls,fdb_latexmk}
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          export HOST_UID HOST_GID
          docker compose -f books/docker/docker-compose.yml run --rm books ${{ matrix.lang }}

      - name: Verify the generated PDF is valid
        run: |
          set -euo pipefail
          lang="${{ matrix.lang }}"
          pdf="books/${lang}/${book_dir}/book.pdf"

          if [ ! -f "$pdf" ]; then
            echo "::error::Expected PDF was not generated: $pdf"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils qpdf

          echo "::group::qpdf --check $pdf"
          qpdf --check "$pdf" || echo "::warning::qpdf reported issues for $pdf (see log above)"
          echo "::endgroup::"

          info="$(pdfinfo "$pdf")"
          echo "$info"
          pages="$(printf '%s\n' "$info" | awk '/^Pages:/ {print $2}')"
          case "$pages" in
            ''|*[!0-9]*)
              echo "::error::Could not read a valid page count from $pdf"
              exit 1
              ;;
          esac
          if [ "$pages" -lt 1 ]; then
            echo "::error::$pdf reports $pages pages"
            exit 1
          fi

          size="$(du -h "$pdf" | cut -f1)"
          echo "✅ ${lang} book is a valid PDF: ${pages} pages, ${size}"

          {
            echo "### 📘 ${lang} book - valid PDF"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Pages | ${pages} |"
            echo "| Size | ${size} |"
          } >> "$GITHUB_STEP_SUMMARY"

          cp "$pdf" "intro-to-salam-${lang}.pdf"

      - name: Upload the ${{ matrix.lang }} PDF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-book-${{ matrix.lang }}
          path: intro-to-salam-${{ matrix.lang }}.pdf
          if-no-files-found: error
          retention-days: 30
