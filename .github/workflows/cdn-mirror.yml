---
name: 🪞 CDN mirror
on:
  release:
    types:
      - published
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdn-mirror
  cancel-in-progress: false
jobs:
  mirror:
    name: Mirror the release to cdn.salamlang.ir
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Ask the server to mirror now
        env:
          HOST: ${{ secrets.SALAM_DEPLOY_HOST }}
          KEY: ${{ secrets.SALAM_DEPLOY_KEY }}
          KNOWN: ${{ secrets.SALAM_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          if [ -z "$HOST" ] || [ -z "$KEY" ] || [ -z "$KNOWN" ]; then
            echo "::notice::SALAM_DEPLOY_HOST, SALAM_DEPLOY_KEY and SALAM_DEPLOY_KNOWN_HOSTS are not all set; skipping. The server's own timer mirrors new releases within 15 minutes."
            exit 0
          fi
          dir="$RUNNER_TEMP/ssh"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s\n' "$KEY" > "$dir/id" && chmod 600 "$dir/id"
          printf '%s\n' "$KNOWN" > "$dir/known_hosts"
          ssh -i "$dir/id" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "root@$HOST" cdn

      - name: Remove SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
