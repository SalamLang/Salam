---
name: 🧪 Compiler - Build & Test (Alpine + LLVM 22)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    name: Self-host salam and run the test suite
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build context is the repo root now (not compiler/) — std/ and tests/
      # live alongside compiler/ post-self-host-restructure, and the
      # self-hosted compiler needs std/ to run at all.
      - name: Build toolchain image (cached)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: compiler/docker/Dockerfile
          target: toolchain
          tags: salam-toolchain:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Self-hosted: no C source, no make, no ccache — compiler/salam (the
      # tracked bootstrap binary) builds a fresh compiler/salam from
      # compiler/main.salam, then tools/bash/run-tests.sh runs the real
      # end-to-end test suite against it (this is the "make test"
      # replacement: there is no make target anymore).
      - name: Build and test
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}":/work \
            -w /work salam-toolchain:ci \
            sh -c 'sh compiler/tools/bash/build-compiler.sh && sh compiler/tools/bash/run-tests.sh'
