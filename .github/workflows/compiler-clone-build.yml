---
name: 🔧 Compiler - Clone & Build (Windows / macOS / Linux)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test-git-clone:
    timeout-minutes: 15
    name: 'Test git clone on ${{ matrix.os }}'
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-slim
          - macos-26
          - macos-15
          - macos-14
          - windows-2025-vs2026
          - windows-2025
          - windows-2022
          - windows-11-arm
    steps:
      - name: 'Checkout ${{ github.ref }} ( ${{ github.sha }} )'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install a C compiler (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build the c/ bootstrap compiler
        shell: bash
        run: sh c/tools/bash/build-compiler.sh

      - name: Self-host build + smoke test
        shell: bash
        run: |
          set -e
          if command -v gcc >/dev/null 2>&1; then CC=gcc
          elif command -v clang >/dev/null 2>&1; then CC=clang
          else CC=tcc
          fi
          echo "self-hosting with --cc=$CC"
          SALAM_STD="$PWD" ./c/salam build compiler/main.salam --cc="$CC" \
            --output=/tmp/salam_clonebuild
          SALAM_STD="$PWD" /tmp/salam_clonebuild version
          SALAM_STD="$PWD" /tmp/salam_clonebuild exec tests/en/basics/hello.salam
