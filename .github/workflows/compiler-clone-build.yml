---
name: 🔧 Compiler - Clone & Build (Windows / macOS / Linux)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test-git-clone:
    timeout-minutes: 10
    name: 'Test git clone on ${{ matrix.os }}'
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04 }
          - { os: ubuntu-22.04 }
          - { os: ubuntu-slim }
          - { os: macos-26 }
          - { os: macos-15 }
          - { os: macos-14 }
          - { os: windows-2025-vs2026 }
          - { os: windows-2025 }
          - { os: windows-2022 }
          - { os: windows-11-arm }
    steps:
      - name: 'Checkout ${{ github.ref }} ( ${{ github.sha }} )'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
