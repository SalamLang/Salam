---
name: 🌙 Compiler - Nightly Release Check
on:
  schedule:
    # 08:00 Asia/Tehran (UTC+3:30, no DST) == 04:30 UTC
    - cron: "30 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check-and-trigger:
    if: github.repository == 'SalamLang/Salam'
    name: Check for new commits and trigger nightly release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check for commits on main in the last 24 hours
        id: check
        run: |
          COUNT=$(git log --since="24 hours ago" --oneline | wc -l | tr -d ' ')
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Found ${COUNT} commit(s) on main in the last 24 hours."
      - name: Trigger nightly compiler release
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NIGHTLY_DATE="$(TZ='Asia/Tehran' date +'%Y-%m-%d')"
          echo "Triggering nightly release for ${NIGHTLY_DATE}"
          gh workflow run compiler-release.yml \
            --ref main \
            -f nightly=true \
            -f nightly_date="${NIGHTLY_DATE}"
      - name: Skip - no new commits
        if: steps.check.outputs.count == '0'
        run: echo "No commits on main in the last 24 hours - skipping nightly release."
