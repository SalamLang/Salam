---
name: 🚀 Compiler - Build & Release Binaries
on:
  push:
    branches:
      - main
permissions:
  contents: read
env:
  BOOTSTRAP_VERSION: 0.2.5
  # Version of LLVM/clang/lld we build FROM SOURCE, fully statically linked
  # (no libLLVM/libclang-cpp .so, no libstdc++/libgcc_s/terminfo/zstd/xml2
  # dependency - see the "Build static clang/opt/lli/lld" steps below), to
  # bundle as the LLVM backend's runtime tools. Bump the *-v1 cache-key
  # suffix on the bundling steps (not just this) when the build recipe
  # itself changes, so stale cached binaries don't linger.
  LLVM_STATIC_VER: 22.1.8
jobs:
  build-linux:
    name: Build Salam for Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies (C toolchain + LLVM backend)
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get update
          sudo apt-get install -y build-essential tcc
          gcc --version | head -1
          clang-22 --version
      - name: Bootstrap and self-host build salam for Linux
        run: |
          set -eu
          if [ -n "${BOOTSTRAP_VERSION:-}" ]; then
            curl -fL -o /tmp/bootstrap.zip \
              "https://github.com/SalamLang/Salam/releases/download/v${BOOTSTRAP_VERSION}/salam-${BOOTSTRAP_VERSION}-linux.zip"
            unzip -q /tmp/bootstrap.zip -d /tmp/bootstrap
            chmod +x /tmp/bootstrap/salam-linux/salam
            BOOTSTRAP_BIN=/tmp/bootstrap/salam-linux/salam
          elif [ -d c ]; then
            echo "BOOTSTRAP_VERSION unset - building bootstrap compiler from c/"
            sh c/tools/bash/build-compiler.sh
            BOOTSTRAP_BIN="$PWD/c/salam"
          else
            echo "::error::BOOTSTRAP_VERSION is unset and c/ does not exist - no bootstrap available"
            exit 1
          fi
          SALAM_STD="$PWD" "$BOOTSTRAP_BIN" build compiler/main.salam --output=compiler/salam
          cp compiler/salam ./salam
          ./salam version
      - name: Smoke-test the backends
        run: |
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-llvm"\nend\n' > smoke.salam
          echo "[C backend]"
          ./salam build smoke.salam --output=smoke_c --log-level=warn && ./smoke_c
          echo "[LLVM backend]"
          ./salam llvm smoke.salam --jit --log-level=warn
          ./salam llvm smoke.salam --emit-obj -o smoke.o --log-level=warn
          ./salam llvm smoke.salam --exec -o smoke_exe --log-level=warn && ./smoke_exe
          rm -f smoke.salam smoke_c smoke_exe smoke.o salam_mod_*.c salam_mod_*.h
      # `salam llvm`/`--jit`/`--emit-obj` shell out to clang/opt/lli (see
      # compiler/semantic.salam FindBundledTool + compiler/llvm.salam
      # nt_resolve_tool): a bundled binary next to `salam`, under llvm/bin/,
      # wins over a bare PATH lookup. These are built FROM SOURCE with every
      # LLVM/Clang shared-lib option off, so the resulting clang/opt/lli/lld
      # depend on nothing but the base glibc/libstdc++/libgcc_s every Linux
      # program needs - no third-party .so to bundle or version-match.
      # Native `--exec`/`salam build` linking still uses the system `ld`
      # (part of build-essential, as universal an assumption as glibc).
      - name: Cache static LLVM/clang/lld build
        id: llvm-static-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: llvm-bundle
          key: llvm-static-linux-${{ env.LLVM_STATIC_VER }}-v1
      # Ubuntu runners ship ~15-20GB of preinstalled SDKs (.NET, Android,
      # GHC, ...) we don't use; a from-source LLVM+Clang build needs the
      # headroom. Best-effort: never fail the job over reclaiming space.
      - name: Free disk space for the LLVM build
        if: steps.llvm-static-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /
      - name: Build static clang/opt/lli/lld, falling back to dynamic on failure (cache miss only)
        if: steps.llvm-static-cache.outputs.cache-hit != 'true'
        timeout-minutes: 150
        run: |
          set -eu
          sudo apt-get install -y ninja-build cmake
          mkdir -p llvm-bundle/bin
          if (
            set -eu
            curl -fL -o llvm-src.tar.xz \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_STATIC_VER}/llvm-project-${LLVM_STATIC_VER}.src.tar.xz"
            mkdir -p llvm-src
            tar -xf llvm-src.tar.xz -C llvm-src --strip-components=1
            cmake -S llvm-src/llvm -B llvm-build -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_ENABLE_PROJECTS="clang;lld" \
              -DLLVM_TARGETS_TO_BUILD="X86;WebAssembly" \
              -DLLVM_ENABLE_ASSERTIONS=OFF \
              -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_ZLIB=OFF \
              -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF \
              -DLLVM_ENABLE_LIBEDIT=OFF -DLLVM_ENABLE_LIBPFM=OFF \
              -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
              -DLLVM_INCLUDE_BENCHMARKS=OFF -DCLANG_INCLUDE_TESTS=OFF \
              -DLLVM_LINK_LLVM_DYLIB=OFF -DBUILD_SHARED_LIBS=OFF \
              -DCLANG_LINK_CLANG_DYLIB=OFF -DLLVM_PARALLEL_LINK_JOBS=1 \
              -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
            ninja -C llvm-build clang opt lli lld
            cp llvm-build/bin/clang llvm-bundle/bin/clang
            cp llvm-build/bin/opt llvm-bundle/bin/opt
            cp llvm-build/bin/lli llvm-bundle/bin/lli
            cp llvm-build/bin/lld llvm-bundle/bin/ld.lld
          ); then
            echo "static" > llvm-bundle/.mode
            echo "static LLVM build succeeded"
          else
            # Matches this project's own precedent (see
            # salam-release-ci-selfcontained project memory): a from-source
            # static LLVM build is inherently the highest-risk part of this
            # pipeline, so on failure fall back to a dynamically-linked
            # system LLVM (closure-copied + rpath-fixed) rather than failing
            # the whole release outright.
            echo "::warning::static LLVM build failed - falling back to a dynamically-linked system LLVM bundle for this run"
            rm -rf llvm-bundle llvm-src llvm-src.tar.xz llvm-build
            sudo apt-get install -y patchelf
            mkdir -p llvm-bundle/bin llvm-bundle/lib
            for t in clang opt lli ld.lld; do
              src=$(command -v "${t}-22" || true)
              if [ -z "$src" ]; then
                echo "::error::${t}-22 not found either - cannot bundle any LLVM toolchain at all"
                exit 1
              fi
              cp "$src" "llvm-bundle/bin/$t"
            done
            for f in llvm-bundle/bin/*; do
              for lib in $(ldd "$f" | awk '/=>/ {print $3}' | \
                           grep -E '/lib(LLVM|clang-cpp|c\+\+|zstd|edit|tinfo|ncurses)[^ ]*\.so'); do
                base=$(basename "$lib")
                [ -e "llvm-bundle/lib/$base" ] || cp -L "$lib" "llvm-bundle/lib/$base"
              done
            done
            for f in llvm-bundle/bin/*; do
              patchelf --set-rpath '$ORIGIN/../lib' "$f"
            done
            echo "dynamic" > llvm-bundle/.mode
          fi
          rm -rf llvm-src llvm-src.tar.xz llvm-build
      - name: Verify the bundle resolves cleanly
        run: |
          set -eu
          mode=$(cat llvm-bundle/.mode 2>/dev/null || echo unknown)
          echo "bundle mode: $mode"
          for f in llvm-bundle/bin/*; do
            echo "== $f =="
            ldd "$f"
            if ldd "$f" | grep -q 'not found'; then
              echo "::error::$f has unresolved shared library deps"
              exit 1
            fi
            if [ "$mode" = "static" ] && ldd "$f" | grep -iE 'LLVM|clang|zstd|tinfo|ncurses|edit|xml2'; then
              echo "::error::$f still depends on a third-party LLVM-adjacent .so - static build misconfigured"
              exit 1
            fi
          done
          if [ "$mode" = "dynamic" ]; then
            echo "::warning::this run's LLVM bundle fell back to dynamic linking (see the build step above) - end users still need nothing extra, but it isn't fully static this time"
          fi
      - name: Validate full test suite (release gate)
        if: startsWith(github.event.head_commit.message, 'release:')
        run: |
          sudo apt-get install -y curl libgtk-3-dev libwebkit2gtk-4.1-dev \
            libssl-dev libsqlite3-dev libhiredis-dev libmariadb-dev-compat libmariadb-dev
          SALAM="$GITHUB_WORKSPACE/salam" sh compiler/tools/bash/run-tests.sh 2>&1 | tee /tmp/tests.log || true
          grep -qE 'RESULT: [0-9]+ passed, 0 failed' /tmp/tests.log \
            || { echo "::error::Linux test suite failed - blocking release"; exit 1; }
      - name: Stage versioned archive
        run: |
          set -eu
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          DIST="salam-linux"
          mkdir -p "$DIST"
          cp salam "$DIST/salam"
          cp -r std "$DIST/std"
          cp -r llvm-bundle "$DIST/llvm"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for Linux (x86_64) - self-hosted toolchain."
            echo ""
            echo "No installation needed. From this folder:"
            echo ""
            echo "  ./salam version"
            echo "  ./salam exec  app.salam                               (interpreter)"
            echo "  ./salam llvm  app.salam --jit                         (run via built-in LLVM backend)"
            echo "  ./salam build app.salam -o app                        (native binary via system tcc/gcc/clang)"
            echo ""
            echo "Bundles its own clang/opt/lld (llvm/bin/) so 'salam llvm --jit',"
            echo "--emit-obj and cross-compiling (salam build --target=...) work with"
            echo "no system LLVM install needed. Native '--exec'/'salam build' linking"
            echo "still uses the system linker (ld, from build-essential)."
          } > "$DIST/RUN-ME.txt"
          zip -r "salam-${VERSION}-linux.zip" "$DIST" >/dev/null
          ls -la "salam-${VERSION}-linux.zip"
      - name: Upload versioned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-zip
          path: salam-*-linux.zip
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux
          path: salam
  build-macos:
    name: Build Salam for macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Homebrew downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-dl-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            brew-dl-${{ runner.arch }}-
      - name: Install LLVM (for the compiler's LLVM backend)
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
      - name: Bootstrap and self-host build salam for macOS
        run: |
          set -eu
          if [ -n "${BOOTSTRAP_VERSION:-}" ]; then
            curl -fL -o /tmp/bootstrap.zip \
              "https://github.com/SalamLang/Salam/releases/download/v${BOOTSTRAP_VERSION}/salam-${BOOTSTRAP_VERSION}-mac.zip"
            unzip -q /tmp/bootstrap.zip -d /tmp/bootstrap
            chmod +x /tmp/bootstrap/salam-mac/salam
            BOOTSTRAP_BIN=/tmp/bootstrap/salam-mac/salam
          elif [ -d c ]; then
            echo "BOOTSTRAP_VERSION unset - building bootstrap compiler from c/"
            CC=clang sh c/tools/bash/build-compiler.sh
            BOOTSTRAP_BIN="$PWD/c/salam"
          else
            echo "::error::BOOTSTRAP_VERSION is unset and c/ does not exist - no bootstrap available"
            exit 1
          fi
          SALAM_STD="$PWD" "$BOOTSTRAP_BIN" build compiler/main.salam --output=compiler/salam --cc=clang
          cp compiler/salam ./salam
          ./salam version
      - name: Smoke-test the backends
        run: |
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-llvm"\nend\n' > smoke.salam
          echo "[C backend, system clang]"
          ./salam build smoke.salam --cc=clang --output=smoke_c --log-level=warn && ./smoke_c
          echo "[LLVM backend]"
          ./salam llvm smoke.salam --jit --log-level=warn
          ./salam llvm smoke.salam --emit-obj -o smoke.o --log-level=warn
          ./salam llvm smoke.salam --exec -o smoke_exe --log-level=warn && ./smoke_exe
          rm -f smoke.salam smoke_c smoke_exe smoke.o salam_mod_*.c salam_mod_*.h
      # Same rationale as the Linux job: bundle clang/opt/lld under llvm/bin/
      # (compiler/semantic.salam FindBundledTool) so `salam llvm --jit` and
      # --emit-obj need no Homebrew LLVM on the end-user machine. Built FROM
      # SOURCE with every shared-lib option off, so the only things these
      # depend on are Apple's own system frameworks/libc++ - never a
      # Homebrew dylib. Native --exec/`salam build` linking still needs
      # Apple's own toolchain (ld64, libSystem, the SDK) - Apple doesn't
      # allow redistributing those, per the RUN-ME.txt note below.
      - name: Cache static LLVM/clang/lld build
        id: llvm-static-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: llvm-bundle
          key: llvm-static-macos-${{ runner.arch }}-${{ env.LLVM_STATIC_VER }}-v1
      - name: Build static clang/opt/lli/lld, falling back to dynamic on failure (cache miss only)
        if: steps.llvm-static-cache.outputs.cache-hit != 'true'
        timeout-minutes: 150
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -eu
          brew install ninja cmake llvm@22
          mkdir -p llvm-bundle/bin
          if (
            set -eu
            curl -fL -o llvm-src.tar.xz \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_STATIC_VER}/llvm-project-${LLVM_STATIC_VER}.src.tar.xz"
            mkdir -p llvm-src
            tar -xf llvm-src.tar.xz -C llvm-src --strip-components=1
            cmake -S llvm-src/llvm -B llvm-build -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_ENABLE_PROJECTS="clang;lld" \
              -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" \
              -DLLVM_ENABLE_ASSERTIONS=OFF \
              -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_ZLIB=OFF \
              -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF \
              -DLLVM_ENABLE_LIBEDIT=OFF \
              -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
              -DLLVM_INCLUDE_BENCHMARKS=OFF -DCLANG_INCLUDE_TESTS=OFF \
              -DLLVM_LINK_LLVM_DYLIB=OFF -DBUILD_SHARED_LIBS=OFF \
              -DCLANG_LINK_CLANG_DYLIB=OFF -DLLVM_PARALLEL_LINK_JOBS=1
            ninja -C llvm-build clang opt lli lld
            cp llvm-build/bin/clang llvm-bundle/bin/clang
            cp llvm-build/bin/opt llvm-bundle/bin/opt
            cp llvm-build/bin/lli llvm-bundle/bin/lli
            cp llvm-build/bin/lld llvm-bundle/bin/ld64.lld
            codesign --sign - --force llvm-bundle/bin/*
          ); then
            echo "static" > llvm-bundle/.mode
            echo "static LLVM build succeeded"
          else
            # Same safety-net precedent as the Linux job: don't let the
            # highest-risk step in this pipeline (a from-source LLVM build)
            # take the whole release down with it.
            echo "::warning::static LLVM build failed - falling back to a dynamically-linked Homebrew LLVM bundle for this run"
            rm -rf llvm-bundle llvm-src llvm-src.tar.xz llvm-build
            LLVM_PREFIX="$(brew --prefix llvm@22)"
            mkdir -p llvm-bundle/bin llvm-bundle/lib
            for t in clang opt lli; do
              cp "$LLVM_PREFIX/bin/$t" "llvm-bundle/bin/$t"
            done
            if [ -e "$LLVM_PREFIX/bin/ld64.lld" ]; then
              cp "$LLVM_PREFIX/bin/ld64.lld" "llvm-bundle/bin/ld64.lld"
            fi
            pending=$(cd llvm-bundle/bin && ls)
            pending=$(for p in $pending; do echo "llvm-bundle/bin/$p"; done)
            seen=""
            while [ -n "$pending" ]; do
              set -- $pending
              f="$1"; shift; pending="$*"
              case " $seen " in *" $f "*) continue ;; esac
              seen="$seen $f"
              case "$f" in
                llvm-bundle/bin/*) rel="../lib" ;;
                *)                 rel=""       ;;
              esac
              for dep in $(otool -L "$f" | tail -n +2 | awk '{print $1}'); do
                case "$dep" in
                  /usr/lib/*|/System/*|@rpath/*|@loader_path/*|@executable_path/*) continue ;;
                esac
                base=$(basename "$dep")
                dst="llvm-bundle/lib/$base"
                if [ ! -e "$dst" ]; then
                  cp -L "$dep" "$dst"
                  chmod +w "$dst"
                  install_name_tool -id "@loader_path/$base" "$dst"
                  pending="$pending $dst"
                fi
                if [ -n "$rel" ]; then
                  install_name_tool -change "$dep" "@loader_path/$rel/$base" "$f"
                else
                  install_name_tool -change "$dep" "@loader_path/$base" "$f"
                fi
              done
            done
            codesign --sign - --force llvm-bundle/bin/* llvm-bundle/lib/* 2>/dev/null || true
            echo "dynamic" > llvm-bundle/.mode
          fi
          rm -rf llvm-src llvm-src.tar.xz llvm-build
      - name: Verify the bundle resolves cleanly
        run: |
          set -eu
          mode=$(cat llvm-bundle/.mode 2>/dev/null || echo unknown)
          echo "bundle mode: $mode"
          for f in llvm-bundle/bin/*; do
            [ -f "$f" ] || continue
            echo "== $f =="
            otool -L "$f"
          done
          if [ "$mode" = "static" ]; then
            for f in llvm-bundle/bin/*; do
              bad=$(otool -L "$f" | tail -n +2 | awk '{print $1}' | \
                    grep -vE '^(/usr/lib/|/System/|@)') || true
              if [ -n "$bad" ]; then
                echo "::error::$f depends on a non-system library - static build misconfigured:"
                echo "$bad"
                exit 1
              fi
            done
          else
            echo "::warning::this run's LLVM bundle fell back to dynamic linking (see the build step above) - end users still need nothing extra, but it isn't fully static this time"
          fi
      - name: Validate test suite (release gate)
        if: startsWith(github.event.head_commit.message, 'release:')
        run: |
          SALAM="$GITHUB_WORKSPACE/salam" sh compiler/tools/bash/run-tests.sh exec errors layout llvm 2>&1 | tee /tmp/tests.log || true
          grep -qE 'RESULT: [0-9]+ passed, 0 failed' /tmp/tests.log \
            || { echo "::error::macOS test suite failed - blocking release"; exit 1; }
      - name: Stage versioned archive
        run: |
          set -eu
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          DIST="salam-mac"
          mkdir -p "$DIST"
          cp salam "$DIST/salam"
          cp -r std "$DIST/std"
          cp -r llvm-bundle "$DIST/llvm"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for macOS - self-hosted toolchain."
            echo ""
            echo "  ./salam exec  app.salam                     (interpreter)"
            echo "  ./salam llvm  app.salam --jit               (run via built-in LLVM backend)"
            echo "  ./salam build app.salam -o app --cc=clang   (native binary via the system"
            echo "                                               clang/ld that ship with Xcode CLT)"
            echo ""
            echo "Note: the default C backend compiler is tcc, which isn't bundled or"
            echo "preinstalled on macOS - pass --cc=clang (as above), or install your own."
            echo ""
            echo "Bundles its own clang/opt (llvm/bin/) so 'salam llvm --jit' and"
            echo "--emit-obj need no Homebrew LLVM installed."
            echo ""
            echo "macOS cannot be a fully-static, self-contained cross-compiler. Apple"
            echo "does not permit statically linking libSystem and the macOS SDK is not"
            echo "redistributable, so linking uses Apple's toolchain. Cross-compiling"
            echo "FROM Linux/Windows TO macOS is likewise not supported."
          } > "$DIST/RUN-ME.txt"
          zip -r "salam-${VERSION}-mac.zip" "$DIST" >/dev/null
          ls -la "salam-${VERSION}-mac.zip"
      - name: Upload versioned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-macos-zip
          path: salam-*-mac.zip
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-macos
          path: salam
  build-windows:
    name: Build Salam for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Obtain bootstrap salam.exe (download release, or build from c/)
        shell: bash
        run: |
          set -eu
          mkdir -p .bootstrap
          if [ -n "${BOOTSTRAP_VERSION:-}" ]; then
            curl -fL -o bootstrap.zip \
              "https://github.com/SalamLang/Salam/releases/download/v${BOOTSTRAP_VERSION}/salam-${BOOTSTRAP_VERSION}-windows.zip"
            7z x bootstrap.zip -o.bootstrap >/dev/null
            rm -f bootstrap.zip
            cp .bootstrap/salam-windows/salam.exe .bootstrap/salam.exe
            if [ -d .bootstrap/salam-windows/tcc ]; then
              cp -r .bootstrap/salam-windows/tcc .bootstrap/tcc
            fi
          elif [ -d c ]; then
            echo "BOOTSTRAP_VERSION unset - building bootstrap compiler from c/"
            sh c/tools/bash/build-compiler.sh
            cp c/salam.exe .bootstrap/salam.exe 2>/dev/null || cp c/salam .bootstrap/salam.exe
          else
            echo "::error::BOOTSTRAP_VERSION is unset and c/ does not exist - no bootstrap available"
            exit 1
          fi

      - name: Cache MSYS2 packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-mingw64-pkgs-${{ github.run_id }}
          restore-keys: |
            msys2-mingw64-pkgs-

      - name: Install LLVM (for the compiler's LLVM backend)
        shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail "{0}"'
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: '1'
        run: |
          pacman -Sy --noconfirm --needed mingw-w64-x86_64-llvm mingw-w64-x86_64-lld
          llvm-config --version

      - name: Add MinGW64 (LLVM) to PATH for later steps
        shell: bash
        run: printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

      - name: Bootstrap and self-host build salam.exe (bundled tcc)
        shell: bash
        run: |
          set -eu
          SALAM_STD="$PWD" ./.bootstrap/salam.exe \
            build compiler/main.salam --output=compiler/salam.exe
          cp compiler/salam.exe ./salam.exe
          ./salam.exe version

      - name: Smoke-test the backends
        shell: bash
        run: |
          set -e
          if [ -d .bootstrap/tcc ]; then
            cp -r .bootstrap/tcc .
          fi
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-llvm"\nend\n' > smoke.salam
          if [ -d tcc ]; then
            echo "[C backend, bundled tcc]"
            ./salam.exe build smoke.salam --output=smoke_c.exe --log-level=warn
          else
            echo "[C backend, system gcc - no bundled tcc in this build]"
            ./salam.exe build smoke.salam --cc=gcc --output=smoke_c.exe --log-level=warn
          fi
          ./smoke_c.exe
          echo "[LLVM backend]"
          ./salam.exe llvm smoke.salam --jit --log-level=warn
          ./salam.exe llvm smoke.salam --emit-obj -o smoke.o --log-level=warn
          ls -l smoke.o
          if ./salam.exe llvm smoke.salam --exec -o smoke_llvm.exe --log-level=warn \
               && ./smoke_llvm.exe; then
            echo "llvm --exec OK"
          else
            echo "note: llvm --exec unavailable (no LLVM-capable linker on PATH);"
            echo "      use 'salam llvm --jit' to run, or 'salam build' for a native exe."
          fi
          rm -f smoke.salam smoke*.exe smoke.o salam_mod_*.c salam_mod_*.h

      # Same rationale as Linux/macOS: bundle clang/opt/lli under llvm/bin/
      # (compiler/semantic.salam FindBundledTool) so `salam.exe llvm --jit`
      # and --emit-obj need no MSYS2/mingw LLVM installed. Built FROM SOURCE
      # with `-static` (mingw's fully-static link mode) so the result depends
      # on nothing but core Windows system DLLs - no libwinpthread/libstdc++/
      # libgcc_s mingw runtime DLLs to bundle or version-match. Native
      # `--exec` linking (needs mingw's ld/collect2/crt objects, not just
      # clang+lld) stays best-effort, same as today.
      - name: Cache static LLVM/clang/lld build
        id: llvm-static-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: llvm-bundle
          key: llvm-static-windows-${{ env.LLVM_STATIC_VER }}-v1

      - name: Build static clang/opt/lli/lld, falling back to dynamic on failure (cache miss only)
        if: steps.llvm-static-cache.outputs.cache-hit != 'true'
        timeout-minutes: 150
        shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail "{0}"'
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: '1'
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          pacman -Sy --noconfirm --needed \
            mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-gcc
          mkdir -p llvm-bundle/bin
          if (
            set -eu
            curl -fL -o llvm-src.tar.xz \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_STATIC_VER}/llvm-project-${LLVM_STATIC_VER}.src.tar.xz"
            mkdir -p llvm-src
            tar -xf llvm-src.tar.xz -C llvm-src --strip-components=1
            cmake -S llvm-src/llvm -B llvm-build -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_ENABLE_PROJECTS="clang;lld" \
              -DLLVM_TARGETS_TO_BUILD="X86;WebAssembly" \
              -DLLVM_ENABLE_ASSERTIONS=OFF \
              -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_ZLIB=OFF \
              -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF \
              -DLLVM_ENABLE_LIBEDIT=OFF \
              -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
              -DLLVM_INCLUDE_BENCHMARKS=OFF -DCLANG_INCLUDE_TESTS=OFF \
              -DLLVM_LINK_LLVM_DYLIB=OFF -DBUILD_SHARED_LIBS=OFF \
              -DCLANG_LINK_CLANG_DYLIB=OFF -DLLVM_PARALLEL_LINK_JOBS=1 \
              -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
            ninja -C llvm-build clang opt lli lld
            cp llvm-build/bin/clang.exe llvm-bundle/bin/clang.exe
            cp llvm-build/bin/opt.exe llvm-bundle/bin/opt.exe
            cp llvm-build/bin/lli.exe llvm-bundle/bin/lli.exe
            cp llvm-build/bin/lld.exe llvm-bundle/bin/ld.lld.exe
          ); then
            echo "static" > llvm-bundle/.mode
            echo "static LLVM build succeeded"
          else
            # Same safety-net precedent as the Linux/macOS jobs: don't let
            # the highest-risk step in this pipeline (a from-source mingw
            # LLVM build - historically the flakiest platform for this, per
            # this project's own abandoned 330-min windows-i686 attempt)
            # take the whole release down with it.
            echo "::warning::static LLVM build failed - falling back to a dynamically-linked mingw64 LLVM bundle for this run"
            rm -rf llvm-bundle llvm-src llvm-src.tar.xz llvm-build
            pacman -Sy --noconfirm --needed mingw-w64-x86_64-llvm mingw-w64-x86_64-lld
            mkdir -p llvm-bundle/bin
            for t in clang.exe opt.exe lli.exe ld.lld.exe; do
              if [ -e "/mingw64/bin/$t" ]; then
                cp "/mingw64/bin/$t" "llvm-bundle/bin/$t"
              fi
            done
            pending=$(cd llvm-bundle/bin && ls)
            pending=$(for p in $pending; do echo "llvm-bundle/bin/$p"; done)
            seen=""
            while [ -n "$pending" ]; do
              set -- $pending
              f="$1"; shift; pending="$*"
              case " $seen " in *" $f "*) continue ;; esac
              seen="$seen $f"
              for dll in $(ldd "$f" | awk '{print $3}' | grep -i '^/mingw64/bin/'); do
                base=$(basename "$dll")
                dst="llvm-bundle/bin/$base"
                if [ ! -e "$dst" ]; then
                  cp "$dll" "$dst"
                  pending="$pending $dst"
                fi
              done
            done
            echo "dynamic" > llvm-bundle/.mode
          fi
          rm -rf llvm-src llvm-src.tar.xz llvm-build

      - name: Verify the bundle resolves cleanly
        shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail "{0}"'
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: '1'
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          mode=$(cat llvm-bundle/.mode 2>/dev/null || echo unknown)
          echo "bundle mode: $mode"
          for f in llvm-bundle/bin/*; do
            echo "== $f =="
            ldd "$f"
            if ldd "$f" | grep -q 'not found'; then
              echo "::error::$f has unresolved DLL deps"
              exit 1
            fi
            if [ "$mode" = "static" ] && ldd "$f" | grep -qi '/mingw64/bin/'; then
              echo "::error::$f still depends on a mingw runtime DLL - static build misconfigured"
              exit 1
            fi
          done
          if [ "$mode" = "dynamic" ]; then
            echo "::warning::this run's LLVM bundle fell back to dynamic linking (see the build step above) - end users still need nothing extra, but it isn't fully static this time"
          fi

      - name: Validate test suite (release gate)
        if: startsWith(github.event.head_commit.message, 'release:')
        shell: bash
        run: |
          SALAM="$GITHUB_WORKSPACE/salam.exe" \
            sh compiler/tools/bash/run-tests.sh general exec errors layout llvm 2>&1 | tee /tmp/tests.log || true
          grep -qE 'RESULT: [0-9]+ passed, 0 failed' /tmp/tests.log \
            || { echo "::error::Windows test suite failed - blocking release"; exit 1; }

      - name: Stage bundle
        shell: bash
        run: |
          set -eu
          DIST="salam-windows"
          mkdir -p "$DIST"
          cp salam.exe "$DIST/"
          cp -r std "$DIST/std"
          if [ -d .bootstrap/tcc ]; then
            cp -r .bootstrap/tcc "$DIST/tcc"
          fi
          cp -r llvm-bundle "$DIST/llvm"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for Windows - self-hosted, self-contained (C backend)."
            echo ""
            echo "No installation needed for the C backend. From this folder:"
            echo ""
            echo "  salam.exe version"
            echo "  salam.exe exec  myprogram.salam        (tree-walking interpreter)"
            echo "  salam.exe build myprogram.salam        (native exe via bundled tcc)"
            echo "  salam.exe llvm  myprogram.salam --jit   (run via the bundled LLVM"
            echo "                                           backend, llvm/bin/)"
            echo ""
            echo "salam.exe finds its std/ library, the bundled tcc/ and the bundled"
            echo "llvm/ automatically; keep them next to salam.exe."
          } > "$DIST/RUN-ME.txt"
          echo "bundle contents:"; ls -la "$DIST"

      - name: Zip the bundle
        shell: bash
        run: |
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          7z a -tzip "salam-${VERSION}-windows.zip" salam-windows >/dev/null
          ls -la "salam-${VERSION}-windows.zip"

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-windows-bundle
          path: salam-*-windows.zip

      - name: Upload salam.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-windows
          path: salam.exe

  build-windows-i686:
    name: Build Salam for Windows (32-bit / i686, minimal)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Foreign-arch (32-bit) target: no cross C toolchain is set up to build
      # c/ for i686 here, so this still needs BOOTSTRAP_VERSION set.
      - name: Bootstrap and self-host build 32-bit salam.exe (bundled 32-bit tcc)
        shell: bash
        run: |
          set -eu
          curl -fL -o bootstrap.zip \
            "https://github.com/SalamLang/Salam/releases/download/v${BOOTSTRAP_VERSION}/salam-${BOOTSTRAP_VERSION}-windows-i686-minimal.zip"
          mkdir -p .bootstrap
          7z x bootstrap.zip -o.bootstrap >/dev/null
          rm -f bootstrap.zip
          SALAM_STD="$PWD" ./.bootstrap/salam-windows-i686/salam.exe \
            build compiler/main.salam --output=compiler/salam.exe
          cp compiler/salam.exe ./salam.exe
          ./salam.exe version
          file salam.exe || true

      - name: Stage minimal 32-bit bundle
        shell: bash
        run: |
          set -eu
          DIST="salam-windows-i686"
          mkdir -p "$DIST"
          cp salam.exe "$DIST/"
          cp -r std "$DIST/std"
          fetch_tcc() {
            out="$1"; file="$2"
            for attempt in 1 2 3 4 5; do
              for base in \
                "https://download.savannah.gnu.org/releases/tinycc" \
                "https://download-mirror.savannah.gnu.org/releases/tinycc" \
                "https://download.savannah.nongnu.org/releases/tinycc"; do
                echo "Fetching $base/$file (attempt $attempt)..."
                if curl -fL --connect-timeout 20 --retry 3 --retry-delay 5 \
                     --retry-all-errors -o "$out" "$base/$file"; then
                  return 0
                fi
              done
              sleep $((attempt * 10))
            done
            echo "ERROR: could not download $file from any Savannah mirror" >&2
            return 1
          }
          fetch_tcc tcc.zip tcc-0.9.27-win32-bin.zip
          7z x tcc.zip -o"$DIST" >/dev/null
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for Windows (32-bit / i686) - MINIMAL build."
            echo ""
            echo "Runs on 32-bit and 64-bit Windows. Ships the interpreter and the"
            echo "C backend (bundled 32-bit tcc) only - there is NO embedded LLVM and"
            echo "NO cross-compilation in this build (see below)."
            echo ""
            echo "  salam.exe version"
            echo "  salam.exe exec  myprogram.salam    (tree-walking interpreter)"
            echo "  salam.exe build myprogram.salam    (native exe via bundled 32-bit tcc)"
            echo ""
            echo "Need 'salam llvm' or 'salam build --target=...'? Use the 64-bit"
            echo "Windows build (salam-<ver>-windows.zip)."
          } > "$DIST/RUN-ME.txt"
          echo "bundle contents:"; ls -la "$DIST"

      - name: Smoke-test the minimal 32-bit build
        shell: bash
        run: |
          set -e
          cd salam-windows-i686
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-win32"\nend\n' > smoke.salam
          echo "[1] C backend via bundled 32-bit tcc"
          ./salam.exe build smoke.salam --output=smoke_tcc.exe --log-level=warn
          ./smoke_tcc.exe
          echo "[2] interpreter"
          ./salam.exe exec smoke.salam --log-level=warn
          rm -f smoke.salam smoke*.exe salam_mod_*.c salam_mod_*.h
          cd ..

      - name: Zip the minimal 32-bit bundle
        shell: bash
        run: |
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          7z a -tzip "salam-${VERSION}-windows-i686-minimal.zip" salam-windows-i686 >/dev/null
          ls -la "salam-${VERSION}-windows-i686-minimal.zip"

      - name: Upload minimal 32-bit Windows bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-windows-i686-bundle
          path: salam-*-windows-i686-minimal.zip

      - name: Upload 32-bit salam.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-windows-i686
          path: salam.exe

  build-linux-i686:
    name: Build Salam for Linux (32-bit / i686)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install 32-bit runtime libs (to run the bootstrap + built i686 binaries)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386
      # Foreign-arch (32-bit) target: no cross C toolchain is set up to build
      # c/ for i686 here, so this still needs BOOTSTRAP_VERSION set.
      - name: Bootstrap and self-host build 32-bit salam (bundled musl-tcc)
        run: |
          set -eu
          curl -fL -o bootstrap.zip \
            "https://github.com/SalamLang/Salam/releases/download/v${BOOTSTRAP_VERSION}/salam-${BOOTSTRAP_VERSION}-linux-i686-minimal.zip"
          mkdir -p .bootstrap
          unzip -q bootstrap.zip -d .bootstrap
          chmod +x .bootstrap/salam-linux-i686/salam
          SALAM_STD="$PWD" ./.bootstrap/salam-linux-i686/salam \
            build compiler/main.salam --output=compiler/salam
          cp compiler/salam ./salam
          chmod +x ./salam
          file salam
          ./salam version
      - name: Smoke-test the 32-bit binary (interpreter + bundled musl-tcc)
        run: |
          cp -r .bootstrap/salam-linux-i686/tcc .
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-linux-32"\nend\n' > smoke.salam
          ./salam build smoke.salam --cc=tcc --output=smoke --log-level=info && ./smoke
          file smoke
          ./salam exec smoke.salam --log-level=warn || true
          rm -f smoke smoke.salam salam_mod_*.c salam_mod_*.h
      - name: Stage versioned archive
        run: |
          set -eu
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          DIST="salam-linux-i686"
          mkdir -p "$DIST"
          cp salam "$DIST/salam"
          cp -r std "$DIST/std"
          cp -r .bootstrap/salam-linux-i686/tcc "$DIST/tcc"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for Linux (32-bit / i686) - self-hosted, self-contained."
            echo ""
            echo "No installation needed. From this folder:"
            echo ""
            echo "  ./salam version"
            echo "  ./salam exec  app.salam            (interpreter)"
            echo "  ./salam build app.salam -o app     (native binary via the bundled,"
            echo "                                      musl-statically-linked tcc - no"
            echo "                                      system C compiler needed)"
            echo ""
            echo "There is no LLVM backend for i686 (none exists for this target; see"
            echo "the 64-bit Linux flagship for 'salam llvm' and cross-compilation)."
          } > "$DIST/RUN-ME.txt"
          zip -r "salam-${VERSION}-linux-i686-minimal.zip" "$DIST" >/dev/null
          ls -la "salam-${VERSION}-linux-i686-minimal.zip"
      - name: Upload versioned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-i686-zip
          path: salam-*-linux-i686-minimal.zip
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-i686
          path: salam

  build-linux-arm:
    name: Build Salam for Linux ARM (${{ matrix.arch }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            deb_arch: arm64
            qemu: qemu-aarch64-static
          - arch: armhf
            deb_arch: armhf
            qemu: qemu-arm-static
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install qemu + ${{ matrix.arch }} runtime libs
        run: |
          sudo dpkg --add-architecture ${{ matrix.deb_arch }}
          sudo apt-get update
          sudo apt-get install -y qemu-user-static libc6:${{ matrix.deb_arch }}
      # Foreign-arch (ARM) target: no cross C toolchain is set up to build c/
      # for this arch here, so this still needs BOOTSTRAP_VERSION set.
      - name: Bootstrap and self-host build salam for ${{ matrix.arch }} (bundled musl-tcc)
        run: |
          set -eu
          curl -fL -o bootstrap.zip \
            "https://github.com/SalamLang/Salam/releases/download/v${BOOTSTRAP_VERSION}/salam-${BOOTSTRAP_VERSION}-linux-${{ matrix.arch }}-minimal.zip"
          mkdir -p .bootstrap
          unzip -q bootstrap.zip -d .bootstrap
          chmod +x ".bootstrap/salam-linux-${{ matrix.arch }}/salam"
          SALAM_STD="$PWD" ${{ matrix.qemu }} \
            "./.bootstrap/salam-linux-${{ matrix.arch }}/salam" \
            build compiler/main.salam --output=compiler/salam
          cp compiler/salam ./salam
          chmod +x ./salam
          file salam
      - name: Smoke-test under qemu
        run: |
          ${{ matrix.qemu }} ./salam version
      - name: Smoke-test bundled musl-tcc under qemu
        run: |
          cp -r ".bootstrap/salam-linux-${{ matrix.arch }}/tcc" .
          printf 'func main:\n    println "ok-%s"\nend\n' "${{ matrix.arch }}" > smoke.salam
          SALAM_STD="$PWD/std" ${{ matrix.qemu }} \
            ./salam build smoke.salam --cc=tcc --output=smoke --log-level=info
          file smoke
          ${{ matrix.qemu }} ./smoke
          rm -f smoke smoke.salam salam_mod_*.c salam_mod_*.h
      - name: Stage versioned archive
        run: |
          set -eu
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          DIST="salam-linux-${{ matrix.arch }}"
          mkdir -p "$DIST"
          cp salam "$DIST/salam"
          cp -r std "$DIST/std"
          cp -r ".bootstrap/salam-linux-${{ matrix.arch }}/tcc" "$DIST/tcc"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for Linux ${{ matrix.arch }} - self-hosted, self-contained."
            echo ""
            echo "No installation needed. From this folder:"
            echo ""
            echo "  ./salam version"
            echo "  ./salam exec  app.salam            (interpreter)"
            echo "  ./salam build app.salam -o app     (native binary via the bundled,"
            echo "                                      musl-statically-linked tcc - no"
            echo "                                      system C compiler needed)"
            echo ""
            echo "There is no LLVM backend for this architecture (see the 64-bit Linux"
            echo "flagship for 'salam llvm' and cross-compilation)."
          } > "$DIST/RUN-ME.txt"
          zip -r "salam-${VERSION}-linux-${{ matrix.arch }}-minimal.zip" "$DIST" >/dev/null
          ls -la "salam-${VERSION}-linux-${{ matrix.arch }}-minimal.zip"
      - name: Upload versioned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-${{ matrix.arch }}-zip
          path: salam-*-linux-${{ matrix.arch }}-minimal.zip
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-${{ matrix.arch }}
          path: salam

  build-android:
    name: Build & sign Android app (AAB + universal + per-ABI APKs)
    if: startsWith(github.event.head_commit.message, 'release:')
    uses: ./.github/workflows/_reusable-android-build.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  create-release:
    if: |
      startsWith(github.event.head_commit.message, 'release:') &&
      github.repository == 'SalamLang/Salam'
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      [
        build-linux,
        build-macos,
        build-windows,
        build-windows-i686,
        build-linux-i686,
        build-linux-arm,
        build-android,
      ]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Read version from VERSION file
        id: get_version
        run: |
          VERSION=$(cat VERSION | sed 's/^[ \t]*//;s/[ \t]*$//')
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Salam version: ${VERSION}"
      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux
          path: ./release
      - name: Rename Linux binary to avoid conflict
        run: |
          mv ./release/salam ./release/salam-linux
      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-macos
          path: ./release
      - name: Rename macOS binary to avoid conflict
        run: |
          mv ./release/salam ./release/salam-mac
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-windows
          path: ./release
      - name: Rename Window binary
        run: |
          mv ./release/salam.exe ./release/salam-windows.exe
      - name: Download Windows self-contained bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-windows-bundle
          path: ./release
      - name: Download Linux versioned archive
