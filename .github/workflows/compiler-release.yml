---
name: 🚀 Compiler - Build & Release Binaries
on:
  push:
    branches:
      - main
permissions:
  contents: read
env:
  BOOTSTRAP_VERSION: 0.2.5
jobs:
  build-linux:
    name: Build Salam for Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies (C toolchain + LLVM backend)
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get update
          sudo apt-get install -y build-essential tcc
          gcc --version | head -1
          clang-22 --version
      - name: Bootstrap and self-host build salam for Linux
        run: |
          set -eu
          curl -fL -o /tmp/bootstrap.zip \
            "https://github.com/SalamLang/Salam/releases/download/v${BOOTSTRAP_VERSION}/salam-${BOOTSTRAP_VERSION}-linux.zip"
          unzip -q /tmp/bootstrap.zip -d /tmp/bootstrap
          chmod +x /tmp/bootstrap/salam-linux/salam
          SALAM_STD="$PWD" /tmp/bootstrap/salam-linux/salam build compiler/main.salam --output=compiler/salam
          cp compiler/salam ./salam
          ./salam version
      - name: Smoke-test the backends
        run: |
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-llvm"\nend\n' > smoke.salam
          echo "[C backend]"
          ./salam build smoke.salam --output=smoke_c --log-level=warn && ./smoke_c
          echo "[LLVM backend]"
          ./salam llvm smoke.salam --jit --log-level=warn
          ./salam llvm smoke.salam --emit-obj -o smoke.o --log-level=warn
          ./salam llvm smoke.salam --exec -o smoke_exe --log-level=warn && ./smoke_exe
          rm -f smoke.salam smoke_c smoke_exe smoke.o salam_mod_*.c salam_mod_*.h
      - name: Validate full test suite (release gate)
        if: startsWith(github.event.head_commit.message, 'release:')
        run: |
          sudo apt-get install -y curl libgtk-3-dev libwebkit2gtk-4.1-dev \
            libssl-dev libsqlite3-dev libhiredis-dev libmariadb-dev-compat libmariadb-dev
          SALAM="$GITHUB_WORKSPACE/salam" sh compiler/tools/bash/run-tests.sh 2>&1 | tee /tmp/tests.log || true
          grep -qE 'RESULT: [0-9]+ passed, 0 failed' /tmp/tests.log \
            || { echo "::error::Linux test suite failed - blocking release"; exit 1; }
      - name: Stage versioned archive
        run: |
          set -eu
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          DIST="salam-linux"
          mkdir -p "$DIST"
          cp salam "$DIST/salam"
          cp -r std "$DIST/std"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for Linux (x86_64) - self-hosted toolchain."
            echo ""
            echo "No installation needed. From this folder:"
            echo ""
            echo "  ./salam version"
            echo "  ./salam exec  app.salam                               (interpreter)"
            echo "  ./salam llvm  app.salam --jit                         (run via built-in LLVM backend)"
            echo "  ./salam build app.salam -o app                        (native binary via system tcc/gcc/clang)"
            echo ""
            echo "Cross-compiling to other targets (salam build --target=...) routes"
            echo "through the LLVM backend and needs clang/lld and the target's sysroot"
            echo "installed - see the Cross-compilation section of the README."
          } > "$DIST/RUN-ME.txt"
          zip -r "salam-${VERSION}-linux.zip" "$DIST" >/dev/null
          ls -la "salam-${VERSION}-linux.zip"
      - name: Upload versioned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-zip
          path: salam-*-linux.zip
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux
          path: salam
  build-macos:
    name: Build Salam for macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Homebrew downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-dl-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            brew-dl-${{ runner.arch }}-
      - name: Install LLVM (for the compiler's LLVM backend)
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
      - name: Bootstrap and self-host build salam for macOS
        run: |
          set -eu
          curl -fL -o /tmp/bootstrap.zip \
            "https://github.com/SalamLang/Salam/releases/download/v${BOOTSTRAP_VERSION}/salam-${BOOTSTRAP_VERSION}-mac.zip"
          unzip -q /tmp/bootstrap.zip -d /tmp/bootstrap
          chmod +x /tmp/bootstrap/salam-mac/salam
          SALAM_STD="$PWD" /tmp/bootstrap/salam-mac/salam build compiler/main.salam --output=compiler/salam --cc=clang
          cp compiler/salam ./salam
          ./salam version
      - name: Smoke-test the backends
        run: |
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-llvm"\nend\n' > smoke.salam
          echo "[C backend, system clang]"
          ./salam build smoke.salam --cc=clang --output=smoke_c --log-level=warn && ./smoke_c
          echo "[LLVM backend]"
          ./salam llvm smoke.salam --jit --log-level=warn
          ./salam llvm smoke.salam --emit-obj -o smoke.o --log-level=warn
          ./salam llvm smoke.salam --exec -o smoke_exe --log-level=warn && ./smoke_exe
          rm -f smoke.salam smoke_c smoke_exe smoke.o salam_mod_*.c salam_mod_*.h
      - name: Validate test suite (release gate)
        if: startsWith(github.event.head_commit.message, 'release:')
        run: |
          SALAM="$GITHUB_WORKSPACE/salam" sh compiler/tools/bash/run-tests.sh exec errors layout llvm 2>&1 | tee /tmp/tests.log || true
          grep -qE 'RESULT: [0-9]+ passed, 0 failed' /tmp/tests.log \
            || { echo "::error::macOS test suite failed - blocking release"; exit 1; }
      - name: Stage versioned archive
        run: |
          set -eu
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          DIST="salam-mac"
          mkdir -p "$DIST"
          cp salam "$DIST/salam"
          cp -r std "$DIST/std"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for macOS - self-hosted toolchain."
            echo ""
            echo "  ./salam exec  app.salam                     (interpreter)"
            echo "  ./salam llvm  app.salam --jit               (run via built-in LLVM backend)"
            echo "  ./salam build app.salam -o app --cc=clang   (native binary via the system"
            echo "                                               clang/ld that ship with Xcode CLT)"
            echo ""
            echo "Note: the default C backend compiler is tcc, which isn't bundled or"
            echo "preinstalled on macOS - pass --cc=clang (as above), or install your own."
            echo ""
            echo "macOS cannot be a fully-static, self-contained cross-compiler. Apple"
            echo "does not permit statically linking libSystem and the macOS SDK is not"
            echo "redistributable, so linking uses Apple's toolchain. Cross-compiling"
            echo "FROM Linux/Windows TO macOS is likewise not supported."
          } > "$DIST/RUN-ME.txt"
          zip -r "salam-${VERSION}-mac.zip" "$DIST" >/dev/null
          ls -la "salam-${VERSION}-mac.zip"
      - name: Upload versioned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-macos-zip
          path: salam-*-mac.zip
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-macos
          path: salam
  build-windows:
    name: Build Salam for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download bootstrap salam.exe (bundled tcc)
        shell: bash
        run: |
          set -eu
          curl -fL -o bootstrap.zip \
            "https://github.com/SalamLang/Salam/releases/download/v${BOOTSTRAP_VERSION}/salam-${BOOTSTRAP_VERSION}-windows.zip"
          mkdir -p .bootstrap
          7z x bootstrap.zip -o.bootstrap >/dev/null
          rm -f bootstrap.zip

      - name: Cache MSYS2 packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-mingw64-pkgs-${{ github.run_id }}
          restore-keys: |
            msys2-mingw64-pkgs-

      - name: Install LLVM (for the compiler's LLVM backend)
        shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail "{0}"'
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: '1'
        run: |
          pacman -Sy --noconfirm --needed mingw-w64-x86_64-llvm mingw-w64-x86_64-lld
          llvm-config --version

      - name: Add MinGW64 (LLVM) to PATH for later steps
        shell: bash
        run: echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

      - name: Bootstrap and self-host build salam.exe (bundled tcc)
        shell: bash
        run: |
          set -eu
          SALAM_STD="$PWD" ./.bootstrap/salam-windows/salam.exe \
            build compiler/main.salam --output=compiler/salam.exe
          cp compiler/salam.exe ./salam.exe
          ./salam.exe version

      - name: Smoke-test the backends
        shell: bash
        run: |
          set -e
          cp -r .bootstrap/salam-windows/tcc .
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-llvm"\nend\n' > smoke.salam
          echo "[C backend, bundled tcc]"
          ./salam.exe build smoke.salam --output=smoke_c.exe --log-level=warn
          ./smoke_c.exe
          echo "[LLVM backend]"
          ./salam.exe llvm smoke.salam --jit --log-level=warn
          ./salam.exe llvm smoke.salam --emit-obj -o smoke.o --log-level=warn
          ls -l smoke.o
          if ./salam.exe llvm smoke.salam --exec -o smoke_llvm.exe --log-level=warn \
               && ./smoke_llvm.exe; then
            echo "llvm --exec OK"
          else
            echo "note: llvm --exec unavailable (no LLVM-capable linker on PATH);"
            echo "      use 'salam llvm --jit' to run, or 'salam build' for a native exe."
          fi
          rm -f smoke.salam smoke*.exe smoke.o salam_mod_*.c salam_mod_*.h

      - name: Validate test suite (release gate)
        if: startsWith(github.event.head_commit.message, 'release:')
        shell: bash
        run: |
          SALAM="$GITHUB_WORKSPACE/salam.exe" \
            sh compiler/tools/bash/run-tests.sh general exec errors layout llvm 2>&1 | tee /tmp/tests.log || true
          grep -qE 'RESULT: [0-9]+ passed, 0 failed' /tmp/tests.log \
            || { echo "::error::Windows test suite failed - blocking release"; exit 1; }

      - name: Stage bundle
        shell: bash
        run: |
          set -eu
          DIST="salam-windows"
          mkdir -p "$DIST"
          cp salam.exe "$DIST/"
          cp -r std "$DIST/std"
          cp -r .bootstrap/salam-windows/tcc "$DIST/tcc"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for Windows - self-hosted, self-contained (C backend)."
            echo ""
            echo "No installation needed for the C backend. From this folder:"
            echo ""
            echo "  salam.exe version"
            echo "  salam.exe exec  myprogram.salam        (tree-walking interpreter)"
            echo "  salam.exe build myprogram.salam        (native exe via bundled tcc)"
            echo "  salam.exe llvm  myprogram.salam --jit   (run via the LLVM backend -"
            echo "                                           needs clang/llc/lli installed)"
            echo ""
            echo "salam.exe finds its std/ library and the bundled tcc/ automatically;"
            echo "keep them next to salam.exe."
          } > "$DIST/RUN-ME.txt"
          echo "bundle contents:"; ls -la "$DIST"

      - name: Zip the bundle
        shell: bash
        run: |
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          7z a -tzip "salam-${VERSION}-windows.zip" salam-windows >/dev/null
          ls -la "salam-${VERSION}-windows.zip"

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-windows-bundle
          path: salam-*-windows.zip

      - name: Upload salam.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-windows
          path: salam.exe

  build-windows-i686:
    name: Build Salam for Windows (32-bit / i686, minimal)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap and self-host build 32-bit salam.exe (bundled 32-bit tcc)
        shell: bash
        run: |
          set -eu
          curl -fL -o bootstrap.zip \
            "https://github.com/SalamLang/Salam/releases/download/v${BOOTSTRAP_VERSION}/salam-${BOOTSTRAP_VERSION}-windows-i686-minimal.zip"
          mkdir -p .bootstrap
          7z x bootstrap.zip -o.bootstrap >/dev/null
          rm -f bootstrap.zip
          SALAM_STD="$PWD" ./.bootstrap/salam-windows-i686/salam.exe \
            build compiler/main.salam --output=compiler/salam.exe
          cp compiler/salam.exe ./salam.exe
          ./salam.exe version
          file salam.exe || true

      - name: Stage minimal 32-bit bundle
        shell: bash
        run: |
          set -eu
          DIST="salam-windows-i686"
          mkdir -p "$DIST"
          cp salam.exe "$DIST/"
          cp -r std "$DIST/std"
          fetch_tcc() {
            out="$1"; file="$2"
            for attempt in 1 2 3 4 5; do
              for base in \
                "https://download.savannah.gnu.org/releases/tinycc" \
                "https://download-mirror.savannah.gnu.org/releases/tinycc" \
                "https://download.savannah.nongnu.org/releases/tinycc"; do
                echo "Fetching $base/$file (attempt $attempt)..."
                if curl -fL --connect-timeout 20 --retry 3 --retry-delay 5 \
                     --retry-all-errors -o "$out" "$base/$file"; then
                  return 0
                fi
              done
              sleep $((attempt * 10))
            done
            echo "ERROR: could not download $file from any Savannah mirror" >&2
            return 1
          }
          fetch_tcc tcc.zip tcc-0.9.27-win32-bin.zip
          7z x tcc.zip -o"$DIST" >/dev/null
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for Windows (32-bit / i686) - MINIMAL build."
            echo ""
            echo "Runs on 32-bit and 64-bit Windows. Ships the interpreter and the"
            echo "C backend (bundled 32-bit tcc) only - there is NO embedded LLVM and"
            echo "NO cross-compilation in this build (see below)."
            echo ""
            echo "  salam.exe version"
            echo "  salam.exe exec  myprogram.salam    (tree-walking interpreter)"
            echo "  salam.exe build myprogram.salam    (native exe via bundled 32-bit tcc)"
            echo ""
            echo "Need 'salam llvm' or 'salam build --target=...'? Use the 64-bit"
            echo "Windows build (salam-<ver>-windows.zip)."
          } > "$DIST/RUN-ME.txt"
          echo "bundle contents:"; ls -la "$DIST"

      - name: Smoke-test the minimal 32-bit build
        shell: bash
        run: |
          set -e
          cd salam-windows-i686
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-win32"\nend\n' > smoke.salam
          echo "[1] C backend via bundled 32-bit tcc"
          ./salam.exe build smoke.salam --output=smoke_tcc.exe --log-level=warn
          ./smoke_tcc.exe
          echo "[2] interpreter"
          ./salam.exe exec smoke.salam --log-level=warn
          rm -f smoke.salam smoke*.exe salam_mod_*.c salam_mod_*.h
          cd ..

      - name: Zip the minimal 32-bit bundle
        shell: bash
        run: |
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          7z a -tzip "salam-${VERSION}-windows-i686-minimal.zip" salam-windows-i686 >/dev/null
          ls -la "salam-${VERSION}-windows-i686-minimal.zip"

      - name: Upload minimal 32-bit Windows bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-windows-i686-bundle
          path: salam-*-windows-i686-minimal.zip

      - name: Upload 32-bit salam.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-windows-i686
          path: salam.exe

  build-linux-i686:
    name: Build Salam for Linux (32-bit / i686)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install 32-bit runtime libs (to run the bootstrap + built i686 binaries)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386
      - name: Bootstrap and self-host build 32-bit salam (bundled musl-tcc)
        run: |
          set -eu
          curl -fL -o bootstrap.zip \
            "https://github.com/SalamLang/Salam/releases/download/v${BOOTSTRAP_VERSION}/salam-${BOOTSTRAP_VERSION}-linux-i686-minimal.zip"
          mkdir -p .bootstrap
          unzip -q bootstrap.zip -d .bootstrap
          chmod +x .bootstrap/salam-linux-i686/salam
          SALAM_STD="$PWD" ./.bootstrap/salam-linux-i686/salam \
            build compiler/main.salam --output=compiler/salam
          cp compiler/salam ./salam
          chmod +x ./salam
          file salam
          ./salam version
      - name: Smoke-test the 32-bit binary (interpreter + bundled musl-tcc)
        run: |
          cp -r .bootstrap/salam-linux-i686/tcc .
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-linux-32"\nend\n' > smoke.salam
          ./salam build smoke.salam --cc=tcc --output=smoke --log-level=info && ./smoke
          file smoke
          ./salam exec smoke.salam --log-level=warn || true
          rm -f smoke smoke.salam salam_mod_*.c salam_mod_*.h
      - name: Stage versioned archive
        run: |
          set -eu
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          DIST="salam-linux-i686"
          mkdir -p "$DIST"
          cp salam "$DIST/salam"
          cp -r std "$DIST/std"
          cp -r .bootstrap/salam-linux-i686/tcc "$DIST/tcc"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for Linux (32-bit / i686) - self-hosted, self-contained."
            echo ""
            echo "No installation needed. From this folder:"
            echo ""
            echo "  ./salam version"
            echo "  ./salam exec  app.salam            (interpreter)"
            echo "  ./salam build app.salam -o app     (native binary via the bundled,"
            echo "                                      musl-statically-linked tcc - no"
            echo "                                      system C compiler needed)"
            echo ""
            echo "There is no LLVM backend for i686 (none exists for this target; see"
            echo "the 64-bit Linux flagship for 'salam llvm' and cross-compilation)."
          } > "$DIST/RUN-ME.txt"
          zip -r "salam-${VERSION}-linux-i686-minimal.zip" "$DIST" >/dev/null
          ls -la "salam-${VERSION}-linux-i686-minimal.zip"
      - name: Upload versioned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-i686-zip
          path: salam-*-linux-i686-minimal.zip
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-i686
          path: salam

  build-linux-arm:
    name: Build Salam for Linux ARM (${{ matrix.arch }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            deb_arch: arm64
            qemu: qemu-aarch64-static
          - arch: armhf
            deb_arch: armhf
            qemu: qemu-arm-static
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install qemu + ${{ matrix.arch }} runtime libs
        run: |
          sudo dpkg --add-architecture ${{ matrix.deb_arch }}
          sudo apt-get update
          sudo apt-get install -y qemu-user-static libc6:${{ matrix.deb_arch }}
      - name: Bootstrap and self-host build salam for ${{ matrix.arch }} (bundled musl-tcc)
        run: |
          set -eu
          curl -fL -o bootstrap.zip \
            "https://github.com/SalamLang/Salam/releases/download/v${BOOTSTRAP_VERSION}/salam-${BOOTSTRAP_VERSION}-linux-${{ matrix.arch }}-minimal.zip"
          mkdir -p .bootstrap
          unzip -q bootstrap.zip -d .bootstrap
          chmod +x ".bootstrap/salam-linux-${{ matrix.arch }}/salam"
          SALAM_STD="$PWD" ${{ matrix.qemu }} \
            "./.bootstrap/salam-linux-${{ matrix.arch }}/salam" \
            build compiler/main.salam --output=compiler/salam
          cp compiler/salam ./salam
          chmod +x ./salam
          file salam
      - name: Smoke-test under qemu
        run: |
          ${{ matrix.qemu }} ./salam version
      - name: Smoke-test bundled musl-tcc under qemu
        run: |
          cp -r ".bootstrap/salam-linux-${{ matrix.arch }}/tcc" .
          printf 'func main:\n    println "ok-%s"\nend\n' "${{ matrix.arch }}" > smoke.salam
          SALAM_STD="$PWD/std" ${{ matrix.qemu }} \
            ./salam build smoke.salam --cc=tcc --output=smoke --log-level=info
          file smoke
          ${{ matrix.qemu }} ./smoke
          rm -f smoke smoke.salam salam_mod_*.c salam_mod_*.h
      - name: Stage versioned archive
        run: |
          set -eu
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          DIST="salam-linux-${{ matrix.arch }}"
          mkdir -p "$DIST"
          cp salam "$DIST/salam"
          cp -r std "$DIST/std"
          cp -r ".bootstrap/salam-linux-${{ matrix.arch }}/tcc" "$DIST/tcc"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for Linux ${{ matrix.arch }} - self-hosted, self-contained."
            echo ""
            echo "No installation needed. From this folder:"
            echo ""
            echo "  ./salam version"
            echo "  ./salam exec  app.salam            (interpreter)"
            echo "  ./salam build app.salam -o app     (native binary via the bundled,"
            echo "                                      musl-statically-linked tcc - no"
            echo "                                      system C compiler needed)"
            echo ""
            echo "There is no LLVM backend for this architecture (see the 64-bit Linux"
            echo "flagship for 'salam llvm' and cross-compilation)."
          } > "$DIST/RUN-ME.txt"
          zip -r "salam-${VERSION}-linux-${{ matrix.arch }}-minimal.zip" "$DIST" >/dev/null
          ls -la "salam-${VERSION}-linux-${{ matrix.arch }}-minimal.zip"
      - name: Upload versioned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-${{ matrix.arch }}-zip
          path: salam-*-linux-${{ matrix.arch }}-minimal.zip
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-${{ matrix.arch }}
          path: salam

  build-android:
    name: Build & sign Android app (AAB + universal + per-ABI APKs)
    if: startsWith(github.event.head_commit.message, 'release:')
    uses: ./.github/workflows/_reusable-android-build.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  create-release:
    if: |
      startsWith(github.event.head_commit.message, 'release:') &&
      github.repository == 'SalamLang/Salam'
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      [
        build-linux,
        build-macos,
        build-windows,
        build-windows-i686,
        build-linux-i686,
        build-linux-arm,
        build-android,
      ]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Read version from VERSION file
        id: get_version
        run: |
          VERSION=$(cat VERSION | sed 's/^[ \t]*//;s/[ \t]*$//')
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Salam version: ${VERSION}"
      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux
          path: ./release
      - name: Rename Linux binary to avoid conflict
        run: |
          mv ./release/salam ./release/salam-linux
      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-macos
          path: ./release
      - name: Rename macOS binary to avoid conflict
        run: |
          mv ./release/salam ./release/salam-mac
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-windows
          path: ./release
      - name: Rename Window binary
        run: |
          mv ./release/salam.exe ./release/salam-windows.exe
      - name: Download Windows self-contained bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-windows-bundle
          path: ./release
      - name: Download Linux versioned archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-zip
          path: ./release
      - name: Download macOS versioned archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-macos-zip
          path: ./release
      - name: Download Windows i686 binary
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-windows-i686
          path: ./release-win-i686
      - name: Download Windows i686 bundle
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-windows-i686-bundle
          path: ./release
      - name: Download Linux i686 binary
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-i686
          path: ./release-linux-i686
      - name: Download Linux i686 archive
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-i686-zip
          path: ./release
      - name: Download Linux aarch64 binary
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-aarch64
          path: ./release-linux-aarch64
      - name: Download Linux aarch64 archive
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-aarch64-zip
          path: ./release
      - name: Download Linux armhf binary
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-armhf
          path: ./release-linux-armhf
      - name: Download Linux armhf archive
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-armhf-zip
          path: ./release
      - name: Download Android AAB + universal APK + per-ABI APKs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-android.outputs.artifact_name }}
          path: ./release
      - name: Collect 32-bit / cross binaries (rename to avoid name clashes)
        run: |
          set -eu
          [ -f ./release-win-i686/salam.exe ]     && mv ./release-win-i686/salam.exe     ./release/salam-windows-i686.exe || true
          [ -f ./release-linux-i686/salam ]       && mv ./release-linux-i686/salam       ./release/salam-linux-i686       || true
          [ -f ./release-linux-aarch64/salam ]    && mv ./release-linux-aarch64/salam    ./release/salam-linux-aarch64    || true
          [ -f ./release-linux-armhf/salam ]      && mv ./release-linux-armhf/salam      ./release/salam-linux-armhf      || true
          echo "release/ now contains:"; ls -la ./release
      # - name: Post Linux release file to SERVER_VERSIONS_API
      #   env:
      #     SERVER_VERSIONS_API: ${{ secrets.SERVER_VERSIONS_API }}
      #     SERVER_VERSIONS_KEY: ${{ secrets.SERVER_VERSIONS_KEY }}
      #   run: |
      #     curl -X POST "$SERVER_VERSIONS_API" \
      #       -F "file=@./release/salam-linux" \
      #       -F "version=${{ env.VERSION }}" \
      #       -F "date=$(date +'%Y-%m-%d')" \
      #       -F "time=$(date +'%H:%M:%S')" \
      #       -F "key='$SERVER_VERSIONS_KEY'" \
      #       -F "platform=linux"
      # - name: Post macOS release file to SERVER_VERSIONS_API
      #   env:
      #     SERVER_VERSIONS_API: ${{ secrets.SERVER_VERSIONS_API }}
      #     SERVER_VERSIONS_KEY: ${{ secrets.SERVER_VERSIONS_KEY }}
      #   run: |
      #     curl -X POST "$SERVER_VERSIONS_API" \
      #       -F "file=@./release/salam-mac" \
      #       -F "version=${{ env.VERSION }}" \
      #       -F "date=$(date +'%Y-%m-%d')" \
      #       -F "time=$(date +'%H:%M:%S')" \
      #       -F "key='$SERVER_VERSIONS_KEY'" \
      #       -F "platform=macos"
      # - name: Post Windows release file to SERVER_VERSIONS_API
      #   env:
      #     SERVER_VERSIONS_API: ${{ secrets.SERVER_VERSIONS_API }}
      #     SERVER_VERSIONS_KEY: ${{ secrets.SERVER_VERSIONS_KEY }}
      #   run: |
      #     curl -X POST "$SERVER_VERSIONS_API" \
      #       -F "file=@./release/salam-windows.exe" \
      #       -F "version=${{ env.VERSION }}" \
      #       -F "date=$(date +'%Y-%m-%d')" \
      #       -F "time=$(date +'%H:%M:%S')" \
      #       -F "key='$SERVER_VERSIONS_KEY'" \
      #       -F "platform=windows"
      - name: Delete existing release and tag if found
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null; then
            echo "Deleted existing release $TAG (and its tag)."
          else
            echo "No existing release $TAG."
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          git tag -d "$TAG" 2>/dev/null || true
      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          shopt -s nullglob
          candidates=(
            # release/salam-linux
            # release/salam-mac
            # release/salam-windows.exe
            # release/salam-linux-i686
            # release/salam-windows-i686.exe
            # release/salam-linux-aarch64
            # release/salam-linux-armhf
            release/salam-*.zip
            release/salam-application-*.apk
            release/salam-application-*.aab
          )
          assets=()
          for c in "${candidates[@]}"; do
            for f in $c; do [ -e "$f" ] && assets+=("$f"); done
          done
          echo "Publishing ${#assets[@]} assets:"; printf '  %s\n' "${assets[@]}"
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Salam Release v$VERSION" \
            --generate-notes \
            "${assets[@]}"
