---
name: 🚀 Compiler - Build & Release Binaries
# checkov:skip=CKV_GHA_7:inputs are only ever read via env: indirection, never interpolated into a run: script
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      nightly:
        description: Build the full multi-platform release and publish it as a nightly release (used by the nightly-release-check workflow)
        type: boolean
        default: false
      nightly_date:
        description: 'Date (YYYY-MM-DD) to stamp the nightly tag/title with; defaults to today (UTC) if left blank'
        type: string
        default: ''
# ccache stores its objects zstd-compressed; level 0 (its default) is fast but
# leaves a lot on the table. This repository keeps seven ccache directories
# across the release matrix, budgeted at 300-800 MB each, against a 10 GB
# repository-wide Actions cache limit shared with every other workflow. Level 9
# shrinks each directory materially for a small write-time cost, which both
# reduces what is uploaded and - because --max-size caps the COMPRESSED size -
# lets more objects live inside the same budget, improving the hit rate.
env:
  CCACHE_COMPRESS: '1'
  CCACHE_COMPRESSLEVEL: '9'

permissions:
  contents: read
jobs:
  build-linux:
    name: Build Salam for Linux
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies (static LLVM + LLD + cross sysroot inputs)
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get update
          sudo apt-get install -y build-essential ccache \
            llvm-22-dev liblld-22-dev libpolly-22-dev libclang-rt-22-dev \
            libzstd-dev zlib1g-dev libtinfo-dev libxml2-dev \
            musl-dev musl-tools mingw-w64 qemu-user-static wine64
          # wine64 alone (no i386 multiarch) can run the 64-bit-only PE
          # binaries this job cross-compiles (--target=x86_64-w64-windows-gnu);
          # run-tests.sh's cross section looks for a "wine" command, so
          # symlink it rather than pulling in wine32/i386 dependencies.
          # Newer Ubuntu (26.04+) turned wine64 into an empty transitional
          # package that just depends on the full "wine" package instead of
          # shipping its own /usr/bin/wine64, so fall back to "wine" if
          # "wine64" isn't found on PATH.
          WINE_BIN="$(command -v wine64 || command -v wine || true)"
          if [ -z "$WINE_BIN" ]; then
            echo "::error::no wine or wine64 binary found after installing wine64"
            exit 1
          fi
          sudo ln -sf "$WINE_BIN" /usr/local/bin/wine
          gcc --version | head -1
          llvm-config-22 --version
      - name: Initialize Wine prefix (for running cross-compiled Windows test binaries)
        run: |
          echo "WINEDEBUG=-all" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=/tmp/xdg-runtime" >> "$GITHUB_ENV"
          mkdir -p /tmp/xdg-runtime && chmod 0700 /tmp/xdg-runtime
          export WINEDEBUG=-all XDG_RUNTIME_DIR=/tmp/xdg-runtime
          timeout 60 wineboot --init >/tmp/wineboot-init.log 2>&1
          timeout 30 wineserver -w || wineserver -k || true
          if [ ! -f ~/.wine/system.reg ]; then
            echo "::error::wine prefix init failed:"
            cat /tmp/wineboot-init.log
            exit 1
          fi
          rm -f /tmp/wineboot-init.log
      - name: Cache cross musl sysroots (aarch64 + i686 + armhf)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/muslcc/sr-aarch64
            /tmp/muslcc/sr-i686
            /tmp/muslcc/sr-arm
          key: musl-embed-sysroots-v2-${{ github.run_id }}
          restore-keys: |
            musl-embed-sysroots-v2-
      # x86_64 is absent on purpose: this job takes it from the distro's
      # musl-dev via `make stage-sysroots`, not from a downloaded toolchain.
      - name: Fetch cross musl sysroots (aarch64 + i686 + armhf) for embedding
        run: sh tools/bash/fetch-musl-sysroots.sh --out /tmp/muslcc --arches "aarch64 i686 arm"
      - name: Cache ccache (Linux)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-linux-${{ github.run_id }}
          restore-keys: |
            ccache-linux-
      # Restore/save split rather than a plain actions/cache: a cache entry is
      # only ever written when its key MISSES, so one immutable key freezes
      # whatever the very first run happened to produce. Any run that staged
      # only part of the target set (a musl sysroot fetch that failed, a
      # cross-toolchain download that 404'd) pins that partial set forever -
      # every later run then hits the stale entry, rebuilds the missing libs
      # from scratch, and cannot store them because the key already exists.
      # Keying on run_id and restoring by prefix lets each run start from the
      # newest entry and save a more complete one, so the cache converges
      # instead of freezing. The save is skipped when nothing was built, so a
      # fully-cached run does not re-upload an identical entry.
      - name: Restore static third-party libs (sqlite3 + hiredis + openssl + mariadb, per --target=)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/extralibs
          key: extralibs-sqlite3-3530400-hiredis-v1.4.0-openssl-3.6.3-mariadb-v3.4.9-v2-${{ github.run_id }}
          restore-keys: |
            extralibs-sqlite3-3530400-hiredis-v1.4.0-openssl-3.6.3-mariadb-v3.4.9-v2-
      # Static libsqlite3.a/libhiredis.a/libssl.a/libcrypto.a/libmariadb.a per
      # supported --target= triple, embedded into salam itself (see
      # SALAM_EMBED_EXTRALIBS_*_DIR below and c/src/llvm/llvm_native.c's
      # salam_try_embed_extralibs_{musl,mingw}) so `link dynamic "sqlite3"`/
      # `link dynamic "hiredis"`/`link dynamic "ssl"`+`link dynamic "crypto"`/
      # `link dynamic "mariadb"` resolve to a bundled static archive on any
      # target - no separate
      # install needed by whoever eventually runs a salam-built program.
      # Kept as its own toolchain fetch, independent of the crt/libc
      # musl-cross fetch above (which discards the full toolchain after
      # copying out crt1.o/libc.a/etc.) so this never risks touching that
      # already-working logic. All libraries are built together per target
      # (not as separate steps) so
      # the aarch64/i686/arm cross-toolchain - a real, ~100MB fetch - only
      # gets downloaded once per target rather than once per library.
      - name: Build static third-party libs for all --target= triples
        id: extralibs
        run: |
          set -eu
          mkdir -p /tmp/extralibs
          # Cheap content fingerprint, compared again at the end of this
          # step, so the save below only runs when something was actually
          # built. The set of paths is signal enough: every need_build*
          # gate below builds only when its .a is missing, so anything
          # built necessarily adds a file. Deliberately no `find -printf`
          # (a GNU extension): if it were unsupported the error would be
          # swallowed, both fingerprints would come back empty and equal,
          # and the cache would silently never be saved again.
          fingerprint() {
            find "$1" -type f 2>/dev/null \
              | LC_ALL=C sort | sha256sum | cut -d' ' -f1
          }
          EXTRALIBS_BEFORE=$(fingerprint /tmp/extralibs)
          TARGETS="x86_64-linux-musl aarch64-linux-musl i686-linux-musl arm-linux-musleabihf x86_64-w64-windows-gnu hostlibs"
          need_build() { [ ! -f "/tmp/extralibs/$2/lib$1.a" ]; }
          any_needed() { for t in $TARGETS; do need_build "$1" "$t" && return 0; done; return 1; }
          # openssl's build_openssl() below writes libssl.a + libcrypto.a, not
          # a "libopenssl.a" - need_build()'s generic lib$1.a pattern doesn't
          # match either file, so a plain `need_build openssl` is always true
          # and would force a from-source openssl rebuild for every target on
          # every run regardless of cache. Check the real output files instead.
          need_build_openssl() { [ ! -f "/tmp/extralibs/$1/libssl.a" ] || [ ! -f "/tmp/extralibs/$1/libcrypto.a" ]; }
          any_needed_openssl() { for t in $TARGETS; do need_build_openssl "$t" && return 0; done; return 1; }

          if any_needed sqlite3; then
            curl -fL --connect-timeout 10 --max-time 120 -o /tmp/sqlite3.zip \
              "https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip"
            echo "1e71ddf93849c6a6ecf58b827c0692073d2dd7ee40196158068f7b29f422e87d  /tmp/sqlite3.zip" \
              | sha256sum -c -
            unzip -q -o /tmp/sqlite3.zip -d /tmp/sqlite3-src
            SQLITE_C=/tmp/sqlite3-src/sqlite-amalgamation-3530400/sqlite3.c
          fi
          if any_needed hiredis; then
            git clone --quiet --depth 1 --branch v1.4.0 \
              https://github.com/redis/hiredis.git /tmp/hiredis-src
          fi
          # openssl needs its own build (Configure + make), not a simple
          # CC/AR pair like sqlite3/hiredis, so it isn't run through
          # build_all() below - build_openssl() is called directly instead,
          # both from the "straightforward toolchain" section and inside
          # the aarch64/i686/arm loop. no-secure-memory is required under
          # musl: crypto/mem_sec.c's secure-heap code includes the Linux
          # kernel's <linux/mman.h> (for mlock2's MLOCK_ONFAULT), which
          # musl's minimal sysroot does not ship - the whole file's
          # OPENSSL_SYS_LINUX block is guarded by #ifndef
          # OPENSSL_NO_SECURE_MEMORY, so disabling the feature skips that
          # include entirely rather than needing the header.
          # Also pre-fetched whenever mariadb needs (re)building, even if
          # openssl itself is fully cached: build_mariadb() below points
          # CMake's FindOpenSSL at a scratch "openssl-root" (headers only,
          # via ensure_openssl_root()) that isn't part of the cached
          # /tmp/extralibs path, so a fresh runner needs the tarball on hand
          # to regenerate just those headers even on an openssl cache hit.
          if any_needed_openssl || any_needed mariadb; then
            curl -fL --connect-timeout 15 --max-time 180 -o /tmp/openssl.tar.gz \
              "https://github.com/openssl/openssl/releases/download/openssl-3.6.3/openssl-3.6.3.tar.gz"
            echo "243a86649cf6f23eeb6a2ff2456e09e5d77dd9018a54d3d96b0c6bdd6ba6c7f1  /tmp/openssl.tar.gz" \
              | sha256sum -c -
          fi
          JOBS=$(nproc 2>/dev/null || echo 4)
          # no-engine: the legacy engines/ (e_afalg, e_capi, e_padlock, ...) are
          # optional OS/hardware-integration modules superseded by OpenSSL 3.x
          # "providers" - e_afalg.c specifically needs the Linux kernel's
          # <linux/version.h>, absent from musl's minimal sysroot. Disabling
          # the whole category avoids that (and whatever the next engine's
          # missing-header turns out to be on some other cross-toolchain)
          # rather than chasing them one at a time; nothing in std/ssl/ssl.salam
          # needs engine-specific APIs.
          build_openssl() {
            target="$1"; ossl_target="$2"; shift 2
            need_build_openssl "$target" || { echo "reusing cached openssl for $target"; return 0; }
            # Per-target scratch dir (not a single shared /tmp/openssl-build)
            # so independent targets can be built concurrently below without
            # clobbering each other's in-progress Configure/make tree.
            ob_dir="/tmp/openssl-build-$target"
            rm -rf "$ob_dir" "$ob_dir.log"; mkdir -p "$ob_dir"
            tar xf /tmp/openssl.tar.gz -C "$ob_dir" --strip-components=1
            if ( cd "$ob_dir" \
                 && ./Configure "$ossl_target" no-shared no-tests no-docs no-apps \
                      no-secure-memory no-engine "$@" \
                 && make -j"$JOBS" build_libs ) >"$ob_dir.log" 2>&1; then
              if [ -f "$ob_dir/libssl.a" ] && [ -f "$ob_dir/libcrypto.a" ]; then
                mkdir -p "/tmp/extralibs/$target"
                cp "$ob_dir/libssl.a" "$ob_dir/libcrypto.a" "/tmp/extralibs/$target/"
                # Scratch OpenSSL "root" (headers + libs) for build_mariadb()
                # below to point CMake's FindOpenSSL at - deliberately NOT
                # under /tmp/extralibs (which gets embedded into salam
                # itself): the headers are only needed to configure
                # mariadbclient's build here in CI, never at runtime.
                rm -rf "/tmp/openssl-root-$target"
                mkdir -p "/tmp/openssl-root-$target/include" "/tmp/openssl-root-$target/lib"
                cp -r "$ob_dir/include/." "/tmp/openssl-root-$target/include/"
                cp "$ob_dir/libssl.a" "$ob_dir/libcrypto.a" \
                  "/tmp/openssl-root-$target/lib/"
                echo "built libssl.a/libcrypto.a for $target"
              else
                echo "::warning::openssl build for $target reported success but libssl.a/libcrypto.a are missing; skipping"
              fi
            else
              echo "::warning::openssl build failed for $target; skipping static openssl for this target"
              tail -60 "$ob_dir.log" || true
            fi
            rm -rf "$ob_dir" "$ob_dir.log"
          }
          # MariaDB Connector/C is CMake-based (needs a compiler + system-name
          # override per target, not a simple CC/AR pair) - same reasoning as
          # openssl above. Its CMakeLists has no "disable TLS" option at all -
          # WITH_SSL must be OPENSSL, GNUTLS, or (Windows-only) SCHANNEL, else
          # it hard-errors ("Invalid TLS/SSL option") - so windows targets use
          # SCHANNEL (native Windows API, zero extra dependency) and
          # everything else points CMake's FindOpenSSL at the scratch
          # "openssl-root" build_openssl() staged above via OPENSSL_ROOT_DIR.
          # The project's own CMake install step renames the static lib to
          # libmariadb.a via a symlink, but salam's embed extraction (a
          # deliberately tiny custom untar, see c/src/driver/embed_sysroot.c)
          # does not support symlinks, so the rename is done here with a
          # plain copy instead.
          if any_needed mariadb; then
            git clone --quiet --depth 1 --branch v3.4.9 \
              https://github.com/mariadb-corporation/mariadb-connector-c.git /tmp/mariadb-src
          fi
          # Regenerates just the openssl-root scratch headers (cheap:
          # extract + `Configure` + `make build_generated`, no compiling)
          # when build_openssl() didn't run this CI invocation because its
          # .a files were already cache hit - the headers live outside the
          # cached /tmp/extralibs path (see build_openssl()'s comment), so a
          # cache hit alone leaves them missing even though the actual libs
          # are available.
          #
          # The sentinel is opensslv.h, and it is generated, not shipped:
          # OpenSSL 3.x keeps ~two dozen headers as .h.in templates and
          # `Configure` alone expands none of them. Staging a Configure-only
          # tree therefore looked complete (evp.h, macros.h and the rest of
          # the static headers are all there, and CMake's FindOpenSSL was
          # happy) right up to the first compile, which died on
          # `openssl/macros.h:15: openssl/opensslv.h: No such file or
          # directory` - the whole mariadb build for the one target whose
          # openssl came from cache. build_openssl() never hit this because
          # `make build_libs` generates them on the way to the .a files.
          ensure_openssl_root() {
            target="$1"; ossl_target="$2"; shift 2
            [ -f "/tmp/openssl-root-$target/include/openssl/opensslv.h" ] && return 0
            [ -f "/tmp/extralibs/$target/libssl.a" ] || return 1
            [ -f /tmp/openssl.tar.gz ] || {
              curl -fL --connect-timeout 15 --max-time 180 -o /tmp/openssl.tar.gz \
                "https://github.com/openssl/openssl/releases/download/openssl-3.6.3/openssl-3.6.3.tar.gz" || return 1
              echo "243a86649cf6f23eeb6a2ff2456e09e5d77dd9018a54d3d96b0c6bdd6ba6c7f1  /tmp/openssl.tar.gz" \
                | sha256sum -c - || return 1
            }
            # Per-target scratch dir - see build_openssl()'s comment above.
            ob_dir="/tmp/openssl-build-$target"
            rm -rf "$ob_dir" "$ob_dir.log"; mkdir -p "$ob_dir"
            tar xf /tmp/openssl.tar.gz -C "$ob_dir" --strip-components=1
            # build_generated expands the .h.in templates and nothing else -
            # it runs perl only, so it needs no cross compiler and costs
            # seconds, unlike the build_libs that build_openssl() does.
            ( cd "$ob_dir" \
              && ./Configure "$ossl_target" no-shared no-tests no-docs no-apps \
                   no-secure-memory no-engine "$@" \
              && make -j"$JOBS" build_generated ) >"$ob_dir.log" 2>&1 || {
              echo "::warning::openssl header regeneration failed for $target"
              tail -30 "$ob_dir.log" || true
              rm -rf "$ob_dir" "$ob_dir.log"; return 1; }
            rm -rf "/tmp/openssl-root-$target"
            mkdir -p "/tmp/openssl-root-$target/include" "/tmp/openssl-root-$target/lib"
            cp -r "$ob_dir/include/." "/tmp/openssl-root-$target/include/"
            cp "/tmp/extralibs/$target/libssl.a" "/tmp/extralibs/$target/libcrypto.a" \
              "/tmp/openssl-root-$target/lib/"
            rm -rf "$ob_dir" "$ob_dir.log"
            # Fail here rather than 400 lines into mariadb's compile: a root
            # missing a generated header configures cleanly and only dies at
            # the first #include.
            [ -f "/tmp/openssl-root-$target/include/openssl/opensslv.h" ] || {
              echo "::warning::openssl-root for $target is missing generated headers"
              return 1; }
          }
          build_mariadb() {
            target="$1"; ossl_target="$2"; shift 2
            need_build mariadb "$target" || { echo "reusing cached mariadb for $target"; return 0; }
            case "$target" in
              *windows*) ssl_args=(-DWITH_SSL=SCHANNEL) ;;
              *)
                if ensure_openssl_root "$target" "$ossl_target"; then
                  # FindOpenSSL.cmake consults pkg-config before honoring
                  # OPENSSL_ROOT_DIR, so on a runner with system libssl-dev
                  # preinstalled it silently resolves OPENSSL_INCLUDE_DIR to
                  # /usr/include (wrong version, and for cross targets the
                  # bundled musl-cross gcc can't even see /usr/include at
                  # all - "fatal error: openssl/evp.h: No such file or
                  # directory"). Pin the include dir and both static libs
                  # directly so FindOpenSSL's own probing never runs.
                  ssl_args=(-DWITH_SSL=OPENSSL "-DOPENSSL_ROOT_DIR=/tmp/openssl-root-$target" \
                    -DOPENSSL_USE_STATIC_LIBS=TRUE \
                    "-DOPENSSL_INCLUDE_DIR=/tmp/openssl-root-$target/include" \
                    "-DOPENSSL_CRYPTO_LIBRARY=/tmp/openssl-root-$target/lib/libcrypto.a" \
                    "-DOPENSSL_SSL_LIBRARY=/tmp/openssl-root-$target/lib/libssl.a" \
                    -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON)
                else
                  echo "::warning::no static openssl available for $target; skipping static mariadb (it has no TLS-less build option)"
                  return 0
                fi
                ;;
            esac
            # Per-target scratch build dir (mariadb-connector-c is built
            # out-of-source, so /tmp/mariadb-src itself is only ever read,
            # not written - safe to share read-only across concurrent
            # targets below) so independent targets can build concurrently.
            mb_dir="/tmp/mariadb-build-$target"
            rm -rf "$mb_dir" "$mb_dir.log"; mkdir -p "$mb_dir"
            # CMAKE_COMPILE_WARNING_AS_ERROR=OFF is load-bearing, not
            # tidiness: mariadb-connector-c adds -Werror to CMAKE_C_FLAGS
            # unless that variable is *defined* (CMakeLists.txt:145), and
            # its ma_context.c falls back to empty stubs with unused
            # parameters on any target with neither inline asm nor working
            # ucontext - which is every musl arch outside x86. That turned
            # -Wunused-parameter into a hard build failure for
            # arm-linux-musleabihf and cost that target its static mariadb.
            if ( cd "$mb_dir" \
                 && cmake /tmp/mariadb-src -DCMAKE_BUILD_TYPE=Release \
                      -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
                      -DWITH_UNIT_TESTS=OFF -DWITH_CURL=OFF "${ssl_args[@]}" "$@" \
                 && cmake --build . --target mariadbclient -j"$JOBS" ) \
                 >"$mb_dir.log" 2>&1; then
              LIB=$(find "$mb_dir" -name "libmariadbclient.a" | head -1)
              if [ -n "$LIB" ]; then
                mkdir -p "/tmp/extralibs/$target"
                cp "$LIB" "/tmp/extralibs/$target/libmariadbclient.a"
                cp "$LIB" "/tmp/extralibs/$target/libmariadb.a"
                cp "$LIB" "/tmp/extralibs/$target/libmysqlclient.a"
                echo "built libmariadb.a for $target"
              else
                echo "::warning::mariadb build for $target reported success but libmariadbclient.a is missing; skipping"
              fi
            else
              echo "::warning::mariadb build failed for $target; skipping static mariadb for this target"
              tail -80 "$mb_dir.log" || true
            fi
            rm -rf "$mb_dir" "$mb_dir.log"
          }

          build_sqlite3() {
            target="$1"; cc="$2"; ar="$3"
            mkdir -p "/tmp/extralibs/$target"
            "$cc" -O2 -DSQLITE_THREADSAFE=1 -c "$SQLITE_C" -o "/tmp/extralibs/$target/sqlite3.o"
            "$ar" rcs "/tmp/extralibs/$target/libsqlite3.a" "/tmp/extralibs/$target/sqlite3.o"
            rm -f "/tmp/extralibs/$target/sqlite3.o"
          }
          build_hiredis() {
            target="$1"; cc="$2"; ar="$3"
            mkdir -p "/tmp/extralibs/$target"
            make -C /tmp/hiredis-src clean >/dev/null
            make -C /tmp/hiredis-src libhiredis.a CC="$cc" AR="$ar" USE_WERROR=0 >/dev/null
            cp /tmp/hiredis-src/libhiredis.a "/tmp/extralibs/$target/libhiredis.a"
          }
          build_all() {
            target="$1"; cc="$2"; ar="$3"
            command -v "$cc" >/dev/null 2>&1 || {
              echo "::warning::$cc not found; skipping static third-party libs for $target"; return 0; }
            if need_build sqlite3 "$target"; then
              build_sqlite3 "$target" "$cc" "$ar"; echo "built libsqlite3.a for $target"
            fi
            if need_build hiredis "$target"; then
              build_hiredis "$target" "$cc" "$ar"; echo "built libhiredis.a for $target"
            fi
          }
          # x86_64-linux-musl and the windows target already have a real,
          # complete cross-gcc on PATH (musl-tools / mingw-w64, apt-installed
          # above) - straightforward.
          build_all x86_64-linux-musl musl-gcc ar
          build_all x86_64-w64-windows-gnu x86_64-w64-mingw32-gcc x86_64-w64-mingw32-ar
          # "hostlibs" isn't a --target= triple - it's this runner's own
          # native glibc host (ubuntu-latest), for SALAM_EMBED_HOSTLIBS_DIR
          # (same-host, no --target= builds - see c/src/driver/build.c and
          # c/src/llvm/llvm_native.c). Genuinely separate from the
          # x86_64-linux-musl build above: this runner links glibc
          # natively, not musl, so it needs its own glibc-linked .a files.
          build_all hostlibs gcc ar

          # openssl (a from-source ./Configure + make, minutes per target on
          # a genuine cache miss) and mariadb (a CMake build depending on it)
          # are the only slow part of this step on a cache miss - sqlite3/
          # hiredis above stay sequential because build_hiredis() does an
          # in-tree `make clean && make` in the single shared
          # /tmp/hiredis-src checkout, which would race under real
          # concurrency. build_openssl()/build_mariadb() build into
          # per-target scratch dirs instead (see their definitions above), so
          # these 3 independent targets are safe to build concurrently here.
          (
            build_openssl x86_64-linux-musl linux-x86_64 CC=musl-gcc
            build_mariadb x86_64-linux-musl linux-x86_64 -DCMAKE_C_COMPILER=musl-gcc
          ) &
          (
            build_openssl x86_64-w64-windows-gnu mingw64 --cross-compile-prefix=x86_64-w64-mingw32-
            build_mariadb x86_64-w64-windows-gnu mingw64 -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
          ) &
          (
            build_openssl hostlibs linux-x86_64 CC=gcc
            build_mariadb hostlibs linux-x86_64 -DCMAKE_C_COMPILER=gcc
          ) &
          wait

          # aarch64/i686/arm need the full cross-tools/musl-cross toolchain
          # (not just the trimmed crt1.o/libc.a the sysroot-embed step
          # keeps) - fetch it fresh here, use its bundled gcc + headers,
          # then discard everything except the resulting .a files.
          #
          # Split into two passes: fetching the toolchain and building
          # sqlite3/hiredis (build_all) touch shared host state (the single
          # /tmp/hiredis-src checkout - see build_all's own parallelism note
          # above) and stay sequential per arch below; the actual
          # openssl+mariadb builds are queued into the ARCH_* arrays and run
          # concurrently across all 3 archs afterward, same as the x86_64/
          # hostlibs targets above.
          ARCH_TARGETS=(); ARCH_GCC=(); ARCH_OSSL=(); ARCH_ARCH=(); ARCH_CTRIPLE=()
          for pair in aarch64:aarch64-linux-musl:aarch64-unknown-linux-musl:linux-aarch64 \
                      i686:i686-linux-musl:i686-unknown-linux-musl:linux-x86 \
                      arm:arm-linux-musleabihf:arm-unknown-linux-musleabihf:linux-armv4; do
            arch="${pair%%:*}"; rest="${pair#*:}"; target="${rest%%:*}"
            rest2="${rest#*:}"; ctriple="${rest2%%:*}"; ossl_target="${rest2#*:}"
            need_build sqlite3 "$target" || need_build hiredis "$target" \
              || need_build_openssl "$target" || need_build mariadb "$target" || {
              echo "reusing cached static libs for $target"; continue; }
            rm -rf "/tmp/xtc-${arch}"; mkdir -p "/tmp/xtc-${arch}"
            if curl -fL --connect-timeout 5 --max-time 300 --speed-limit 512 --speed-time 30 \
                 -o "/tmp/xtc-${arch}.tar" \
                 "https://github.com/cross-tools/musl-cross/releases/latest/download/${ctriple}.tar.xz" \
               || curl -fL --connect-timeout 5 --max-time 300 --speed-limit 512 --speed-time 30 \
                 -o "/tmp/xtc-${arch}.tar" "https://musl.cc/${target}-cross.tgz" \
                 2>/dev/null; then
              tar xf "/tmp/xtc-${arch}.tar" -C "/tmp/xtc-${arch}"
              GCC=$(find "/tmp/xtc-${arch}" -name "${ctriple}-gcc" -o -name "*-linux-musl*-gcc" \
                      -o -name "*musleabihf-gcc" | head -1)
              AR=$(find "/tmp/xtc-${arch}" -name "${ctriple}-ar" -o -name "*-linux-musl*-ar" \
                     -o -name "*musleabihf-ar" | head -1)
              if [ -n "$GCC" ] && [ -n "$AR" ]; then
                build_all "$target" "$GCC" "$AR"
                # $GCC/$AR point inside /tmp/xtc-${arch}: queue this arch for
                # the parallel openssl/mariadb pass below instead of
                # cleaning up the fetched toolchain right away (the
                # unconditional cleanup a few lines down is skipped via
                # `continue` for exactly this case), since that pass still
                # needs a real cross-gcc/ar to invoke. All queued archs'
                # toolchains are removed together after that pass completes.
                ARCH_TARGETS+=("$target"); ARCH_GCC+=("$GCC"); ARCH_OSSL+=("$ossl_target")
                ARCH_ARCH+=("$arch"); ARCH_CTRIPLE+=("$ctriple")
                continue
              else
                echo "::warning::could not locate cross-gcc/ar for $arch in the fetched toolchain; skipping static third-party libs for $target"
              fi
            else
              echo "::warning::could not fetch $arch musl-cross toolchain; skipping static third-party libs for $target"
            fi
            chmod -R u+rwX "/tmp/xtc-${arch}" 2>/dev/null || true
            rm -rf "/tmp/xtc-${arch}" "/tmp/xtc-${arch}.tar"
          done
          for i in "${!ARCH_TARGETS[@]}"; do
            target="${ARCH_TARGETS[$i]}"; GCC="${ARCH_GCC[$i]}"; ossl_target="${ARCH_OSSL[$i]}"
            arch="${ARCH_ARCH[$i]}"; ctriple="${ARCH_CTRIPLE[$i]}"
            (
              build_openssl "$target" "$ossl_target" "--cross-compile-prefix=$(dirname "$GCC")/${ctriple}-"
              build_mariadb "$target" "$ossl_target" -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR="$arch" -DCMAKE_C_COMPILER="$GCC"
            ) &
          done
          wait
          for arch in aarch64 i686 arm; do
            chmod -R u+rwX "/tmp/xtc-${arch}" 2>/dev/null || true
            rm -rf "/tmp/xtc-${arch}" "/tmp/xtc-${arch}.tar"
          done
          rm -rf /tmp/sqlite3.zip /tmp/sqlite3-src /tmp/hiredis-src /tmp/openssl.tar.gz /tmp/mariadb-src \
            /tmp/openssl-root-*

          for target in $TARGETS; do
            [ -d "/tmp/extralibs/$target" ] || continue
            if [ "$target" = "hostlibs" ]; then
              echo "SALAM_EMBED_HOSTLIBS_DIR=/tmp/extralibs/hostlibs" >> "$GITHUB_ENV"
              continue
            fi
            var="SALAM_EMBED_EXTRALIBS_$(echo "$target" | tr 'a-z-' 'A-Z_')_DIR"
            echo "${var}=/tmp/extralibs/$target" >> "$GITHUB_ENV"
          done

          # Fail safe towards saving: an empty fingerprint means the
          # helper itself broke, and skipping the save on that would
          # quietly reintroduce the very staleness this replaced.
          EXTRALIBS_AFTER=$(fingerprint /tmp/extralibs)
          if [ -n "$EXTRALIBS_AFTER" ] && [ "$EXTRALIBS_BEFORE" = "$EXTRALIBS_AFTER" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'static libs fully cached; skipping cache save'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'static libs changed; a fresh cache entry will be saved'
          fi
      - name: Save static third-party libs (sqlite3 + hiredis + openssl + mariadb, per --target=)
        if: steps.extralibs.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/extralibs
          key: extralibs-sqlite3-3530400-hiredis-v1.4.0-openssl-3.6.3-mariadb-v3.4.9-v2-${{ github.run_id }}
      # The compiler is written in its own language, so building it needs one:
      # the last published release. Everything it produces from here is this
      # checkout's sources, and build-selfhost.sh stamps this checkout's
      # VERSION onto the result rather than letting the seed's leak through.
      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam

      # Built by the compiler itself now, not by make -C c. Three pieces:
      # stage-sysroots collects this host's musl/mingw CRTs, build-embed turns
      # those plus the per-target static third-party libs into libsalam_embed.a,
      # and std/llvm/native/build.sh produces the libsalam_llvm.a that carries
      # in-process LLVM and LLD. The compiler then links all three in.
      - name: Stage the musl and mingw sysroots
        run: sh tools/bash/stage-sysroots.sh --out="$GITHUB_WORKSPACE/sysroots"

      - name: Build libsalam_llvm.a (in-process LLVM + LLD)
        run: sh std/llvm/native/build.sh --llvm-config llvm-config-22 --out "$GITHUB_WORKSPACE"

      - name: Build libsalam_embed.a (sysroots + static third-party libs)
        run: |
          set -eu
          sr="$GITHUB_WORKSPACE/sysroots"
          sh tools/bash/build-embed.sh --out "$GITHUB_WORKSPACE" \
            --musl-x86_64 "$sr/x86_64-linux-musl" \
            --musl-aarch64 "${SALAM_EMBED_MUSL_AARCH64_DIR:-}" \
            --musl-i686 "${SALAM_EMBED_MUSL_I686_DIR:-}" \
            --musl-arm "${SALAM_EMBED_MUSL_ARM_DIR:-}" \
            --mingw-x86_64 "$sr/x86_64-w64-mingw32" \
            --mingw-i686 "$sr/i686-w64-mingw32" \
            --hostlibs "${SALAM_EMBED_HOSTLIBS_DIR:-}" \
            --extralibs-x86_64-musl "${SALAM_EMBED_EXTRALIBS_X86_64_LINUX_MUSL_DIR:-}" \
            --extralibs-aarch64-musl "${SALAM_EMBED_EXTRALIBS_AARCH64_LINUX_MUSL_DIR:-}" \
            --extralibs-i686-musl "${SALAM_EMBED_EXTRALIBS_I686_LINUX_MUSL_DIR:-}" \
            --extralibs-arm-musl "${SALAM_EMBED_EXTRALIBS_ARM_LINUX_MUSLEABIHF_DIR:-}" \
            --extralibs-x86_64-mingw "${SALAM_EMBED_EXTRALIBS_X86_64_W64_WINDOWS_GNU_DIR:-}"

      - name: Build the flagship self-contained salam (LLVM + LLD + sysroots)
        run: |
          set -eu
          sh tools/bash/build-selfhost.sh \
            --llvm="$GITHUB_WORKSPACE" --embed="$GITHUB_WORKSPACE"
          echo "SELF_CONTAINED=1" >> "$GITHUB_ENV"
          ./salam version

      - name: Smoke-test the backend (and cross-compile with a scrubbed PATH)
        run: |
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-llvm"\nend\n' > smoke.salam
          echo "[native] embedded LLVM backend"
          ./salam llvm smoke.salam --emit-obj -o smoke.o --log-level=warn
          ./salam llvm smoke.salam --exec -o smoke_exe --log-level=warn && ./smoke_exe
          if [ "${SELF_CONTAINED:-0}" = "1" ]; then
            echo "[cross] x86_64-linux-musl, PATH=/nonexistent (in-process LLD + embedded musl)"
            env PATH=/nonexistent SALAM_STD="$SALAM_STD" SALAM_CACHE=/tmp/sc \
              ./salam build smoke.salam --target=x86_64-linux-musl -o smoke_musl
            ./smoke_musl; file smoke_musl
            echo "[cross] x86_64-w64-windows-gnu, PATH=/nonexistent (embedded mingw sysroot)"
            env PATH=/nonexistent SALAM_STD="$SALAM_STD" SALAM_CACHE=/tmp/sc \
              ./salam build smoke.salam --target=x86_64-w64-windows-gnu -o smoke.exe
            file smoke.exe
            if [ -n "${SALAM_EMBED_MUSL_AARCH64_DIR:-}" ]; then
              echo "[cross] aarch64-linux-musl, PATH=/nonexistent (embedded aarch64 musl)"
              env PATH=/nonexistent SALAM_STD="$SALAM_STD" SALAM_CACHE=/tmp/sc \
                ./salam build smoke.salam --target=aarch64-linux-musl -o smoke_a64
              file smoke_a64
              qemu-aarch64-static ./smoke_a64
            fi
            if [ -n "${SALAM_EMBED_MUSL_I686_DIR:-}" ]; then
              echo "[cross] i686-linux-musl, PATH=/nonexistent (embedded i686 musl)"
              env PATH=/nonexistent SALAM_STD="$SALAM_STD" SALAM_CACHE=/tmp/sc \
                ./salam build smoke.salam --target=i686-linux-musl -o smoke_i686
              file smoke_i686
              ./smoke_i686
            fi
            if [ -n "${SALAM_EMBED_MUSL_ARM_DIR:-}" ]; then
              echo "[cross] arm-linux-musleabihf, PATH=/nonexistent (embedded armhf musl)"
              env PATH=/nonexistent SALAM_STD="$SALAM_STD" SALAM_CACHE=/tmp/sc \
                ./salam build smoke.salam --target=arm-linux-musleabihf -o smoke_armhf
              file smoke_armhf
              qemu-arm-static ./smoke_armhf
            fi
          fi
          rm -f smoke.salam smoke_exe smoke_musl smoke.exe smoke_a64 smoke_i686 smoke_armhf smoke.o salam_mod_*.c salam_mod_*.h
      - name: Set up pinned tcc
        if: startsWith(github.event.head_commit.message, 'release:') || (github.event_name == 'workflow_dispatch' && inputs.nightly)
        uses: ./.github/actions/setup-tcc
      - name: Validate full test suite (release gate)
        if: startsWith(github.event.head_commit.message, 'release:') || (github.event_name == 'workflow_dispatch' && inputs.nightly)
        run: |
          sudo apt-get install -y libhiredis-dev libmariadb-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          SALAM="$GITHUB_WORKSPACE/salam" sh tools/bash/run-tests.sh 2>&1 | tee /tmp/tests.log || true
          grep -qE 'RESULT: [0-9]+ passed, 0 failed' /tmp/tests.log \
            || { echo "::error::Linux test suite failed - blocking release"; exit 1; }

      # Generated C has to compile without a single diagnostic, under every C
      # compiler that can build it - not just the one the auto-ladder happens
      # to pick above. SALAM_C_STRICT=1 makes any diagnostic fatal, so a
      # codegen regression stops the job rather than scrolling past in a log
      # nobody reads; running all three matters because they disagree about
      # what is worth warning about, and a construct only gcc objects to is
      # still a construct we emitted wrongly.
      #
      # Deliberately not a matrix job: it reuses the salam built above, and
      # the sections listed are the codegen-heavy ones. db/opencv are skipped
      # because they pass their own --cc for the mock link.
      - name: Generated C compiles clean under tcc, gcc and clang
        if: startsWith(github.event.head_commit.message, 'release:') || (github.event_name == 'workflow_dispatch' && inputs.nightly)
        run: |
          set -eu
          # One clang, whichever name this image has it under.
          CLANG=""
          for c in clang-22 clang; do
            if command -v "$c" >/dev/null 2>&1; then
              CLANG="$c"
              break
            fi
          done
          rc=0
          for cc in tcc gcc $CLANG; do
            command -v "$cc" >/dev/null 2>&1 || continue
            echo "::group::generated C under $cc"
            log="/tmp/strict-$cc.log"
            SALAM="$GITHUB_WORKSPACE/salam" SALAM_CC="$cc" SALAM_C_STRICT=1 \
              sh tools/bash/run-tests.sh general exec errors layout >"$log" 2>&1 || true
            tail -20 "$log"
            echo "::endgroup::"
            if ! grep -qE 'RESULT: [0-9]+ passed, 0 failed' "$log"; then
              echo "::error::generated C is not clean under $cc"
              grep -E '^FAIL' "$log" | head -20
              rc=1
            fi
          done
          exit "$rc"
      - name: Stage versioned archive
        run: |
          set -eu
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          DIST="salam-linux"
          mkdir -p "$DIST"
          cp salam "$DIST/salam"
          cp -r std "$DIST/std"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for Linux (x86_64) - flagship self-contained toolchain."
            echo ""
            echo "No installation needed. From this folder:"
            echo ""
            echo "  ./salam version"
            echo "  ./salam exec  app.salam                               (interpreter)"
            echo "  ./salam llvm  app.salam --jit                         (run via built-in LLVM)"
            echo "  ./salam build app.salam -o app                        (native binary)"
            if [ "${SELF_CONTAINED:-0}" = "1" ]; then
              echo ""
              echo "Cross-compile with ZERO tools installed (LLVM + LLD + sysroots are"
              echo "compiled into salam itself):"
              echo ""
              echo "  ./salam build app.salam --target=x86_64-linux-musl      -o app"
              echo "  ./salam build app.salam --target=x86_64-w64-windows-gnu -o app.exe"
              if [ -n "${SALAM_EMBED_MUSL_AARCH64_DIR:-}" ]; then
                echo "  ./salam build app.salam --target=aarch64-linux-musl     -o app"
              fi
              if [ -n "${SALAM_EMBED_MUSL_I686_DIR:-}" ]; then
                echo "  ./salam build app.salam --target=i686-linux-musl        -o app"
              fi
              if [ -n "${SALAM_EMBED_MUSL_ARM_DIR:-}" ]; then
                echo "  ./salam build app.salam --target=arm-linux-musleabihf   -o app"
              fi
              echo ""
              echo "Embedded targets depend on which sysroots this build bundled (see"
              echo "above). Other targets link against a system or \$SALAM_SYSROOTS"
              echo "sysroot. macOS targets are not supported (Apple SDK restrictions)."
            fi
          } > "$DIST/RUN-ME.txt"
          zip -r "salam-${VERSION}-linux.zip" "$DIST" >/dev/null
          ls -la "salam-${VERSION}-linux.zip"
      - name: Upload versioned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-zip
          path: salam-*-linux.zip
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux
          path: salam
  build-macos:
    name: Build Salam for macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Homebrew downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-dl-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            brew-dl-${{ runner.arch }}-
      - name: Install dependencies (static LLVM)
        id: brewdeps
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          # Same restore/save reasoning as the static-libs cache: keep the
          # rolling run_id key, but only upload when the download set
          # actually moved. A plain actions/cache stores a new copy of the
          # whole thing on every single run, and these entries are big
          # enough that the duplicates alone were evicting other caches.
          # shasum, not sha256sum: macOS ships the former in the base
          # system and has no coreutils, so sha256sum is simply absent.
          fingerprint() {
            find "$1" -type f 2>/dev/null \
              | LC_ALL=C sort | shasum -a 256 | cut -d' ' -f1
          }
          mkdir -p "$HOME/Library/Caches/Homebrew/downloads"
          PKGS_BEFORE=$(fingerprint "$HOME/Library/Caches/Homebrew/downloads")

          brew untap aws/tap || true
          brew install llvm@22 ccache
          "$(brew --prefix llvm@22)/bin/llvm-config" --version

          PKGS_AFTER=$(fingerprint "$HOME/Library/Caches/Homebrew/downloads")
          if [ -n "$PKGS_AFTER" ] && [ "$PKGS_BEFORE" = "$PKGS_AFTER" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'download cache unchanged; skipping cache save'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'download cache changed; a fresh entry will be saved'
          fi
      - name: Save Homebrew downloads
        if: steps.brewdeps.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-dl-${{ runner.arch }}-${{ github.run_id }}
      - name: Cache ccache (macOS)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-macos-${{ github.run_id }}
          restore-keys: |
            ccache-macos-
      - name: Build salam for macOS (embedded static LLVM)
        run: |
          export CCACHE_DIR="$HOME/.ccache"; ccache --max-size=500M >/dev/null 2>&1 || true
          LLVM_PREFIX="$(brew --prefix llvm@22)"
          make -C c -j"$(sysctl -n hw.ncpu)" \
            WITH_LLVM=1 LLVM_LINK_STATIC=1 \
            LLVM_CONFIG="$LLVM_PREFIX/bin/llvm-config" CC="ccache clang" \
            LLVM_CXXLIB=-lc++ \
            EXTRA_LDFLAGS="-L$(brew --prefix)/lib"
          ccache --show-stats 2>/dev/null | head -5 || true
          ./salam version
      # The Linux and Windows jobs already refuse to ship a binary that
      # imports a third-party library; macOS had no such gate, and 0.2.7
      # shipped with a dynamic reference to Homebrew's versioned
      # /opt/homebrew/opt/z3/lib/libz3.4.16.dylib. That path exists only on a
      # machine with that exact formula version installed, so the released
      # binary aborted under dyld before main() on every other Mac - including
      # the runner that the self-host workflow bootstraps from. The build now
      # drops -lz3 and prefers a static libzstd (see c/Makefile); this check is
      # what keeps the next such leak from reaching a release.
      - name: Verify salam is self-contained (no Homebrew dylibs)
        run: |
          set -eu
          echo "dylib dependencies of salam:"
          otool -L salam
          bad=$(otool -L salam | awk 'NR > 1 { print $1 }' \
            | grep -E '^(/opt/homebrew/|/usr/local/(opt|Cellar|lib)/|.*/Cellar/)' || true)
          if [ -n "$bad" ]; then
            echo "ERROR: salam links non-system dylibs that will not exist on a user's Mac:"
            echo "$bad"
            echo ""
            echo "These are Homebrew Cellar paths, usually versioned. dyld aborts at"
            echo "startup on any machine without that exact formula version installed."
            echo "Either drop the library (see the -lz3 note in c/Makefile) or link its"
            echo "static archive instead of the dylib."
            exit 1
          fi
          echo "OK: salam only links macOS system libraries."
      - name: Smoke-test the embedded LLVM backend
        run: |
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-llvm"\nend\n' > smoke.salam
          ./salam llvm smoke.salam --emit-obj -o smoke.o --log-level=warn
          ./salam llvm smoke.salam --exec -o smoke_exe --log-level=warn && ./smoke_exe
          rm -f smoke.salam smoke_exe smoke.o salam_mod_*.c salam_mod_*.h
      - name: Validate test suite (release gate)
        if: startsWith(github.event.head_commit.message, 'release:') || (github.event_name == 'workflow_dispatch' && inputs.nightly)
        run: |
          SALAM="$GITHUB_WORKSPACE/salam" sh tools/bash/run-tests.sh exec errors layout llvm 2>&1 | tee /tmp/tests.log || true
          grep -qE 'RESULT: [0-9]+ passed, 0 failed' /tmp/tests.log \
            || { echo "::error::macOS test suite failed - blocking release"; exit 1; }
      - name: Stage versioned archive
        run: |
          set -eu
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          DIST="salam-mac"
          mkdir -p "$DIST"
          cp salam "$DIST/salam"
          cp -r std "$DIST/std"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for macOS - embedded LLVM toolchain."
            echo ""
            echo "  ./salam exec  app.salam            (interpreter)"
            echo "  ./salam llvm  app.salam --jit      (run via built-in LLVM)"
            echo "  ./salam build app.salam -o app     (native binary; uses the system"
            echo "                                      clang/ld that ship with Xcode CLT)"
            echo ""
            echo "Note: macOS cannot be a fully-static, self-contained cross-compiler."
            echo "Apple does not permit statically linking libSystem and the macOS SDK"
            echo "is not redistributable, so linking uses Apple's toolchain. Cross-"
            echo "compiling FROM Linux/Windows TO macOS is likewise not supported."
          } > "$DIST/RUN-ME.txt"
          zip -r "salam-${VERSION}-mac.zip" "$DIST" >/dev/null
          ls -la "salam-${VERSION}-mac.zip"
      - name: Upload versioned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-macos-zip
          path: salam-*-mac.zip
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-macos
          path: salam
  build-windows:
    name: Build Salam for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The test suite builds+runs one native .exe per test case (hundreds of
      # them), each a fresh file Windows Defender's real-time scanner inspects
      # before it's allowed to execute. That per-process scan is the single
      # biggest contributor to this job being far slower than the Linux/macOS
      # builds for the same test suite - excluding the paths/binaries that
      # matter here is the standard fix for GitHub-hosted Windows runners.
      - name: Exclude build/test paths from Windows Defender
        shell: pwsh
        run: |
          # Best-effort: some runner images/policies may reject these: don't
          # let a blocked exclusion fail the whole build over a speed-up.
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}"
            Add-MpPreference -ExclusionPath "C:\msys64"
            Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
            Add-MpPreference -ExclusionProcess "tcc.exe"
            Add-MpPreference -ExclusionProcess "salam.exe"
            Add-MpPreference -ExclusionProcess "gcc.exe"
            Set-MpPreference -DisableRealtimeMonitoring $true
            Write-Host "Windows Defender exclusions applied."
          } catch {
            Write-Host "::warning::Could not configure Windows Defender exclusions: $_"
          }

      - name: Restore MSYS2 packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-mingw64-pkgs-${{ github.run_id }}
          restore-keys: |
            msys2-mingw64-pkgs-

      - name: Install MINGW64 toolchain + static LLVM + LLD
        id: msys2deps
        shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail "{0}"'
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: '1'
        run: |
          # Same restore/save reasoning as the static-libs cache: keep the
          # rolling run_id key, but only upload when the package set
          # actually moved. A plain actions/cache stored a fresh ~300MB
          # copy on every run, and those duplicates alone were evicting
          # other caches out of the repo's 10GB budget.
          fingerprint() {
            find "$1" -type f 2>/dev/null \
              | LC_ALL=C sort | sha256sum | cut -d' ' -f1
          }
          mkdir -p /c/msys64/var/cache/pacman/pkg
          PKGS_BEFORE=$(fingerprint /c/msys64/var/cache/pacman/pkg)

          # clang here is a genuine multi-target cross-compiler frontend
          # (unlike gcc, it needs no target-native binary to compile - only
          # target headers via -isystem) - used below to build sqlite3/
          # hiredis/openssl/mariadb for the 4 linux-musl --target= triples,
          # which musl-cross's Linux-hosted cross-gcc binaries cannot do on
          # this Windows host (wrong executable format). llvm-ar/llvm-ranlib
          # (bundled with mingw-w64-x86_64-llvm, already installed below)
          # are the target-agnostic archiver counterpart.
          # git: the bundled tcc is cloned from a pinned TinyCC commit in a
          # later step, and this MSYS2 shell does not otherwise have one -
          # Git for Windows is not on its PATH.
          pacman -Sy --noconfirm --needed \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-llvm \
            mingw-w64-x86_64-lld \
            mingw-w64-x86_64-clang \
            make ccache git
          gcc --version | head -1
          llvm-config --version
          clang --version | head -1

          PKGS_AFTER=$(fingerprint /c/msys64/var/cache/pacman/pkg)
          if [ -n "$PKGS_AFTER" ] && [ "$PKGS_BEFORE" = "$PKGS_AFTER" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'pacman package cache unchanged; skipping cache save'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'pacman package cache changed; a fresh entry will be saved'
          fi

      - name: Save MSYS2 packages
        if: steps.msys2deps.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-mingw64-pkgs-${{ github.run_id }}

      - name: Cache ccache (Windows)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\ccache-win64
          key: ccache-win64-${{ github.run_id }}
          restore-keys: |
            ccache-win64-

      - name: Cache cross musl sysroots (for cross-compiling to Linux from Windows)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:\muslcc\sr-x86_64
            C:\muslcc\sr-aarch64
            C:\muslcc\sr-i686
            C:\muslcc\sr-arm
          # v3: the staged sysroots gained crtbeginT.o/crtend.o/libgcc_eh.a,
          # which clang needs to link statically here. A restored v2 cache
          # has only the old five files and fetch-musl-sysroots.sh would
          # reuse it as-is, so the key has to move for them to appear.
          key: musl-embed-sysroots-win-v3-${{ github.run_id }}
          restore-keys: |
            musl-embed-sysroots-win-v3-

      - name: Fetch cross musl sysroots (x86_64 + aarch64 + i686 + armhf) for embedding
        shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail "{0}"'
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: '1'
        # --headers, unlike the Linux jobs: this one has no cross toolchain
        # of its own to build the static third-party libs with, so it
        # cross-compiles them with clang against exactly these sysroots.
        run: sh tools/bash/fetch-musl-sysroots.sh --out /c/muslcc --headers

      # Same restore/save split as the Linux job above, and for the same
      # reason - see that step's comment. This job is where it bit hardest:
      # the 4 linux-musl targets it cross-builds depend on sysroots staged a
      # step earlier, so the entry written by the first run predated them and
      # every run since rebuilt sqlite3/hiredis for all 4 from scratch.
      - name: Restore static third-party libs (sqlite3 + hiredis + openssl + mariadb, per --target=)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\extralibs
          key: extralibs-sqlite3-3530400-hiredis-v1.4.0-openssl-3.6.3-mariadb-v3.4.9-win-v3-${{ github.run_id }}
          restore-keys: |
            extralibs-sqlite3-3530400-hiredis-v1.4.0-openssl-3.6.3-mariadb-v3.4.9-win-v3-
      # Windows counterpart of the Linux job's identically-named step - see
      # its comment for the overall rationale. x86_64-w64-windows-gnu (this
      # job's own native target) is built via the native MSYS2 gcc, same as
      # before. The 4 linux-musl targets are now also built here, via
      # clang -target <triple> -isystem <musl-sysroot>/include (the sysroot
      # staged with headers by the "Fetch cross musl sysroots" step above) +
      # llvm-ar/llvm-ranlib as the archiver: musl-cross's own cross-gcc
      # binaries are Linux-hosted ELF executables that cannot run under
      # MSYS2/Windows at all (wrong binary format), but clang needs no
      # target-native binary to *compile* - only target headers - so this
      # sidesteps that entirely. Nothing here ever executes target code:
      # sqlite3/hiredis/openssl(build_libs)/mariadb(mariadbclient) all only
      # compile + archive .a files, no link/run step, so a working target
      # linker is never needed either - salam's own embedded LLD does the
      # real link later, against these plus SALAM_EMBED_MUSL_*_DIR.
      # Each musl target gets a small on-disk "<triple>-gcc"/-ar/-ranlib
      # wrapper (a plain shebang script - exec'd fine by the MSYS-native
      # perl/make used for openssl/hiredis below) plus a "<triple>-gcc.bat"
      # twin (for CMake's native mingw-w64 cmake.exe, which cannot run a
      # shebang script directly) so both the Configure-based (openssl) and
      # CMake-based (mariadb) builds can drive clang as if it were a real
      # "<triple>-gcc". Best-effort throughout, same as the rest of this
      # file: any single library/target failing just warns and is skipped,
      # never fails the job.
      - name: Build static third-party libs for x86_64-w64-windows-gnu + linux-musl targets
        id: extralibs
        shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail "{0}"'
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: '1'
        run: |
          set -eu
          pacman -Sy --noconfirm --needed git unzip >/dev/null

          # See the Linux job's identical fingerprint helper: it decides
          # whether the save step below has anything new worth uploading.
          mkdir -p /c/extralibs
          fingerprint() {
            find "$1" -type f 2>/dev/null \
              | LC_ALL=C sort | sha256sum | cut -d' ' -f1
          }
          EXTRALIBS_BEFORE=$(fingerprint /c/extralibs)

          # need_build/need_build_openssl take the target triple as their
          # last argument (unlike this step's previous windows-gnu-only
          # form) so the same helpers cover every target below.
          need_build() { [ ! -f "/c/extralibs/$2/lib$1.a" ]; }
          need_build_openssl() { [ ! -f "/c/extralibs/$1/libssl.a" ] || [ ! -f "/c/extralibs/$1/libcrypto.a" ]; }

          # Only targets whose musl sysroot actually has headers staged (see
          # the fetch step above; a target whose fetch failed there is
          # silently absent here, already warned about at fetch time).
          # entry = <triple>:<sysroot-dir>:<openssl-Configure-target>:<CMAKE_SYSTEM_PROCESSOR>
          MUSL_TARGETS=""
          if [ -n "${SALAM_EMBED_MUSL_DIR:-}" ] && [ -f "${SALAM_EMBED_MUSL_DIR}/include/features.h" ]; then
            MUSL_TARGETS="$MUSL_TARGETS x86_64-linux-musl:${SALAM_EMBED_MUSL_DIR}:linux-x86_64:x86_64"
          fi
          if [ -n "${SALAM_EMBED_MUSL_AARCH64_DIR:-}" ] && [ -f "${SALAM_EMBED_MUSL_AARCH64_DIR}/include/features.h" ]; then
            MUSL_TARGETS="$MUSL_TARGETS aarch64-linux-musl:${SALAM_EMBED_MUSL_AARCH64_DIR}:linux-aarch64:aarch64"
          fi
          if [ -n "${SALAM_EMBED_MUSL_I686_DIR:-}" ] && [ -f "${SALAM_EMBED_MUSL_I686_DIR}/include/features.h" ]; then
            MUSL_TARGETS="$MUSL_TARGETS i686-linux-musl:${SALAM_EMBED_MUSL_I686_DIR}:linux-x86:i686"
          fi
          if [ -n "${SALAM_EMBED_MUSL_ARM_DIR:-}" ] && [ -f "${SALAM_EMBED_MUSL_ARM_DIR}/include/features.h" ]; then
            MUSL_TARGETS="$MUSL_TARGETS arm-linux-musleabihf:${SALAM_EMBED_MUSL_ARM_DIR}:linux-armv4:arm"
          fi
          [ -n "$MUSL_TARGETS" ] || echo "::warning::no musl sysroots with headers staged; skipping static third-party libs for every linux-musl target"

          musl_triples() { for e in $MUSL_TARGETS; do printf '%s\n' "${e%%:*}"; done; }
          any_needed() { for t in x86_64-w64-windows-gnu $(musl_triples); do need_build "$1" "$t" && return 0; done; return 1; }
          any_needed_openssl() { for t in x86_64-w64-windows-gnu $(musl_triples); do need_build_openssl "$t" && return 0; done; return 1; }

          # C:\msys64 is this whole workflow's hardcoded MSYS2 install root
          # (every step's `shell:` points at it directly) - used below to
          # give CMake (a native mingw-w64 binary, not MSYS-native) real
          # Windows paths for its compiler/AR/RANLIB instead of relying on
          # MSYS's argv auto-path-conversion heuristics.
          LLVM_AR_WIN=C:/msys64/mingw64/bin/llvm-ar.exe
          LLVM_RANLIB_WIN=C:/msys64/mingw64/bin/llvm-ranlib.exe
          if [ ! -f "$LLVM_AR_WIN" ] || [ ! -f "$LLVM_RANLIB_WIN" ]; then
            echo "::warning::llvm-ar/llvm-ranlib not found at the expected MSYS2 path; musl cross-libs below will be skipped"
            MUSL_TARGETS=""
          fi

          XWRAP=/c/xwrap
          mkdir -p "$XWRAP"
          # Emits <XWRAP>/<triple>/<triple>-{gcc,ar,ranlib} (plain shebang
          # scripts, exec'd fine by MSYS-native perl/make via their normal
          # #! handling) plus a <triple>-gcc.bat twin (for native mingw-w64
          # cmake.exe, which cannot run a shebang script). Prints the wrapper
          # dir's POSIX path on stdout.
          #
          # Only the .bat carries link flags, and deliberately so. The shebang
          # pair is used by sqlite3/hiredis (compile + ar, never a link) and by
          # openssl's `make build_libs` (static libs only), all of which work
          # as they are; the .bat is used by exactly one caller, mariadb's
          # CMake, which is the only thing here that links an executable.
          #
          #   -fuse-ld=lld  clang otherwise resolves plain `ld` off PATH, which
          #                 on this runner is MSYS2's mingw ld - a PE-only
          #                 linker. Its very first act is CMakeTestCCompiler's
          #                 try-compile, and it died there with "unrecognised
          #                 emulation mode: elf_i386 / Supported emulations:
          #                 i386pep i386pe", so CMake declared the compiler
          #                 broken and every musl target lost its static
          #                 mariadb. lld links ELF for all four.
          #   -B/-L         these sysroots are flat - crt1.o, crti.o, crtn.o,
          #                 libc.a and libgcc.a sit directly in <sysroot> (see
          #                 tools/bash/fetch-musl-sysroots.sh), nowhere clang
          #                 looks by default. Without -B it emits a bare
          #                 "crt1.o" the linker cannot resolve.
          #   -static       nothing but .a files was staged, so a dynamic link
          #                 has nothing to find.
          #
          # The .bat also needs a Windows-shaped sysroot path: it is read by
          # native cmake.exe/clang.exe, which take a leading /c/... as
          # drive-relative rather than as the MSYS mount. Same reasoning as
          # LLVM_AR_WIN/LLVM_RANLIB_WIN above.
          make_musl_wrapper() {
            triple="$1"; sr="$2"
            d="$XWRAP/$triple"; mkdir -p "$d"
            printf '#!/bin/sh\nexec clang -target %s -isystem "%s/include" "$@"\n' "$triple" "$sr" \
              >"$d/$triple-gcc"
            printf '#!/bin/sh\nexec llvm-ar "$@"\n' >"$d/$triple-ar"
            printf '#!/bin/sh\nexec llvm-ranlib "$@"\n' >"$d/$triple-ranlib"
            chmod +x "$d/$triple-gcc" "$d/$triple-ar" "$d/$triple-ranlib"
            srw=$(cygpath -m "$sr" 2>/dev/null || printf '%s' "$sr")
            printf '@echo off\r\nclang -target %s -isystem "%s/include" -fuse-ld=lld -static -B"%s" -L"%s" %%*\r\n' \
              "$triple" "$srw" "$srw" "$srw" >"$d/$triple-gcc.bat"
            printf '%s\n' "$d"
          }

          build_sqlite3() {
            target="$1"; cc="$2"; ar="$3"
            mkdir -p "/c/extralibs/$target"
            "$cc" -O2 -DSQLITE_THREADSAFE=1 -c "$SQLITE_C" -o "/c/extralibs/$target/sqlite3.o"
            "$ar" rcs "/c/extralibs/$target/libsqlite3.a" "/c/extralibs/$target/sqlite3.o"
            rm -f "/c/extralibs/$target/sqlite3.o"
          }
          build_hiredis() {
            target="$1"; cc="$2"; ar="$3"
            mkdir -p "/c/extralibs/$target"
            make -C /tmp/hiredis-src clean >/dev/null
            make -C /tmp/hiredis-src libhiredis.a CC="$cc" AR="$ar" USE_WERROR=0 >/dev/null
            cp /tmp/hiredis-src/libhiredis.a "/c/extralibs/$target/libhiredis.a"
          }
          build_all() {
            target="$1"; cc="$2"; ar="$3"
            { command -v "$cc" >/dev/null 2>&1 || [ -x "$cc" ]; } || {
              echo "::warning::$cc not found/executable; skipping static sqlite3/hiredis for $target"; return 0; }
            if need_build sqlite3 "$target"; then
              build_sqlite3 "$target" "$cc" "$ar"; echo "built libsqlite3.a for $target"
            fi
            if need_build hiredis "$target"; then
              build_hiredis "$target" "$cc" "$ar"; echo "built libhiredis.a for $target"
            fi
          }

          if any_needed sqlite3; then
            curl -fL --connect-timeout 10 --max-time 120 -o /tmp/sqlite3.zip \
              "https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip"
            echo "1e71ddf93849c6a6ecf58b827c0692073d2dd7ee40196158068f7b29f422e87d  /tmp/sqlite3.zip" \
              | sha256sum -c -
            unzip -q -o /tmp/sqlite3.zip -d /tmp/sqlite3-src
            SQLITE_C=/tmp/sqlite3-src/sqlite-amalgamation-3530400/sqlite3.c
          fi
          if any_needed hiredis; then
            git clone --quiet --depth 1 --branch v1.4.0 \
              https://github.com/redis/hiredis.git /tmp/hiredis-src
          fi
          # openssl and mariadb (SCHANNEL for windows-gnu; OPENSSL, via the
          # scratch openssl-root below, for the 4 musl targets) build
          # concurrently into their own per-target scratch dirs. Package
          # installs are hoisted into one combined pacman call first since
          # pacman cannot run two concurrent instances (db lock).
          if any_needed_openssl || any_needed mariadb; then
            pkgs=""
            if any_needed_openssl; then pkgs="$pkgs perl"; fi
            if any_needed mariadb; then pkgs="$pkgs mingw-w64-x86_64-cmake"; fi
            # shellcheck disable=SC2086
            [ -n "$pkgs" ] && pacman -Sy --noconfirm --needed $pkgs >/dev/null
          fi
          if any_needed_openssl || any_needed mariadb; then
            curl -fL --connect-timeout 15 --max-time 180 -o /tmp/openssl.tar.gz \
              "https://github.com/openssl/openssl/releases/download/openssl-3.6.3/openssl-3.6.3.tar.gz"
            echo "243a86649cf6f23eeb6a2ff2456e09e5d77dd9018a54d3d96b0c6bdd6ba6c7f1  /tmp/openssl.tar.gz" \
              | sha256sum -c -
          fi
          if any_needed mariadb; then
            git clone --quiet --depth 1 --branch v3.4.9 \
              https://github.com/mariadb-corporation/mariadb-connector-c.git /tmp/mariadb-src
          fi

          build_openssl() {
            target="$1"; ossl_target="$2"; shift 2
            need_build_openssl "$target" || { echo "reusing cached openssl for $target"; return 0; }
            ob_dir="/tmp/openssl-build-$target"
            rm -rf "$ob_dir" "$ob_dir.log"; mkdir -p "$ob_dir"
            tar xf /tmp/openssl.tar.gz -C "$ob_dir" --strip-components=1
            if ( cd "$ob_dir" \
                 && ./Configure "$ossl_target" no-shared no-tests no-docs no-apps \
                      no-secure-memory no-engine "$@" \
                 && make -j"$(nproc)" build_libs ) >"$ob_dir.log" 2>&1; then
              if [ -f "$ob_dir/libssl.a" ] && [ -f "$ob_dir/libcrypto.a" ]; then
                mkdir -p "/c/extralibs/$target"
                cp "$ob_dir/libssl.a" "$ob_dir/libcrypto.a" "/c/extralibs/$target/"
                # Scratch openssl "root" (headers + libs) for build_mariadb()
                # below to point CMake's FindOpenSSL at - not under
                # /c/extralibs (which gets embedded into salam itself): the
                # headers are only needed to configure mariadbclient here.
                rm -rf "/tmp/openssl-root-$target"
                mkdir -p "/tmp/openssl-root-$target/include" "/tmp/openssl-root-$target/lib"
                cp -r "$ob_dir/include/." "/tmp/openssl-root-$target/include/"
                cp "$ob_dir/libssl.a" "$ob_dir/libcrypto.a" "/tmp/openssl-root-$target/lib/"
                echo "built libssl.a/libcrypto.a for $target"
              else
                echo "::warning::openssl build for $target reported success but libssl.a/libcrypto.a are missing; skipping"
              fi
            else
              echo "::warning::openssl build failed for $target; skipping static openssl for this target"
              tail -60 "$ob_dir.log" || true
            fi
            rm -rf "$ob_dir" "$ob_dir.log"
          }
          build_mariadb() {
            target="$1"; ssl_args="$2"; extra_args="$3"
            need_build mariadb "$target" || { echo "reusing cached mariadb for $target"; return 0; }
            mb_dir="/tmp/mariadb-build-$target"
            rm -rf "$mb_dir" "$mb_dir.log"; mkdir -p "$mb_dir"
            # shellcheck disable=SC2086
            # -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF: see the Linux job's copy
            # of build_mariadb for why this is load-bearing on musl targets.
            #
            # WITH_CURL=OFF is not enough to keep curl out: CMakeLists.txt:74
            # runs FIND_PACKAGE(CURL) unconditionally, before it ever looks at
            # the option. On this runner that finds MSYS2's CURLConfig.cmake,
            # which find_dependency(Brotli)'s its way into a FindBrotli.cmake
            # that calls pkg_check_modules - a command that only exists once
            # FindPkgConfig has been loaded, and ssl_args deliberately sets
            # CMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON to stop FindOpenSSL
            # resolving the wrong OpenSSL. So the two settings collided:
            # "Unknown CMake command pkg_check_modules", and every musl target
            # lost its mariadb again. Disabling the CURL lookup outright is
            # what WITH_CURL=OFF was asking for anyway.
            #
            # This only surfaced once the cross compiler could link at all -
            # before that CMake stopped at its own compiler check.
            if ( cd "$mb_dir" \
                 && cmake /tmp/mariadb-src -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release \
                      -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
                      -DWITH_UNIT_TESTS=OFF -DWITH_CURL=OFF \
                      -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON $ssl_args $extra_args \
                 && cmake --build . --target mariadbclient -j"$(nproc)" ) \
                 >"$mb_dir.log" 2>&1; then
              LIB=$(find "$mb_dir" -name "libmariadbclient.a" | head -1)
              if [ -n "$LIB" ]; then
                mkdir -p "/c/extralibs/$target"
                cp "$LIB" "/c/extralibs/$target/libmariadbclient.a"
                cp "$LIB" "/c/extralibs/$target/libmariadb.a"
                cp "$LIB" "/c/extralibs/$target/libmysqlclient.a"
                echo "built libmariadb.a for $target"
              else
                echo "::warning::mariadb build for $target reported success but libmariadbclient.a is missing; skipping"
              fi
            else
              echo "::warning::mariadb build failed for $target; skipping static mariadb for this target"
              tail -80 "$mb_dir.log" || true
            fi
            rm -rf "$mb_dir" "$mb_dir.log"
          }
          musl_openssl_root_args() {
            target="$1"
            [ -f "/tmp/openssl-root-$target/include/openssl/ssl.h" ] || return 1
            printf -- '-DWITH_SSL=OPENSSL -DOPENSSL_ROOT_DIR=/tmp/openssl-root-%s -DOPENSSL_USE_STATIC_LIBS=TRUE '\
              '-DOPENSSL_INCLUDE_DIR=/tmp/openssl-root-%s/include -DOPENSSL_CRYPTO_LIBRARY=/tmp/openssl-root-%s/lib/libcrypto.a '\
              '-DOPENSSL_SSL_LIBRARY=/tmp/openssl-root-%s/lib/libssl.a -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON' \
              "$target" "$target" "$target" "$target"
          }

          # --- x86_64-w64-windows-gnu: native MSYS2 gcc, same as before ---
          build_all x86_64-w64-windows-gnu gcc ar
          (
            build_openssl x86_64-w64-windows-gnu mingw64
            build_mariadb x86_64-w64-windows-gnu -DWITH_SSL=SCHANNEL -DCMAKE_C_COMPILER=gcc
          ) &

          # --- the 4 linux-musl targets: clang -target cross-compile ---
          for entry in $MUSL_TARGETS; do
            triple="${entry%%:*}"; rest="${entry#*:}"
            sr="${rest%%:*}"; rest2="${rest#*:}"
            ossl_target="${rest2%%:*}"; arch="${rest2#*:}"
            wdir=$(make_musl_wrapper "$triple" "$sr")
            build_all "$triple" "$wdir/$triple-gcc" "$wdir/$triple-ar"
            (
              build_openssl "$triple" "$ossl_target" "--cross-compile-prefix=$wdir/$triple-"
              ssl_args=$(musl_openssl_root_args "$triple") || ssl_args=""
              if [ -n "$ssl_args" ]; then
                build_mariadb "$triple" "$ssl_args" \
                  "-DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=$arch -DCMAKE_C_COMPILER=$wdir/$triple-gcc.bat -DCMAKE_AR=$LLVM_AR_WIN -DCMAKE_RANLIB=$LLVM_RANLIB_WIN"
              elif need_build mariadb "$triple"; then
                echo "::warning::no static openssl available for $triple; skipping static mariadb (it has no TLS-less build option)"
              fi
            ) &
          done
          wait
          rm -rf /tmp/sqlite3.zip /tmp/sqlite3-src /tmp/hiredis-src /tmp/openssl.tar.gz /tmp/mariadb-src \
            /tmp/openssl-root-*

          echo "SALAM_EMBED_EXTRALIBS_X86_64_W64_WINDOWS_GNU_DIR=C:/extralibs/x86_64-w64-windows-gnu" \
            >> "$GITHUB_ENV"
          # This job's own native (no --target=) build IS x86_64-w64-windows-gnu
          # - reuse the same staged libs for SALAM_EMBED_HOSTLIBS_DIR rather
          # than building a redundant second copy.
          echo "SALAM_EMBED_HOSTLIBS_DIR=C:/extralibs/x86_64-w64-windows-gnu" \
            >> "$GITHUB_ENV"
          for entry in $MUSL_TARGETS; do
            triple="${entry%%:*}"
            [ -d "/c/extralibs/$triple" ] || continue
            var="SALAM_EMBED_EXTRALIBS_$(echo "$triple" | tr 'a-z-' 'A-Z_')_DIR"
            echo "${var}=C:/extralibs/$triple" >> "$GITHUB_ENV"
          done

          # Fail safe towards saving: an empty fingerprint means the
          # helper itself broke, and skipping the save on that would
          # quietly reintroduce the very staleness this replaced.
          EXTRALIBS_AFTER=$(fingerprint /c/extralibs)
          if [ -n "$EXTRALIBS_AFTER" ] && [ "$EXTRALIBS_BEFORE" = "$EXTRALIBS_AFTER" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'static libs fully cached; skipping cache save'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'static libs changed; a fresh cache entry will be saved'
          fi

      - name: Save static third-party libs (sqlite3 + hiredis + openssl + mariadb, per --target=)
        if: steps.extralibs.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\extralibs
          key: extralibs-sqlite3-3530400-hiredis-v1.4.0-openssl-3.6.3-mariadb-v3.4.9-win-v3-${{ github.run_id }}

      - name: Build salam.exe (embedded LLVM; best-effort LLD + mingw/musl sysroots)
        shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail "{0}"'
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: '1'
          CCACHE_DIR: 'C:/ccache-win64'
        run: |
          ccache --max-size=500M >/dev/null 2>&1 || true
          SR=/tmp/mingw-sr/lib; mkdir -p "$SR"
          # Search the whole /mingw64 tree by basename instead of assuming a
          # fixed subdirectory layout - MSYS2 has shuffled crt/gcc-runtime
          # paths across gcc bumps before, and a hardcoded path silently
          # degrades this to the non-self-contained fallback build.
          embed_ok=1
          missing=""
          for x in crt2.o dllcrt2.o libmingw32.a libmingwex.a libmoldname.a \
                   libmsvcrt.a libadvapi32.a libshell32.a libuser32.a libkernel32.a \
                   crtbegin.o crtend.o libgcc.a libgcc_eh.a; do
            f=$(find /mingw64 -name "$x" 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              cp "$f" "$SR/"
            else
              embed_ok=0; missing="$missing $x"
            fi
          done
          [ "$embed_ok" = 1 ] || echo "::warning::mingw sysroot assembly incomplete, missing:$missing"
          built=0
          if [ "$embed_ok" = 1 ]; then
            echo "Attempting flagship build (embedded LLVM + in-process LLD + mingw/musl sysroots)."
            if make -C c -j2 \
                 WITH_LLVM=1 WITH_LLD=1 LLVM_LINK_STATIC=1 LLVM_CONFIG=llvm-config \
                 CC="ccache gcc" CXX="ccache g++" \
                 SALAM_EMBED_MINGW_DIR=/tmp/mingw-sr \
                 SALAM_EMBED_MUSL_DIR="${SALAM_EMBED_MUSL_DIR:-}" \
                 SALAM_EMBED_MUSL_AARCH64_DIR="${SALAM_EMBED_MUSL_AARCH64_DIR:-}" \
                 SALAM_EMBED_MUSL_I686_DIR="${SALAM_EMBED_MUSL_I686_DIR:-}" \
                 SALAM_EMBED_MUSL_ARM_DIR="${SALAM_EMBED_MUSL_ARM_DIR:-}" \
                 SALAM_EMBED_EXTRALIBS_X86_64_W64_WINDOWS_GNU_DIR="${SALAM_EMBED_EXTRALIBS_X86_64_W64_WINDOWS_GNU_DIR:-}" \
                 SALAM_EMBED_EXTRALIBS_X86_64_LINUX_MUSL_DIR="${SALAM_EMBED_EXTRALIBS_X86_64_LINUX_MUSL_DIR:-}" \
                 SALAM_EMBED_EXTRALIBS_AARCH64_LINUX_MUSL_DIR="${SALAM_EMBED_EXTRALIBS_AARCH64_LINUX_MUSL_DIR:-}" \
                 SALAM_EMBED_EXTRALIBS_I686_LINUX_MUSL_DIR="${SALAM_EMBED_EXTRALIBS_I686_LINUX_MUSL_DIR:-}" \
                 SALAM_EMBED_EXTRALIBS_ARM_LINUX_MUSLEABIHF_DIR="${SALAM_EMBED_EXTRALIBS_ARM_LINUX_MUSLEABIHF_DIR:-}" \
                 SALAM_EMBED_HOSTLIBS_DIR="${SALAM_EMBED_HOSTLIBS_DIR:-}" \
                 EXTRA_LDFLAGS="-static -static-libgcc -static-libstdc++"; then
              built=1
              echo "SELF_CONTAINED=1" >> "$GITHUB_ENV"
              echo "Flagship self-contained salam.exe built."
            else
              echo "::warning::LLD/embedded-sysroot build failed; falling back to embedded-LLVM-only."
              make -C c clean
            fi
          else
            echo "::warning::could not assemble mingw sysroot; building embedded-LLVM-only."
          fi
          if [ "$built" != 1 ]; then
            make -C c -j2 \
              WITH_LLVM=1 LLVM_LINK_STATIC=1 LLVM_CONFIG=llvm-config CC="ccache gcc" \
              EXTRA_LDFLAGS="-static -static-libgcc -static-libstdc++"
            echo "SELF_CONTAINED=0" >> "$GITHUB_ENV"
          fi
          ccache --show-stats 2>/dev/null | head -5 || true
          test -f salam.exe || mv salam salam.exe
          ./salam.exe version

      - name: Verify salam.exe is self-contained (no third-party DLLs)
        shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail "{0}"'
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: '1'
        run: |
          echo "DLL imports of salam.exe:"
          objdump -p salam.exe | grep -i 'DLL Name' || true
          bad=$(objdump -p salam.exe | grep -i 'DLL Name' \
            | grep -iE 'libzstd|libstdc\+\+|libgcc|libwinpthread|libxml2|libz\.dll|zlib|libz3|libffi|libLLVM|libc\+\+' \
            || true)
          if [ -n "$bad" ]; then
            echo "ERROR: salam.exe depends on non-system DLLs:"
            echo "$bad"
            exit 1
          fi
          echo "OK: salam.exe imports only Windows system DLLs."

      # Built from the pin in tools/ci/tinycc-ref.txt rather than fetched
      # from Savannah, whose newest win64 binary is 0.9.27 from December 2017
      # - eight years and a win64 float-argument miscompile behind mob. It
      # installs straight into the bundle at salam-windows/tcc, the same path
      # the zip used to unpack to, so everything downstream is unchanged.
      # The build is entirely determined by the pinned commit and the script
      # driving it, so it is worth caching rather than repeating every run:
      # a clone of tinycc's history plus a full compile, for a bundle that
      # comes out byte-for-byte the same. Keyed on both files so moving the
      # pin or changing the build invalidates it; the install prefix is a
      # fixed path under the workspace, which matters because configure
      # bakes it into the binary, so restoring it elsewhere would not work.
      # The staging step below runs `tcc.exe -v` on whatever lands here, so
      # a restored bundle still has to prove it runs.
      - name: Restore bundled tcc
        id: tccbundle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: salam-windows/tcc
          key: tcc-bundle-windows-x86_64-${{ hashFiles('tools/ci/tinycc-ref.txt', 'tools/ci/build-tcc.sh') }}-v1
      # MSYS2 rather than the `shell: bash` the staging step below uses:
      # building tcc needs gcc and make, which Git Bash does not have.
      - name: Build bundled tcc from the pinned TinyCC commit
        if: steps.tccbundle.outputs.cache-hit != 'true'
        shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail "{0}"'
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: '1'
        run: |
          sh tools/ci/build-tcc.sh "$(pwd)/salam-windows/tcc"
      - name: Save bundled tcc
        if: steps.tccbundle.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: salam-windows/tcc
          key: tcc-bundle-windows-x86_64-${{ hashFiles('tools/ci/tinycc-ref.txt', 'tools/ci/build-tcc.sh') }}-v1

      - name: Stage self-contained bundle
        shell: bash
        run: |
          set -eu
          DIST="salam-windows"
          mkdir -p "$DIST"
          cp salam.exe "$DIST/"
          cp -r std    "$DIST/std"
          "$DIST/tcc/tcc.exe" -v
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for Windows - self-contained."
            echo ""
            echo "No installation needed. From this folder:"
            echo ""
            echo "  salam.exe version"
            echo "  salam.exe exec  myprogram.salam              (tree-walking interpreter)"
            echo "  salam.exe build myprogram.salam              (C backend via bundled tcc)"
            echo "  salam.exe llvm  myprogram.salam --jit        (run via the built-in LLVM)"
            echo "  salam.exe llvm  myprogram.salam --exec       (native exe via built-in LLVM)"
            if [ "${SELF_CONTAINED:-0}" = "1" ]; then
              echo ""
              echo "Cross-compile with ZERO tools installed (LLVM + LLD + sysroots are"
              echo "compiled into salam.exe itself):"
              echo ""
              echo "  salam.exe build myprogram.salam --target=x86_64-w64-windows-gnu -o app.exe"
              if [ -n "${SALAM_EMBED_MUSL_DIR:-}" ]; then
                echo "  salam.exe build myprogram.salam --target=x86_64-linux-musl      -o app"
              fi
              if [ -n "${SALAM_EMBED_MUSL_AARCH64_DIR:-}" ]; then
                echo "  salam.exe build myprogram.salam --target=aarch64-linux-musl     -o app"
              fi
              if [ -n "${SALAM_EMBED_MUSL_I686_DIR:-}" ]; then
                echo "  salam.exe build myprogram.salam --target=i686-linux-musl        -o app"
              fi
              if [ -n "${SALAM_EMBED_MUSL_ARM_DIR:-}" ]; then
                echo "  salam.exe build myprogram.salam --target=arm-linux-musleabihf   -o app"
              fi
            fi
            echo ""
            echo "LLVM is compiled into salam.exe itself - no clang/llc/lli needed."
            echo "salam.exe finds its std/ library and the bundled tcc/ automatically;"
            echo "keep them next to salam.exe."
          } > "$DIST/RUN-ME.txt"
          echo "bundle contents:"; ls -la "$DIST"

      - name: Smoke-test the embedded LLVM backend
        shell: bash
        run: |
          set -e
          cd salam-windows
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-llvm"\nend\n' > smoke.salam
          echo "[1] LLVM emit-obj (in-process)"
          ./salam.exe llvm smoke.salam --emit-obj -o smoke.o --log-level=warn
          ls -l smoke.o
          echo "[2] C backend via bundled tcc (build and run)"
          ./salam.exe build smoke.salam --output=smoke_tcc.exe --log-level=warn
          ./smoke_tcc.exe
          echo "[3] LLVM --exec (build and run; best-effort: tcc cannot link LLVM COFF objects)"
          if ./salam.exe llvm smoke.salam --exec -o smoke_llvm.exe --log-level=warn \
               && ./smoke_llvm.exe; then
            echo "    llvm --exec OK"
          else
            echo "    note: llvm --exec unavailable on Windows (no LLVM-capable linker);"
            echo "          use 'salam llvm --jit' to run, or 'salam build' for a native exe."
          fi
          if [ "${SELF_CONTAINED:-0}" = "1" ]; then
            for pair in x86_64:SALAM_EMBED_MUSL_DIR aarch64:SALAM_EMBED_MUSL_AARCH64_DIR \
                        i686:SALAM_EMBED_MUSL_I686_DIR arm:SALAM_EMBED_MUSL_ARM_DIR; do
              tgt="${pair%%:*}"; var="${pair#*:}"
              eval "val=\${$var:-}"
              [ -z "$val" ] && continue
              triple="$tgt-linux-musl"; [ "$tgt" = "arm" ] && triple="arm-linux-musleabihf"
              echo "[4] cross target $triple, PATH=/nonexistent (embedded musl, no tools on Windows)"
              PATH=/nonexistent SALAM_STD="$SALAM_STD" SALAM_CACHE=/tmp/sc \
                ./salam.exe build smoke.salam --target="$triple" -o "smoke_$tgt" --log-level=warn
              file "smoke_$tgt"
            done
          fi
          rm -f smoke.salam smoke*.exe smoke_x86_64 smoke_aarch64 smoke_i686 smoke_arm smoke.o salam_mod_*.c salam_mod_*.h
          cd ..

      - name: Install native libraries for full test suite (hiredis, mariadb, sqlite3, openssl)
        if: startsWith(github.event.head_commit.message, 'release:') || (github.event_name == 'workflow_dispatch' && inputs.nightly)
        shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail "{0}"'
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: '1'
        run: |
          pacman -Sy --noconfirm --needed \
            mingw-w64-x86_64-hiredis mingw-w64-x86_64-libmariadbclient mingw-w64-x86_64-sqlite3

      # tcc (the C backend bundled with the Windows release) resolves genuine
      # Windows system DLLs (ws2_32, winhttp, kernel32, user32, ...) on its
      # own with zero staging. It does NOT know about MSYS2-only libraries,
      # so hiredis/mariadb/sqlite3/openssl need a copy placed in tcc's own
      # lib/ dir (searched relative to tcc.exe regardless of -L) under the
      # exact name `-l<name>` expects: bare `lib<name>.dll` for the
      # MinGW-built hiredis/mariadb, a renamed copy for sqlite3 (MSYS2 ships
      # it soname-versioned as `libsqlite3-0.dll`) and for openssl (ships as
      # `lib{ssl,crypto}-3-x64.dll`).
      #
      # sqlite3 is bundled rather than linked against the OS-provided
      # winsqlite3.dll (the std lib's previous approach) because that DLL's
      # presence isn't guaranteed on every Windows SKU - notably it is not
      # reliably present on the Windows Server base this windows-latest
      # runner uses, which is exactly what broke `import sqlite`/FFI-sqlite
      # tests here. Bundling our own copy (like hiredis/mariadb already do)
      # makes this self-contained instead of relying on the host OS.
      #
      # WebView2Loader.dll is MSVC-built, not MinGW-built: tcc's direct-DLL
      # loader (which reads the export table straight from the PE image)
      # rejects it outright ("unrecognized file type"), so it needs an
      # actual `.def` - generated via tcc's own bundled `-impdef`, exactly
      # as tcc-win32.txt documents for linking against arbitrary DLLs.
      - name: Stage native libs for full test suite (hiredis, mariadb, sqlite3, openssl, WebView2Loader)
        if: startsWith(github.event.head_commit.message, 'release:') || (github.event_name == 'workflow_dispatch' && inputs.nightly)
        shell: bash
        run: |
          set -eu
          TCCLIB="salam-windows/tcc/lib"
          MB="/c/msys64/mingw64/bin"
          cp "$MB/libhiredis.dll"      "$TCCLIB/"
          cp "$MB/libmariadb.dll"      "$TCCLIB/"
          cp "$MB/libsqlite3-0.dll"    "$TCCLIB/libsqlite3.dll"
          cp "$MB/libssl-3-x64.dll"    "$TCCLIB/libssl.dll"
          cp "$MB/libcrypto-3-x64.dll" "$TCCLIB/libcrypto.dll"
          curl -fL --connect-timeout 20 --retry 3 --retry-delay 5 --retry-all-errors \
            -o webview2.nupkg \
            "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.3296.44"
          mkdir -p wv2pkg
          unzip -q webview2.nupkg -d wv2pkg
          ./salam-windows/tcc/tcc.exe -impdef wv2pkg/runtimes/win-x64/native/WebView2Loader.dll \
            -o "$TCCLIB/WebView2Loader.def"
          rm -rf wv2pkg webview2.nupkg

      # The db-category tests build a mysql_mock.a via a POSIX `ln -s`
      # (see tools/bash/run-one-build.sh); unprivileged symlink creation
      # on Windows silently no-ops without Developer Mode, which failed
      # tests would otherwise mask as ordinary link errors.
      - name: Enable Developer Mode (symlink support for db mock tests)
        if: startsWith(github.event.head_commit.message, 'release:') || (github.event_name == 'workflow_dispatch' && inputs.nightly)
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" `
            -Name "AllowDevelopmentWithoutDevMode" -Value 1 -PropertyType DWord -Force | Out-Null

      # Chocolatey's own resolve/download/checksum overhead makes a cold
      # `choco install` take minutes for a single small package; caching the
      # installed package skips all of that on every run after the first.
      - name: Cache Chocolatey redis package
        if: startsWith(github.event.head_commit.message, 'release:') || (github.event_name == 'workflow_dispatch' && inputs.nightly)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\ProgramData\chocolatey\lib\redis
          key: choco-redis-${{ runner.os }}-v1

      - name: Validate test suite (release gate)
        if: startsWith(github.event.head_commit.message, 'release:') || (github.event_name == 'workflow_dispatch' && inputs.nightly)
        shell: bash
        run: |
          set -eu
          # GitHub Actions services: only run on Linux-hosted runners, so a
          # live Redis for the db/redis + interop/redis_demo tests has to be
          # started by hand here. Launched (and left running) within this
          # same step/process tree, not a separate step, so there's no risk
          # of it being torn down by the runner's per-step Job Object.
          # Skip the (slow) install entirely when the cache step above
          # already restored a working copy.
          REDIS_EXE=$(find /c/ProgramData/chocolatey -iname "redis-server.exe" 2>/dev/null | head -1)
          [ -n "$REDIS_EXE" ] || choco install redis -y --no-progress --limit-output
          REDIS_EXE=$(find /c/ProgramData/chocolatey -iname "redis-server.exe" 2>/dev/null | head -1)
          if [ -z "$REDIS_EXE" ]; then
            echo "::error::redis-server.exe not found after choco install"
            exit 1
          fi
          REDIS_CLI="$(dirname "$REDIS_EXE")/redis-cli.exe"
          "$REDIS_EXE" --port 6379 &
          ready=0
          for _ in $(seq 1 30); do
            "$REDIS_CLI" -h 127.0.0.1 -p 6379 ping 2>/dev/null | grep -q PONG && { ready=1; break; }
            sleep 1
          done
          [ "$ready" = 1 ] || echo "::warning::redis-server did not answer PING in time; redis tests will fail"

          # `tcc` here must resolve to the exact bundled binary salam.exe's
          # own build uses (for consistent lib-search behavior with the
          # staged native libs above); mingw64/bin supplies `ar` for the
          # mysql mock build and the runtime DLL closure for
          # hiredis/mariadb (WS2_32, libcurl, zlib, zstd, ...) since those
          # were staged under their original mingw64/bin names. openssl and
          # sqlite3 were staged as *renamed* copies (libssl.dll,
          # libcrypto.dll, libsqlite3.dll - see "Stage native libs" above)
          # that only exist under tcc/lib, not under any name mingw64/bin
          # provides, so tcc/lib must be on PATH too or every test that
          # links ssl/crypto/sqlite3 fails at process start with no output
          # (DLL not found, before stdio is even initialized).
          export PATH="$GITHUB_WORKSPACE/salam-windows/tcc:$GITHUB_WORKSPACE/salam-windows/tcc/lib:/c/msys64/mingw64/bin:$PATH"
          SALAM="$GITHUB_WORKSPACE/salam-windows/salam.exe" \
            sh tools/bash/run-tests.sh 2>&1 | tee /tmp/tests.log || true
          grep -qE 'RESULT: [0-9]+ passed, 0 failed' /tmp/tests.log \
            || { echo "::error::Windows test suite failed - blocking release"; exit 1; }

      - name: Zip the bundle
        shell: bash
        run: |
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          7z a -tzip "salam-${VERSION}-windows.zip" salam-windows >/dev/null
          ls -la "salam-${VERSION}-windows.zip"

      - name: Upload self-contained bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-windows-bundle
          path: salam-*-windows.zip

      - name: Upload salam.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-windows
          path: salam.exe

  build-windows-i686:
    name: Build Salam for Windows (32-bit / i686, cross-compiled static LLVM+LLD)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cross-build prerequisites (cmake, ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Cache llvm-mingw Linux toolchain (cross-compiler + i686 sysroot)
        id: cache-llvm-mingw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/llvm-mingw
          key: llvm-mingw-toolchain-20260616-v1

      - name: Fetch llvm-mingw Linux toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          set -eu
          # MSYS2 dropped LLVM/clang/lld for i686 entirely (confirmed via
          # "target not found" at install time). llvm-mingw is a separately
          # maintained project that still builds a real LLVM 22 targeting
          # i686-w64-mingw32; its Linux-hosted release lets us cross-compile
          # from here without needing a native 32-bit Windows machine.
          curl -fL --connect-timeout 15 --max-time 600 --retry 3 --retry-delay 10 \
            -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz"
          mkdir -p /tmp/llvm-mingw
          tar xJf /tmp/llvm-mingw.tar.xz -C /tmp/llvm-mingw --strip-components=1
          rm -f /tmp/llvm-mingw.tar.xz

      - name: Cache static LLVM+LLD built for i686-w64-mingw32
        id: cache-llvm-i686
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/llvm-i686-install
          key: llvm-i686-mingw32-static-llvmorg-22.1.8-v1

      # This is the expensive, one-time part: llvm-mingw itself only ships a
      # *dynamic* libLLVM-22.dll for i686 (confirmed - no static .a anywhere
      # in its release), so a genuinely static, single-file salam.exe means
      # building LLVM+LLD from source ourselves, cross-targeting
      # i686-w64-mingw32 with llvm-mingw's own clang (staying on one
      # compiler/runtime end to end avoids GCC/Clang ABI-mixing risk).
      # Cached by LLVM tag, so this only reruns when llvm-mingw bumps its
      # LLVM version - every other push reuses the cache in seconds.
      - name: Build static LLVM+LLD for i686-w64-mingw32 (cache miss only - slow)
        if: steps.cache-llvm-i686.outputs.cache-hit != 'true'
        run: |
          set -eu
          TC=/tmp/llvm-mingw/bin
          git clone --depth 1 --branch llvmorg-22.1.8 --filter=blob:none --sparse \
            https://github.com/llvm/llvm-project.git /tmp/llvm-src
          git -C /tmp/llvm-src sparse-checkout set llvm lld cmake third-party libunwind

          echo "--- stage 1: native llvm-tblgen (build-time tool, must match the LLVM source tag) ---"
          cmake -G Ninja -S /tmp/llvm-src/llvm -B /tmp/llvm-native-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF
          ninja -C /tmp/llvm-native-build llvm-tblgen

          echo "--- stage 2: cross-compiled static LLVM+LLD for i686-w64-mingw32 ---"
          # Targets scoped to what salam's own --target flag actually
          # supports (x86_64/i686 -> X86, aarch64 -> AArch64, arm -> ARM,
          # wasm32 -> WebAssembly) rather than every obscure LLVM backend,
          # to keep this one-time build bounded. zlib/zstd/libxml2/terminfo
          # are disabled - llvm-mingw's i686 sysroot has no static libz/
          # libzstd to link against, and none of those are load-bearing for
          # codegen/JIT/linking.
          cmake -G Ninja -S /tmp/llvm-src/llvm -B /tmp/llvm-cross-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/llvm-i686-install \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER="$TC/i686-w64-mingw32-clang" \
            -DCMAKE_CXX_COMPILER="$TC/i686-w64-mingw32-clang++" \
            -DCMAKE_AR="$TC/i686-w64-mingw32-ar" \
            -DCMAKE_RANLIB="$TC/i686-w64-mingw32-ranlib" \
            -DLLVM_TABLEGEN=/tmp/llvm-native-build/bin/llvm-tblgen \
            -DLLVM_ENABLE_PROJECTS=lld \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM;WebAssembly" \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_LIBEDIT=OFF \
            -DBUILD_SHARED_LIBS=OFF -DLLVM_ENABLE_ASSERTIONS=OFF
          ninja -C /tmp/llvm-cross-build install
          echo "installed sizes:"; du -sh /tmp/llvm-i686-install/lib /tmp/llvm-i686-install/include
          rm -rf /tmp/llvm-src /tmp/llvm-native-build /tmp/llvm-cross-build

      - name: Cache ccache (Windows i686)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ccache-i686
          key: ccache-win-i686-v3-${{ github.run_id }}
          restore-keys: |
            ccache-win-i686-v3-

      - name: Build 32-bit salam.exe (cross-compiled, embedded static LLVM+LLD, best-effort)
        run: |
          set -eu
          TC=/tmp/llvm-mingw/bin
          LLVM_ROOT=/tmp/llvm-i686-install
          export CCACHE_DIR=/tmp/ccache-i686; mkdir -p "$CCACHE_DIR"
          which ccache >/dev/null 2>&1 || sudo apt-get install -y ccache
          ccache --max-size=500M >/dev/null 2>&1 || true

          # salam's Makefile drives everything off `$(LLVM_CONFIG) --foo`;
          # llvm-config itself only exists as a native-host tool (we built
          # LLVM as a *library only*, and a real llvm-config binary would
          # be a foreign i686-w64-mingw32 PE anyway - can't run it here to
          # ask it questions). This shim answers the same handful of flags
          # the Makefile actually calls with the paths/libs from the cross
          # build above, standing in for the genuine tool.
          cat > /tmp/fake-llvm-config << 'FAKE_LLVM_CONFIG_EOF'
          #!/usr/bin/env bash
          set -eu
          LIBDIR="/tmp/llvm-i686-install/lib"
          INCDIR="/tmp/llvm-i686-install/include"
          for arg in "$@"; do
            case "$arg" in
              --includedir) echo "$INCDIR" ;;
              --version) echo "22.1.8" ;;
              --ldflags) echo "-L$LIBDIR" ;;
              --system-libs) echo "-lpsapi -lshell32 -lole32 -luuid -ladvapi32 -lws2_32 -lversion -lntdll -lshlwapi -luser32" ;;
              --cxxflags) echo "-I$INCDIR -std=c++17" ;;
              --libs)
                libs=""
                for f in "$LIBDIR"/lib*.a; do
                  [ -e "$f" ] || continue
                  b=$(basename "$f" .a)
                  libs="$libs -l${b#lib}"
                done
                echo "-Wl,--start-group $libs -Wl,--end-group"
                ;;
            esac
          done
          FAKE_LLVM_CONFIG_EOF
          chmod +x /tmp/fake-llvm-config

          built=0
          if [ -d "$LLVM_ROOT/lib" ]; then
            if make -C c -j"$(nproc)" \
                 WITH_LLVM=1 WITH_LLD=1 LLVM_LINK_STATIC=1 \
                 LLVM_CONFIG=/tmp/fake-llvm-config \
                 LLVM_CXXLIB=-lc++ \
                 LLD_LIBS="-llldMinGW -llldELF -llldCOFF -llldMachO -llldWasm -llldCommon" \
                 CC="ccache $TC/i686-w64-mingw32-clang" CXX="ccache $TC/i686-w64-mingw32-clang++" \
                 EXTRA_LDFLAGS="-static"; then
              built=1
              echo "SELF_CONTAINED=1" >> "$GITHUB_ENV"
              echo "Built cross-compiled, fully static salam.exe with embedded LLVM+LLD."
            else
              echo "::warning::cross-compiled LLVM+LLD build failed; falling back to tcc-only (no LLVM)."
            fi
          else
            echo "::warning::no cross-built LLVM available; falling back to tcc-only (no LLVM)."
          fi
          if [ "$built" != 1 ]; then
            make -C c clean
            make -C c -j"$(nproc)" \
              WITH_LLVM=0 CC="ccache $TC/i686-w64-mingw32-clang" \
              EXTRA_LDFLAGS="-static"
            echo "SELF_CONTAINED=0" >> "$GITHUB_ENV"
          fi
          ccache --show-stats 2>/dev/null | head -5 || true
          test -f salam.exe || mv salam salam.exe
          file salam.exe

      - name: Verify salam.exe is self-contained (no third-party DLLs)
        run: |
          OBJDUMP=/tmp/llvm-mingw/bin/llvm-objdump
          [ -x "$OBJDUMP" ] || OBJDUMP=objdump
          echo "DLL imports of salam.exe:"
          "$OBJDUMP" -p salam.exe | grep -i 'DLL Name' || true
          bad=$("$OBJDUMP" -p salam.exe | grep -i 'DLL Name' \
            | grep -iE 'libzstd|libstdc\+\+|libgcc|libwinpthread|libxml2|libz\.dll|zlib|libz3|libffi|libLLVM|libc\+\+|libunwind' \
            || true)
          if [ -n "$bad" ]; then
            echo "ERROR: salam.exe depends on non-system DLLs:"
            echo "$bad"
            exit 1
          fi
          echo "OK: salam.exe imports only Windows system DLLs."

      # Same reasoning as the x86_64 bundle above, with its own key: this
      # cross-build runs on a Linux runner and produces an i686 PE, so it
      # must never share an entry with a native build on the same runner.
      - name: Restore bundled tcc (i686 cross)
        id: tccbundle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: salam-windows-i686/tcc
          key: tcc-bundle-windows-i686-cross-${{ hashFiles('tools/ci/tinycc-ref.txt', 'tools/ci/build-tcc.sh') }}-v1
      - name: Stage 32-bit bundle
        run: |
          set -eu
          DIST="salam-windows-i686"
          mkdir -p "$DIST"
          cp salam.exe "$DIST/"
          cp -r std    "$DIST/std"
          # Cross-built from the pin in tools/ci/tinycc-ref.txt with the
          # same llvm-mingw toolchain this job already uses for LLVM, rather
          # than fetched from Savannah, whose newest win32 binary is 0.9.27
          # from December 2017. --cpu=i386 with --targetos=WIN32 is what
          # produces a 32-bit Windows tcc from a Linux host; there is no
          # native i686 runner to build it on. build-tcc.sh reads the target
          # name (i386-win32) back out of those two flags and builds the
          # runtime with a host-native tcc of its own - see the script.
          # A tcc.exe with no libtcc1.a beside it links nothing, so both have
          # to be there before the cached bundle counts as usable. The build
          # is all-or-nothing and the save only runs after it succeeds, so a
          # half-written entry should not exist; this just makes one
          # self-heal instead of shipping a bundle that cannot compile.
          if [ -f "$DIST/tcc/tcc.exe" ] \
             && [ -n "$(find "$DIST/tcc" -name libtcc1.a 2>/dev/null | head -1)" ]; then
            echo "reusing cached tcc bundle at $DIST/tcc"
          else
            CROSS_PREFIX=/tmp/llvm-mingw/bin/i686-w64-mingw32- \
            TCC_CONFIGURE_EXTRA="--targetos=WIN32 --cpu=i386" \
              sh tools/ci/build-tcc.sh "$(pwd)/$DIST/tcc"
          fi
          file "$DIST/tcc/tcc.exe"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            if [ "${SELF_CONTAINED:-0}" = "1" ]; then
              echo "Salam for Windows (32-bit / i686) - cross-compiled, fully static,"
              echo "embedded LLVM+LLD toolchain."
              echo ""
              echo "Cross-compiled from Linux with llvm-mingw + a from-source static"
              echo "LLVM+LLD build (MSYS2 no longer packages LLVM for i686 at all)."
              echo "No installation needed. From this folder:"
              echo ""
              echo "  salam.exe version"
              echo "  salam.exe exec  myprogram.salam              (tree-walking interpreter)"
              echo "  salam.exe build myprogram.salam              (C backend via bundled tcc)"
              echo "  salam.exe llvm  myprogram.salam --jit        (run via the built-in LLVM)"
              echo "  salam.exe llvm  myprogram.salam --exec       (native exe via built-in LLVM)"
              echo ""
              echo "LLVM + LLD are compiled into salam.exe itself - no clang/llc/lli"
              echo "needed, and no separate DLLs (fully static, single-file)."
            else
              echo "Salam for Windows (32-bit / i686) - MINIMAL build."
              echo ""
              echo "The cross-compiled LLVM+LLD build failed this run and fell back"
              echo "to an interpreter + tcc-only build - see the CI log for why."
              echo ""
              echo "  salam.exe version"
              echo "  salam.exe exec  myprogram.salam    (tree-walking interpreter)"
              echo "  salam.exe build myprogram.salam    (native exe via bundled 32-bit tcc)"
            fi
          } > "$DIST/RUN-ME.txt"
          echo "bundle contents:"; ls -la "$DIST"

      - name: Save bundled tcc (i686 cross)
        if: steps.tccbundle.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: salam-windows-i686/tcc
          key: tcc-bundle-windows-i686-cross-${{ hashFiles('tools/ci/tinycc-ref.txt', 'tools/ci/build-tcc.sh') }}-v1
      - name: Smoke-test the 32-bit build (format checks only - can't execute an i686 PE on this Linux host)
        run: |
          set -e
          cd salam-windows-i686
          file salam.exe
          file tcc/tcc.exe
          echo "note: no execution smoke test here - this job cross-compiles"
          echo "from Linux and has no way to run the resulting i686 Windows PE."
          cd ..

      - name: Zip the 32-bit bundle
        run: |
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          zip -r "salam-${VERSION}-windows-i686.zip" salam-windows-i686 >/dev/null
          ls -la "salam-${VERSION}-windows-i686.zip"

      - name: Upload 32-bit Windows bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-windows-i686-bundle
          path: salam-*-windows-i686.zip

      - name: Upload 32-bit salam.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-windows-i686
          path: salam.exe

  build-linux-i686:
    name: Build Salam for Linux (32-bit / i686, embedded LLVM+LLD)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage cross sysroots on host (system musl + mingw-w64) for the i686 container to embed
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev mingw-w64
          sh tools/bash/stage-sysroots.sh --out="$GITHUB_WORKSPACE/sysroots"
          ls -la sysroots
      - name: Cache ccache (Linux i686)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ccache-i686
          key: ccache-linux-i686-v2-${{ github.run_id }}
          restore-keys: |
            ccache-linux-i686-v2-
      - name: Build + smoke-test inside an i386/debian container (native - no QEMU needed for i386 on amd64)
        run: |
          set -eu
          mkdir -p /tmp/ccache-i686
          # Debian dropped i386 dev packages for LLVM past v15 in its stable
          # "bookworm" archive, but sid (unstable) still builds a full
          # llvm-21-dev/lld-21/liblld-21-dev for i386 - confirmed on
          # packages.debian.org. LLVM itself stopped shipping 32-bit Windows
          # installers at v22 (github.com/ScoopInstaller/Main/issues/7685),
          # so 21 is the newest release that still targets 32-bit hosts at
          # all; 22+ tracks amd64/arm64 only (see the 64-bit jobs above).
          docker run --rm --platform=linux/386 \
            -v "$PWD:/work" -w /work/c \
            -v /tmp/ccache-i686:/root/.ccache \
            -e CCACHE_DIR=/root/.ccache \
            i386/debian:sid bash -euxc '
              apt-get update
              PKGS="build-essential ccache file git llvm-21-dev liblld-21-dev libpolly-21-dev libzstd-dev zlib1g-dev libtinfo-dev libxml2-dev"
              if ! apt-get install -y --no-install-recommends $PKGS; then
                # Debian is winding the i386 port down. linux-libc-dev is now
                # Architecture: all, and dak only copies an arch:all binary
                # into binary-<arch> for architectures whose source package
                # still builds there - so every time a new linux upload lands
                # in sid, linux-libc-dev can disappear from binary-i386 for a
                # few hours. libc6-dev depends on it, which drags down
                # build-essential, zlib1g-dev, llvm-21-dev, everything, with
                # "linux-libc-dev: none of the choices are installable".
                # binary-all itself is unreachable here (Debian sets
                # No-Support-for-Architecture-all, so apt refuses to fetch
                # that index), but the amd64 index carries the same arch:all
                # packages. Adding it as a source is enough; amd64 is never
                # added as a dpkg architecture, so only Architecture: all
                # packages out of it are installable and every real binary
                # still resolves to i386.
                echo "::warning::i386 dependency resolution failed - retrying with the amd64 index as an Architecture: all fallback."
                printf "deb [arch=amd64] http://deb.debian.org/debian sid main\n" > /etc/apt/sources.list.d/arch-all-fallback.list
                apt-get update
                apt-get install -y --no-install-recommends $PKGS
              fi
              # This container runs as root over a bind mount owned by the
              # host runner user, not root - git refuses to touch a repo it
              # does not itself own ("dubious ownership") unless told
              # otherwise, which silently blanked out SALAM_GIT_COMMIT/DATE
              # (the Makefile discards git stderr, so the failure was
              # invisible - salam version just printed "unknown").
              git config --global --add safe.directory /work
              ccache --max-size=300M >/dev/null 2>&1 || true
              MUSL_SR=/work/sysroots/x86_64-linux-musl
              MINGW_SR=/work/sysroots/x86_64-w64-mingw32
              if make -j"$(nproc)" \
                   WITH_LLVM=1 WITH_LLD=1 LLVM_LINK_STATIC=1 \
                   LLVM_CONFIG=llvm-config-21 CC="ccache gcc" CXX="ccache g++" \
                   SALAM_EMBED_MUSL_DIR="$MUSL_SR" SALAM_EMBED_MINGW_DIR="$MINGW_SR"; then
                echo 1 > /work/.self_contained
              else
                echo "::warning::self-contained (LLD) i686 build failed; falling back to embedded-LLVM-only."
                make clean
                make -j"$(nproc)" WITH_LLVM=1 LLVM_LINK_STATIC=1 LLVM_CONFIG=llvm-config-21 CC="ccache gcc"
                echo 0 > /work/.self_contained
              fi
              ccache --show-stats 2>/dev/null | head -5 || true
              file /work/salam
              /work/salam version
              export SALAM_STD=/work/std
              printf "func main:\n    println \"ok-linux32\"\nend\n" > /tmp/smoke.salam
              /work/salam llvm /tmp/smoke.salam --exec -o /tmp/smoke_exec --log-level=warn && /tmp/smoke_exec
              if [ "$(cat /work/.self_contained)" = 1 ]; then
                /work/salam build /tmp/smoke.salam --target=x86_64-linux-musl -o /work/.smoke_x86_64 --log-level=warn
                /work/salam build /tmp/smoke.salam --target=x86_64-w64-windows-gnu -o /work/.smoke_x86_64.exe --log-level=warn
              fi
            '
          echo "SELF_CONTAINED=$(cat .self_contained)" >> "$GITHUB_ENV"
          rm -f .self_contained
      - name: Verify cross-compiled x86_64-linux-musl output runs natively on this host
        if: env.SELF_CONTAINED == '1'
        run: |
          # The previous step's `docker run` has no --user flag, so the
          # container runs as root and everything it writes into the bind
          # mount (including these two cross-compiled outputs) lands on the
          # host owned by root:root. This step itself runs directly on the
          # runner as the unprivileged `runner` user, so `chmod` on a
          # root-owned file fails with EPERM ("Operation not permitted") -
          # reclaim ownership first (GitHub-hosted runners have passwordless
          # sudo) rather than adding --user to the container (which would
          # break its own `apt-get install`, which needs root).
          sudo chown "$(id -u):$(id -g)" .smoke_x86_64 .smoke_x86_64.exe
          file .smoke_x86_64
          chmod +x .smoke_x86_64
          ./.smoke_x86_64
          file .smoke_x86_64.exe
          rm -f .smoke_x86_64 .smoke_x86_64.exe
      - name: Stage versioned archive
        run: |
          set -eu
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          DIST="salam-linux-i686"
          mkdir -p "$DIST"
          cp salam "$DIST/salam"
          cp -r std "$DIST/std"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            if [ "${SELF_CONTAINED:-0}" = "1" ]; then
              echo "Salam for Linux (32-bit / i686) - flagship self-contained toolchain."
            else
              echo "Salam for Linux (32-bit / i686) - embedded LLVM (no in-process linker)."
            fi
            echo ""
            echo "  ./salam version"
            echo "  ./salam exec  app.salam                       (interpreter)"
            echo "  ./salam llvm  app.salam --jit                 (run via built-in LLVM)"
            echo "  ./salam build app.salam -o app                (native binary)"
            if [ "${SELF_CONTAINED:-0}" = "1" ]; then
              echo ""
              echo "Cross-compile with ZERO tools installed (LLVM + LLD + sysroots are"
              echo "compiled into salam itself):"
              echo ""
              echo "  ./salam build app.salam --target=x86_64-linux-musl      -o app"
              echo "  ./salam build app.salam --target=x86_64-w64-windows-gnu -o app.exe"
            fi
          } > "$DIST/RUN-ME.txt"
          zip -r "salam-${VERSION}-linux-i686.zip" "$DIST" >/dev/null
          ls -la "salam-${VERSION}-linux-i686.zip"
      - name: Upload versioned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-i686-zip
          path: salam-*-linux-i686.zip
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-i686
          path: salam

  build-linux-armhf:
    name: Build Salam for Linux (armhf, embedded LLVM+LLD)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage cross sysroots on host (system musl + mingw-w64) for the armhf container to embed
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev mingw-w64
          sh tools/bash/stage-sysroots.sh --out="$GITHUB_WORKSPACE/sysroots"
      - name: Set up QEMU (armhf containers need user-mode emulation; i386 doesn't)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm
      - name: Cache ccache (Linux armhf)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ccache-armhf
          key: ccache-linux-armhf-v2-${{ github.run_id }}
          restore-keys: |
            ccache-linux-armhf-v2-
      - name: Build + smoke-test inside an arm32v7/debian container (QEMU-emulated compile - slower)
        run: |
          set -eu
          mkdir -p /tmp/ccache-armhf
          # apt.llvm.org does not publish armhf at all (only amd64/i386/
          # arm64/s390x); Debian's own stable "bookworm" archive tops out at
          # llvm-15 for armhf, but sid (unstable) still builds a full
          # llvm-21-dev/lld-21/liblld-21-dev for armhf - confirmed on
          # packages.debian.org. 21 is the newest release that still targets
          # 32-bit hosts at all (LLVM stopped shipping 32-bit Windows
          # installers at v22: github.com/ScoopInstaller/Main/issues/7685).
          docker run --rm --platform=linux/arm/v7 \
            -v "$PWD:/work" -w /work/c \
            -v /tmp/ccache-armhf:/root/.ccache \
            -e CCACHE_DIR=/root/.ccache \
            arm32v7/debian:sid bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends build-essential ccache file git \
                llvm-21-dev liblld-21-dev libpolly-21-dev libzstd-dev zlib1g-dev libtinfo-dev libxml2-dev
              # Same fix as the i686 job above: this container runs as root
              # over a bind mount owned by the host runner user, so git
              # refuses to read it as "dubious ownership" unless told
              # otherwise - the Makefile discards git stderr, so that
              # failure silently produced "unknown" commit/date instead of
              # erroring.
              git config --global --add safe.directory /work
              ccache --max-size=300M >/dev/null 2>&1 || true
              MUSL_SR=/work/sysroots/x86_64-linux-musl
              MINGW_SR=/work/sysroots/x86_64-w64-mingw32
              if make -j"$(nproc)" \
                   WITH_LLVM=1 WITH_LLD=1 LLVM_LINK_STATIC=1 \
                   LLVM_CONFIG=llvm-config-21 CC="ccache gcc" CXX="ccache g++" \
                   SALAM_EMBED_MUSL_DIR="$MUSL_SR" SALAM_EMBED_MINGW_DIR="$MINGW_SR"; then
                echo 1 > /work/.self_contained
              else
                echo "::warning::self-contained (LLD) armhf build failed; falling back to embedded-LLVM-only."
                make clean
                make -j"$(nproc)" WITH_LLVM=1 LLVM_LINK_STATIC=1 LLVM_CONFIG=llvm-config-21 CC="ccache gcc"
                echo 0 > /work/.self_contained
              fi
              ccache --show-stats 2>/dev/null | head -5 || true
              file /work/salam
              /work/salam version
              export SALAM_STD=/work/std
              printf "func main:\n    println \"ok-armhf\"\nend\n" > /tmp/smoke.salam
              # ORC in-process JIT goes through LLVM JITLink, whose AArch32
              # (32-bit ARM) backend is explicitly documented upstream as
              # not production-ready (llvm.org/docs/JITLink.html: "the arm32
              # ... backend[s] ... are not yet ready for general use"), and
              # fails with "Invalid opcode ... for relocation: Arm_Jump24" -
              # a known gap, not a salam bug or an LLVM-21-vs-22 regression.
              # Skip --jit here rather than run-and-warn; --exec below still
              # exercises the same LLVM codegen via AOT object emission + a
              # real linker (build-and-run), a separate and mature path.
              # --exec emits an AOT object and links it with the system
              # linker - unlike --jit above, this has no known upstream gap
              # and is expected to just work. Keep this and the smoke-exec
              # run as two separate top-level statements (not `a && b`):
              # with `set -e`, a failing first command in an `&&` list is
              # exempt from triggering exit (bash only checks the last
              # command in the list), so `a && b` would silently skip `b`
              # and let the step report success even if `a` itself failed
              # to produce a working binary - which is exactly how a real
              # armhf hard/soft-float ABI link failure here went unnoticed
              # previously. Two statements means either one failing now
              # correctly fails this step (still non-fatal to the overall
              # release build, since the job has continue-on-error: true).
              /work/salam llvm /tmp/smoke.salam --exec -o /tmp/smoke_exec --log-level=warn
              /tmp/smoke_exec
              if [ "$(cat /work/.self_contained)" = 1 ]; then
                /work/salam build /tmp/smoke.salam --target=x86_64-linux-musl -o /work/.smoke_x86_64 --log-level=warn
                /work/salam build /tmp/smoke.salam --target=x86_64-w64-windows-gnu -o /work/.smoke_x86_64.exe --log-level=warn
              fi
            '
          echo "SELF_CONTAINED=$(cat .self_contained)" >> "$GITHUB_ENV"
          rm -f .self_contained
      - name: Verify cross-compiled x86_64-linux-musl output runs natively on this host
        if: env.SELF_CONTAINED == '1'
        run: |
          # The previous step's `docker run` has no --user flag, so the
          # container runs as root and everything it writes into the bind
          # mount (including these two cross-compiled outputs) lands on the
          # host owned by root:root. This step itself runs directly on the
          # runner as the unprivileged `runner` user, so `chmod` on a
          # root-owned file fails with EPERM ("Operation not permitted") -
          # reclaim ownership first (GitHub-hosted runners have passwordless
          # sudo) rather than adding --user to the container (which would
          # break its own `apt-get install`, which needs root).
          sudo chown "$(id -u):$(id -g)" .smoke_x86_64 .smoke_x86_64.exe
          file .smoke_x86_64
          chmod +x .smoke_x86_64
          ./.smoke_x86_64
          file .smoke_x86_64.exe
          rm -f .smoke_x86_64 .smoke_x86_64.exe
      - name: Stage versioned archive
        run: |
          set -eu
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          DIST="salam-linux-armhf"
          mkdir -p "$DIST"
          cp salam "$DIST/salam"
          cp -r std "$DIST/std"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            if [ "${SELF_CONTAINED:-0}" = "1" ]; then
              echo "Salam for Linux (armhf) - flagship self-contained toolchain."
            else
              echo "Salam for Linux (armhf) - embedded LLVM (no in-process linker)."
            fi
            echo ""
            echo "  ./salam version"
            echo "  ./salam exec  app.salam                       (interpreter)"
            echo "  ./salam llvm  app.salam --jit                 (run via built-in LLVM)"
            echo "  ./salam build app.salam -o app                (native binary)"
            if [ "${SELF_CONTAINED:-0}" = "1" ]; then
              echo ""
              echo "Cross-compile with ZERO tools installed (LLVM + LLD + sysroots are"
              echo "compiled into salam itself):"
              echo ""
              echo "  ./salam build app.salam --target=x86_64-linux-musl      -o app"
              echo "  ./salam build app.salam --target=x86_64-w64-windows-gnu -o app.exe"
            fi
          } > "$DIST/RUN-ME.txt"
          zip -r "salam-${VERSION}-linux-armhf.zip" "$DIST" >/dev/null
          ls -la "salam-${VERSION}-linux-armhf.zip"
      - name: Upload versioned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-armhf-zip
          path: salam-*-linux-armhf.zip
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-armhf
          path: salam

  build-linux-aarch64:
    name: Build Salam for Linux (aarch64, native flagship)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies (static LLVM + LLD + cross sysroot inputs)
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get update
          sudo apt-get install -y build-essential ccache \
            llvm-22-dev liblld-22-dev libpolly-22-dev libclang-rt-22-dev \
            libzstd-dev zlib1g-dev libtinfo-dev libxml2-dev \
            libsqlite3-dev \
            mingw-w64 qemu-user-static
          # libsqlite3-dev: this job builds no static third-party libs (the
          # x86_64 job does that for the release archives), so the general
          # suite's `link dynamic "sqlite3"` tests have nothing for the
          # in-process lld to find in the musl sysroot. They fall back to the
          # C backend, which links them against the host's libsqlite3.
          gcc --version | head -1
          llvm-config-22 --version
      - name: Cache cross musl sysroots (x86_64 + aarch64 + i686 + armhf) for embedding
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/muslcc/sr-x86_64
            /tmp/muslcc/sr-aarch64
            /tmp/muslcc/sr-i686
            /tmp/muslcc/sr-arm
          key: musl-embed-sysroots-arm64-v1-${{ github.run_id }}
          restore-keys: |
            musl-embed-sysroots-arm64-v1-
      - name: Fetch cross musl sysroots (x86_64 + aarch64 + i686 + armhf) for embedding
        run: sh tools/bash/fetch-musl-sysroots.sh --out /tmp/muslcc
      - name: Stage mingw-w64 x86_64 target files (for cross-to-Windows embed)
        run: |
          G=""
          for d in /usr/lib/gcc/x86_64-w64-mingw32/*win32; do
            [ -d "$d" ] && G="$d" && break
          done
          if [ -n "$G" ]; then
            mkdir -p /tmp/mingw-sr/lib
            cp /usr/x86_64-w64-mingw32/lib/{crt2.o,dllcrt2.o,libmingw32.a,libmingwex.a,libmoldname.a,libmsvcrt.a,libadvapi32.a,libshell32.a,libuser32.a,libkernel32.a} /tmp/mingw-sr/lib/
            cp "$G"/{crtbegin.o,crtend.o,libgcc.a,libgcc_eh.a} /tmp/mingw-sr/lib/
            echo "SALAM_EMBED_MINGW_DIR=/tmp/mingw-sr" >> "$GITHUB_ENV"
            echo "staged mingw x86_64 sysroot -> /tmp/mingw-sr"
          else
            echo "::warning::mingw-w64 gcc runtime dir not found; not embedding x86_64-w64-windows-gnu target."
          fi
      - name: Cache ccache (Linux aarch64)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-linux-aarch64-${{ github.run_id }}
          restore-keys: |
            ccache-linux-aarch64-
      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam

      - name: Build the flagship self-contained salam (LLVM + LLD + sysroots)
        run: |
          set -eu
          sh tools/bash/stage-sysroots.sh --musl-arch aarch64 \
            --out="$GITHUB_WORKSPACE/sysroots"
          sh std/llvm/native/build.sh --llvm-config llvm-config-22 \
            --out "$GITHUB_WORKSPACE"
          sh tools/bash/build-embed.sh --out "$GITHUB_WORKSPACE" \
            --musl-x86_64 "${SALAM_EMBED_MUSL_DIR:-}" \
            --musl-aarch64 "${SALAM_EMBED_MUSL_AARCH64_DIR:-$GITHUB_WORKSPACE/sysroots/aarch64-linux-musl}" \
            --musl-i686 "${SALAM_EMBED_MUSL_I686_DIR:-}" \
            --musl-arm "${SALAM_EMBED_MUSL_ARM_DIR:-}" \
            --mingw-x86_64 "${SALAM_EMBED_MINGW_DIR:-$GITHUB_WORKSPACE/sysroots/x86_64-w64-mingw32}"
          sh tools/bash/build-selfhost.sh \
            --llvm="$GITHUB_WORKSPACE" --embed="$GITHUB_WORKSPACE"
          echo "SELF_CONTAINED=1" >> "$GITHUB_ENV"
          ./salam version
      - name: Smoke-test the backend (and cross-compile with a scrubbed PATH)
        run: |
          export SALAM_STD="$PWD/std"
          printf 'func main:\n    println "ok-llvm"\nend\n' > smoke.salam
          echo "[native] embedded LLVM backend"
          ./salam llvm smoke.salam --emit-obj -o smoke.o --log-level=warn
          ./salam llvm smoke.salam --exec -o smoke_exe --log-level=warn && ./smoke_exe
          if [ "${SELF_CONTAINED:-0}" = "1" ]; then
            if [ -n "${SALAM_EMBED_MUSL_AARCH64_DIR:-}" ]; then
              echo "[cross] aarch64-linux-musl (native target), PATH=/nonexistent"
              env PATH=/nonexistent SALAM_STD="$SALAM_STD" SALAM_CACHE=/tmp/sc \
                ./salam build smoke.salam --target=aarch64-linux-musl -o smoke_a64
              ./smoke_a64; file smoke_a64
            fi
            if [ -n "${SALAM_EMBED_MUSL_DIR:-}" ]; then
              echo "[cross] x86_64-linux-musl, PATH=/nonexistent"
              env PATH=/nonexistent SALAM_STD="$SALAM_STD" SALAM_CACHE=/tmp/sc \
                ./salam build smoke.salam --target=x86_64-linux-musl -o smoke_x64
              file smoke_x64; qemu-x86_64-static ./smoke_x64
            fi
            if [ -n "${SALAM_EMBED_MUSL_I686_DIR:-}" ]; then
              echo "[cross] i686-linux-musl, PATH=/nonexistent"
              env PATH=/nonexistent SALAM_STD="$SALAM_STD" SALAM_CACHE=/tmp/sc \
                ./salam build smoke.salam --target=i686-linux-musl -o smoke_i686
              file smoke_i686; qemu-i386-static ./smoke_i686
            fi
            if [ -n "${SALAM_EMBED_MUSL_ARM_DIR:-}" ]; then
              echo "[cross] arm-linux-musleabihf, PATH=/nonexistent"
              env PATH=/nonexistent SALAM_STD="$SALAM_STD" SALAM_CACHE=/tmp/sc \
                ./salam build smoke.salam --target=arm-linux-musleabihf -o smoke_armhf
              file smoke_armhf; qemu-arm-static ./smoke_armhf
            fi
            if [ -n "${SALAM_EMBED_MINGW_DIR:-}" ]; then
              echo "[cross] x86_64-w64-windows-gnu, PATH=/nonexistent"
              env PATH=/nonexistent SALAM_STD="$SALAM_STD" SALAM_CACHE=/tmp/sc \
                ./salam build smoke.salam --target=x86_64-w64-windows-gnu -o smoke.exe
              file smoke.exe
            fi
          fi
          rm -f smoke.salam smoke_exe smoke_a64 smoke_x64 smoke_i686 smoke_armhf smoke.exe smoke.o salam_mod_*.c salam_mod_*.h
      - name: Set up pinned tcc
        if: startsWith(github.event.head_commit.message, 'release:') || (github.event_name == 'workflow_dispatch' && inputs.nightly)
        uses: ./.github/actions/setup-tcc
      - name: Validate test suite (release gate)
        if: startsWith(github.event.head_commit.message, 'release:') || (github.event_name == 'workflow_dispatch' && inputs.nightly)
        run: |
          SALAM="$GITHUB_WORKSPACE/salam" sh tools/bash/run-tests.sh exec errors layout llvm general 2>&1 | tee /tmp/tests.log || true
          grep -qE 'RESULT: [0-9]+ passed, 0 failed' /tmp/tests.log \
            || { echo "::error::Linux aarch64 test suite failed - blocking release"; exit 1; }
      - name: Stage versioned archive
        run: |
          set -eu
          VERSION=$(tr -d ' \t\r\n' < VERSION)
          DIST="salam-linux-aarch64"
          mkdir -p "$DIST"
          cp salam "$DIST/salam"
          cp -r std "$DIST/std"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          {
            echo "Salam for Linux (aarch64) - flagship self-contained toolchain."
            echo ""
            echo "No installation needed. From this folder:"
            echo ""
            echo "  ./salam version"
            echo "  ./salam exec  app.salam                               (interpreter)"
            echo "  ./salam llvm  app.salam --jit                         (run via built-in LLVM)"
            echo "  ./salam build app.salam -o app                        (native binary)"
            if [ "${SELF_CONTAINED:-0}" = "1" ]; then
              echo ""
              echo "Cross-compile with ZERO tools installed (LLVM + LLD + sysroots are"
              echo "compiled into salam itself):"
              echo ""
              if [ -n "${SALAM_EMBED_MUSL_AARCH64_DIR:-}" ]; then
                echo "  ./salam build app.salam --target=aarch64-linux-musl     -o app"
              fi
              if [ -n "${SALAM_EMBED_MUSL_DIR:-}" ]; then
                echo "  ./salam build app.salam --target=x86_64-linux-musl      -o app"
              fi
              if [ -n "${SALAM_EMBED_MUSL_I686_DIR:-}" ]; then
                echo "  ./salam build app.salam --target=i686-linux-musl        -o app"
              fi
              if [ -n "${SALAM_EMBED_MUSL_ARM_DIR:-}" ]; then
                echo "  ./salam build app.salam --target=arm-linux-musleabihf   -o app"
              fi
              if [ -n "${SALAM_EMBED_MINGW_DIR:-}" ]; then
                echo "  ./salam build app.salam --target=x86_64-w64-windows-gnu -o app.exe"
              fi
              echo ""
              echo "Embedded targets depend on which sysroots this build bundled (see"
              echo "above). macOS targets are not supported (Apple SDK restrictions)."
            fi
          } > "$DIST/RUN-ME.txt"
          zip -r "salam-${VERSION}-linux-aarch64.zip" "$DIST" >/dev/null
          ls -la "salam-${VERSION}-linux-aarch64.zip"
      - name: Upload versioned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-aarch64-zip
          path: salam-*-linux-aarch64.zip
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-linux-aarch64
          path: salam

  build-android:
    name: Build & sign Android AAB + APKs
    if: |
      github.ref == 'refs/heads/main' &&
      github.repository == 'SalamLang/Salam' &&
      ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')) ||
       (github.event_name == 'workflow_dispatch' && inputs.nightly))
    uses: ./.github/workflows/_reusable-android-build.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # Best-effort gate: a signing-secret hiccup on the Android side (or an
  # android/ build regression) should not block the far more heavily-used
  # native-binary release. Jobs that call a reusable workflow via `uses:`
  # can't set `continue-on-error`, so this no-op job absorbs build-android's
  # failure and always reports success; create-release depends on this job
  # instead and downloads build-android's artifact with continue-on-error,
  # so a failure there just means the AAB/APKs are missing from that run's
  # release rather than the whole release failing.
  android-gate:
    name: Android build gate (best-effort)
    needs: build-android
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report Android build result
        run: echo "build-android result=${{ needs.build-android.result }}"

  create-release:
    if: |
      github.ref == 'refs/heads/main' &&
      github.repository == 'SalamLang/Salam' &&
      ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')) ||
       (github.event_name == 'workflow_dispatch' && inputs.nightly))
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      [
        build-linux,
        build-macos,
        build-windows,
        build-windows-i686,
        build-linux-i686,
        build-linux-armhf,
        build-linux-aarch64,
        android-gate,
      ]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Read version from VERSION file
        id: get_version
        run: |
          VERSION=$(cat VERSION | sed 's/^[ \t]*//;s/[ \t]*$//')
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Salam version: ${VERSION}"
      - name: Compute release tag/title (nightly vs versioned)
        env:
          NIGHTLY: ${{ inputs.nightly }}
          NIGHTLY_DATE_INPUT: ${{ inputs.nightly_date }}
        run: |
          if [ "$NIGHTLY" = "true" ]; then
            NIGHTLY_DATE="$NIGHTLY_DATE_INPUT"
            [ -n "$NIGHTLY_DATE" ] || NIGHTLY_DATE="$(date -u +%Y-%m-%d)"
            {
              echo "TAG=v${VERSION}-nightly-${NIGHTLY_DATE}"
              echo "RELEASE_TITLE=Salam Nightly Release v${VERSION}-nightly-${NIGHTLY_DATE}"
              echo "PRERELEASE_FLAG=--prerelease"
            } >> "$GITHUB_ENV"
          else
            {
              echo "TAG=v${VERSION}"
              echo "RELEASE_TITLE=Salam Release v${VERSION}"
              echo "PRERELEASE_FLAG="
            } >> "$GITHUB_ENV"
          fi
      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux
          path: ./release
      - name: Rename Linux binary to avoid conflict
        run: |
          mv ./release/salam ./release/salam-linux
      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-macos
          path: ./release
      - name: Rename macOS binary to avoid conflict
        run: |
          mv ./release/salam ./release/salam-mac
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-windows
          path: ./release
      - name: Rename Window binary
        run: |
          mv ./release/salam.exe ./release/salam-windows.exe
      - name: Download Windows self-contained bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-windows-bundle
          path: ./release
      - name: Download Linux versioned archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-zip
          path: ./release
      - name: Download macOS versioned archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-macos-zip
          path: ./release
      - name: Download Windows i686 binary
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-windows-i686
          path: ./release-win-i686
      - name: Download Windows i686 bundle
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-windows-i686-bundle
          path: ./release
      - name: Download Linux i686 binary
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-i686
          path: ./release-linux-i686
      - name: Download Linux i686 archive
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-i686-zip
          path: ./release
      - name: Download Linux aarch64 binary
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-aarch64
          path: ./release-linux-aarch64
      - name: Download Linux aarch64 archive
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-aarch64-zip
          path: ./release
      - name: Download Linux armhf binary
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-armhf
          path: ./release-linux-armhf
      - name: Download Linux armhf archive
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-linux-armhf-zip
          path: ./release
      - name: Download Android AAB + APKs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-android-release
          path: ./release
      - name: Collect 32-bit / cross binaries (rename to avoid name clashes)
        run: |
          set -eu
          [ -f ./release-win-i686/salam.exe ]     && mv ./release-win-i686/salam.exe     ./release/salam-windows-i686.exe || true
          [ -f ./release-linux-i686/salam ]       && mv ./release-linux-i686/salam       ./release/salam-linux-i686       || true
          [ -f ./release-linux-aarch64/salam ]    && mv ./release-linux-aarch64/salam    ./release/salam-linux-aarch64    || true
          [ -f ./release-linux-armhf/salam ]      && mv ./release-linux-armhf/salam      ./release/salam-linux-armhf      || true
          echo "release/ now contains:"; ls -la ./release

      # The machine-readable std/ index the MCP server and the editor tooling
      # read. It is committed, and mcp-server.yml fails the build when it
      # drifts from std/, so the copy checked out here is the one that matches
      # this tag. Publishing it per-release means consumers can pin a version
      # instead of pointing a raw URL at a branch that keeps moving.
      - name: Stage the stdlib index
        run: |
          set -eu
          src=docs/ai/stdlib-index.json
          [ -f "$src" ] || { echo "::error::$src is missing"; exit 1; }
          mkdir -p ./release
          cp "$src" "./release/salam-${VERSION}-stdlib-index.json"
          ls -l "./release/salam-${VERSION}-stdlib-index.json"

      # The browsable counterpart of the index above: one self-contained page
      # for the whole standard library, generated by this release's own
      # compiler rather than a stale one. `salam doc` exits 1 when a source
      # file will not parse - deliberately, so silently missing entries are
      # not the only clue - but it still writes the page, so that is surfaced
      # as a warning rather than taken as a reason to hold the whole release.
      # A missing page is a real failure and does stop it.
      - name: Generate the stdlib documentation page
        run: |
          set -eu
          out="./release/salam-${VERSION}-stdlib-doc.html"
          chmod +x ./release/salam-linux
          rc=0
          ./release/salam-linux doc std --output="$out" || rc=$?
          if [ ! -s "$out" ]; then
            echo "::error::salam doc produced no page at $out (exit $rc)"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::warning::salam doc exited $rc; some std/ files did not parse"
            echo "::warning::and their declarations are missing from the page"
          fi
          ls -l "$out"
      # - name: Post Linux release file to SERVER_VERSIONS_API
      #   env:
      #     SERVER_VERSIONS_API: ${{ secrets.SERVER_VERSIONS_API }}
      #     SERVER_VERSIONS_KEY: ${{ secrets.SERVER_VERSIONS_KEY }}
      #   run: |
      #     curl -X POST "$SERVER_VERSIONS_API" \
      #       -F "file=@./release/salam-linux" \
      #       -F "version=${{ env.VERSION }}" \
      #       -F "date=$(date +'%Y-%m-%d')" \
      #       -F "time=$(date +'%H:%M:%S')" \
      #       -F "key='$SERVER_VERSIONS_KEY'" \
      #       -F "platform=linux"
      # - name: Post macOS release file to SERVER_VERSIONS_API
      #   env:
      #     SERVER_VERSIONS_API: ${{ secrets.SERVER_VERSIONS_API }}
      #     SERVER_VERSIONS_KEY: ${{ secrets.SERVER_VERSIONS_KEY }}
      #   run: |
      #     curl -X POST "$SERVER_VERSIONS_API" \
      #       -F "file=@./release/salam-mac" \
      #       -F "version=${{ env.VERSION }}" \
      #       -F "date=$(date +'%Y-%m-%d')" \
      #       -F "time=$(date +'%H:%M:%S')" \
      #       -F "key='$SERVER_VERSIONS_KEY'" \
      #       -F "platform=macos"
      # - name: Post Windows release file to SERVER_VERSIONS_API
      #   env:
      #     SERVER_VERSIONS_API: ${{ secrets.SERVER_VERSIONS_API }}
      #     SERVER_VERSIONS_KEY: ${{ secrets.SERVER_VERSIONS_KEY }}
      #   run: |
      #     curl -X POST "$SERVER_VERSIONS_API" \
      #       -F "file=@./release/salam-windows.exe" \
      #       -F "version=${{ env.VERSION }}" \
      #       -F "date=$(date +'%Y-%m-%d')" \
      #       -F "time=$(date +'%H:%M:%S')" \
      #       -F "key='$SERVER_VERSIONS_KEY'" \
      #       -F "platform=windows"
      - name: Delete existing release and tag if found
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null; then
            echo "Deleted existing release $TAG (and its tag)."
          else
            echo "No existing release $TAG."
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          git tag -d "$TAG" 2>/dev/null || true
      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          shopt -s nullglob
          candidates=(
            # release/salam-linux
            # release/salam-mac
            # release/salam-windows.exe
            # release/salam-linux-i686
            # release/salam-windows-i686.exe
            # release/salam-linux-aarch64
            # release/salam-linux-armhf
            release/salam-*.zip
            release/salam-*-stdlib-index.json
            release/salam-*-stdlib-doc.html
            release/salam-application-*.aab
            release/salam-application-*.apk
          )
          assets=()
          for c in "${candidates[@]}"; do
            for f in $c; do [ -e "$f" ] && assets+=("$f"); done
          done
          echo "Publishing ${#assets[@]} assets:"; printf '  %s\n' "${assets[@]}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            ${PRERELEASE_FLAG:+"$PRERELEASE_FLAG"} \
            "${assets[@]}"

  # A failed nightly used to be invisible. The nightly-check workflow goes
  # green the moment it dispatches, and the failure then lands in *this*
  # workflow's run, which nobody is watching at 04:30 UTC - so every nightly
  # attempt after 2026-08-04 failed its release gate unnoticed and the newest
  # published nightly went stale for a week. This job keeps a single tracking
  # issue in sync with the outcome: opened/updated when a nightly cannot
  # publish, closed when one does.
  nightly-report:
    name: Report nightly outcome
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' && inputs.nightly &&
      github.repository == 'SalamLang/Salam'
    needs:
      [
        build-linux,
        build-macos,
        build-windows,
        build-windows-i686,
        build-linux-i686,
        build-linux-armhf,
        build-linux-aarch64,
        android-gate,
        create-release,
      ]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update or close the nightly tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job deliberately has no checkout - it only talks to the
          # issues API - so gh cannot infer the repository from a git
          # remote and has to be told which one it is.
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NIGHTLY_DATE: ${{ inputs.nightly_date }}
        run: |
          set -eu
          TITLE="🌙 Nightly release is failing"

          # "skipped" is not a failure: create-release skips itself when a
          # build job fails, and reporting it alongside the build that
          # actually broke just buries the real cause.
          failed=$(printf '%s' "$RESULTS" \
            | jq -r 'to_entries
                     | map(select(.value.result == "failure" or .value.result == "cancelled"))
                     | .[].key')

          # Matched on the exact title rather than `gh issue list --search`:
          # the search index lags behind by minutes, which would open a
          # second copy of this issue every night.
          num=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')

          if [ -z "$failed" ]; then
            echo "nightly ${NIGHTLY_DATE:-$(date -u +%F)} published successfully"
            if [ -n "$num" ]; then
              gh issue comment "$num" \
                --body "Nightly \`${NIGHTLY_DATE:-$(date -u +%F)}\` published successfully in ${RUN_URL} - closing."
              gh issue close "$num"
            fi
            exit 0
          fi

          echo "failed jobs:"
          printf '%s\n' "$failed" | sed 's/^/  /'

          body=$(
            echo "The nightly release for \`${NIGHTLY_DATE:-$(date -u +%F)}\` did not publish."
            echo ""
            echo "Failed jobs:"
            printf '%s\n' "$failed" | while IFS= read -r job; do
              printf -- "- \`%s\`\n" "$job"
            done
            echo ""
            echo "Run: ${RUN_URL}"
            echo ""
            echo "Nothing is published unless every platform passes its release gate,"
            echo "so the newest nightly stays stale until this run is green again."
            echo "This issue is updated on each nightly attempt and closed"
            echo "automatically by the first one that succeeds."
          )

          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
            echo "updated issue #$num"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
