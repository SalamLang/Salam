---
name: 🧬 Self-Host - Bootstrap & Parity
# checkov:skip=CKV_GHA_7:inputs are only ever read via env: indirection, never interpolated into a run: script
on:
  push:
    branches:
      - main
    paths:
      - 'compiler/**'
      - 'std/**'
      - 'tests/**'
      - 'install.sh'
      - '.github/workflows/compiler-selfhost.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'compiler/**'
      - 'std/**'
      - 'tests/**'
      - 'install.sh'
      - '.github/workflows/compiler-selfhost.yml'
  workflow_dispatch:
    inputs:
      seed_version:
        description: 'Released salam version to bootstrap FROM (e.g. 0.2.7). Blank = latest release with an asset for the runner platform.'
        type: string
        default: ''
env:
  CCACHE_COMPRESS: '1'
  CCACHE_COMPRESSLEVEL: '9'

permissions:
  contents: read
concurrency:
  group: compiler-selfhost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  seed:
    name: Resolve seed release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the seed salam version
        id: resolve
        env:
          SALAM_VERSION: ${{ inputs.seed_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh ./install.sh
          v=$("$HOME/.salam/bin/salam" version | head -1 | awk '{ print $2 }')
          [ -n "$v" ] || { echo "::error::could not read version from the installed salam"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "seed salam version: $v"

  bootstrap:
    name: Bootstrap on ${{ matrix.os }}
    needs: seed
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, experimental: false }
          - { os: macos-latest, experimental: true }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install seed salam from a published release
        env:
          SALAM_VERSION: ${{ needs.seed.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh ./install.sh
          echo "$HOME/.salam/bin" >> "$GITHUB_PATH"

      - name: Repair the seed binary's Homebrew dylib deps (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -eu
          seed="$HOME/.salam/bin/salam"
          otool -L "$seed" || true
          for lib in $(otool -L "$seed" | awk 'NR > 1 { print $1 }' | grep '^/opt/homebrew/' || true); do
            if [ -f "$lib" ]; then continue; fi
            formula=$(printf '%s' "$lib" | sed -n 's#^/opt/homebrew/opt/\([^/]*\)/.*#\1#p')
            [ -n "$formula" ] || {
              echo "::warning::cannot map $lib to a Homebrew formula - leaving it"
              continue
            }
            echo "seed needs missing $lib - installing formula '$formula'"
            brew install "$formula" || true
            if [ -f "$lib" ]; then continue; fi
            dir=$(dirname "$lib")
            stem=$(basename "$lib" | cut -d. -f1)
            alt=$(find "$dir" -maxdepth 1 -name "$stem.*.dylib" 2>/dev/null | head -1 || true)
            [ -n "$alt" ] || {
              echo "::error::no substitute available for $lib"
              exit 1
            }
            ln -sf "$alt" "$lib"
            echo "linked $lib -> $alt"
          done

      - name: Verify the seed compiler runs
        run: |
          set -eu
          "$HOME/.salam/bin/salam" version > seed-version.txt
          head -1 seed-version.txt
          rm -f seed-version.txt

      - name: Pick the stage-0 compiler
        env:
          SEED_VERSION: ${{ needs.seed.outputs.version }}
          SEED_MIN: '0.3.1'
        run: |
          set -eu
          newest=$(printf '%s\n%s\n' "$SEED_MIN" "$SEED_VERSION" |
            sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ "$newest" = "$SEED_VERSION" ]; then
            echo "seed $SEED_VERSION >= $SEED_MIN - bootstrapping from the release"
            echo "SALAM_SEED=$HOME/.salam/bin/salam" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::seed $SEED_VERSION predates $SEED_MIN and cannot resolve" \
            "compiler/'s ../ imports. Publish a $SEED_MIN or newer release, or" \
            "point SALAM_SEED at a newer binary."
          exit 1

      - name: Cache static LLVM/LLD archive
        id: llvm-archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libsalam_llvm.a
          key: >-
            salam-llvm-a-${{ matrix.os }}-llvm22-${{ hashFiles(
            'std/llvm/native/**') }}

      - name: Cache ccache for the LLVM archive build
        if: steps.llvm-archive.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-selfhost-llvm-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-selfhost-llvm-${{ matrix.os }}-

      - name: Cache static lld (macOS)
        id: lld-static
        if: runner.os == 'macOS' && steps.llvm-archive.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lldstatic
          key: >-
            salam-lld-static-${{ matrix.os }}-llvm22-${{
            hashFiles('tools/bash/build-static-lld.sh') }}
          restore-keys: |
            salam-lld-static-${{ matrix.os }}-llvm22-

      - name: Build static LLVM/LLD archive (best-effort)
        if: steps.llvm-archive.outputs.cache-hit != 'true'
        run: |
          set -u
          CCACHE_DIR="$HOME/.ccache"
          export CCACHE_DIR
          mkdir -p "$CCACHE_DIR"
          case "${{ matrix.os }}" in
          ubuntu*)
            echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
            wget -4 -qO llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 22 || true
            sudo apt-get update || true
            sudo apt-get install -y ccache llvm-22-dev liblld-22-dev \
              libpolly-22-dev libzstd-dev zlib1g-dev libtinfo-dev \
              libxml2-dev || true
            LLVM_CONFIG=llvm-config-22
            ;;
          macos*)
            brew install ccache llvm lld || true
            LLVM_CONFIG="$(brew --prefix llvm)/bin/llvm-config"
            if [ ! -f lldstatic/lib/liblldCommon.a ]; then
              sh tools/bash/build-static-lld.sh \
                --prefix "$PWD/lldstatic" \
                --llvm-config "$LLVM_CONFIG" \
                --jobs "$(sysctl -n hw.ncpu)" || {
                echo "::warning::static lld build failed - stage2 will have LLVM but no in-process LLD"
                rm -rf lldstatic
              }
            fi
            ;;
          *)
            LLVM_CONFIG=llvm-config
            ;;
          esac
          if ! command -v "$LLVM_CONFIG" >/dev/null 2>&1; then
            echo "::error::no $LLVM_CONFIG - refusing to build a stage2 that falls back to the C backend"
            exit 1
          fi
          "$LLVM_CONFIG" --version
          C_COMPILER=gcc
          CXX_COMPILER=g++
          if command -v ccache >/dev/null 2>&1; then
            ccache --max-size=500M >/dev/null 2>&1 || true
            C_COMPILER="ccache gcc"
            CXX_COMPILER="ccache g++"
          fi
          LLD_ARGS=WITH_LLD=1
          case "${{ matrix.os }}" in
          macos*)
            if [ -f lldstatic/lib/liblldCommon.a ]; then
              LLD_ARGS="WITH_LLD=1 LLD_PREFIX=$PWD/lldstatic"
            else
              LLD_ARGS=
              echo "::warning::no static lld - stage2 gets LLVM without in-process LLD"
            fi
            ;;
          esac
          echo "lld: ${LLD_ARGS:-(autodetect)}"
          # shellcheck disable=SC2086 # deliberately unquoted: empty = omit
          if env $LLD_ARGS CC="$C_COMPILER" CXX="$CXX_COMPILER" \
            sh std/llvm/native/build.sh --llvm-config "$LLVM_CONFIG" \
            --out "$GITHUB_WORKSPACE"; then
            before=$(wc -c <libsalam_llvm.a | tr -d ' ')
            strip --strip-debug libsalam_llvm.a 2>/dev/null ||
              strip -S libsalam_llvm.a 2>/dev/null || true
            ranlib libsalam_llvm.a 2>/dev/null || true
            after=$(wc -c <libsalam_llvm.a | tr -d ' ')
            echo "libsalam_llvm.a: $before -> $after bytes after --strip-debug"
            if ! ar t libsalam_llvm.a >/dev/null 2>&1; then
              echo "::error::libsalam_llvm.a is unreadable after strip"
              rm -f libsalam_llvm.a
              exit 1
            fi
            echo "libsalam_llvm.a built - stage2 gets LLVM in-process"
          else
            echo "::error::libsalam-llvm failed - stage2 would fall back to the C backend"
            exit 1
          fi
          command -v ccache >/dev/null 2>&1 && ccache --show-stats | head -5

      - name: Install LLVM link-time system libs
        run: |
          set -u
          case "${{ runner.os }}" in
          Linux) sudo apt-get install -y zlib1g-dev libzstd-dev || true ;;
          macOS) brew install zstd || true ;;
          esac

      - name: Bootstrap stage1 -> stage2 -> stage3
        run: |
          set -eu
          sh compiler/tools/bash/bootstrap.sh "$SALAM_SEED" build/selfhost

      - name: Report per-stage backend
        env:
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          set -eu
          printf 'func main:\n    println "backend-probe"\nend\n' > probe.salam
          for s in build/selfhost/salam-stage*; do
            [ -x "$s" ] || continue
            if "$s" build probe.salam --output=probe_exe --log-level=info 2>&1 |
              grep -q "LLVM IR"; then
              backend="LLVM (in-process)"
            else
              backend="C (no static LLVM linked in)"
            fi
            printf '%-28s %12s bytes  %s\n' "$(basename "$s")" \
              "$(wc -c <"$s" | tr -d ' ')" "$backend"
            rm -f probe_exe
          done
          rm -f probe.salam

      - name: Smoke-test the self-hosted compiler
        env:
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          set -eu
          sh=build/selfhost/salam-stage2
          printf 'func main:\n    println "ok-selfhost"\nend\n' > smoke.salam
          "$sh" exec smoke.salam
          "$sh" build smoke.salam --output=smoke_exe --cc=cc
          ./smoke_exe
          rm -f smoke.salam smoke_exe

      - name: Upload stage2 compiler
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-selfhost-stage2-${{ matrix.os }}
          path: build/selfhost/salam-stage2
          if-no-files-found: error
          retention-days: 14

  parity:
    name: Parity - ${{ matrix.suite }}
    needs: [seed, bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [exec, layout, llvm, errors, general]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the same seed salam (reference compiler)
        env:
          SALAM_VERSION: ${{ needs.seed.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh ./install.sh
          "$HOME/.salam/bin/salam" version | head -1

      - name: Download stage2 self-hosted compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-selfhost-stage2-ubuntu-latest
          path: build/selfhost

      - name: Install test-suite dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libhiredis-dev libmariadb-dev

      - name: Set up pinned tcc
        uses: ./.github/actions/setup-tcc

      - name: Run parity gate for ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -eu
          chmod +x build/selfhost/salam-stage2
          sh compiler/tools/bash/selfhost-parity.sh \
            "$HOME/.salam/bin/salam" \
            build/selfhost/salam-stage2 \
            "$SUITE"
