---
name: 🧬 Self-Host - Bootstrap & Parity
# Builds the self-hosted compiler (compiler/*.salam) the way a user would -
# install a released `salam`, then `salam build compiler/main.salam` - and
# gates it against the reference compiler on the shared test corpus.
#
# Deliberately touches nothing in c/: no `make`, no C sources. The only
# compiler this workflow needs is the released binary install.sh fetches,
# which is also the reference the parity gate diffs against. That is the
# whole point - it is the proving ground for making the self-hosted
# compiler primary, and it must not depend on the C build to work.
# checkov:skip=CKV_GHA_7:inputs are only ever read via env: indirection, never interpolated into a run: script
on:
  push:
    branches:
      - main
    paths:
      - 'compiler/**'
      - 'std/**'
      - 'tests/**'
      - 'install.sh'
      - '.github/workflows/compiler-selfhost.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'compiler/**'
      - 'std/**'
      - 'tests/**'
      - 'install.sh'
      - '.github/workflows/compiler-selfhost.yml'
  workflow_dispatch:
    inputs:
      seed_version:
        description: 'Released salam version to bootstrap FROM (e.g. 0.2.7). Blank = latest release with an asset for the runner platform.'
        type: string
        default: ''
# ccache stores its objects zstd-compressed, but at its default level. The
# 10 GB Actions cache budget is repository-wide and shared with every other
# workflow, so raise the level: smaller uploads, and because --max-size caps
# the COMPRESSED size, more objects fit in the same budget. Matches the value
# compiler-release.yml sets for the same reason.
env:
  CCACHE_COMPRESS: '1'
  CCACHE_COMPRESSLEVEL: '9'

permissions:
  contents: read
concurrency:
  group: compiler-selfhost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Resolved once, in its own job, because a matrix job's outputs are
  # written by every leg and the surviving value is whichever finished
  # last. Every downstream job pins this exact version so the whole run
  # bootstraps from, and diffs against, one reference compiler - even if a
  # release is published while the run is in flight.
  seed:
    name: Resolve seed release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the seed salam version
        id: resolve
        env:
          SALAM_VERSION: ${{ inputs.seed_version }}
        run: |
          set -eu
          sh ./install.sh
          v=$("$HOME/.salam/bin/salam" version | head -1 | awk '{ print $2 }')
          [ -n "$v" ] || { echo "::error::could not read version from the installed salam"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "seed salam version: $v"

  bootstrap:
    name: Bootstrap on ${{ matrix.os }}
    needs: seed
    runs-on: ${{ matrix.os }}
    # macOS is not yet known-good for the self-hosted driver; keep it
    # visible without letting it block the branch. Drop `experimental`
    # from the matrix entry once it goes green consistently.
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, experimental: false }
          - { os: macos-latest, experimental: true }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the checked-out install.sh rather than curl-ing it from main,
      # so a PR that breaks the installer fails here instead of shipping.
      # It still downloads the same published release archive.
      - name: Install seed salam from a published release
        env:
          SALAM_VERSION: ${{ needs.seed.outputs.version }}
        run: |
          set -eu
          sh ./install.sh
          echo "$HOME/.salam/bin" >> "$GITHUB_PATH"

      # Released macOS binaries up to 0.2.7 were linked against Homebrew's
      # llvm@22 and inherited its optional Z3 solver as a *versioned* Cellar
      # dylib (/opt/homebrew/opt/z3/lib/libz3.4.16.dylib). Nothing installs
      # that on a stock runner, so the seed aborts under dyld before it can
      # compile anything and stage 1 dies with "Abort trap: 6". c/Makefile no
      # longer links -lz3 and compiler-release.yml now gates on otool, so this
      # whole step can be deleted once the resolved seed is a release built
      # after those changes - it is a no-op for a clean binary.
      - name: Repair the seed binary's Homebrew dylib deps (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -eu
          seed="$HOME/.salam/bin/salam"
          otool -L "$seed" || true
          for lib in $(otool -L "$seed" | awk 'NR > 1 { print $1 }' | grep '^/opt/homebrew/' || true); do
            if [ -f "$lib" ]; then continue; fi
            formula=$(printf '%s' "$lib" | sed -n 's#^/opt/homebrew/opt/\([^/]*\)/.*#\1#p')
            [ -n "$formula" ] || {
              echo "::warning::cannot map $lib to a Homebrew formula - leaving it"
              continue
            }
            echo "seed needs missing $lib - installing formula '$formula'"
            brew install "$formula" || true
            if [ -f "$lib" ]; then continue; fi
            # Homebrew has moved on to a different soname than the one the
            # seed was built against. Point the old name at whatever is
            # there: the seed links these libraries but never calls into
            # them, so it only has to satisfy dyld at load time.
            dir=$(dirname "$lib")
            stem=$(basename "$lib" | cut -d. -f1)
            alt=$(find "$dir" -maxdepth 1 -name "$stem.*.dylib" 2>/dev/null | head -1 || true)
            [ -n "$alt" ] || {
              echo "::error::no substitute available for $lib"
              exit 1
            }
            ln -sf "$alt" "$lib"
            echo "linked $lib -> $alt"
          done

      # Deliberately not `salam version | head -1`: in a pipeline the exit
      # status is head's, so a seed that cannot even start reports success and
      # the real failure only surfaces several steps later, inside bootstrap.sh.
      - name: Verify the seed compiler runs
        run: |
          set -eu
          "$HOME/.salam/bin/salam" version > seed-version.txt
          head -1 seed-version.txt
          rm -f seed-version.txt

      # Static in-process LLVM/LLD for the self-hosted compiler, so stage2
      # lowers IR itself instead of shelling out to a clang/lld the user
      # would have to install. Without libsalam_llvm.a, bootstrap.sh's
      # SALAM_HAVE_LLVM gate stays off and the compiler falls back to the C
      # backend - which is what the parity gate used to measure.
      #
      # Best-effort on purpose: the archive needs LLVM development libraries,
      # and this job's value (does the compiler bootstrap at all) must not
      # depend on apt. A failure here downgrades stage2 to the C backend and
      # says so; it never fails the job. Once this is green on a few runs,
      # tighten it by setting SALAM_WITH_LLVM=1 on the bootstrap step below,
      # which turns a missing archive into a hard error.
      # `make libsalam-llvm` merges every LLVM/LLD static archive into
      # libsalam_llvm.a with `ar -M` (see c/Makefile's LLVM_MERGE_LIBS), so
      # the result is SELF-CONTAINED: a cache hit needs neither llvm-*-dev
      # nor lld installed, only the handful of small system libs std/llvm
      # links alongside it. That is what makes caching worth it here - a hit
      # skips a ~1 GB apt install and the whole archive merge.
      #
      # No restore-keys, deliberately. Every other cache in this repository
      # uses them, but a prefix match here would restore an archive built
      # from *different* sources: it would link happily and miscompile. The
      # key is an exact content hash of everything that ends up in the
      # archive - the two translation units plus the headers they include -
      # so a miss is correct and a hit is safe.
      - name: Cache static LLVM/LLD archive
        id: llvm-archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libsalam_llvm.a
          key: >-
            salam-llvm-a-${{ matrix.os }}-llvm22-${{ hashFiles('c/Makefile',
            'c/src/llvm/**', 'c/src/core/*.h', 'c/src/semantic/*.h',
            'c/src/i18n/*.h', 'c/src/logger/*.h', 'c/src/diag/*.h') }}

      # Only useful on a miss, and only for the two objects that are actually
      # compiled (llvm_native.c + lld_link.cc); the bulk of the archive is
      # prebuilt LLVM. Cheap to keep, and it makes a source-only change to
      # those two files rebuild in seconds instead of minutes.
      - name: Cache ccache for the LLVM archive build
        if: steps.llvm-archive.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-selfhost-llvm-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-selfhost-llvm-${{ matrix.os }}-

      - name: Build static LLVM/LLD archive (best-effort)
        if: steps.llvm-archive.outputs.cache-hit != 'true'
        run: |
          set -u
          # Not `env: CCACHE_DIR: ~/.ccache`: Actions does not expand `~` in
          # env values, so ccache would create a literal "~" directory in the
          # workspace and the cache step above would never see a thing.
          CCACHE_DIR="$HOME/.ccache"
          export CCACHE_DIR
          mkdir -p "$CCACHE_DIR"
          case "${{ matrix.os }}" in
          ubuntu*)
            wget -qO llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 22 || true
            sudo apt-get update || true
            sudo apt-get install -y ccache llvm-22-dev liblld-22-dev \
              libpolly-22-dev libzstd-dev zlib1g-dev libtinfo-dev \
              libxml2-dev || true
            LLVM_CONFIG=llvm-config-22
            ;;
          macos*)
            brew install ccache llvm lld || true
            LLVM_CONFIG="$(brew --prefix llvm)/bin/llvm-config"
            ;;
          *)
            LLVM_CONFIG=llvm-config
            ;;
          esac
          if ! command -v "$LLVM_CONFIG" >/dev/null 2>&1; then
            echo "::warning::no $LLVM_CONFIG; stage2 uses the C backend"
            exit 0
          fi
          "$LLVM_CONFIG" --version
          C_COMPILER=gcc
          CXX_COMPILER=g++
          if command -v ccache >/dev/null 2>&1; then
            ccache --max-size=500M >/dev/null 2>&1 || true
            C_COMPILER="ccache gcc"
            CXX_COMPILER="ccache g++"
          fi
          if make -C c libsalam-llvm -j2 WITH_LLVM=1 WITH_LLD=1 \
            LLVM_LINK_STATIC=1 LLVM_CONFIG="$LLVM_CONFIG" \
            CC="$C_COMPILER" CXX="$CXX_COMPILER"; then
            # The merged archive carries LLVM's own DWARF, which nothing here
            # ever reads: it describes LLVM's internals, not the user program
            # being compiled. Dropping it is the single biggest lever on this
            # cache entry, and the repository's 10 GB cache budget is shared
            # with every other workflow.
            #
            # --strip-debug only, never --strip-all or --strip-unneeded: those
            # drop the symbol table a static archive is linked BY. ranlib
            # afterwards rebuilds the archive index that strip invalidates.
            before=$(wc -c <libsalam_llvm.a | tr -d ' ')
            strip --strip-debug libsalam_llvm.a 2>/dev/null ||
              strip -S libsalam_llvm.a 2>/dev/null || true
            ranlib libsalam_llvm.a 2>/dev/null || true
            after=$(wc -c <libsalam_llvm.a | tr -d ' ')
            echo "libsalam_llvm.a: $before -> $after bytes after --strip-debug"
            # A stripped archive that no longer links is worse than a big one.
            if ! ar t libsalam_llvm.a >/dev/null 2>&1; then
              echo "::error::libsalam_llvm.a is unreadable after strip"
              rm -f libsalam_llvm.a
              exit 0
            fi
            echo "libsalam_llvm.a built - stage2 will link LLVM/LLD in-process"
          else
            echo "::warning::libsalam-llvm failed; stage2 uses the C backend"
          fi
          command -v ccache >/dev/null 2>&1 && ccache --show-stats | head -5

      # Needed whether the archive was built or restored: std/llvm links
      # `link static "z"` / `"zstd"` next to libsalam_llvm.a, and the static
      # libz.a/libzstd.a come from these packages. A few hundred KB, versus
      # the ~1 GB of llvm-*-dev the cache hit avoided.
      # Unconditional on Linux rather than gated on the archive existing:
      # these are a few hundred KB and usually already present, so the check
      # would cost more than the install. Notably NOT gated with
      # `hashFiles('libsalam_llvm.a')`, which would read and hash a
      # multi-hundred-MB archive just to decide whether to run apt.
      - name: Install LLVM link-time system libs
        if: runner.os == 'Linux'
        run: |
          set -u
          sudo apt-get install -y zlib1g-dev libzstd-dev || true

      - name: Bootstrap stage1 -> stage2 -> stage3
        run: |
          set -eu
          sh compiler/tools/bash/bootstrap.sh "$HOME/.salam/bin/salam" build/selfhost

      # Records which backend stage2 actually got, so a silent downgrade to
      # the C backend is visible in the log rather than only showing up as a
      # parity number weeks later.
      - name: Report stage2 backend
        env:
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          set -eu
          sh=build/selfhost/salam-stage2
          printf 'func main:\n    println "backend-probe"\nend\n' > probe.salam
          if "$sh" build probe.salam --output=probe_exe --log-level=info 2>&1 |
            grep -qi "generating LLVM IR"; then
            echo "stage2 backend: LLVM (in-process)"
          else
            echo "stage2 backend: C (no static LLVM linked in)"
          fi
          rm -f probe.salam probe_exe

      - name: Smoke-test the self-hosted compiler
        env:
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          set -eu
          sh=build/selfhost/salam-stage2
          printf 'func main:\n    println "ok-selfhost"\nend\n' > smoke.salam
          "$sh" exec smoke.salam
          "$sh" build smoke.salam --output=smoke_exe --cc=cc
          ./smoke_exe
          rm -f smoke.salam smoke_exe

      - name: Upload stage2 compiler
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-selfhost-stage2-${{ matrix.os }}
          path: build/selfhost/salam-stage2
          if-no-files-found: error
          retention-days: 14

  parity:
    name: Parity - ${{ matrix.suite }}
    needs: [seed, bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One leg per suite so the two runs each suite needs (reference +
        # self-host) overlap with the other suites instead of queueing
        # behind them. Suites must match compiler/tools/selfhost-parity-budget.txt.
        suite: [exec, layout, llvm, errors, general]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to the exact version the bootstrap job resolved, so every
      # matrix leg diffs against the same reference even if a release is
      # published mid-run.
      - name: Install the same seed salam (reference compiler)
        env:
          SALAM_VERSION: ${{ needs.seed.outputs.version }}
        run: |
          set -eu
          sh ./install.sh
          "$HOME/.salam/bin/salam" version | head -1

      - name: Download stage2 self-hosted compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salam-selfhost-stage2-ubuntu-latest
          path: build/selfhost

      - name: Install test-suite dependencies
        run: |
          set -eu
          sudo apt-get update
          # tcc: the corpus' default --cc for `general`; libsqlite3/libmariadb/
          # libhiredis: `link dynamic` targets several tests need present to
          # link at all. Missing ones fail BOTH compilers, so they would not
          # break the delta - installing them just keeps the comparison wide.
          sudo apt-get install -y tcc libsqlite3-dev libhiredis-dev libmariadb-dev

      - name: Run parity gate for ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -eu
          chmod +x build/selfhost/salam-stage2
          sh compiler/tools/bash/selfhost-parity.sh \
            "$HOME/.salam/bin/salam" \
            build/selfhost/salam-stage2 \
            "$SUITE"
