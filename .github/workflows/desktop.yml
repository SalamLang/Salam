---
name: 🖥️ Desktop apps
on:
  pull_request:
    branches:
      - main
    paths:
      - std/desktop/**
      - std/webview/**
      - tests/en/desktop/**
      - agent/salam/**
      - .github/workflows/desktop.yml
  push:
    branches:
      - main
    paths:
      - std/desktop/**
      - std/webview/**
      - tests/en/desktop/**
      - agent/salam/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    name: Cross-build the smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]

      - name: Build the compiler
        run: sh tools/bash/build-selfhost.sh

      - name: Install the Windows toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 nsis

      - name: Build the smoke test for every target
        run: |
          set -eu
          mkdir -p stage
          for target in x86_64-w64-windows-gnu arm64-apple-macos x86_64-apple-macos; do
            ./salam build tests/en/desktop/smoke.salam --backend=native --target="$target" \
              --output="stage/smoke-$target" --log-level=error
          done
          for target in x86_64-w64-windows-gnu arm64-apple-macos x86_64-apple-macos; do
            ./salam bundle tests/en/desktop/sample --target="$target" --output="stage/sample-$target"
          done
          ./salam bundle tests/en/desktop/sample --target=x86_64-w64-windows-gnu --format=nsis --output=stage/sample-setup
          for target in x86_64-w64-windows-gnu arm64-apple-macos; do
            ./salam build compiler/main.salam --backend=native --target="$target" \
              --output="stage/salam-$target" --log-level=error
          done
          ./salam bundle agent/salam --target=x86_64-w64-windows-gnu --output=stage/agent-x86_64-w64-windows-gnu
          ./salam bundle agent/salam --target=arm64-apple-macos --output=stage/agent-arm64-apple-macos
          ./salam bundle agent/salam --target=x86_64-apple-macos --output=stage/agent-x86_64-apple-macos
          ls -laR stage

      - name: Upload the smoke tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-stage
          path: |
            stage/
            salam
            agent/salam/test_agent.py
          retention-days: 3

  linux:
    name: Linux x64
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the compiler
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-stage

      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Run the smoke test
        env:
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          chmod +x salam
          mkdir run
          cd run
          ../salam build ../tests/en/desktop/smoke.salam --output=smoke --log-level=error
          timeout 150 xvfb-run -a ./smoke

      - name: Salam Agent against a fake backend
        env:
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          ./salam build agent/salam/main.salam --output=run/agent --log-level=error
          SALAM_AGENT_BROWSER="$(command -v google-chrome)" timeout 400 xvfb-run -a python3 -I agent/salam/test_agent.py run/agent

      - name: Bundle the sample and run the installed package
        env:
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          ./salam bundle tests/en/desktop/sample --output=dist
          ls -la dist
          sudo dpkg -i dist/salam-sample_*.deb
          timeout 60 xvfb-run -a salam-sample --self-test

      - name: Install rpm and appimagetool
        env:
          TOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          TOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          sudo apt-get install -y rpm cpio
          mkdir -p "$RUNNER_TEMP/tool"
          cd "$RUNNER_TEMP/tool"
          curl -fsSL -o appimagetool "$TOOL_URL"
          echo "$TOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null
          sudo ln -s "$PWD/squashfs-root/AppRun" /usr/local/bin/appimagetool

      - name: Bundle an rpm and an AppImage and run them
        env:
          ARCH: x86_64
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          ./salam bundle tests/en/desktop/sample --format=rpm,appimage --output=dist-more
          ls -la dist-more
          mkdir rpm-root
          rpm2cpio dist-more/*.rpm | cpio -idm -D rpm-root
          timeout 60 xvfb-run -a rpm-root/usr/bin/salam-sample --self-test
          set -- dist-more/*.AppImage
          chmod +x "$1"
          timeout 60 xvfb-run -a "$1" --appimage-extract-and-run --self-test

  wine:
    name: Windows services under wine
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the compiler
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-stage

      - name: Install wine and mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wine64 xvfb
          WINE_BIN="$(command -v wine64 || command -v wine)"
          sudo ln -sf "$WINE_BIN" /usr/local/bin/wine

      - name: Run the services test
        env:
          SALAM_STD: ${{ github.workspace }}/std
          DESKTOP_WINE_ARCHES: x86_64
          WINEDEBUG: -all
        run: |
          chmod +x salam
          timeout 60 wineboot --init || true
          sh tools/bash/desktop-wine-check.sh ./salam

  windows:
    name: Windows x64
    needs: stage
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the smoke test
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-stage

      - name: Make sure the WebView2 runtime is there
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) {
            Get-ItemProperty $key | Select-Object pv, location | Format-List
          } else {
            Write-Output 'WebView2 is missing, installing it'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile setup.exe
            Start-Process -Wait -FilePath .\setup.exe -ArgumentList '/silent', '/install'
          }

      - name: Run the smoke test
        shell: bash
        run: |
          ls -la stage
          export SALAM_WEBVIEW_TRACE=smoke-trace.log
          trap 'cat smoke-trace.log 2>/dev/null || true' EXIT
          timeout 150 ./stage/smoke-x86_64-w64-windows-gnu.exe

      - name: Run the bundled sample
        shell: bash
        run: |
          cd stage/sample-x86_64-w64-windows-gnu
          unzip -q ./*.zip -d out
          timeout 60 out/*/salam-sample.exe --self-test

      - name: Install, run and remove the NSIS package
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          set -- stage/sample-setup/*-setup.exe
          chmod +x "$1"
          "$1" /S '/D=C:\salam-sample-test'
          timeout 60 /c/salam-sample-test/salam-sample.exe --self-test
          /c/salam-sample-test/uninstall.exe /S '_?=C:\salam-sample-test'
          test ! -e /c/salam-sample-test/salam-sample.exe

      - name: Bundle on Windows with a Windows compiler
        shell: bash
        env:
          SALAM_STD: ${{ github.workspace }}\std
        run: |
          chmod +x stage/salam-x86_64-w64-windows-gnu.exe
          ./stage/salam-x86_64-w64-windows-gnu.exe bundle tests/en/desktop/sample --output=native-dist
          mkdir native-out
          unzip -q native-dist/*.zip -d native-out
          timeout 60 native-out/*/salam-sample.exe --self-test

      - name: Salam Agent against a fake backend
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cd stage/agent-x86_64-w64-windows-gnu
          unzip -q ./*.zip -d out
          cd ../..
          set -- stage/agent-x86_64-w64-windows-gnu/out/*/*.exe
          timeout 400 python -I agent/salam/test_agent.py "$1"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: stage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: arm64, target: arm64-apple-macos }
          - { os: macos-15-intel, arch: x64, target: x86_64-apple-macos }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the smoke test
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-stage

      - name: Run the smoke test
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x "stage/smoke-$TARGET"
          perl -e 'alarm 150; exec @ARGV' "./stage/smoke-$TARGET"

      - name: Run the bundled sample
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd "stage/sample-$TARGET"
          tar xzf ./*.tar.gz
          perl -e 'alarm 60; exec @ARGV' "./Salam Sample.app/Contents/MacOS/salam-sample" --self-test

      - name: Bundle a dmg with a macOS compiler and run it
        if: matrix.arch == 'arm64'
        env:
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          chmod +x stage/salam-arm64-apple-macos
          ./stage/salam-arm64-apple-macos bundle tests/en/desktop/sample --format=app,tar,dmg --output=native-dist
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/sample" native-dist/*.dmg
          perl -e 'alarm 60; exec @ARGV' "$RUNNER_TEMP/sample/Salam Sample.app/Contents/MacOS/salam-sample" --self-test
          hdiutil detach "$RUNNER_TEMP/sample"

      - name: Salam Agent against a fake backend
        if: ${{ !cancelled() }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd "stage/agent-$TARGET"
          tar xzf ./*.tar.gz
          cd ../..
          set -- "stage/agent-$TARGET"/*.app/Contents/MacOS/*
          chmod +x "$1"
          perl -e 'alarm 400; exec @ARGV' python3 -I agent/salam/test_agent.py "$1"
