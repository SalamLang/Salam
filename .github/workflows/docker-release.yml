---
name: 🐳 Docker - Build & Publish Salam Runtime Image
# checkov:skip=CKV_GHA_7:inputs are only ever read via env: indirection, never interpolated into a run: script

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['🚀 Compiler - Build & Release Binaries']
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Salam version to publish (e.g. 0.2.8); leave blank to resolve the latest GitHub release'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build multi-arch image and push to Docker Hub
    runs-on: ubuntu-latest
    if: |
      github.repository == 'SalamLang/Salam' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_commit.message, 'release:')))
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Resolve Salam version to publish
        id: resolve
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -eu
          if [ -n "${VERSION_INPUT:-}" ]; then
            VERSION="$VERSION_INPUT"
          else
            TAG=$(curl -fsSL -o /dev/null -w '%{url_effective}' \
                    "https://github.com/SalamLang/Salam/releases/latest")
            VERSION="${TAG##*/v}"
          fi
          echo "Publishing Salam ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for cross-arch emulated builds)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags/labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: basemax/salam
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.resolve.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
          push: true
          build-args: |
            SALAM_VERSION=${{ steps.resolve.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
