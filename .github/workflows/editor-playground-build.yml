---
name: 🕹️ Editor - Build Playground on PRs
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: editor-playground-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/_changes.yml # zizmor: ignore[self-repository]
    with:
      paths: |
        compiler/*
        std/*
        tools/bash/*
        tools/js/*
        editor/*
        tests/*/editor-selected/*
        .github/actions/setup-*
        .github/workflows/_changes.yml
        .github/workflows/editor-playground-build.yml
  build-deploy:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]

      - name: Set up pinned tcc
        uses: ./.github/actions/setup-tcc # zizmor: ignore[self-repository]

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-v1

      - name: Install Emscripten SDK
        run: |
          set -e
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          if [ ! -d "upstream/emscripten" ]; then
            ./emsdk install latest
            ./emsdk activate latest
          else
            echo "Emscripten SDK restored from cache - skipping install"
          fi
          . ./emsdk_env.sh
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$EMSDK/.emscripten" >> "$GITHUB_ENV"

      - name: Verify editor source files are present
        run: |
          set -eu
          missing=0
          for f in editor/page.salam editor/app.salam editor/anim.salam editor/anim_frames.salam editor/history.salam editor/page_parts.salam editor/worker.js editor/build.sh editor/assets/logo.svg; do
            if [ ! -f "$f" ]; then
              echo "::error::missing editor source file: $f (is it committed? editor/* is gitignored except sources)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Build self-hosted compiler + WebAssembly playground bundle
        run: |
          set -e
          emcc --version
          sh tools/bash/update-playground.sh --selfhost

      - name: Test the editor page controls
        run: |
          set -eu
          dir="$(mktemp -d)"
          (cd "$dir" && npm install --no-save --no-audit --no-fund jsdom@27.0.0 playwright-core@1.49.1)
          echo "NODE_TOOLS=$dir/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$dir/node_modules" node tools/js/test-editor-page.js editor/index.html

      - name: Run programs and pages through the WebAssembly compiler
        run: node tools/js/test-editor-wasm.js editor

      - name: Click, type, scroll and run in the editor in Chrome
        run: |
          set -eu
          mkdir -p editor-shots
          NODE_PATH="$NODE_TOOLS" node tools/js/test-editor-browser.js editor editor-shots

      - name: Upload the editor screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-shots
          path: editor-shots
          retention-days: 3
          if-no-files-found: ignore

      - name: Verify generated editor assets
        run: |
          set -eu
          missing=0
          for f in editor/salam-wa-*.js editor/salam-wa-*.wasm editor/salam-wa-*.data \
                   editor/examples_data.salam editor/index.html; do
            if [ ! -f "$f" ]; then
              echo "::error::missing generated asset: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "==> Editor directory to be published:"
          ls -l editor/
