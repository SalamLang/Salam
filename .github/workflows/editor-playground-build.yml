---
name: 🕹️ Editor - Build Playground on PRs
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: editor-playground-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-deploy:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies (tcc)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y tcc

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-v1

      - name: Install Emscripten SDK
        run: |
          set -e
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          if [ ! -d "upstream/emscripten" ]; then
            ./emsdk install latest
            ./emsdk activate latest
          else
            echo "Emscripten SDK restored from cache - skipping install"
          fi
          . ./emsdk_env.sh
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$EMSDK/.emscripten" >> "$GITHUB_ENV"

      - name: Verify editor source files are present
        run: |
          set -eu
          missing=0
          for f in editor/src/page.salam editor/src/app.salam editor/build.sh editor/assets/logo.svg; do
            if [ ! -f "$f" ]; then
              echo "::error::missing editor source file: $f (is it committed? editor/* is gitignored except sources)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Build native compiler + WebAssembly playground bundle
        run: |
          set -e
          emcc --version
          cd compiler
          sh tools/bash/update-playground.sh

      - name: Verify generated editor assets
        run: |
          set -eu
          missing=0
          for f in editor/salam-wa.js editor/salam-wa.wasm editor/salam-wa.data \
                   editor/src/examples_data.salam editor/index.html; do
            if [ ! -f "$f" ]; then
              echo "::error::missing generated asset: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "==> Editor directory to be published:"
          ls -l editor/

      - name: Deploy preview to Vercel
        id: vercel_deploy
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID are not configured; skipping preview deploy."
            exit 0
          fi
          # editor/ is a plain static bundle (HTML/JS/Wasm), so it is deployed
          # as-is: no framework build runs inside Vercel's container.
          url=$(npx --yes vercel@latest deploy ./editor --token="$VERCEL_TOKEN" --yes)
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Post or update sticky PR comment with preview URL
        if: steps.vercel_deploy.outputs.preview_url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.vercel_deploy.outputs.preview_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- salam-editor-preview -->';
            const url = process.env.PREVIEW_URL;
            const headSha = process.env.HEAD_SHA;
            const body = `${marker}\n🕹️ **Editor playground preview:** ${url}\n\nBuilt from ${headSha.substring(0, 7)}.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
