---
name: 🕹️ Editor - Build & Deploy Playground (WebAssembly)
on:
  push:
    branches:
      - main
    paths:
      - 'compiler/**'
      - 'tools/bash/**'
      - 'std/**'
      - 'editor/**'
      - 'tests/*/editor-selected/**'
      - '.github/workflows/editor-playground-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-playground-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-deploy:
    name: Build and Deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      built: ${{ steps.verify.outputs.built }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam

      - name: Set up pinned tcc
        uses: ./.github/actions/setup-tcc

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-v1

      - name: Install Emscripten SDK
        run: |
          set -e
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          if [ ! -d "upstream/emscripten" ]; then
            ./emsdk install latest
            ./emsdk activate latest
          else
            echo "Emscripten SDK restored from cache - skipping install"
          fi
          . ./emsdk_env.sh
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$EMSDK/.emscripten" >> "$GITHUB_ENV"

      - name: Verify editor source files are present
        run: |
          set -eu
          missing=0
          for f in editor/page.salam editor/app.salam editor/anim.salam editor/anim_frames.salam editor/history.salam editor/build.sh editor/assets/logo.svg; do
            if [ ! -f "$f" ]; then
              echo "::error::missing editor source file: $f (is it committed? editor/* is gitignored except sources)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Build self-hosted compiler + WebAssembly playground bundle
        run: |
          set -e
          emcc --version
          sh tools/bash/update-playground.sh --selfhost

      - name: Verify generated editor assets
        id: verify
        run: |
          set -eu
          missing=0
          for f in editor/salam-wa.js editor/salam-wa.wasm editor/salam-wa.data \
                   editor/examples_data.salam editor/index.html; do
            if [ ! -f "$f" ]; then
              echo "::error::missing generated asset: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "==> Editor directory to be published:"
          ls -l editor/
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Keep the bundle for the server deploy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-site
          path: editor
          retention-days: 3

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload playground artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: editor

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-server:
    name: Deploy to production server
    needs: build-deploy
    if: always() && needs.build-deploy.outputs.built == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-editor-server
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Download the editor bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: editor-site
          path: editor-site

      - name: Upload to the server
        uses: ./.github/actions/deploy-ssh
        with:
          source: editor-site
          target: ${{ secrets.SSH_PATH_EDITOR }}
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USERNAME }}
          private-key: ${{ secrets.SSH_PRIVATEKEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          allowed-root: /hosts/
          exclude: '*.salam build.sh package.json README.md'
