---
name: 🧩 Extension - VS Code (build & publish)

# Nothing built this extension until now, which is how `src/extension.salam`
# came to stop compiling without anyone noticing. So the build half runs on
# every change to it, and the publish half is strictly additive on top.
#
# Publishing needs a Marketplace personal access token in the VSCE_PAT secret.
# Until that exists the job still runs and still produces the .vsix; it just
# says so and stops instead of failing, so a missing token never turns into a
# red build.
# checkov:skip=CKV_GHA_7:inputs are only ever read via env: indirection, never interpolated into a run: script
on:
  push:
    branches: [main]
    paths:
      - 'extensions/vscode/**'
      - '.github/workflows/extension-vscode.yml'
  pull_request:
    paths:
      - 'extensions/vscode/**'
      - '.github/workflows/extension-vscode.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the Marketplace (needs VSCE_PAT; ignored without it)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: extension-vscode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & package the .vsix
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.pack.outputs.vsix }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The compiler is written in Salam, so building it needs one. Used to
      # come from `make -C c`; that is gone, so a released binary seeds it.
      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam

      # Built from this checkout rather than installed from the last release:
      # the extension is written against the compiler in this tree, and a
      # published build lags it. This is the cheap C build (a few seconds),
      # not the full LLVM one the release workflow does.
      - name: Build the salam compiler from source
        run: |
          set -eu
          sh tools/bash/build-selfhost.sh
          ./salam version
          pwd >> "$GITHUB_PATH"

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # From the repo root: extensions/vscode is a workspace member and its
      # devDependencies resolve through the root catalog, which only bun reads.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Compile the extension
        working-directory: extensions/vscode
        run: |
          set -eu
          salam js src/extension.salam --output=out/extension.js
          [ -s out/extension.js ] || { echo "::error::out/extension.js is empty or missing"; exit 1; }
          ls -l out/extension.js

      - name: Package
        id: pack
        working-directory: extensions/vscode
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          bunx vsce package --no-dependencies
          vsix=""
          for f in ./*.vsix; do
            if [ -f "$f" ]; then
              vsix=$f
              break
            fi
          done
          [ -n "$vsix" ] || { echo "::error::vsce produced no .vsix"; exit 1; }
          # Cheap proof the archive is a real, readable zip holding the code,
          # rather than a zero-byte file that only looks like success.
          unzip -l "$vsix" | grep -q 'extension/out/extension.js' \
            || { echo "::error::$vsix has no extension/out/extension.js"; exit 1; }
          echo "vsix=$(basename "$vsix")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l "$vsix"

      - name: Upload the .vsix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension-vsix
          path: extensions/vscode/*.vsix
          if-no-files-found: error

  publish:
    name: Publish to the VS Code Marketplace
    needs: build
    # Never from a pull request: a fork's PR must not be able to reach the
    # token, and a branch build has no business shipping to the Marketplace.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the .vsix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension-vsix
          path: ./dist

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Two independent reasons to stop, and neither one is a failure: no token
      # configured yet, or this version is already on the Marketplace. The
      # second matters because `vsce publish` errors on a duplicate version,
      # and every push to main would otherwise go red between releases.
      - name: Decide whether to publish
        id: gate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice::VSCE_PAT is not configured; built the .vsix and stopped before publishing"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          id=$(node -p "const p=require('./extensions/vscode/package.json');p.publisher+'.'+p.name")
          echo "extension: $id, local version: $VERSION"
          # A lookup failure must not be read as "not published yet": that
          # would send a duplicate publish and fail the job on a network
          # blip. Only a version we positively read and that differs proceeds.
          live=$(bunx vsce show "$id" --json 2>/dev/null \
                 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                     try{const j=JSON.parse(s);process.stdout.write(String(j.versions?.[0]?.version||""))}catch{process.stdout.write("")}})' \
                 || true)
          if [ -z "$live" ]; then
            echo "::warning::could not read the published version for $id; skipping to avoid a duplicate publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "marketplace version: $live"
          if [ "$live" = "$VERSION" ]; then
            echo "::notice::$VERSION is already published; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.gate.outputs.publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ needs.build.outputs.vsix }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          bunx vsce publish --no-dependencies --packagePath "./dist/$VSIX"
          echo "::notice::published $VERSION to the Marketplace"
