---
name: 🧩 Extension - VS Code (build & publish)

# checkov:skip=CKV_GHA_7:inputs are only ever read via env: indirection, never interpolated into a run: script
on:
  push:
    branches: [main]
    paths:
      - 'extensions/vscode/**'
      - '.github/workflows/extension-vscode.yml'
  pull_request:
    paths:
      - 'extensions/vscode/**'
      - '.github/workflows/extension-vscode.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the Marketplace (needs VSCE_PAT; ignored without it)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: extension-vscode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & package the .vsix
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.pack.outputs.vsix }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a seed compiler
        id: seed
        uses: ./.github/actions/setup-salam
        with:
          add-to-path: 'false'

      - name: Build the salam compiler from source
        env:
          SEED_PATH: ${{ steps.seed.outputs.salam }}
        run: |
          set -eu
          sh tools/bash/build-selfhost.sh --seed="$SEED_PATH"
          ./salam version
          pwd >> "$GITHUB_PATH"

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Compile the extension
        working-directory: extensions/vscode
        env:
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          set -eu
          mkdir -p out
          salam js src/extension.salam --output=out/extension.js
          [ -s out/extension.js ] || { echo "::error::out/extension.js is empty or missing"; exit 1; }
          ls -l out/extension.js

      - name: Package
        id: pack
        working-directory: extensions/vscode
        env:
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          bunx vsce package --no-dependencies
          vsix=""
          for f in ./*.vsix; do
            if [ -f "$f" ]; then
              vsix=$f
              break
            fi
          done
          [ -n "$vsix" ] || { echo "::error::vsce produced no .vsix"; exit 1; }
          unzip -l "$vsix" | grep -q 'extension/out/extension.js' \
            || { echo "::error::$vsix has no extension/out/extension.js"; exit 1; }
          echo "vsix=$(basename "$vsix")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l "$vsix"

      - name: Upload the .vsix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension-vsix
          path: extensions/vscode/*.vsix
          if-no-files-found: error

  publish:
    name: Publish to the VS Code Marketplace
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the .vsix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension-vsix
          path: ./dist

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Decide whether to publish
        id: gate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice::VSCE_PAT is not configured; built the .vsix and stopped before publishing"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          id=$(node -p "const p=require('./extensions/vscode/package.json');p.publisher+'.'+p.name")
          echo "extension: $id, local version: $VERSION"
          live=$(bunx vsce show "$id" --json 2>/dev/null \
                 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                     try{const j=JSON.parse(s);process.stdout.write(String(j.versions?.[0]?.version||""))}catch{process.stdout.write("")}})' \
                 || true)
          if [ -z "$live" ]; then
            echo "::warning::could not read the published version for $id; skipping to avoid a duplicate publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "marketplace version: $live"
          if [ "$live" = "$VERSION" ]; then
            echo "::notice::$VERSION is already published; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.gate.outputs.publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ needs.build.outputs.vsix }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          bunx vsce publish --no-dependencies --packagePath "./dist/$VSIX"
          echo "::notice::published $VERSION to the Marketplace"
