---
name: 🧪 Memory Leaks - ASan/LSan over the full test suite
on:
  push:
    branches:
      - main
    paths:
      - 'c/**'
      - 'compiler/**'
      - 'std/**'
      - 'tests/**'
      - '.github/workflows/lint-memory-leaks.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'c/**'
      - 'compiler/**'
      - 'std/**'
      - 'tests/**'
      - '.github/workflows/lint-memory-leaks.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: memory-leaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-hosted:
    name: Self-hosted compiler - leak ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y build-essential
          gcc --version | head -1

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam

      - name: Build the reference compiler
        run: sh tools/bash/build-selfhost.sh

      - name: Build the self-hosted compiler with AddressSanitizer
        run: |
          set -eu
          SALAM_STD="$GITHUB_WORKSPACE/std" ./salam build compiler/main.salam \
            --output=salam-selfhost-asan --cc=gcc --asan --log-level=error
          ./salam-selfhost-asan version | head -1

      - name: TEMP diagnostic - symbolized leak report for inspect/exec/build
        run: |
          set -eu
          SALAM_STD="$GITHUB_WORKSPACE/std" ./salam build compiler/main.salam \
            --output=salam-selfhost-asan-g --cc=gcc --asan -g --log-level=error
          W=$(mktemp -d)
          cp tests/en/basics/hello.salam "$W/hello.salam"
          cd "$W"
          for case in "inspect hello.salam --emit-ast" "exec hello.salam" "build hello.salam --output=hello.out --cc=gcc"; do
            echo "::group::leak report: $case"
            ASAN_OPTIONS="detect_leaks=1:exitcode=0:max_leaks=100000:fast_unwind_on_malloc=0" \
              "$GITHUB_WORKSPACE/salam-selfhost-asan-g" $case > /dev/null 2> report.txt || true
            grep -A6 '#0 ' report.txt | sort | uniq -c | sort -rn | head -60
            echo "::endgroup::"
          done

      - name: Check the self-hosted leak budget
        run: |
          set -eu
          sh compiler/tools/bash/leakcheck-selfhost.sh ./salam-selfhost-asan

  programs:
    name: Compiled programs - leak ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y build-essential
          gcc --version | head -1

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam

      - name: Build the reference compiler
        run: sh tools/bash/build-selfhost.sh

      - name: Check the program leak budget
        run: sh tools/bash/leakcheck-programs.sh ./salam
