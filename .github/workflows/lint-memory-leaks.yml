---
name: 🧪 Memory Leaks - ASan/LSan over the full test suite
# Runs the entire test corpus through AddressSanitizer/LeakSanitizer builds of
# both compilers and fails on a leak.
#
# Two compilers, two different bars, on purpose:
#
#   c-compiler   The reference compiler (c/*.c) allocates nearly everything
#                from an arena it frees on the way out, so LeakSanitizer sees
#                nothing today. That is a property worth keeping, so this job
#                is a HARD gate at exactly zero leaking invocations.
#
#   self-hosted  compiler/*.salam is written in Salam, which is manually
#                memory-managed and has no arena behind its string
#                temporaries: every discarded `a + b` stays live until exit.
#                Zero is not reachable without changing how the compiler
#                allocates, so this job is a RATCHET against
#                compiler/tools/selfhost-leak-budget.txt - it fails on a
#                regression and warns when a number can be lowered.
#
# Why the corpus and not a handful of smoke tests: a leak on the error path,
# in the layout schema loader, or in one language's diagnostics is invisible
# to anything narrower. run-tests.sh already drives ~1200 real compiles;
# turning that into a leak gate costs one ASan build and no new test files.
on:
  push:
    branches:
      - main
    paths:
      - 'c/**'
      - 'compiler/**'
      - 'std/**'
      - 'tests/**'
      - '.github/workflows/lint-memory-leaks.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'c/**'
      - 'compiler/**'
      - 'std/**'
      - 'tests/**'
      - '.github/workflows/lint-memory-leaks.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: memory-leaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-hosted:
    name: Self-hosted compiler - leak ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y build-essential
          gcc --version | head -1

      # The seed is a published release, which is fine for what this measures:
      # the artifact under test is salam-selfhost-asan, built from the
      # compiler/*.salam in this PR. The seed only lowers those sources to C,
      # it is not the thing being leak-checked. No LLVM flags - the seed only
      # has to reach the C backend, and linking LLVM in would cost minutes.
      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam

      - name: Build the reference compiler
        run: sh tools/bash/build-selfhost.sh

      - name: Build the self-hosted compiler with AddressSanitizer
        run: |
          set -eu
          SALAM_STD="$GITHUB_WORKSPACE/std" ./salam build compiler/main.salam \
            --output=salam-selfhost-asan --cc=gcc --asan --log-level=error
          ./salam-selfhost-asan version | head -1

      - name: Check the self-hosted leak budget
        run: |
          set -eu
          sh compiler/tools/bash/leakcheck-selfhost.sh ./salam-selfhost-asan
