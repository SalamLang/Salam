---
name: 🔎 Lint - Prek (audit)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prek-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek-audit:
    name: Prek Audit Hooks - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04 }
          - { os: ubuntu-26.04 }
          - { os: macos-26 }
          - { os: windows-2025-vs2026 }
    steps:
      - name: 'Checkout ${{ github.ref }} ( ${{ github.sha }} )'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run prek-action
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
      - name: Run manual prek hooks
        run: prek run --all-files --config prek-audit.toml
