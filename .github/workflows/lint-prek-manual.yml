---
# https://github.com/j178/prek
name: 🛠️ Lint - Prek (manual run)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prek-manual:
    name: Prek Manual Hooks - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04 }
          # - { os: ubuntu-22.04 }
          # - { os: ubuntu-slim }
          - { os: macos-26 }
          # - { os: macos-15 }
          # - { os: macos-14 }
          - { os: windows-2025-vs2026 }
          # - { os: windows-2025 }
          # - { os: windows-2022 }
          # - { os: windows-11-arm } # `shfmt-binary` is not supported on your platform
    steps:
      - name: 'Checkout ${{ github.ref }} ( ${{ github.sha }} )'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run prek-action
        uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          install-only: true
      - name: Run manual prek hooks
        run: prek run --all-files --hook-stage manual
