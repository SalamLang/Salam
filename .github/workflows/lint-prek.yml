---
# https://github.com/j178/prek
name: 🧹 Lint - Prek (standard hooks)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prek:
    name: Prek Standard Hooks - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04 }
          # - { os: ubuntu-22.04 }
          # - { os: ubuntu-slim }
          - { os: macos-26 }
          # - { os: macos-15 }
          # - { os: macos-14 }
          - { os: windows-2025-vs2026 }
          # - { os: windows-2025 }
          # - { os: windows-2022 }
          # - { os: windows-11-arm }
    steps:
      - name: 'Checkout ${{ github.ref }} ( ${{ github.sha }} )'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          extra-args: --all-files
        env:
          # biome's win32-arm64 binary crashes (0xC0000005) on this runner, upstream issue;
          # skip just this hook here so the rest of the standard hooks still run on windows-11-arm
          PREK_SKIP: ${{ matrix.os == 'windows-11-arm' && 'biome-check' || '' }}
