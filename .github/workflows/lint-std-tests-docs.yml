---
name: 📚 Lint - Std Tests and Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - 'std/**'
      - 'tests/**'
      - 'website/content/*/std/**'
      - 'tools/salam/check-std-coverage-docs.salam'
      - 'tools/salam/std-coverage-docs-baseline.txt'
      - 'tools/salam/check-naming.salam'
      - 'tools/salam/std-naming-baseline.txt'
      - '.github/workflows/lint-std-tests-docs.yml'
  push:
    branches:
      - main
    paths:
      - 'std/**'
      - 'tests/**'
      - 'website/content/*/std/**'
      - 'tools/salam/check-std-coverage-docs.salam'
      - 'tools/salam/std-coverage-docs-baseline.txt'
      - 'tools/salam/check-naming.salam'
      - 'tools/salam/std-naming-baseline.txt'

permissions:
  contents: read

concurrency:
  group: std-tests-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  std-tests-docs:
    name: Std symbols have Persian names, tests and docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the released Salam compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]
        with:
          version: latest

      - name: Every std symbol needs tests and docs in both languages
        run: salam run tools/salam/check-std-coverage-docs.salam

      - name: Public naming report (informational)
        continue-on-error: true
        run: salam run tools/salam/check-naming.salam
