---
name: 🔢 Lint - Version Sync

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version-sync:
    name: All version sites match VERSION
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the released Salam compiler
        uses: ./.github/actions/setup-salam
        with:
          version: latest

      - name: Every version site must match VERSION
        run: salam run tools/salam/update-version.salam check
