---
# Every place the release version is written has to agree with the VERSION
# file. The check and the tool that fixes it are the same program, reading one
# table, so a site cannot be bumped by one and forgotten by the other:
#
#   salam run tools/salam/update-version.salam check   what this job runs
#   salam run tools/salam/update-version.salam sync    what fixes a failure
#   salam run tools/salam/update-version.salam 0.3.2     bump the release
#
# Uses a released salam rather than building one: this only reads and compares
# text, so it has no reason to wait on a compiler build, and pinning it to the
# published compiler keeps the job honest about running what users have.
name: 🔢 Lint - Version Sync

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version-sync:
    name: All version sites match VERSION
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the released Salam compiler
        uses: ./.github/actions/setup-salam
        with:
          version: latest

      - name: Every version site must match VERSION
        run: salam run tools/salam/update-version.salam check
