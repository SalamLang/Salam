---
name: LLVM self-host gate

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'std/llvm/native/**'
      - 'compiler/semantic/**'
      - 'compiler/llvmgen/**'
      - 'compiler/semantic/**'
      - 'std/**'
      - '.github/workflows/llvm-selfhost-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llvm-selfhost-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM and lld
        run: |
          set -eu
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          wget -4 -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev liblld-22-dev libpolly-22-dev \
            libzstd-dev zlib1g-dev libtinfo-dev libxml2-dev

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam

      - name: Build libsalam_llvm.a
        run: |
          sh std/llvm/native/build.sh --llvm-config llvm-config-22 \
            --out "$GITHUB_WORKSPACE"

      - name: Build the compiler with LLVM in-process
        run: sh tools/bash/build-selfhost.sh --llvm="$GITHUB_WORKSPACE"

      - name: Backend must compile the whole corpus
        run: |
          fail=0
          for f in $(find tests/en -name '*.salam' | sort); do
            if ./salam llvm "$f" --output=/tmp/gate.ll 2>&1 | grep -q 'CODEGEN.*ERROR'; then
              echo "codegen FAIL: $f"
              fail=$((fail + 1))
            fi
          done
          echo "codegen failures: $fail"
          test "$fail" -eq 0

      - name: Build the self-hosted compiler through the LLVM backend
        run: |
          ./salam build compiler/main.salam --backend=llvm --output=/tmp/selfhost-llvm
          test -s /tmp/selfhost-llvm

      - name: Produced compiler must actually run
        continue-on-error: true
        run: |
          timeout 120 /tmp/selfhost-llvm version | tee /tmp/gate-version.txt
          grep -q '^salam ' /tmp/gate-version.txt

      - name: Produced compiler must compile and run a program
        continue-on-error: true
        run: |
          timeout 300 /tmp/selfhost-llvm build tests/en/llvm/ll_fib.salam --output=/tmp/gate-fib
          diff <(/tmp/gate-fib) tests/en/llvm/ll_fib.out
