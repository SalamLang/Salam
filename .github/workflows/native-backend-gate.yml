---
name: Native backend gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-backend-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml # zizmor: ignore[self-repository]
    with:
      paths: |
        compiler/*
        std/*
        tools/bash/backend-sweep.sh
        tools/bash/run-one-build.sh
        tools/bash/native-*.sh
        .github/workflows/native-backend-gate.yml
        .github/actions/setup-*
        .github/workflows/_changes.yml

  linux:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    env:
      SALAM_STD: ${{ github.workspace }}/std
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]

      - name: Build the compiler
        run: sh tools/bash/build-selfhost.sh

      - name: Encoder output matches GNU as
        run: |
          find tests/en/llvm -name '*.salam' ! -name '_*' -print0 | sort -z |
            xargs -0 sh tools/bash/native-encoder-check.sh ./salam

      - name: Compiler built by the native backend reproduces itself
        run: sh tools/bash/native-selfhost-check.sh ./salam

      - name: Test programs agree with the C backend
        run: |
          sh tools/bash/backend-sweep.sh ./salam native \
            general features basics types switch match data editor-selected stdlib

  windows-cross:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    env:
      SALAM_STD: ${{ github.workspace }}/std
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mingw-w64 and wine
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wine64
          WINE_BIN="$(command -v wine64 || command -v wine || true)"
          if [ -z "$WINE_BIN" ]; then
            echo "::error::no wine or wine64 binary found after installing wine64"
            exit 1
          fi
          sudo ln -sf "$WINE_BIN" /usr/local/bin/wine

      - name: Initialize the wine prefix
        run: |
          echo "WINEDEBUG=-all" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=/tmp/xdg-runtime" >> "$GITHUB_ENV"
          mkdir -p /tmp/xdg-runtime && chmod 0700 /tmp/xdg-runtime
          export WINEDEBUG=-all XDG_RUNTIME_DIR=/tmp/xdg-runtime
          timeout 60 wineboot --init >/tmp/wineboot-init.log 2>&1
          timeout 30 wineserver -w || wineserver -k || true
          if [ ! -f ~/.wine/system.reg ]; then
            echo "::error::wine prefix init failed:"
            cat /tmp/wineboot-init.log
            exit 1
          fi

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]

      - name: Build the compiler
        run: sh tools/bash/build-selfhost.sh

      - name: Windows programs built by the native backend run correctly
        run: |
          find tests/en/llvm -name '*.salam' ! -name '_*' -print0 | sort -z |
            xargs -0 sh tools/bash/native-windows-check.sh ./salam

  linux-cross:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    env:
      SALAM_STD: ${{ github.workspace }}/std
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: i686
            triple: i686-linux-musl
            runner: env
          - arch: arm
            triple: arm-linux-musleabihf
            runner: qemu-arm-static
          - arch: aarch64
            triple: aarch64-linux-musl
            runner: qemu-aarch64-static
          - arch: riscv64
            triple: riscv64-linux-musl
            runner: qemu-riscv64-static
    name: linux-cross (${{ matrix.arch }})
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install qemu user emulation
        if: matrix.runner != 'env'
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Install debuggers
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y gdb gdb-multiarch

      - name: Fetch the musl sysroot
        env:
          ARCH: ${{ matrix.arch }}
        run: sh tools/bash/fetch-musl-sysroots.sh --out /tmp/muslcc --arches "$ARCH"

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]

      - name: Build the compiler
        run: sh tools/bash/build-selfhost.sh

      - name: Programs built by the native backend run under emulation
        env:
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
          RUNNER: ${{ matrix.runner }}
        run: |
          SALAM_MUSL_SYSROOT=/tmp/muslcc/sr-$ARCH sh tools/bash/native-cross-check.sh ./salam "$TRIPLE" "$RUNNER" \
            basics features types data games match switch llvm general stdlib

      - name: gdb reads the debug info
        env:
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
          RUNNER: ${{ matrix.runner }}
        run: SALAM_MUSL_SYSROOT=/tmp/muslcc/sr-$ARCH sh tools/bash/native-gdb-check.sh ./salam "$TRIPLE" "$RUNNER"
  windows-arm64-build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    env:
      SALAM_STD: ${{ github.workspace }}/std
      LLVM_MINGW: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch llvm-mingw
        run: |
          curl -fsSL --retry 3 -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/${LLVM_MINGW}.tar.xz"
          echo "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335  /tmp/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf /tmp/llvm-mingw.tar.xz -C /tmp
          echo "/tmp/${LLVM_MINGW}/bin" >> "$GITHUB_PATH"
      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]
      - name: Build the compiler
        run: sh tools/bash/build-selfhost.sh
      - name: Build the test programs for Windows on Arm with the built-in linker
        run: |
          find tests/en/llvm -name '*.salam' ! -name '_*' -print0 | sort -z |
            SALAM_LINKER=builtin NATIVE_WIN_TRIPLE=aarch64-w64-windows-gnu NATIVE_WIN_STAGE=winarm-stage/builtin \
              xargs -0 sh tools/bash/native-windows-check.sh ./salam
      - name: Build them again linked by lld
        run: |
          find tests/en/llvm -name '*.salam' ! -name '_*' -print0 | sort -z |
            SALAM_LINKER=system NATIVE_WIN_TRIPLE=aarch64-w64-windows-gnu NATIVE_WIN_STAGE=winarm-stage/lld \
              xargs -0 sh tools/bash/native-windows-check.sh ./salam
      - name: Build the compiler itself for Windows on Arm
        run: |
          mkdir -p winarm-stage/selfhost
          ./salam build compiler/main.salam --backend=native --release --target=aarch64-w64-windows-gnu \
            --output=winarm-stage/selfhost/salam.exe --log-level=error
          ./salam llvm compiler/main.salam --target=x86_64-linux-gnu -o winarm-stage/selfhost/ref.ll --log-level=error
          tar -cf winarm-stage/selfhost/src.tar compiler std
      - name: Upload the programs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winarm-stage
          path: winarm-stage
          retention-days: 3
  windows-arm64-run:
    needs: windows-arm64-build
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the programs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winarm-stage
          path: winarm-stage
      - name: Programs linked by the built-in linker run on Windows on Arm
        shell: bash
        run: sh tools/bash/native-stage-run.sh winarm-stage/builtin
      - name: Programs linked by lld run on Windows on Arm
        if: always()
        shell: bash
        run: sh tools/bash/native-stage-run.sh winarm-stage/lld
      - name: The compiler built for Windows on Arm reproduces the reference IR
        if: always()
        shell: bash
        run: |
          cd winarm-stage/selfhost
          mkdir src
          tar -xf src.tar -C src
          SALAM_STD="$(pwd -W)/src/std" ./salam.exe llvm src/compiler/main.salam --target=x86_64-linux-gnu -o out.ll --log-level=error
          grep -v ' UTC\\00"$' ref.ll >ref.trim
          grep -v ' UTC\\00"$' out.ll | tr -d '\r' >out.trim
          if ! cmp -s ref.trim out.trim; then
            diff ref.trim out.trim | head -20
            exit 1
          fi
          echo "salam.exe on Windows on Arm reproduces the reference IR"
