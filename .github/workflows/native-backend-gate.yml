---
name: Native backend gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-backend-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml # zizmor: ignore[self-repository]
    with:
      paths: |
        compiler/*
        std/*
        tools/bash/backend-sweep.sh
        tools/bash/run-one-build.sh
        tools/bash/native-*.sh
        tools/bash/package-native.sh
        tools/fuzz/*
        .github/workflows/native-backend-gate.yml
        .github/actions/setup-*
        .github/workflows/_changes.yml

  linux:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["self-hosted","linux","x64","salam-ci"]') || 'ubuntu-24.04' }}
    env:
      SALAM_STD: ${{ github.workspace }}/std
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]

      - name: Build the compiler
        run: sh tools/bash/build-selfhost.sh

      - name: Native build time and size against LLVM
        run: sh tools/bash/native-compile-report.sh ./salam | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Encoder output matches GNU as
        run: |
          find tests/en/llvm -name '*.salam' ! -name '_*' -print0 | sort -z |
            xargs -0 sh tools/bash/native-encoder-check.sh ./salam

      - name: Compiler built by the native backend reproduces itself
        run: sh tools/bash/native-selfhost-check.sh ./salam

      - name: Test programs agree with the C backend
        run: |
          sh tools/bash/backend-sweep.sh ./salam native \
            general features basics types switch match data editor-selected stdlib

      - name: Vector and image tests at x86-64-v2 and x86-64-v3
        run: sh tools/bash/native-cpu-check.sh ./salam

      - name: Random programs agree with the C backend
        run: ./salam run tools/fuzz/salamfuzz.salam -- ./salam --count 30 --seed "$((GITHUB_RUN_NUMBER * 30))"

      - name: The built-in linker's thread-local storage
        run: |
          sh tools/bash/fetch-musl-sysroots.sh --out /tmp/muslcc --arches x86_64
          SALAM_MUSL_SYSROOT=/tmp/muslcc/sr-x86_64 sh tools/bash/native-tls-check.sh ./salam x86_64 env

      - name: Shared libraries built by the native backend
        run: |
          sh tools/bash/native-shared-lib-check.sh ./salam host env
          SALAM_MUSL_SYSROOT=/tmp/muslcc/sr-x86_64 sh tools/bash/native-shared-lib-check.sh ./salam x86_64-linux-musl env
          sh tools/bash/native-shared-lib-check.sh ./salam x86_64-apple-macos none
          sh tools/bash/native-shared-lib-check.sh ./salam arm64-apple-macos none
          sh tools/bash/native-shared-lib-check.sh ./salam x86_64-apple-macos11 none
          sh tools/bash/native-shared-lib-check.sh ./salam arm64-apple-macos11 none

      - name: Package a native-built compiler for Linux x64
        run: |
          mkdir -p native-pkg
          SALAM_MUSL_SYSROOT=/tmp/muslcc/sr-x86_64 ./salam build compiler/main.salam --backend=native --release \
            --target=x86_64-linux-musl --output=native-pkg/salam --log-level=error
          sh tools/bash/package-native.sh native-pkg/salam x86_64-linux-musl linux-x64 native-pkg

      - name: The packaged compiler builds and runs programs
        run: sh tools/bash/native-package-check.sh native-pkg/salam-native-linux-x64.tar.gz

      - name: Upload the packaged compiler
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: salam-native-linux-x64
          path: native-pkg/salam-native-linux-x64.tar.gz
          retention-days: 14

  macos-debug-build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["self-hosted","linux","x64","salam-ci"]') || 'ubuntu-24.04' }}
    env:
      SALAM_STD: ${{ github.workspace }}/std
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]

      - name: Build the compiler
        run: sh tools/bash/build-selfhost.sh

      - name: Build the macOS debug programs
        run: sh tools/bash/native-lldb-check.sh build ./salam macos-debug

      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-debug
          path: macos-debug
          retention-days: 3

  macos-debug:
    needs: macos-debug-build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the programs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-macos-debug
          path: macos-debug

      - name: lldb reads the debug info and unwinds the stack
        run: sh tools/bash/native-lldb-check.sh run macos-debug

  hosts-build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["self-hosted","linux","x64","salam-ci"]') || 'ubuntu-24.04' }}
    env:
      SALAM_STD: ${{ github.workspace }}/std
      SALAM_LINKER: builtin
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            triple: arm64-apple-macos
            exe: salam
          - target: macos-x64
            triple: x86_64-apple-macos
            exe: salam
          - target: windows-x64
            triple: x86_64-w64-windows-gnu
            exe: salam.exe
          - target: linux-arm64
            triple: aarch64-linux-musl
            exe: salam
    name: hosts-build (${{ matrix.target }})
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang and llvm-ar for the C test helpers
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Install mingw-w64
        if: matrix.target == 'windows-x64'
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Fetch the musl sysroot
        if: matrix.target == 'linux-arm64'
        run: |
          sh tools/bash/fetch-musl-sysroots.sh --out /tmp/muslcc --arches aarch64
          echo "SALAM_MUSL_SYSROOT=/tmp/muslcc/sr-aarch64" >> "$GITHUB_ENV"

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]

      - name: Build the compiler
        run: sh tools/bash/build-selfhost.sh

      - name: Build the test programs for the host with the native backend
        env:
          TRIPLE: ${{ matrix.triple }}
        run: NATIVE_CROSS_STAGE=host-stage/tests sh tools/bash/native-cross-check.sh ./salam "$TRIPLE" none

      - name: Build programs for macOS 11 and as universal binaries
        if: startsWith(matrix.target, 'macos-')
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          NATIVE_CROSS_STAGE=host-stage/macos11 sh tools/bash/native-cross-check.sh ./salam "${TRIPLE}11.0" none llvm
          NATIVE_CROSS_STAGE=host-stage/universal sh tools/bash/native-cross-check.sh ./salam universal-apple-macos none llvm

      - name: Build and package the compiler itself for the host
        env:
          TARGET: ${{ matrix.target }}
          TRIPLE: ${{ matrix.triple }}
          EXE: ${{ matrix.exe }}
        run: |
          mkdir -p host-stage/selfhost
          ./salam build compiler/main.salam --backend=native --release --target="$TRIPLE" --output="host-stage/selfhost/$EXE" --log-level=error
          ./salam llvm compiler/main.salam --target=x86_64-linux-gnu -o host-stage/selfhost/ref.ll --log-level=error
          sh tools/bash/package-native.sh "host-stage/selfhost/$EXE" "$TRIPLE" "$TARGET" host-stage
          rm -rf "host-stage/selfhost/$EXE" "host-stage/salam-native-$TARGET"

      - name: Build the C ABI tests and programs with identical code folding
        env:
          TRIPLE: ${{ matrix.triple }}
        run: sh tools/bash/native-hw-stage.sh ./salam "$TRIPLE" host-stage

      - name: Build the compiler with identical code folding
        if: matrix.target == 'macos-arm64'
        env:
          TARGET: ${{ matrix.target }}
          TRIPLE: ${{ matrix.triple }}
        run: sh tools/bash/native-icf-compiler.sh build ./salam "$TRIPLE" "host-stage/salam-native-$TARGET.tar.gz" host-stage/icf-compiler

      - name: Upload the programs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-stage-${{ matrix.target }}
          path: host-stage
          retention-days: 3

  hosts-run:
    needs: hosts-build
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            host: macos-latest
            exe: salam
          - target: macos-x64
            host: macos-15-intel
            exe: salam
          - target: windows-x64
            host: windows-latest
            exe: salam.exe
          - target: linux-arm64
            host: ubuntu-24.04-arm
            exe: salam
    runs-on: ${{ matrix.host }}
    name: hosts-run (${{ matrix.target }})
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the programs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-stage-${{ matrix.target }}
          path: host-stage

      - name: Test programs built by the native backend run on the host
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: NATIVE_STAGE_SKIP="$(sh tools/bash/native-host-skips.sh "$TARGET")" sh tools/bash/native-stage-tests.sh host-stage/tests

      - name: Programs for macOS 11 and universal binaries run on the host
        if: always() && startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          archs=$(lipo -archs host-stage/universal/llvm/ll_fib)
          echo "universal slices: $archs"
          [ "$archs" = "x86_64 arm64" ]
          codesign --verify --verbose host-stage/universal/llvm/ll_fib host-stage/tests/llvm/ll_fib host-stage/macos11/llvm/ll_fib
          sh tools/bash/native-stage-tests.sh host-stage/macos11
          sh tools/bash/native-stage-tests.sh host-stage/universal

      - name: C ABI and timer tests run on the host
        if: always()
        shell: bash
        run: sh tools/bash/native-stage-tests.sh host-stage/abi

      - name: C ABI tests built by the LLVM backend run on the host
        if: always()
        shell: bash
        run: sh tools/bash/native-stage-tests.sh host-stage/abi-llvm

      - name: Programs with identical code folding run on the host
        if: always()
        shell: bash
        run: sh tools/bash/native-stage-tests.sh host-stage/icf

      - name: The compiler with identical code folding reproduces the reference IR on the host
        if: always() && matrix.target == 'macos-arm64'
        shell: bash
        run: sh tools/bash/native-icf-compiler.sh run host-stage/icf-compiler host-stage/selfhost/ref.ll

      - name: The compiler built by the native backend reproduces the reference IR on the host
        id: ir
        if: always()
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          mkdir -p host-stage/pkg
          tar -xzf "host-stage/salam-native-$TARGET.tar.gz" -C host-stage/pkg
          std="$(pwd)/std"
          if command -v cygpath >/dev/null 2>&1; then std="$(cygpath -m "$std")"; fi
          SALAM_STD="$std" "host-stage/pkg/salam-native-$TARGET/$EXE" llvm compiler/main.salam --target=x86_64-linux-gnu -o host-stage/out.ll --log-level=error
          grep -v ' UTC\\00"$' host-stage/selfhost/ref.ll >host-stage/ref.trim
          grep -v ' UTC\\00"$' host-stage/out.ll | tr -d '\r' >host-stage/out.trim
          if ! cmp -s host-stage/ref.trim host-stage/out.trim; then
            diff host-stage/ref.trim host-stage/out.trim | head -20
            exit 1
          fi
          echo "the native-built compiler reproduces the reference IR on this host"

      - name: The packaged compiler builds and runs programs on the host
        id: smoke
        if: always()
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: sh tools/bash/native-package-check.sh "host-stage/salam-native-$TARGET.tar.gz"

      - name: Upload the packaged compiler
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.ir.outcome == 'success' && steps.smoke.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: salam-native-${{ matrix.target }}
          path: host-stage/salam-native-${{ matrix.target }}.tar.gz
          retention-days: 14

  windows-cross:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["self-hosted","linux","x64","salam-ci"]') || 'ubuntu-24.04' }}
    env:
      SALAM_STD: ${{ github.workspace }}/std
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mingw-w64 and wine
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wine64
          WINE_BIN="$(command -v wine64 || command -v wine || true)"
          if [ -z "$WINE_BIN" ]; then
            echo "::error::no wine or wine64 binary found after installing wine64"
            exit 1
          fi
          sudo ln -sf "$WINE_BIN" /usr/local/bin/wine

      - name: Initialize the wine prefix
        run: |
          echo "WINEDEBUG=-all" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=/tmp/xdg-runtime" >> "$GITHUB_ENV"
          mkdir -p /tmp/xdg-runtime && chmod 0700 /tmp/xdg-runtime
          export WINEDEBUG=-all XDG_RUNTIME_DIR=/tmp/xdg-runtime
          timeout 60 wineboot --init >/tmp/wineboot-init.log 2>&1
          timeout 30 wineserver -w || wineserver -k || true
          if [ ! -f ~/.wine/system.reg ]; then
            echo "::error::wine prefix init failed:"
            cat /tmp/wineboot-init.log
            exit 1
          fi

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]

      - name: Build the compiler
        run: sh tools/bash/build-selfhost.sh

      - name: Windows programs built by the native backend run correctly
        run: |
          find tests/en/llvm -name '*.salam' ! -name '_*' -print0 | sort -z |
            xargs -0 sh tools/bash/native-windows-check.sh ./salam

      - name: Windows -g builds keep their code and carry DWARF
        run: sh tools/bash/native-windows-debug-check.sh ./salam

      - name: Windows DLLs built by the native backend load and run
        run: sh tools/bash/native-windows-dll-check.sh ./salam

      - name: Windows GUI programs carry their icon, manifest and version info
        run: sh tools/bash/native-windows-gui-check.sh ./salam

  linux-cross:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["self-hosted","linux","x64","salam-ci"]') || 'ubuntu-24.04' }}
    env:
      SALAM_STD: ${{ github.workspace }}/std
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: i686
            triple: i686-linux-musl
            runner: env
          - arch: arm
            triple: arm-linux-musleabihf
            runner: qemu-arm-static
          - arch: aarch64
            triple: aarch64-linux-musl
            runner: qemu-aarch64-static
          - arch: riscv64
            triple: riscv64-linux-musl
            runner: qemu-riscv64-static
    name: linux-cross (${{ matrix.arch }})
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install qemu user emulation
        if: matrix.runner != 'env'
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Install debuggers, and clang and llvm-ar for the C test helpers
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y gdb gdb-multiarch clang llvm

      - name: Fetch the musl sysroot
        env:
          ARCH: ${{ matrix.arch }}
        run: sh tools/bash/fetch-musl-sysroots.sh --out /tmp/muslcc --arches "$ARCH"

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]

      - name: Build the compiler
        run: sh tools/bash/build-selfhost.sh

      - name: Programs built by the native backend run under emulation
        env:
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
          RUNNER: ${{ matrix.runner }}
        run: |
          SALAM_MUSL_SYSROOT=/tmp/muslcc/sr-$ARCH sh tools/bash/native-cross-check.sh ./salam "$TRIPLE" "$RUNNER" \
            basics features types data games match switch llvm general stdlib

      - name: Random programs agree with the C backend under emulation
        env:
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
          RUNNER: ${{ matrix.runner }}
        run: |
          ./salam build tools/fuzz/salamfuzz.salam --output=/tmp/salamfuzz --log-level=error
          SALAM_MUSL_SYSROOT=/tmp/muslcc/sr-$ARCH /tmp/salamfuzz ./salam --count 15 \
            --seed "$((GITHUB_RUN_NUMBER * 30))" --target "$TRIPLE" --runner "$RUNNER"

      - name: gdb reads the debug info
        env:
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
          RUNNER: ${{ matrix.runner }}
        run: SALAM_MUSL_SYSROOT=/tmp/muslcc/sr-$ARCH sh tools/bash/native-gdb-check.sh ./salam "$TRIPLE" "$RUNNER"

      - name: The built-in linker's branch thunks
        if: matrix.arch == 'arm' || matrix.arch == 'aarch64'
        env:
          ARCH: ${{ matrix.arch }}
          RUNNER: ${{ matrix.runner }}
        run: sh tools/bash/native-thunk-check.sh ./salam "$ARCH" "$RUNNER"

      - name: The built-in linker's thread-local storage
        env:
          ARCH: ${{ matrix.arch }}
          RUNNER: ${{ matrix.runner }}
        run: SALAM_MUSL_SYSROOT=/tmp/muslcc/sr-$ARCH sh tools/bash/native-tls-check.sh ./salam "$ARCH" "$RUNNER"

      - name: Dynamic musl links by the built-in linker
        env:
          ARCH: ${{ matrix.arch }}
          RUNNER: ${{ matrix.runner }}
        run: SALAM_MUSL_SYSROOT=/tmp/muslcc/sr-$ARCH sh tools/bash/native-musl-dyn-check.sh ./salam "$ARCH" "$RUNNER"

      - name: Dynamic glibc links by the built-in linker
        env:
          ARCH: ${{ matrix.arch }}
          RUNNER: ${{ matrix.runner }}
        run: |
          case "$ARCH" in
            i686) pkgs="gcc-i686-linux-gnu"; libc=/usr/i686-linux-gnu ;;
            arm) pkgs="gcc-arm-linux-gnueabihf"; libc=/usr/arm-linux-gnueabihf ;;
            aarch64) pkgs="libc6-dev-arm64-cross"; libc=/usr/aarch64-linux-gnu ;;
            riscv64) pkgs="libc6-dev-riscv64-cross"; libc=/usr/riscv64-linux-gnu ;;
          esac
          [ "$RUNNER" = env ] && sudo apt-get update
          sudo apt-get install -y "$pkgs" lld
          sh tools/bash/native-glibc-check.sh ./salam "$ARCH" "$libc" "$RUNNER" basics llvm general

      - name: Shared libraries built by the native backend
        env:
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
          RUNNER: ${{ matrix.runner }}
        run: |
          SALAM_MUSL_SYSROOT=/tmp/muslcc/sr-$ARCH sh tools/bash/native-shared-lib-check.sh ./salam "$TRIPLE" "$RUNNER"
          gnu=$ARCH-linux-gnu
          [ "$ARCH" = arm ] && gnu=arm-linux-gnueabihf
          sh tools/bash/native-shared-lib-check.sh ./salam "$gnu" "$RUNNER"

      - name: Build the benchmarks with and without the vectorizers
        if: matrix.arch == 'aarch64'
        env:
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
        run: SALAM_MUSL_SYSROOT=/tmp/muslcc/sr-$ARCH sh tools/bash/native-bench-stage.sh ./salam "$TRIPLE" bench-stage

      - name: Upload the benchmarks
        if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a64-bench-stage
          path: bench-stage
          retention-days: 3

  linux-arm64-run:
    needs: linux-cross
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the benchmarks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: a64-bench-stage
          path: bench-stage
      - name: Vectorized benchmarks print the same on AArch64 hardware
        run: |
          chmod +x bench-stage/*.on bench-stage/*.off
          sh tools/bash/native-bench-run.sh bench-stage

  windows-arm64-build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["self-hosted","linux","x64","salam-ci"]') || 'ubuntu-24.04' }}
    env:
      SALAM_STD: ${{ github.workspace }}/std
      LLVM_MINGW: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch llvm-mingw
        run: |
          curl -fsSL --retry 3 -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/${LLVM_MINGW}.tar.xz"
          echo "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335  /tmp/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf /tmp/llvm-mingw.tar.xz -C /tmp
          echo "/tmp/${LLVM_MINGW}/bin" >> "$GITHUB_PATH"
      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]
      - name: Build the compiler
        run: sh tools/bash/build-selfhost.sh
      - name: Build the test programs for Windows on Arm with the built-in linker
        run: |
          find tests/en/llvm -name '*.salam' ! -name '_*' -print0 | sort -z |
            SALAM_LINKER=builtin NATIVE_WIN_TRIPLE=aarch64-w64-windows-gnu NATIVE_WIN_STAGE=winarm-stage/builtin \
              xargs -0 sh tools/bash/native-windows-check.sh ./salam
      - name: Build them again linked by lld
        run: |
          find tests/en/llvm -name '*.salam' ! -name '_*' -print0 | sort -z |
            SALAM_LINKER=system NATIVE_WIN_TRIPLE=aarch64-w64-windows-gnu NATIVE_WIN_STAGE=winarm-stage/lld \
              xargs -0 sh tools/bash/native-windows-check.sh ./salam
      - name: Build the i686 stdcall programs with the LLVM backend
        run: |
          SALAM_LINKER=builtin NATIVE_WIN_BACKEND=llvm NATIVE_WIN_TRIPLE=i686-w64-windows-gnu NATIVE_WIN_STAGE=winarm-stage/i686-llvm \
            sh tools/bash/native-windows-check.sh ./salam tests/en/llvm/stdcall_pkg_extern.salam tests/en/llvm/stdcall_fn_pointer.salam
      - name: Build the compiler itself for Windows on Arm
        run: |
          mkdir -p winarm-stage/selfhost
          ./salam build compiler/main.salam --backend=native --release --target=aarch64-w64-windows-gnu \
            --output=winarm-stage/selfhost/salam.exe --log-level=error
          ./salam llvm compiler/main.salam --target=x86_64-linux-gnu -o winarm-stage/selfhost/ref.ll --log-level=error
          tar -cf winarm-stage/selfhost/src.tar compiler std tests/en/llvm
          SALAM_LLVM_MINGW="/tmp/${LLVM_MINGW}" sh tools/bash/package-native.sh winarm-stage/selfhost/salam.exe \
            aarch64-w64-windows-gnu windows-arm64 winarm-stage
          rm -rf winarm-stage/salam-native-windows-arm64
      - name: Build the C ABI tests and programs with identical code folding
        run: |
          SALAM_LINKER=builtin sh tools/bash/native-hw-stage.sh ./salam aarch64-w64-windows-gnu winarm-stage
          SALAM_LINKER=builtin sh tools/bash/native-hw-stage.sh ./salam i686-w64-windows-gnu winarm-stage/i686
      - name: Build the general and stdlib tests for Windows on Arm
        run: |
          SALAM_LINKER=builtin NATIVE_CROSS_STAGE=winarm-stage/tests \
            sh tools/bash/native-cross-check.sh ./salam aarch64-w64-windows-gnu none general stdlib
      - name: Build the webview programs against the mock WebView2 loader
        run: |
          SALAM_LINKER=builtin NATIVE_WEBVIEW_STAGE=winarm-stage/webview \
            NATIVE_WEBVIEW_TRIPLES="aarch64-w64-windows-gnu i686-w64-windows-gnu x86_64-w64-windows-gnu" \
            sh tools/bash/native-windows-webview-check.sh ./salam
      - name: Build the compiler with identical code folding
        run: |
          SALAM_LINKER=builtin sh tools/bash/native-icf-compiler.sh build ./salam aarch64-w64-windows-gnu \
            winarm-stage/salam-native-windows-arm64.tar.gz winarm-stage/icf-compiler
      - name: Package Salam for Windows on Arm
        run: sh tools/bash/package-winarm.sh ./salam "/tmp/${LLVM_MINGW}" winarm-stage/package
      - name: Upload the programs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winarm-stage
          path: winarm-stage
          retention-days: 3
  windows-arm64-run:
    needs: windows-arm64-build
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the programs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winarm-stage
          path: winarm-stage
      - name: Programs linked by the built-in linker run on Windows on Arm
        shell: bash
        run: sh tools/bash/native-stage-run.sh winarm-stage/builtin
      - name: Programs linked by lld run on Windows on Arm
        if: always()
        shell: bash
        run: sh tools/bash/native-stage-run.sh winarm-stage/lld
      - name: i686 programs built by the LLVM backend run under x86 emulation
        if: always()
        shell: bash
        run: sh tools/bash/native-stage-run.sh winarm-stage/i686-llvm
      - name: General and stdlib tests run on Windows on Arm
        if: always()
        shell: bash
        run: NATIVE_STAGE_SKIP="$(sh tools/bash/native-host-skips.sh windows-arm64)" sh tools/bash/native-stage-tests.sh winarm-stage/tests
      - name: Webview programs run against the mock, native and under emulation
        if: always()
        shell: bash
        run: sh tools/bash/native-windows-webview-check.sh --run winarm-stage/webview
      - name: C ABI and timer tests run on Windows on Arm
        if: always()
        shell: bash
        run: sh tools/bash/native-stage-tests.sh winarm-stage/abi
      - name: C ABI tests built by the LLVM backend run on Windows on Arm
        if: always()
        shell: bash
        run: sh tools/bash/native-stage-tests.sh winarm-stage/abi-llvm
      - name: Programs with identical code folding run on Windows on Arm
        if: always()
        shell: bash
        run: sh tools/bash/native-stage-tests.sh winarm-stage/icf
      - name: i686 C ABI and timer tests run under x86 emulation
        if: always()
        shell: bash
        run: sh tools/bash/native-stage-tests.sh winarm-stage/i686/abi
      - name: i686 C ABI tests built by the LLVM backend run under x86 emulation
        if: always()
        shell: bash
        run: sh tools/bash/native-stage-tests.sh winarm-stage/i686/abi-llvm
      - name: i686 programs with identical code folding run under x86 emulation
        if: always()
        shell: bash
        run: sh tools/bash/native-stage-tests.sh winarm-stage/i686/icf
      - name: The compiler with identical code folding reproduces the reference IR on Windows on Arm
        if: always()
        shell: bash
        run: sh tools/bash/native-icf-compiler.sh run winarm-stage/icf-compiler winarm-stage/selfhost/ref.ll
      - name: The compiler built for Windows on Arm reproduces the reference IR
        id: ir
        if: always()
        shell: bash
        run: |
          cd winarm-stage/selfhost
          mkdir src
          tar -xf src.tar -C src
          SALAM_STD="$(pwd -W)/src/std" ./salam.exe llvm src/compiler/main.salam --target=x86_64-linux-gnu -o out.ll --log-level=error
          grep -v ' UTC\\00"$' ref.ll >ref.trim
          grep -v ' UTC\\00"$' out.ll | tr -d '\r' >out.trim
          if ! cmp -s ref.trim out.trim; then
            diff ref.trim out.trim | head -20
            exit 1
          fi
          echo "salam.exe on Windows on Arm reproduces the reference IR"
      - name: The packaged compiler builds and runs programs on Windows on Arm by itself
        if: always()
        shell: bash
        run: |
          cd winarm-stage/selfhost
          [ -d src ] || { mkdir src && tar -xf src.tar -C src; }
          sh ../../tools/bash/native-host-check.sh ../package/salam.exe src/tests/en/llvm/*.salam
      - name: The native-built compiler package builds and runs programs on Windows on Arm
        id: smoke
        if: always()
        shell: bash
        run: sh tools/bash/native-package-check.sh winarm-stage/salam-native-windows-arm64.tar.gz
      - name: Upload the packaged compiler
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.ir.outcome == 'success' && steps.smoke.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: salam-native-windows-arm64
          path: winarm-stage/salam-native-windows-arm64.tar.gz
          retention-days: 14
