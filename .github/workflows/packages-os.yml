---
name: 📦 Packages - Linux and macOS
on:
  pull_request:
    branches:
      - main
    paths:
      - compiler/pkgmgr/**
      - compiler/cli/cli_pkg.salam
      - compiler/cli/cli_new.salam
      - compiler/driver/driver_lib.salam
      - compiler/driver/driver_link.salam
      - std/archive/**
      - std/net/http/**
      - tools/bash/test-packages.sh
      - tools/bash/run-tests.sh
      - tests/en/packages/**
      - tests/en/lib/**
      - tests/*/project/**
      - .github/workflows/packages-os.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packages-os-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    name: Packages on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]
      - name: Build the compiler from this checkout
        run: sh tools/bash/build-selfhost.sh --output "$GITHUB_WORKSPACE/salam"
      - name: Run the package, library, project and new-project tests
        run: |
          set -eu
          SALAM="$GITHUB_WORKSPACE/salam" sh tools/bash/run-tests.sh packages lib project new 2>&1 | tee /tmp/pkg-tests.log
          grep -qE 'RESULT: [0-9]+ passed, 0 failed' /tmp/pkg-tests.log
