---
name: 📦 Packaging - Distro packages & manifests
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (defaults to the VERSION file)'
        type: string
        default: ''
      attach:
        description: 'Attach the built .deb / .rpm to that release'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION=${INPUT_VERSION#v}
          elif [ -n "${RELEASE_TAG:-}" ]; then
            VERSION=${RELEASE_TAG#v}
          else
            VERSION=$(tr -d ' \t\r\n' < VERSION)
          fi
          case "$VERSION" in
            *-nightly-*)
              echo "::notice::$VERSION is a nightly; distro packages are only cut for stable releases"
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "packaging v$VERSION"

  deb:
    name: Build .deb packages
    runs-on: ubuntu-latest
    needs: resolve
    if: ${{ !contains(needs.resolve.outputs.version, '-nightly-') }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dpkg-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev lintian
      - name: Download the Linux release tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p release
          for a in x86_64 aarch64 armhf i686; do
            gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
              --pattern "salam-$VERSION-linux-$a.tar.gz" --dir release \
              || echo "::warning::no linux-$a tarball on v$VERSION"
          done
          ls -la release
      - name: Build the packages
        run: |
          sh packaging/debian/build-deb.sh --version "$VERSION" \
            --input ./release --output ./debs
          ls -la debs
      - name: Lint the packages
        run: |
          set -eu
          for d in debs/*.deb; do
            echo "== $d"
            lintian --fail-on error,warning --suppress-tags \
              statically-linked-binary,embedded-library,unstripped-binary-or-object,\
          arch-dependent-file-in-usr-share,no-manual-page,changelog-file-missing-in-native-package,\
          extended-description-is-probably-too-short "$d" || true
          done
      - name: Smoke-test the amd64 package
        run: |
          set -eu
          sudo dpkg -i debs/salam_"$VERSION"-1_amd64.deb
          printf 'func main:\n    println "salam"\nend\n' > /tmp/hello.salam
          cd /tmp
          # The point of the wrapper: a bare $PATH lookup has to work.
          out=$(salam exec /tmp/hello.salam)
          echo "$out"
          [ "$out" = "salam" ] || { echo "::error::installed salam did not run"; exit 1; }
          salam version
      - name: Upload the packages as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-deb
          path: debs/*.deb
      - name: Attach the packages to the release
        if: ${{ github.event_name == 'release' || inputs.attach }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          for d in debs/*.deb; do
            sha256sum "$d" | awk '{ print $1, "'"$(basename "$d")"'" }' > "$d.sha256"
          done
          gh release upload "v$VERSION" debs/*.deb debs/*.deb.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

  rpm:
    name: Build .rpm packages
    runs-on: ubuntu-latest
    needs: resolve
    if: ${{ !contains(needs.resolve.outputs.version, '-nightly-') }}
    permissions:
      contents: write
    container:
      image: fedora:41
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Install build tooling
        run: dnf install -y rpm-build rpmdevtools curl tar gzip gh
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the spec
        run: |
          set -eu
          ./packaging/bump.sh "$VERSION"
          cp packaging/dist/rpm/salam.spec /tmp/salam.spec
          cat /tmp/salam.spec
      - name: Build
        run: |
          set -eu
          rpmdev-setuptree
          spectool -g -R /tmp/salam.spec
          rpmbuild -bb /tmp/salam.spec
          find ~/rpmbuild/RPMS -name '*.rpm' -print
      - name: Collect
        run: |
          mkdir -p rpms
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} rpms/ \;
          ls -la rpms
      - name: Upload the packages as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-rpm
          path: rpms/*.rpm
      - name: Attach the packages to the release
        if: ${{ github.event_name == 'release' || inputs.attach }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release upload "v$VERSION" rpms/*.rpm \
            --repo "$GITHUB_REPOSITORY" --clobber

  manifests:
    name: Render package manifests
    runs-on: ubuntu-latest
    needs: resolve
    if: ${{ !contains(needs.resolve.outputs.version, '-nightly-') }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render every manifest against the published release
        run: ./packaging/bump.sh "$VERSION"
      - name: Upload the rendered manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-package-manifests
          path: packaging/dist/
      - name: Summarize
        run: |
          {
            echo "### Rendered package manifests for v$VERSION"
            echo ""
            echo "Download the \`salam-package-manifests\` artifact, or see"
            echo "\`packaging/README.md\` for where each file goes."
            echo ""
            echo '```'
            find packaging/dist -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-aur:
    name: Publish to the AUR
    runs-on: ubuntu-latest
    needs: [resolve, manifests]
    # Nothing is pushed until AUR_SSH_PRIVATE_KEY exists; see packaging/README.md.
    if: ${{ !contains(needs.resolve.outputs.version, '-nightly-') }}
    container:
      image: archlinux:base-devel
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Skip when no AUR key is configured
        id: gate
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; skipping the AUR push"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install tooling
        if: steps.gate.outputs.run == 'true'
        run: pacman -Syu --noconfirm --needed git openssh python curl
      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the manifests
        if: steps.gate.outputs.run == 'true'
        run: ./packaging/bump.sh "$VERSION"
      - name: Push salam-bin and salam
        if: steps.gate.outputs.run == 'true'
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          set -eu

          # makepkg refuses to run as root, and this container is root.
          useradd -m builder
          install -d -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org > /home/builder/.ssh/known_hosts
          cat > /home/builder/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF
          chown -R builder:builder /home/builder/.ssh
          chmod 700 /home/builder/.ssh
          chmod 600 /home/builder/.ssh/aur /home/builder/.ssh/config

          install -d -o builder -g builder /home/builder/work
          cp packaging/dist/aur/salam-bin/PKGBUILD /home/builder/work/PKGBUILD.salam-bin
          cp packaging/dist/aur/salam/PKGBUILD     /home/builder/work/PKGBUILD.salam
          chown -R builder:builder /home/builder/work

          su builder -c '
            set -eu
            cd /home/builder/work
            git config --global user.name "'"${AUR_USERNAME:-Salam Release Bot}"'"
            git config --global user.email "'"${AUR_EMAIL:-MaxBaseCode@gmail.com}"'"
            for pkg in salam-bin salam; do
              echo "== $pkg"
              rm -rf "$pkg"
              git clone "ssh://aur@aur.archlinux.org/$pkg.git" "$pkg"
              cp "PKGBUILD.$pkg" "$pkg/PKGBUILD"
              cd "$pkg"
              makepkg --printsrcinfo > .SRCINFO
              git add PKGBUILD .SRCINFO
              if git diff --cached --quiet; then
                echo "  no change"
              else
                git commit -m "Update to '"$VERSION"'"
                git push origin master
                echo "  pushed '"$VERSION"'"
              fi
              cd ..
            done
          '
