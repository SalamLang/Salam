---
name: 📦 Packaging - Distro packages & manifests
# checkov:skip=CKV_GHA_7:inputs are only ever read via env: indirection, never interpolated into a run: script
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (defaults to the VERSION file)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION=${INPUT_VERSION#v}
          elif [ -n "${RELEASE_TAG:-}" ]; then
            VERSION=${RELEASE_TAG#v}
          else
            VERSION=$(tr -d ' \t\r\n' < VERSION)
          fi
          case "$VERSION" in
            *-nightly-*)
              echo "::notice::$VERSION is a nightly; distro packages are only cut for stable releases"
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "packaging v$VERSION"

  manifests:
    name: Render package manifests
    runs-on: ubuntu-24.04
    needs: resolve
    if: ${{ !contains(needs.resolve.outputs.version, '-nightly-') }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render every manifest against the published release
        run: ./packaging/bump.sh "$VERSION"
      - name: Upload the rendered manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salam-package-manifests
          path: packaging/dist/
      - name: Summarize
        run: |
          {
            echo "### Rendered package manifests for v$VERSION"
            echo ""
            echo "Download the \`salam-package-manifests\` artifact, or see"
            echo "\`packaging/README.md\` for where each file goes."
            echo ""
            echo '```'
            find packaging/dist -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-aur:
    name: Publish to the AUR
    runs-on: ubuntu-24.04
    needs: [resolve, manifests]
    # Nothing is pushed until AUR_SSH_PRIVATE_KEY exists; see packaging/README.md.
    if: ${{ !contains(needs.resolve.outputs.version, '-nightly-') }}
    container:
      image: archlinux:base-devel
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Skip when no AUR key is configured
        id: gate
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; skipping the AUR push"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install tooling
        if: steps.gate.outputs.run == 'true'
        run: pacman -Syu --noconfirm --needed git openssh python curl
      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the manifests
        if: steps.gate.outputs.run == 'true'
        run: ./packaging/bump.sh "$VERSION"
      - name: Push salam-bin and salamlang
        if: steps.gate.outputs.run == 'true'
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          set -eu

          # makepkg refuses to run as root, and this container is root.
          useradd -m builder
          install -d -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org > /home/builder/.ssh/known_hosts
          cat > /home/builder/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF
          chown -R builder:builder /home/builder/.ssh
          chmod 700 /home/builder/.ssh
          chmod 600 /home/builder/.ssh/aur /home/builder/.ssh/config

          install -d -o builder -g builder /home/builder/work
          cp packaging/dist/aur/salam-bin/PKGBUILD  /home/builder/work/PKGBUILD.salam-bin
          cp packaging/dist/aur/salamlang/PKGBUILD  /home/builder/work/PKGBUILD.salamlang
          chown -R builder:builder /home/builder/work

          su builder -c "
            set -eu
            cd /home/builder/work
            git config --global user.name \"${AUR_USERNAME:-Salam Release Bot}\"
            git config --global user.email \"${AUR_EMAIL:-MaxBaseCode@gmail.com}\"
            for pkg in salam-bin salamlang; do
              echo \"== \$pkg\"
              rm -rf \"\$pkg\"
              git clone \"ssh://aur@aur.archlinux.org/\$pkg.git\" \"\$pkg\"
              cp \"PKGBUILD.\$pkg\" \"\$pkg/PKGBUILD\"
              cd \"\$pkg\"
              makepkg --printsrcinfo > .SRCINFO
              git add PKGBUILD .SRCINFO
              if git diff --cached --quiet; then
                echo \"  no change\"
              else
                git commit -m \"Update to $VERSION\"
                git push origin master
                echo \"  pushed $VERSION\"
              fi
              cd ..
            done
          "

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [resolve, manifests]
    # Nothing is published until NPM_TOKEN exists; see packaging/README.md.
    if: ${{ !contains(needs.resolve.outputs.version, '-nightly-') }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip when no npm token is configured
        id: gate
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN is not set; skipping the npm publish"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Render the manifests
        if: steps.gate.outputs.run == 'true'
        run: ./packaging/bump.sh "$VERSION"
      - name: Skip if this version is already on npm
        if: steps.gate.outputs.run == 'true'
        id: check
        run: |
          set -eu
          if npm view "salamlang@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::salamlang@$VERSION is already published; skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.gate.outputs.run == 'true' && steps.check.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          cd packaging/dist/npm
          npm publish --access public

  publish-chocolatey:
    name: Publish to Chocolatey
    runs-on: windows-latest
    needs: [resolve, manifests]
    # Nothing is published until CHOCO_API_KEY exists; see packaging/README.md.
    if: ${{ !contains(needs.resolve.outputs.version, '-nightly-') }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - name: Skip when no Chocolatey API key is configured
        id: gate
        shell: bash
        run: |
          if [ -z "${CHOCO_API_KEY:-}" ]; then
            echo "::notice::CHOCO_API_KEY is not set; skipping the Chocolatey push"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the manifests
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: ./packaging/bump.sh "$VERSION"
      - name: Skip if this version is already on the community feed
        if: steps.gate.outputs.run == 'true'
        id: check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://community.chocolatey.org/api/v2/Packages(Id='salam',Version='$env:VERSION')"
          try {
            $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -Method Get
            $exists = $resp.StatusCode -eq 200 -and $resp.Content -match 'salam'
          } catch {
            $exists = $false
          }
          if ($exists) {
            Write-Host "::notice::salam $env:VERSION is already on the Chocolatey feed; skipping"
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }
      - name: Pack and push
        if: steps.gate.outputs.run == 'true' && steps.check.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd packaging/dist/chocolatey
          choco pack
          $nupkg = Get-ChildItem -Filter "salam.$env:VERSION.nupkg" | Select-Object -First 1
          choco push $nupkg.Name --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
