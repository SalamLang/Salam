---
# Step 2 of 2: runs in the base repository context after pr-labeler.yml
# finishes. No pull request code is checked out or executed here. The only
# input taken from the PR run is a number, which is validated before use.
name: 🏷️ PR - Auto-Labeler

on:
  # zizmor: ignore[dangerous-triggers] -- no PR code is run; the artifact is validated as a plain integer
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - PR - Auto-Labeler (collect)
    types:
      - completed

permissions: {}

jobs:
  labeler:
    name: Label files
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download PR number
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate PR number
        id: pr
        run: |
          number="$(head -n 1 pr-number)"
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number in artifact" >&2
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Pull Request Labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
          pr-number: ${{ steps.pr.outputs.number }}
