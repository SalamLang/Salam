---
name: 🏷️ PR - Auto-Labeler

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - PR - Auto-Labeler (collect)
    types:
      - completed

permissions: {}

concurrency:
  group: pr-labeler-apply-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  labeler:
    name: Label files
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download PR number
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-number
          path: ${{ runner.temp }}/pr-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          file="$RUNNER_TEMP/pr-artifact/pr-number"
          if [ ! -f "$file" ] || [ -L "$file" ] || [ "$(wc -c < "$file")" -gt 16 ]; then
            echo "Missing or oversized pr-number file" >&2
            exit 1
          fi
          number="$(head -n 1 "$file")"
          if ! [[ "$number" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "Invalid PR number in artifact" >&2
            exit 1
          fi
          pr_head_sha="$(gh api "repos/$REPO/pulls/$number" --jq .head.sha)"
          pr_head_repo="$(gh api "repos/$REPO/pulls/$number" --jq .head.repo.full_name)"
          if [ "$pr_head_sha" != "$RUN_HEAD_SHA" ] || [ "$pr_head_repo" != "$RUN_HEAD_REPO" ]; then
            echo "PR $number does not belong to the run that produced the artifact" >&2
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Pull Request Labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
          pr-number: ${{ steps.pr.outputs.number }}
