---
# Step 1 of 2: runs in the (untrusted) pull request context with a read-only
# token and no secrets. It only records the PR number for pr-labeler-apply.yml.
name: PR - Auto-Labeler (collect)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  collect:
    name: Save PR number
    runs-on: ubuntu-24.04
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number

      - name: Upload PR number
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-number
          path: pr-number
          retention-days: 1
