---
name: 🐳 Runner - Track latest Salam release in sandbox image

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['🚀 Compiler - Build & Release Binaries']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    if: |
      github.repository == 'SalamLang/Salam' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        startsWith(github.event.workflow_run.head_commit.message, 'release:')))
    runs-on: ubuntu-24.04
    name: Rebuild sandbox image against the latest release and redeploy
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check that the API token can use Cloudflare Containers
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          code=$(curl -s -o /tmp/cf-containers.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/containers/me" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare answered HTTP $code for /containers/me. CLOUDFLARE_API_TOKEN needs the account permission Containers: Edit (and the account needs Workers Paid). Create a new token with it and update the secret."
            cat /tmp/cf-containers.json || true
            exit 1
          fi
      - name: Deploy (builds + pushes the sandbox image tracking latest, then the Worker)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'runner'
          packageManager: bun
