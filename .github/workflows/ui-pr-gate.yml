---
name: 🪟 UI and pages - PR gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-pr-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml # zizmor: ignore[self-repository]
    with:
      paths: |
        std/gui/ui/*
        std/gui/style/*
        std/gui/flow/*
        std/gui/color/*
        std/gui/paint/*
        std/gui/typeset/*
        std/gui/window/*
        std/gui/reactive/*
        std/layout/*
        compiler/sal_layout/*
        compiler/jsgen/*
        compiler/driver/driver.salam
        std/dom/*
        tests/*/js/*
        tools/js/*
        tools/bash/run-one-js.sh
        tools/bash/check-js-method-names.py
        compiler/docgen/*
        std/layoutgen/*
        std/net/http/swagger/*
        agent/salam/*
        extensions/vscode/*
        compiler/semantic/sema_layout*.salam
        tools/salam/style-*.tsv
        tests/*/page/*
        tests/*/ui/*
        tools/bash/run-tests.sh
        tools/bash/run-one-build.sh
        tools/bash/ui-gate-run.sh
        tools/ui-gate-known-failures.txt
        tools/bash/build-selfhost.sh
        .github/workflows/ui-pr-gate.yml
        .github/workflows/_changes.yml
        .github/actions/setup-salam/*

  jsnames:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: JavaScript method names in emitted code
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look for PascalCase method names in emitted JavaScript
        run: python3 tools/bash/check-js-method-names.py

  compiler:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Build the compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the compiler built from this compiler source
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: salam
          key: ui-gate-compiler-0.6.18-${{ hashFiles('compiler/**', 'std/**', 'VERSION', 'tools/bash/build-selfhost.sh') }}

      - name: Install the pinned seed compiler
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-salam # zizmor: ignore[self-repository]
        with:
          version: '0.6.18'

      - name: Build the compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y build-essential
          sh tools/bash/build-selfhost.sh

      - name: Check the compiler runs
        run: |
          chmod +x salam
          ./salam version | head -1

      - name: Upload the compiler
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-gate-salam
          path: salam
          retention-days: 1
          if-no-files-found: error

  sections:
    needs: compiler
    name: ${{ matrix.section }} ${{ matrix.lang }} ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { section: page, lang: en, shard: 1/2 }
          - { section: page, lang: en, shard: 2/2 }
          - { section: page, lang: fa, shard: 1/2 }
          - { section: page, lang: fa, shard: 2/2 }
          - { section: ui, lang: en, shard: '' }
          - { section: ui, lang: fa, shard: '' }
          - { section: uiexamples, lang: en, shard: '' }
          - { section: js, lang: en, shard: '' }
          - { section: js, lang: fa, shard: '' }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the compiler
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-gate-salam

      - name: Install a C compiler and the X11 headers
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev

      - name: Run the section headless
        env:
          SECTION: ${{ matrix.section }}
          LANG_CODE: ${{ matrix.lang }}
          SHARD: ${{ matrix.shard }}
          SALAM_WINDOW_BACKEND: headless
          GATE_TIMEOUT: '1500'
        run: |
          set -eu
          chmod +x salam
          SALAM="$GITHUB_WORKSPACE/salam" sh tools/bash/ui-gate-run.sh "$SECTION" "$LANG_CODE" "$SHARD"

  pagestate:
    needs: compiler
    name: Stateful page in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the compiler
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-gate-salam

      - name: Click through a page with components, if, each and lists
        run: |
          set -eu
          chmod +x salam
          dir="$(mktemp -d)"
          (cd "$dir" && npm install --no-save --no-audit --no-fund playwright-core@1.49.1)
          ./salam web tests/en/page/components/component_state_list.salam --output="$dir/state.html"
          NODE_PATH="$dir/node_modules" node tools/js/test-page-state.js "$dir/state.html"

  vscode:
    needs: compiler
    name: VS Code extension commands
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the compiler
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-gate-salam

      - name: Compile the extension and drive every command
        env:
          SALAM_STD: ${{ github.workspace }}/std
        run: |
          set -eu
          chmod +x salam
          dir="$(mktemp -d)"
          ./salam js extensions/vscode/src/extension.salam --output="$dir/extension.js"
          node extensions/vscode/test/smoke.js --lsp "$dir/extension.js"
          node extensions/vscode/test/smoke.js "$dir/extension.js"

  gate:
    if: always()
    needs: [changes, jsnames, compiler, sections, pagestate, vscode]
    name: UI and pages gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -eu
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
