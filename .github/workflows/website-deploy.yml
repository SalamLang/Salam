---
name: 🌐 Website - Build & Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    with:
      paths: |
        website/*
        VERSION
        .github/actions/deploy-ssh/*
        .github/actions/publish-gh-pages/*
        .github/workflows/website-deploy.yml
        .github/actions/setup-*
        .github/workflows/_changes.yml
  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a seed compiler
        uses: ./.github/actions/setup-salam

      - name: Install SQLite for the database examples
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build the compiler, check the examples, generate both sites
        run: sh website/build.sh

      - name: Upload the Persian site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-fa
          path: website/dist/fa
          retention-days: 7

      - name: Upload the English site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-en
          path: website/dist/en
          retention-days: 7

  deploy-fa:
    name: Deploy the Persian site to salamlang.ir
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-website-server
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Download the site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-fa
          path: site

      - name: Upload to the server
        uses: ./.github/actions/deploy-ssh
        with:
          source: site
          target: ${{ secrets.SSH_PATH_SITE }}
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USERNAME }}
          private-key: ${{ secrets.SSH_PRIVATEKEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          allowed-root: /hosts/

  deploy-en:
    name: Deploy the English site to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Download the English site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-en
          path: site-en

      - name: Publish to the gh-pages branch
        uses: ./.github/actions/publish-gh-pages
        with:
          source: site-en
          target: en
          token: ${{ secrets.GITHUB_TOKEN }}
          message: 'Publish the English website'
