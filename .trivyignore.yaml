---
secrets:
  - id: private-key
    paths:
      - 'packages/ssh/selftest_privatekey.salam'
    statement: >-
      Test fixtures, not credentials. Three throwaway 1024-bit RSA keys
      generated with ssh-keygen purely to exercise the PKCS#1 / PKCS#8 /
      OpenSSH private-key parsers in packages/ssh/privatekey.salam. They protect
      nothing, are never used to authenticate anywhere, and are deliberately
      too weak for production use.
  - id: private-key
    paths:
      - 'std/doc.html'
    statement: >-
      Generated stdlib API documentation. It renders the source of every pub
      declaration in std/, so it carries a second copy of the three throwaway
      packages/ssh self-test keys ignored above. No new key material.

vulnerabilities:
  - id: GHSA-wrw7-89jp-8q8g
    paths:
      - 'agent/src-tauri/Cargo.lock'
    statement: >-
      glib 0.18 comes in through Tauri's Linux backend (wry, tao and gtk 0.18),
      which cannot move to glib 0.20 until Tauri does. The unsound code is the
      Iterator impl of glib::VariantStrIter, which Salam Agent never calls.

misconfigurations:
  - id: AVD-DS-0026
    paths:
      - 'sandbox/image/Dockerfile'
    statement: >-
      The sandbox image only holds a sleeping process that stands in for a
      user shell, so there is no service to probe.
