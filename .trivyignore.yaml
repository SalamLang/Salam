---
secrets:
  - id: private-key
    paths:
      - 'std/ssh/selftest_privatekey.salam'
    statement: >-
      Test fixtures, not credentials. Three throwaway 1024-bit RSA keys
      generated with ssh-keygen purely to exercise the PKCS#1 / PKCS#8 /
      OpenSSH private-key parsers in std/ssh/privatekey.salam. They protect
      nothing, are never used to authenticate anywhere, and are deliberately
      too weak for production use.
  - id: private-key
    paths:
      - 'std/doc.html'
    statement: >-
      Generated stdlib API documentation. It renders the source of every pub
      declaration in std/, so it carries a second copy of the three throwaway
      std/ssh self-test keys ignored above. No new key material.
  - id: stripe-secret-token
    paths:
      - 'website/content/en/learn/36-css-responsive.txt'
      - 'website/content/fa/learn/36-css-responsive.txt'
    statement: >-
      The responsive CSS lesson shows a text field whose placeholder is a
      made-up string with the Stripe live-key prefix, only to demonstrate the
      width of a selectable block. It is not a key.

vulnerabilities:
  - id: GHSA-wrw7-89jp-8q8g
    paths:
      - 'agent/src-tauri/Cargo.lock'
    statement: >-
      glib 0.18 comes in through Tauri's Linux backend (wry, tao and gtk 0.18),
      which cannot move to glib 0.20 until Tauri does. The unsound code is the
      Iterator impl of glib::VariantStrIter, which Salam Agent never calls.
  - id: GO-2026-5932
    paths:
      - 'tests/en/apps/httpbench/bench/echo/go.mod'
      - 'tests/en/apps/httpbench/bench/gin/go.mod'
    statement: >-
      The advisory covers golang.org/x/crypto/openpgp, which is unmaintained
      and has no fixed release. These benchmark servers never import it: echo
      pulls in x/crypto for acme/autocert and gin for sha3, and
      `go list -deps ./...` finds no openpgp package in either build.

misconfigurations:
  - id: AVD-DS-0026
    paths:
      - 'sandbox/image/Dockerfile'
    statement: >-
      The sandbox image only holds a sleeping process that stands in for a
      user shell, so there is no service to probe.
