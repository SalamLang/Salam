<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Salam Agent</title>
    <link rel="icon" href="favicon.ico">
    <style>
    @font-face {
      font-family: "Shabnam";
      src: url("fonts/Shabnam.woff2") format("woff2");
      font-weight: 400;
    }
    @font-face {
      font-family: "Shabnam";
      src: url("fonts/Shabnam-Bold.woff2") format("woff2");
      font-weight: 700;
    }
    :root {
      --brand: #ff5c00;
      --bg: #ffffff;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --border: #e6e6e9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --brand: #ff6a1a;
        --bg: #141416;
        --text: #ececef;
        --muted: #9a9aa2;
        --border: #2c2c31;
      }
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Shabnam", Tahoma, sans-serif;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    main {
      text-align: center;
      max-width: 360px;
    }
    .mark {
      display: block;
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px;
    }
    p {
      color: var(--muted);
      margin: 0 0 20px;
      line-height: 1.8;
    }
    .spin {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      margin: 0 auto;
      animation: r 0.8s linear infinite;
    }
    @keyframes r {
      to {
        transform: rotate(360deg);
      }
    }
    #offline {
      display: none;
    }
    #offline:target {
      display: block;
    }
    #offline:target + #connecting {
      display: none;
    }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="logo.svg" alt="ایجنت سلام" width="64" height="64">
      <section id="offline">
        <h1>اتصال برقرار نشد</h1>
        <p>اتصال اینترنت را بررسی کنید. هر چند ثانیه دوباره تلاش می‌کنیم.</p>
        <div class="spin"></div>
      </section>
      <section id="connecting">
        <h1>ایجنت سلام در حال اتصال است</h1>
        <p>چند لحظه صبر کنید.</p>
        <div class="spin"></div>
      </section>
    </main>
  </body>
</html>
