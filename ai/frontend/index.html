<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <link rel="preconnect" href="<%= apiUrl %>" crossorigin>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>دستیار هوشمند سلام</title>
    <meta
      name="description"
      content="دستیار هوشمند زبان برنامه‌نویسی سلام؛ برای نوشتن، فهمیدن و اشکال‌زدایی کد سلام به زبان فارسی."
    >
    <meta name="generator" content="Salam">
    <meta name="theme-color" content="#ff5c00">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:title" content="دستیار هوشمند سلام">
    <meta
      property="og:description"
      content="دستیار هوشمند زبان برنامه‌نویسی سلام"
    >
    <meta
      property="og:image"
      content="https://www.salamlang.ir/assets/img/og-fa.png"
    >
    <script>
    var theme = "light";
    try {
      theme = localStorage.getItem("salam-ai-theme") || "";
      if (theme !== "light" && theme !== "dark")
        theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
    } catch {}
    document.documentElement.dataset.theme = theme;
    </script>
    <script>
    (() => {
      try {
        if (localStorage.getItem("salam-ai-token")) return;
        window.__salamProviders = fetch("<%= apiUrl %>/auth/providers")
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null);
      } catch (e) {}
    })();
    </script>
    <style>
    .boot {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .boot img {
      width: 56px;
      height: 56px;
      opacity: 0.85;
      animation: boot-pulse 1.2s ease-in-out infinite;
    }
    @keyframes boot-pulse {
      50% {
        opacity: 0.35;
      }
    }
    </style>
    <script>
    (() => {
      var tauri = window.__TAURI_INTERNALS__;
      if (!tauri || !tauri.invoke) return;
      function beat() {
        try {
          tauri.invoke("agent_alive").catch(() => {});
        } catch (e) {}
      }
      beat();
      setInterval(beat, 4000);
    })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <img src="/logo.svg" alt="" width="56" height="56">
      </div>
    </div>
  </body>
</html>
