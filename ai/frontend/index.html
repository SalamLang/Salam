      name="twitter:image:alt"

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.salamlang.ir/#org",
          "name": "SalamLang",
          "url": "https://www.salamlang.ir/",
          "logo": "https://ai.salamlang.ir/icon-512.png",
          "sameAs": ["https://github.com/SalamLang"]
        },
        {
          "@type": "WebSite",
          "@id": "https://ai.salamlang.ir/#site",
          "url": "https://ai.salamlang.ir/",
          "name": "دستیار هوشمند سلام",
          "alternateName": "Salam AI",
          "inLanguage": ["fa", "en"],
          "publisher": { "@id": "https://www.salamlang.ir/#org" }
        },
        {
          "@type": "WebApplication",
          "@id": "https://ai.salamlang.ir/#app",
          "name": "دستیار هوشمند سلام",
          "alternateName": "Salam AI",
          "url": "https://ai.salamlang.ir/",
          "description": "دستیار هوشمند زبان برنامه‌نویسی سلام برای نوشتن، فهمیدن، تبدیل و اشکال‌زدایی کد.",
          "applicationCategory": "DeveloperApplication",
          "operatingSystem": "Any",
          "browserRequirements": "Requires JavaScript",
          "inLanguage": ["fa", "en"],
          "image": "https://ai.salamlang.ir/og-ai.png",
          "publisher": { "@id": "https://www.salamlang.ir/#org" }
        }
      ]
    }
    </script>
    <script>
    var theme = "light";
    try {
      theme = localStorage.getItem("salam-ai-theme") || "";
      if (theme !== "light" && theme !== "dark")
        theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
    } catch {}
    document.documentElement.dataset.theme = theme;
    </script>
    <script>
    (() => {
      try {
        if (localStorage.getItem("salam-ai-token")) return;
        window.__salamProviders = fetch("<%= apiUrl %>/auth/providers")
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null);
      } catch (e) {}
    })();
    </script>
    <style>
    .boot {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .boot img {
      width: 56px;
      height: 56px;
      opacity: 0.85;
      animation: boot-pulse 1.2s ease-in-out infinite;
    }
    @keyframes boot-pulse {
      50% {
        opacity: 0.35;
      }
    }
    </style>
    <script>
    (() => {
      var tauri = window.__TAURI_INTERNALS__;
      if (!tauri || !tauri.invoke) return;
      function beat() {
        try {
          tauri.invoke("agent_alive").catch(() => {});
        } catch (e) {}
      }
      beat();
      setInterval(beat, 4000);
    })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <img src="/logo.svg" alt="" width="56" height="56">
      </div>
    </div>
  </body>
</html>
