---

services:
  bench:
    build:
      context: ../..
      dockerfile: benchmark/docker/Dockerfile
      target: bench
      args:
        ALPINE_VERSION: edge
        LLVM_VERSION: '22'
    image: salam-bench:latest
    init: true
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../RESULTS.md:/repo/benchmark/RESULTS.md
      - ../results:/repo/benchmark/results

  shell:
    build:
      context: ../..
      dockerfile: benchmark/docker/Dockerfile
      target: shell
      args:
        ALPINE_VERSION: edge
        LLVM_VERSION: '22'
    image: salam-bench:shell
    init: true
    stdin_open: true
    tty: true
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../..:/repo
    working_dir: /repo/benchmark
