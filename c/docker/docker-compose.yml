---
# Docker Compose for the Salam compiler.
#
# This file lives in c/docker/. The build context is the repo root (`../..`),
# since the image needs both the compiler tree (c/: src/, tools/, Makefile)
# and the standard library (std/, a sibling of c/). Run it from anywhere with:
#
#   Development (live reload):
#     docker compose -f c/docker/docker-compose.yml up dev
#   Production (build + run):
#     docker compose -f c/docker/docker-compose.yml run --rm prod build app.salam --output=app
#

services:
  dev:
    build:
      context: ../..
      dockerfile: c/docker/Dockerfile
      target: dev
      args:
        ALPINE_VERSION: edge
        LLVM_VERSION: '22'
    image: salam:dev
    init: true
    stdin_open: true
    tty: true
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../..:/repo
      - salam-build:/repo/c/build
    working_dir: /repo/c

  prod:
    build:
      context: ../..
      dockerfile: c/docker/Dockerfile
      target: prod
      args:
        ALPINE_VERSION: edge
        LLVM_VERSION: '22'
    image: salam:prod
    init: true
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../..:/work
    working_dir: /work
    command: ['help']

volumes:
  salam-build:
