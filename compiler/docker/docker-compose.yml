---
# Docker Compose for the Salam compiler.
#
# This file lives in compiler/docker/. The build context is the REPO ROOT
# (`../..`), not just compiler/ — std/ and tests/ live alongside compiler/
# post-self-host-restructure, and the self-hosted compiler needs std/ to run
# at all. Run it from anywhere with:
#
#   Development (live reload):
#     docker compose -f compiler/docker/docker-compose.yml up dev
#   Production (build + run):
#     docker compose -f compiler/docker/docker-compose.yml run --rm prod build app.salam --output=app
#

services:
  dev:
    build:
      context: ../..
      dockerfile: compiler/docker/Dockerfile
      target: dev
      args:
        ALPINE_VERSION: edge
        LLVM_VERSION: '22'
    image: salam:dev
    init: true
    stdin_open: true
    tty: true
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../..:/app
    working_dir: /app

  prod:
    build:
      context: ../..
      dockerfile: compiler/docker/Dockerfile
      target: prod
      args:
        ALPINE_VERSION: edge
        LLVM_VERSION: '22'
    image: salam:prod
    init: true
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../..:/work
    working_dir: /work
    command: ['help']
