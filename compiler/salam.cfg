# Local development config: resolve std/ from this checkout instead of the
# installed prefix. Used by a self-hosted salam binary built from this
# directory's *.salam sources (e.g. via `salam build main.salam -o salam`)
# and placed here. Path is relative to this file's directory (compiler/),
# so it works whether the binary was built natively on Windows, Linux, or
# under WSL.
stdlib = ../std
