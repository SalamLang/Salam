---
# Docker Compose for the minimal Salam runtime image (docker/Dockerfile).
#
# This file lives in docker/. The build context is docker/ itself (the
# image just downloads a prebuilt release, so it needs no repo source);
# the run-time bind mount points at the repo root (one level up) so you
# can run any .salam file in the repo. Run it from anywhere with:
#
#   docker compose -f docker/docker-compose.yml run --rm salam version
#   docker compose -f docker/docker-compose.yml run --rm salam run some_script.salam
#   docker compose -f docker/docker-compose.yml run --rm salam build some_script.salam -o app
#
# Pin a specific released version instead of latest:
#   SALAM_VERSION=0.2.8 docker compose -f docker/docker-compose.yml build
#

services:
  salam:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SALAM_VERSION: ${SALAM_VERSION:-}
    image: basemax/salam:${SALAM_VERSION:-latest}
    init: true
    stdin_open: true
    tty: true
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    security_opt:
      - no-new-privileges:true
    volumes:
      - ..:/work
    working_dir: /work
    command: ['help']
