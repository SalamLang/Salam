---
services:
  salam:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SALAM_VERSION: ${SALAM_VERSION:-}
    image: basemax/salam:${SALAM_VERSION:-latest}
    init: true
    stdin_open: true
    tty: true
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    security_opt:
      - no-new-privileges:true
    volumes:
      - ..:/work
    working_dir: /work
    command: ['help']
