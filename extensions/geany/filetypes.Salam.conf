[lexer_properties=C]
lexer.cpp.backquoted.strings=1

[settings]
lexer_filetype=C
extension=salam
comment_single=//
comment_open=/*
comment_close=*/
comment_use_indent=true
tag_parser=Salam
mime_type=text/x-salam

[indentation]
width=4
type=0
hard_tab_width=8

[build_settings]
error_regex=^(.+?):([0-9]+):[0-9]+: (?:fatal )?(?:error|warning)
