\nپایان\n"},{id:"temperature",mode:"app",title__en:"Temperature",title__fa:"تبدیل دما",code__en:"func main:\n    println \"Celsius -> Fahrenheit\"\n    repeat 0 to 40 by 10 in c:\n        f := (c as f64) * 9.0 / 5.0 + 32.0\n        println c, \"C =\", f, \"F\"\n    end\nend\n",code__fa:"تابع ریشه:\n    سرچاپ \"سلسیوس به فارنهایت\"\n    تکرار 0 تا 40 هر 10 در س:\n        ف := (س برگردان اعشار۶۴) * 9.0 / 5.0 + 32.0\n        سرچاپ س, \"س =\", ف, \"ف\"\n    پایان\nپایان\n"},{id:"layout",mode:"layout",title__en:"Web page",title__fa:"صفحه‌ی وب",code__en:"page:\n    title = \"My Page\"\n    lang = \"english\"\n    dir = \"left to right\"\n    header:\n        background = \"blue\"\n        color = \"white\"\n        padding = 24px\n        heading: size = 1 content = \"Welcome to Salam\" font size = 32px end\n    end\n    box:\n        padding = 20px\n        paragraph: content = \"This page was generated from Salam.\" end\n    end\nend\n",code__fa:"صفحه:\n    عنوان = \"برنامه‌ی من\"\n    زبان = \"فارسی\"\n    جهت = \"راست به چپ\"\n    سرصفحه:\n        پس‌زمینه = \"آبی\"\n        رنگ = \"سفید\"\n        فاصله داخلی = 24px\n        سرتیتر: اندازه = 1 محتوا = \"به سلام خوش آمدید\" پایان\n    پایان\n    جعبه:\n        فاصله داخلی = 20px\n        پاراگراف: محتوا = \"این صفحه از کد سلام ساخته شده است.\" پایان\n    پایان\nپایان\n"},{id:"collatz",mode:"app",title__en:"Collatz",title__fa:"دنباله‌ی کولاتز",code__en:"func main:\n    mut n := 27\n    mut steps := 0\n    println \"Collatz from\", n\n    until n != 1:\n        if n % 2 == 0: n /= 2\n        else:\n            n = 3 * n + 1\n        end\n        steps++\n    end\n    println \"reached 1 in\", steps, \"steps\"\nend\n",code__fa:"تابع ریشه:\n    ناپایا ن := 27\n    ناپایا گامها := 0\n    سرچاپ \"کولاتز از\", ن\n    تا ن نابرابر 1:\n        اگر ن % 2 برابر 0: ن /= 2\n        وگرنه:\n            ن = 3 * ن + 1\n        پایان\n        گامها++\n    پایان\n    سرچاپ \"در\", گامها, \"گام به ۱ رسید\"\nپایان\n"},{id:"lcm",mode:"app",title__en:"LCM",title__fa:"ک.م.م",code__en:"func gcd(a: int, b: int): int:\n    mut x := a\n    mut y := b\n    until y != 0:\n        t := y\n        y = x % y\n        x = t\n    end\n    ret x\nend\n\nfunc lcm(a: int, b: int): int: ret a / gcd(a, b) * b end\n\nfunc main:\n    println \"lcm(4, 6) =\", lcm(4, 6)\n    println \"lcm(21, 6) =\", lcm(21, 6)\nend\n",code__fa:"تابع بمم(الف: صحیح, ب: صحیح): صحیح:\n    ناپایا ایکس := الف\n    ناپایا ایگرگ := ب\n    تا ایگرگ نابرابر 0:\n        ت := ایگرگ\n        ایگرگ = ایکس % ایگرگ\n        ایکس = ت\n    پایان\n    برگشت ایکس\nپایان\n\nتابع کمم(الف: صحیح, ب: صحیح): صحیح: برگشت الف / بمم(الف, ب) * ب پایان\n\nتابع ریشه:\n    سرچاپ \"ک.م.م ۴ و ۶ =\", کمم(4, 6)\n    سرچاپ \"ک.م.م ۲۱ و ۶ =\", کمم(21, 6)\nپایان\n"},{id:"leap_year",mode:"app",title__en:"Leap year",title__fa:"سال کبیسه",code__en:"func is_leap(y: int): bool:\n    if y % 400 == 0: ret true\n    else y % 100 == 0: ret false\n    else:\n        ret y % 4 == 0\n    end\nend\n\nfunc main:\n    years := [1900, 2000, 2012, 2021, 2024]\n    repeat 5 in i:\n        if is_leap(years[i]): println years[i], \"is a leap year\"\n        else:\n            println years[i], \"is not a leap year\"\n        end\n    end\nend\n",code__fa:"تابع کبیسه است(سال: صحیح): منطقی:\n    اگر سال % 400 برابر 0: برگشت درست پایان\n    اگر سال % 100 برابر 0: برگشت نادرست پایان\n    برگشت سال % 4 برابر 0\nپایان\n\nتابع ریشه:\n    سالها := [1900, 2000, 2012, 2021, 2024]\n    تکرار 5 در i:\n        اگر کبیسه است(سالها[i]): سرچاپ سالها[i], \"کبیسه است\"\n        وگرنه:\n            سرچاپ سالها[i], \"کبیسه نیست\"\n        پایان\n    پایان\nپایان\n"},{id:"palindrome",mode:"app",title__en:"Palindrome number",title__fa:"عدد متقارن",code__en:"func is_palindrome(n: int): bool:\n    mut x := n\n    mut rev := 0\n    until x > 0:\n        rev = rev * 10 + x % 10\n        x /= 10\n    end\n    ret rev == n\nend\n\nfunc main:\n    nums := [121, 123, 1221, 13]\n    repeat 4 in i:\n        if is_palindrome(nums[i]): println nums[i], \"is a palindrome\"\n        else:\n            println nums[i], \"is not a palindrome\"\n        end\n    end\nend\n",code__fa:"تابع متقارن است(ن: صحیح): منطقی:\n    ناپایا ایکس := ن\n    ناپایا برعکس := 0\n    تا ایکس بزرگتر 0:\n        برعکس = برعکس * 10 + ایکس % 10\n        ایکس /= 10\n    پایان\n    برگشت برعکس برابر ن\nپایان\n\nتابع ریشه:\n    اعداد := [121, 123, 1221, 13]\n    تکرار 4 در i:\n        اگر متقارن است(اعداد[i]): سرچاپ اعداد[i], \"متقارن است\"\n        وگرنه:\n            سرچاپ اعداد[i], \"متقارن نیست\"\n        پایان\n    پایان\nپایان\n"},{id:"digit_sum",mode:"app",title__en:"Digit sum",title__fa:"جمع ارقام",code__en:"func digit_sum(n: int): int:\n    mut x := n\n    mut s := 0\n    until x > 0:\n        s += x % 10\n        x /= 10\n    end\n    ret s\nend\n\nfunc main:\n    println \"digit sum of 12345 =\", digit_sum(12345)\n    println \"digit sum of 99 =\", digit_sum(99)\nend\n",code__fa:"تابع جمع ارقام(ن: صحیح): صحیح:\n    ناپایا ایکس := ن\n    ناپایا مجموع := 0\n    تا ایکس بزرگتر 0:\n        مجموع += ایکس % 10\n        ایکس /= 10\n    پایان\n    برگشت مجموع\nپایان\n\nتابع ریشه:\n    سرچاپ \"جمع ارقام ۱۲۳۴۵ =\", جمع ارقام(12345)\n    سرچاپ \"جمع ارقام ۹۹ =\", جمع ارقام(99)\nپایان\n"},{id:"minmax",mode:"app",title__en:"Min & max",title__fa:"کمینه و بیشینه",code__en:"func main:\n    a := [5, 9, 1, 7, 3, 8, 2]\n    mut lo := a[0]\n    mut hi := a[0]\n    repeat 1 to 7 - 1 in i:\n        if a[i] < lo: lo = a[i] end\n        if a[i] > hi: hi = a[i] end\n    end\n    println \"min =\", lo, \"max =\", hi\nend\n",code__fa:"تابع ریشه:\n    آ := [5, 9, 1, 7, 3, 8, 2]\n    ناپایا کمینه := آ[0]\n    ناپایا بیشینه := آ[0]\n    تکرار 1 تا 7 - 1 در i:\n        اگر آ[i] کوچکتر کمینه: کمینه = آ[i] پایان\n        اگر آ[i] بزرگتر بیشینه: بیشینه = آ[i] پایان\n    پایان\n    سرچاپ \"کمینه =\", کمینه, \"بیشینه =\", بیشینه\nپایان\n"},{id:"average",mode:"app",title__en:"Average",title__fa:"میانگین",code__en:"func main:\n    a := [10, 20, 30, 40, 50, 60]\n    mut sum := 0\n    repeat 6 in i: sum += a[i] end\n    avg := (sum as f64) / 6.0\n    println \"sum =\", sum\n    println \"average =\", avg\nend\n",code__fa:"تابع ریشه:\n    آ := [10, 20, 30, 40, 50, 60]\n    ناپایا مجموع := 0\n    تکرار 6 در i: مجموع += آ[i] پایان\n    میانگین := (مجموع برگردان اعشار۶۴) / 6.0\n    سرچاپ \"مجموع =\", مجموع\n    سرچاپ \"میانگین =\", میانگین\nپایان\n"},{id:"count_vowels",mode:"app",title__en:"Count vowels",title__fa:"شمارش مصوت‌ها",code__en:"func main:\n    s := \"salam donya\"\n    mut count := 0\n    repeat s.Len() in i:\n        c := s.Substr(i, 1)\n        if c == \"a\" or c == \"e\" or c == \"i\" or c == \"o\" or c == \"u\":\n            count++\n        end\n    end\n    println \"vowels in\", s, \"=\", count\nend\n",code__fa:"تابع ریشه:\n    س := \"salam donya\"\n    ناپایا تعداد := 0\n    تکرار س.طول() در i:\n        ک := س.زیررشته(i, 1)\n        اگر ک برابر \"a\" یا ک برابر \"e\" یا ک برابر \"i\" یا ک برابر \"o\" یا ک برابر \"u\":\n            تعداد++\n        پایان\n    پایان\n    سرچاپ \"تعداد مصوت‌ها در\", س, \"=\", تعداد\nپایان\n"},{id:"star_triangle",mode:"app",title__en:"Star triangle",title__fa:"مثلث ستاره",code__en:"func main:\n    repeat 1 to 5 in row:\n        mut line := \"\"\n        repeat row: line += \"*\" end\n        println line\n    end\nend\n",code__fa:"تابع ریشه:\n    تکرار 1 تا 5 در ردیف:\n        ناپایا خط := \"\"\n        تکرار ردیف: خط += \"*\" پایان\n        سرچاپ خط\n    پایان\nپایان\n"},{id:"multiplication_table",mode:"app",title__en:"Times table",title__fa:"جدول ضرب",code__en:"func main:\n    repeat 1 to 5 in i:\n        mut line := \"\"\n        repeat 1 to 5 in j: line = line + (i * j) + \" \" end\n        println line\n    end\nend\n",code__fa:"تابع ریشه:\n    تکرار 1 تا 5 در i:\n        ناپایا خط := \"\"\n        تکرار 1 تا 5 در j: خط = خط + (i * j) + \" \" پایان\n        سرچاپ خط\n    پایان\nپایان\n"},{id:"dec_to_bin",mode:"app",title__en:"Decimal to binary",title__fa:"تبدیل به دودویی",code__en:"func to_binary(n: int): str:\n    if n == 0: ret \"0\" end\n    mut x := n\n    mut bits := \"\"\n    until x > 0:\n        bits = \"\" + (x % 2) + bits\n        x /= 2\n    end\n    ret bits\nend\n\nfunc main:\n    nums := [0, 5, 10, 255]\n    repeat 4 in i:\n        println nums[i], \"=\", to_binary(nums[i]), \"in binary\"\n    end\nend\n",code__fa:"تابع به دودویی(ن: صحیح): رشته:\n    اگر ن برابر 0: برگشت \"0\" پایان\n    ناپایا ایکس := ن\n    ناپایا بیتها := \"\"\n    تا ایکس بزرگتر 0:\n        بیتها = \"\" + (ایکس % 2) + بیتها\n        ایکس /= 2\n    پایان\n    برگشت بیتها\nپایان\n\nتابع ریشه:\n    اعداد := [0, 5, 10, 255]\n    تکرار 4 در i:\n        سرچاپ اعداد[i], \"در مبنای دو =\", به دودویی(اعداد[i])\n    پایان\nپایان\n"},{id:"prime_factors",mode:"app",title__en:"Prime factors",title__fa:"عوامل اول",code__en:"func main:\n    n := 360\n    mut x := n\n    mut line := \"\"\n    mut d := 2\n    until d * d <= x:\n        until x % d == 0:\n            line = line + d + \" \"\n            x /= d\n        end\n        d++\n    end\n    if x > 1: line = line + x + \" \" end\n    println n, \"=\", line\nend\n",code__fa:"تابع ریشه:\n    ن := 360\n    ناپایا ایکس := ن\n    ناپایا خط := \"\"\n    ناپایا د := 2\n    تا د * د کوچکتربرابر ایکس:\n        تا ایکس % د برابر 0:\n            خط = خط + د + \" \"\n            ایکس /= د\n        پایان\n        د++\n    پایان\n    اگر ایکس بزرگتر 1: خط = خط + ایکس + \" \" پایان\n    سرچاپ ن, \"=\", خط\nپایان\n"},{id:"power_iter",mode:"app",title__en:"Integer power",title__fa:"توان صحیح",code__en:"func power(base: int, exp: int): int:\n    mut result := 1\n    repeat exp: result *= base end\n    ret result\nend\n\nfunc main:\n    repeat 0 to 8 in e:\n        println \"2 ^\", e, \"=\", power(2, e)\n    end\nend\n",code__fa:"تابع توان(پایه: صحیح, نما: صحیح): صحیح:\n    ناپایا نتیجه := 1\n    تکرار نما: نتیجه *= پایه پایان\n    برگشت نتیجه\nپایان\n\nتابع ریشه:\n    تکرار 0 تا 8 در e:\n        سرچاپ \"۲ به توان\", e, \"=\", توان(2, e)\n    پایان\nپایان\n"},{id:"bank_account",mode:"app",title__en:"Bank account",title__fa:"حساب بانکی",code__en:"struct Account:\n    pub balance: int = 0\n    pub func deposit(n: int): this.balance += n end\n    pub func withdraw(n: int):\n        if n <= this.balance: this.balance -= n\n        else:\n            println \"insufficient funds\"\n        end\n    end\nend\n\nfunc main:\n    mut a := Account { balance = 100 }\n    a.deposit(50)\n    a.withdraw(30)\n    a.withdraw(200)\n    println \"balance =\", a.balance\nend\n",code__fa:"ساختار حساب:\n    همگانی موجودی: صحیح = 0\n    همگانی تابع واریز(مبلغ: صحیح): این.موجودی += مبلغ پایان\n    همگانی تابع برداشت(مبلغ: صحیح):\n        اگر مبلغ کوچکتربرابر این.موجودی: این.موجودی -= مبلغ\n        وگرنه:\n            سرچاپ \"موجودی کافی نیست\"\n        پایان\n    پایان\nپایان\n\nتابع ریشه:\n    ناپایا ح := حساب { موجودی = 100 }\n    ح.واریز(50)\n    ح.برداشت(30)\n    ح.برداشت(200)\n    سرچاپ \"موجودی =\", ح.موجودی\nپایان\n"},{id:"stack",mode:"app",title__en:"Stack",title__fa:"پشته",code__en:"func main:\n    mut s := Vector {} as Vector<int>\n    s.Push(1)\n    s.Push(2)\n    s.Push(3)\n    println \"size =\", s.Len()\n    until s.Len() > 0:\n        println \"pop\", s.Pop()\n    end\n    println \"size =\", s.Len()\nend\n",code__fa:"تابع ریشه:\n    ناپایا پشته := وکتور {} برگردان وکتور<صحیح>\n    پشته.بیفزا(1)\n    پشته.بیفزا(2)\n    پشته.بیفزا(3)\n    سرچاپ \"اندازه =\", پشته.طول() برگردان صحیح\n    تا پشته.طول() بزرگتر 0:\n        سرچاپ \"برداشت\", پشته.دربیاور()\n    پایان\n    سرچاپ \"اندازه =\", پشته.طول() برگردان صحیح\nپایان\n"},{id:"weekday",mode:"app",title__en:"Weekdays (enum)",title__fa:"روزهای هفته",code__en:"enum Day: Mon, Tue, Wed, Thu, Fri, Sat, Sun end\n\nfunc is_weekend(d: Day): bool: ret d == Day.Sat or d == Day.Sun end\n\nfunc main:\n    d := Day.Sat\n    println \"day index =\", d as int\n    if is_weekend(d): println \"it is the weekend\"\n    else:\n        println \"it is a weekday\"\n    end\nend\n",code__fa:"جداشمار روز: دوشنبه, سه شنبه, چهارشنبه, پنجشنبه, جمعه, شنبه, یکشنبه پایان\n\nتابع آخر هفته است(ر: روز): منطقی: برگشت ر برابر روز.شنبه یا ر برابر روز.یکشنبه پایان\n\nتابع ریشه:\n    ر := روز.شنبه\n    سرچاپ \"شماره‌ی روز =\", ر برگردان صحیح\n    اگر آخر هفته است(ر): سرچاپ \"آخر هفته است\"\n    وگرنه:\n        سرچاپ \"روز کاری است\"\n    پایان\nپایان\n"},{id:"counter_closure",mode:"app",title__en:"Counter closure",title__fa:"بستار شمارنده",code__en:"func make_counter(): func () int:\n    mut n := 0\n    ret ():\n        n++\n        ret n\n    end\nend\n\nfunc main:\n    next := make_counter()\n    println next(), next(), next(), next()\nend\n",code__fa:"تابع ساخت شمارنده(): تابع () صحیح:\n    ناپایا ن := 0\n    برگشت ():\n        ن++\n        برگشت ن\n    پایان\nپایان\n\nتابع ریشه:\n    بعدی := ساخت شمارنده()\n    سرچاپ بعدی(), بعدی(), بعدی(), بعدی()\nپایان\n"},{id:"acronym",mode:"app",title__en:"Acronym",title__fa:"سرنام",code__en:"func main:\n    phrase := \"salam azad multi platform\"\n    mut words := phrase.Split(\" \")\n    mut acro := \"\"\n    repeat words.Len() in i:\n        w := words.Get(i)\n        acro += w.Substr(0, 1)\n    end\n    println phrase, \"->\", acro\nend\n",code__fa:"تابع ریشه:\n    عبارت := \"salam azad multi platform\"\n    ناپایا کلمات := عبارت.بشکاف(\" \")\n    ناپایا سرنام := \"\"\n    تکرار کلمات.طول() در i:\n        ک := کلمات.بگیر(i)\n        سرنام += ک.زیررشته(0, 1)\n    پایان\n    سرچاپ عبارت, \"->\", سرنام\nپایان\n"},{id:"sqrt_newton",mode:"app",title__en:"Newton sqrt",title__fa:"جذر نیوتن",code__en:"func sqrt(x: f64): f64:\n    if x <= 0.0: ret 0.0 end\n    mut guess := x\n    repeat 20:\n        guess = (guess + x / guess) / 2.0\n    end\n    ret guess\nend\n\nfunc main:\n    vals := [2.0, 16.0, 50.0]\n    repeat 3 in i:\n        println \"sqrt of\", vals[i], \"~\", sqrt(vals[i])\n    end\nend\n",code__fa:"تابع جذر(ایکس: اعشار۶۴): اعشار۶۴:\n    اگر ایکس کوچکتربرابر 0.0: برگشت 0.0 پایان\n    ناپایا حدس := ایکس\n    تکرار 20:\n        حدس = (حدس + ایکس / حدس) / 2.0\n    پایان\n    برگشت حدس\nپایان\n\nتابع ریشه:\n    مقادیر := [2.0, 16.0, 50.0]\n    تکرار 3 در i:\n        سرچاپ \"جذر\", مقادیر[i], \"تقریباً\", جذر(مقادیر[i])\n    پایان\nپایان\n"},{id:"range_sum",mode:"app",title__en:"Range sum",title__fa:"مجموع بازه",code__en:"func main:\n    n := 100\n    mut sum := 0\n    repeat 1 to n in i: sum += i end\n    formula := n * (n + 1) / 2\n    println \"loop sum =\", sum\n    println \"formula  =\", formula\nend\n",code__fa:"تابع ریشه:\n    ن := 100\n    ناپایا مجموع := 0\n    تکرار 1 تا ن در i: مجموع += i پایان\n    فرمول := ن * (ن + 1) / 2\n    سرچاپ \"مجموع حلقه =\", مجموع\n    سرچاپ \"مجموع فرمول =\", فرمول\nپایان\n"}];let n=(-1);let aq=(ar,as)=>"";let at=(au,av)=>"";let aw=(ax,ay,az)=>"";let ba=(bb,bc)=>"";let bd=(be,bf)=>"";let bi=(-1);let bp=(-1);if(typeof document!=="undefined"&&document.readyState==="loading"){document.addEventListener("DOMContentLoaded",zv);}else{zv();}})();</script></body></html>
