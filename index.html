 aeb = 0; let aec = 0; let aed = 0; let aee = 0; const abt = 6; let abu = [4, 8, 12, 20, 30, 60]; let abv = 0; let abw = 0; let abx = 0; let aby = 0; let abz = 0; let aca = 0; let acb = 0; let acc = 0; let acd = 0; let ace = 0; let acf = "en"; let acg = 0; let ach = 2; let aci = 0; let acj = false; let ack = true; let acl = false; const hk = 32; const hn = [{ id: "hello", mode: "app", title__en: "Hello", title__fa: "سلام", code__en: "func main:\n    name := \"Salam\"\n    println \"Hello,\", name\n    println \"2 + 3 =\", 2 + 3\nend\n", code__fa: "روال ریشه:\n    نام := \"سلام\"\n    سرچاپ \"سلام،\", نام\n    سرچاپ \"۲ + ۳ =\", 2 + 3\nپایان\n" }, { id: "fizzbuzz", mode: "app", title__en: "FizzBuzz", title__fa: "فیزباز", code__en: "func main:\n    repeat 1 to 15 in i:\n        if i % 15 == 0: println \"FizzBuzz\"\n        else i % 3 == 0: println \"Fizz\"\n        else i % 5 == 0: println \"Buzz\"\n        else:\n            println i\n        end\n    end\nend\n", code__fa: "روال ریشه:\n    تکرار 1 تا 15 در i:\n        اگر i % 15 == 0: سرچاپ \"فیزباز\"\n        وگرنه i % 3 == 0: سرچاپ \"فیز\"\n        وگرنه i % 5 == 0: سرچاپ \"باز\"\n        وگرنه:\n            سرچاپ i\n        پایان\n    پایان\nپایان\n" }, { id: "factorial", mode: "app", title__en: "Factorial", title__fa: "فاکتوریل", code__en: "func fact(n: int): int:\n    if n <= 1: ret 1 end\n    ret n * fact(n - 1)\nend\n\nfunc main:\n    repeat 1 to 6 in i:\n        println i, \"! =\", fact(i)\n    end\nend\n", code__fa: "روال فاکتوریل(ن: صحیح): صحیح:\n    اگر ن <= 1: برگشت 1 پایان\n    برگشت ن * فاکتوریل(ن - 1)\nپایان\n\nروال ریشه:\n    تکرار 1 تا 6 در i:\n        سرچاپ i, \"! =\", فاکتوریل(i)\n    پایان\nپایان\n" }, { id: "fibonacci", mode: "app", title__en: "Fibonacci", title__fa: "فیبوناچی", code__en: "func fib(n: int): int:\n    if n < 2: ret n end\n    ret fib(n - 1) + fib(n - 2)\nend\n\nfunc main:\n    mut line := \"\"\n    repeat 12 in i: line = line + fib(i) + \" \" end\n    println \"Fibonacci:\", line\nend\n", code__fa: "روال فیب(ن: صحیح): صحیح:\n    اگر ن < 2: برگشت ن پایان\n    برگشت فیب(ن - 1) + فیب(ن - 2)\nپایان\n\nروال ریشه:\n    ناپایا خط := \"\"\n    تکرار 12 در i: خط = خط + فیب(i) + \" \" پایان\n    سرچاپ \"فیبوناچی:\", خط\nپایان\n" }, { id: "primes", mode: "app", title__en: "Primes", title__fa: "اعداد اول", code__en: "func is prime(n: int): bool:\n    if n < 2: ret false end\n    mut i := 2\n    until i * i <= n:\n        if n % i == 0: ret false end\n        i = i + 1\n    end\n    ret true\nend\n\nfunc main:\n    mut line := \"\"\n    repeat 2 to 30 in n:\n        if is prime(n): line = line + n + \" \" end\n    end\n    println \"Primes up to 30:\", line\nend\n", code__fa: "روال اول است(ن: صحیح): منطقی:\n    اگر ن < 2: برگشت نادرست پایان\n    ناپایا i := 2\n    تا i * i <= ن:\n        اگر ن % i == 0: برگشت نادرست پایان\n        i = i + 1\n    پایان\n    برگشت درست\nپایان\n\nروال ریشه:\n    ناپایا خط := \"\"\n    تکرار 2 تا 30 در ن:\n        اگر اول است(ن): خط = خط + ن + \" \" پایان\n    پایان\n    سرچاپ \"اعداد اول تا ۳۰:\", خط\nپایان\n" }, { id: "gcd", mode: "app", title__en: "GCD", title__fa: "ب.م.م", code__en: "func gcd(a: int, b: int): int:\n    mut x := a\n    mut y := b\n    until y != 0:\n        t := y\n        y = x % y\n        x = t\n    end\n    ret x\nend\n\nfunc main:\n    println \"gcd(48, 36) =\", gcd(48, 36)\n    println \"gcd(17, 5) =\", gcd(17, 5)\nend\n", code__fa: "روال بمم(الف: صحیح, ب: صحیح): صحیح:\n    ناپایا ایکس := الف\n    ناپایا ایگرگ := ب\n    تا ایگرگ != 0:\n        ت := ایگرگ\n        ایگرگ = ایکس % ایگرگ\n        ایکس = ت\n    پایان\n    برگشت ایکس\nپایان\n\nروال ریشه:\n    سرچاپ \"ب.م.م ۴۸ و ۳۶ =\", بمم(48, 36)\n    سرچاپ \"ب.م.م ۱۷ و ۵ =\", بمم(17, 5)\nپایان\n" }, { id: "bubblesort", mode: "app", title__en: "Bubble sort", title__fa: "مرتب‌سازی حبابی", code__en: "func main:\n    mut a := [5, 2, 8, 1, 9, 3]\n    repeat 6 in i:\n        repeat 5 - i in j:\n            if a[j] > a[j + 1]:\n                t := a[j]\n                a[j] = a[j + 1]\n                a[j + 1] = t\n            end\n        end\n    end\n    mut line := \"\"\n    repeat 6 in k: line = line + a[k] + \" \" end\n    println \"Sorted:\", line\nend\n", code__fa: "روال ریشه:\n    ناپایا آ := [5, 2, 8, 1, 9, 3]\n    تکرار 6 در i:\n        تکرار 5 - i در ج:\n            اگر آ[ج] > آ[ج + 1]:\n                ت := آ[ج]\n                آ[ج] = آ[ج + 1]\n                آ[ج + 1] = ت\n            پایان\n        پایان\n    پایان\n    ناپایا خط := \"\"\n    تکرار 6 در ک: خط = خط + آ[ک] + \" \" پایان\n    سرچاپ \"مرتب‌شده:\", خط\nپایان\n" }, { id: "reverse", mode: "app", title__en: "Reverse string", title__fa: "وارونه‌سازی رشته", code__en: "func main:\n    s := \"Salam\"\n    mut r := \"\"\n    mut i := s.len() - 1\n    until i >= 0:\n        r = r.concat(s.substr(i, 1))\n        i = i - 1\n    end\n    println \"reverse of\", s, \"is\", r\nend\n", code__fa: "روال ریشه:\n    س := \"Salam\"\n    ناپایا ر := \"\"\n    ناپایا i := س.طول() - 1\n    تا i >= 0:\n        ر = ر.پیوست(س.زیررشته(i, 1))\n        i = i - 1\n    پایان\n    سرچاپ \"وارونه‌ی\", س, \"می‌شود\", ر\nپایان\n" }, { id: "rectangle", mode: "app", title__en: "Struct: Rectangle", title__fa: "ساختار: مستطیل", code__en: "struct Rect:\n    pub w: f64 = 0.0\n    pub h: f64 = 0.0\n    pub func area(): f64: ret this.w * this.h end\n    pub func perimeter(): f64: ret 2.0 * (this.w + this.h) end\nend\n\nfunc main:\n    r := Rect { w = 4.0, h = 3.0 }\n    println \"area =\", r.area()\n    println \"perimeter =\", r.perimeter()\nend\n", code__fa: "ساختار مستطیل:\n    طول: اعشار۶۴ = 0.0\n    عرض: اعشار۶۴ = 0.0\n    همگانی روال مساحت(): اعشار۶۴: برگشت این.طول * این.عرض پایان\n    همگانی روال محیط(): اعشار۶۴: برگشت 2.0 * (این.طول + این.عرض) پایان\nپایان\n\nروال ریشه:\n    ر := مستطیل { طول = 4.0, عرض = 3.0 }\n    سرچاپ \"مساحت =\", ر.مساحت()\n    سرچاپ \"محیط =\", ر.محیط()\nپایان\n" }, { id: "wordcount", mode: "app", title__en: "Word count (HashMap)", title__fa: "شمارش کلمات", code__en: "func main:\n    text := \"the cat the dog the bird\"\n    mut words := text.split(\" \")\n    mut counts := HashMap {} as HashMap<str, int> repeat words.len() in i: w := words.get(i)\n    if counts.has(w): counts.put(w, counts.get(w) + 1)\n    else:\n        counts.put(w, 1)\n    end\nend\nmut it := counts.iter()\nuntil it.has_next():\n    println it.key(), \"->\", it.value()\n    it.next()\nend\nend\n", code__fa: "روال ریشه:\n    متن := \"گربه سگ گربه پرنده گربه\"\n    ناپایا کلمات := متن.بشکاف(\" \")\n    ناپایا آمار := نگاشت {} برگردان نگاشت<رشته, صحیح> تکرار کلمات.طول() در i: ک := کلمات.بگیر(i)\n    اگر آمار.دارد(ک): آمار.درج(ک, آمار.بگیر(ک) + 1)\n    وگرنه:\n        آمار.درج(ک, 1)\n    پایان\nپایان\nناپایا پیمایه := آمار.پیمایش()\nتا پیمایه.داردبعدی():\n    سرچاپ پیمایه.کلید(), \"->\", پیمایه.مقدار()\n    پیمایه.بعدی()\nپایان\nپایان\n" }, { id: "temperature", mode: "app", title__en: "Temperature", title__fa: "تبدیل دما", code__en: "func main:\n    println \"Celsius -> Fahrenheit\"\n    repeat 0 to 40 by 10 in c:\n        f := (c as f64) * 9.0 / 5.0 + 32.0\n        println c, \"C =\", f, \"F\"\n    end\nend\n", code__fa: "روال ریشه:\n    سرچاپ \"سلسیوس به فارنهایت\"\n    تکرار 0 تا 40 هر 10 در س:\n        ف := (س برگردان اعشار۶۴) * 9.0 / 5.0 + 32.0\n        سرچاپ س, \"س =\", ف, \"ف\"\n    پایان\nپایان\n" }, { id: "layout", mode: "layout", title__en: "Web page", title__fa: "صفحه‌ی وب", code__en: "layout:\n    title = \"My Page\"\n    lang = \"english\"\n    dir = \"left to right\"\n    header:\n        background = \"blue\"\n        color = \"white\"\n        padding = \"24px\"\n        heading: size = 1 content = \"Welcome to Salam\" font_size = \"32px\" end\n    end\n    box:\n        padding = \"20px\"\n        paragraph: content = \"This page was generated from Salam.\" end\n    end\nend\n", code__fa: "چیدمان:\n    عنوان = \"برنامه‌ی من\"\n    زبان = \"فارسی\"\n    جهت = \"راست به چپ\"\n    سرصفحه:\n        پس‌زمینه = \"آبی\"\n        رنگ = \"سفید\"\n        فاصله داخلی = \"24px\"\n        سرتیتر: اندازه = 1 محتوا = \"به سلام خوش آمدید\" پایان\n    پایان\n    جعبه:\n        فاصله داخلی = \"20px\"\n        پاراگراف: محتوا = \"این صفحه از کد سلام ساخته شده است.\" پایان\n    پایان\nپایان\n" }, { id: "collatz", mode: "app", title__en: "Collatz", title__fa: "دنباله‌ی کولاتز", code__en: "func main:\n    mut n := 27\n    mut steps := 0\n    println \"Collatz from\", n\n    until n != 1:\n        if n % 2 == 0: n = n / 2\n        else:\n            n = 3 * n + 1\n        end\n        steps = steps + 1\n    end\n    println \"reached 1 in\", steps, \"steps\"\nend\n", code__fa: "روال ریشه:\n    ناپایا ن := 27\n    ناپایا گامها := 0\n    سرچاپ \"کولاتز از\", ن\n    تا ن != 1:\n        اگر ن % 2 == 0: ن = ن / 2\n        وگرنه:\n            ن = 3 * ن + 1\n        پایان\n        گامها = گامها + 1\n    پایان\n    سرچاپ \"در\", گامها, \"گام به ۱ رسید\"\nپایان\n" }, { id: "lcm", mode: "app", title__en: "LCM", title__fa: "ک.م.م", code__en: "func gcd(a: int, b: int): int:\n    mut x := a\n    mut y := b\n    until y != 0:\n        t := y\n        y = x % y\n        x = t\n    end\n    ret x\nend\n\nfunc lcm(a: int, b: int): int: ret a / gcd(a, b) * b end\n\nfunc main:\n    println \"lcm(4, 6) =\", lcm(4, 6)\n    println \"lcm(21, 6) =\", lcm(21, 6)\nend\n", code__fa: "روال بمم(الف: صحیح, ب: صحیح): صحیح:\n    ناپایا ایکس := الف\n    ناپایا ایگرگ := ب\n    تا ایگرگ != 0:\n        ت := ایگرگ\n        ایگرگ = ایکس % ایگرگ\n        ایکس = ت\n    پایان\n    برگشت ایکس\nپایان\n\nروال کمم(الف: صحیح, ب: صحیح): صحیح: برگشت الف / بمم(الف, ب) * ب پایان\n\nروال ریشه:\n    سرچاپ \"ک.م.م ۴ و ۶ =\", کمم(4, 6)\n    سرچاپ \"ک.م.م ۲۱ و ۶ =\", کمم(21, 6)\nپایان\n" }, { id: "leap_year", mode: "app", title__en: "Leap year", title__fa: "سال کبیسه", code__en: "func is leap(y: int): bool:\n    if y % 400 == 0: ret true\n    else y % 100 == 0: ret false\n    else:\n        ret y % 4 == 0\n    end\nend\n\nfunc main:\n    years := [1900, 2000, 2012, 2021, 2024]\n    repeat 5 in i:\n        if is leap(years[i]): println years[i], \"is a leap year\"\n        else:\n            println years[i], \"is not a leap year\"\n        end\n    end\nend\n", code__fa: "روال کبیسه است(سال: صحیح): منطقی:\n    اگر سال % 400 == 0: برگشت درست پایان\n    اگر سال % 100 == 0: برگشت نادرست پایان\n    برگشت سال % 4 == 0\nپایان\n\nروال ریشه:\n    سالها := [1900, 2000, 2012, 2021, 2024]\n    تکرار 5 در i:\n        اگر کبیسه است(سالها[i]): سرچاپ سالها[i], \"کبیسه است\"\n        وگرنه:\n            سرچاپ سالها[i], \"کبیسه نیست\"\n        پایان\n    پایان\nپایان\n" }, { id: "palindrome", mode: "app", title__en: "Palindrome number", title__fa: "عدد متقارن", code__en: "func is palindrome(n: int): bool:\n    mut x := n\n    mut rev := 0\n    until x > 0:\n        rev = rev * 10 + x % 10\n        x = x / 10\n    end\n    ret rev == n\nend\n\nfunc main:\n    nums := [121, 123, 1221, 13]\n    repeat 4 in i:\n        if is palindrome(nums[i]): println nums[i], \"is a palindrome\"\n        else:\n            println nums[i], \"is not a palindrome\"\n        end\n    end\nend\n", code__fa: "روال متقارن است(ن: صحیح): منطقی:\n    ناپایا ایکس := ن\n    ناپایا برعکس := 0\n    تا ایکس > 0:\n        برعکس = برعکس * 10 + ایکس % 10\n        ایکس = ایکس / 10\n    پایان\n    برگشت برعکس == ن\nپایان\n\nروال ریشه:\n    اعداد := [121, 123, 1221, 13]\n    تکرار 4 در i:\n        اگر متقارن است(اعداد[i]): سرچاپ اعداد[i], \"متقارن است\"\n        وگرنه:\n            سرچاپ اعداد[i], \"متقارن نیست\"\n        پایان\n    پایان\nپایان\n" }, { id: "digit_sum", mode: "app", title__en: "Digit sum", title__fa: "جمع ارقام", code__en: "func digit sum(n: int): int:\n    mut x := n\n    mut s := 0\n    until x > 0:\n        s = s + x % 10\n        x = x / 10\n    end\n    ret s\nend\n\nfunc main:\n    println \"digit sum of 12345 =\", digit sum(12345)\n    println \"digit sum of 99 =\", digit sum(99)\nend\n", code__fa: "روال جمع ارقام(ن: صحیح): صحیح:\n    ناپایا ایکس := ن\n    ناپایا مجموع := 0\n    تا ایکس > 0:\n        مجموع = مجموع + ایکس % 10\n        ایکس = ایکس / 10\n    پایان\n    برگشت مجموع\nپایان\n\nروال ریشه:\n    سرچاپ \"جمع ارقام ۱۲۳۴۵ =\", جمع ارقام(12345)\n    سرچاپ \"جمع ارقام ۹۹ =\", جمع ارقام(99)\nپایان\n" }, { id: "minmax", mode: "app", title__en: "Min & max", title__fa: "کمینه و بیشینه", code__en: "func main:\n    a := [5, 9, 1, 7, 3, 8, 2]\n    mut lo := a[0]\n    mut hi := a[0]\n    repeat 1 to 7 - 1 in i:\n        if a[i] < lo: lo = a[i] end\n        if a[i] > hi: hi = a[i] end\n    end\n    println \"min =\", lo, \"max =\", hi\nend\n", code__fa: "روال ریشه:\n    آ := [5, 9, 1, 7, 3, 8, 2]\n    ناپایا کمینه := آ[0]\n    ناپایا بیشینه := آ[0]\n    تکرار 1 تا 7 - 1 در i:\n        اگر آ[i] < کمینه: کمینه = آ[i] پایان\n        اگر آ[i] > بیشینه: بیشینه = آ[i] پایان\n    پایان\n    سرچاپ \"کمینه =\", کمینه, \"بیشینه =\", بیشینه\nپایان\n" }, { id: "average", mode: "app", title__en: "Average", title__fa: "میانگین", code__en: "func main:\n    a := [10, 20, 30, 40, 50, 60]\n    mut sum := 0\n    repeat 6 in i: sum = sum + a[i] end\n    avg := (sum as f64) / 6.0\n    println \"sum =\", sum\n    println \"average =\", avg\nend\n", code__fa: "روال ریشه:\n    آ := [10, 20, 30, 40, 50, 60]\n    ناپایا مجموع := 0\n    تکرار 6 در i: مجموع = مجموع + آ[i] پایان\n    میانگین := (مجموع برگردان اعشار۶۴) / 6.0\n    سرچاپ \"مجموع =\", مجموع\n    سرچاپ \"میانگین =\", میانگین\nپایان\n" }, { id: "count_vowels", mode: "app", title__en: "Count vowels", title__fa: "شمارش مصوت‌ها", code__en: "func main:\n    s := \"salam donya\"\n    mut count := 0\n    repeat s.len() in i:\n        c := s.substr(i, 1)\n        if c == \"a\" or c == \"e\" or c == \"i\" or c == \"o\" or c == \"u\":\n            count = count + 1\n        end\n    end\n    println \"vowels in\", s, \"=\", count\nend\n", code__fa: "روال ریشه:\n    س := \"salam donya\"\n    ناپایا تعداد := 0\n    تکرار س.طول() در i:\n        ک := س.زیررشته(i, 1)\n        اگر ک == \"a\" یا ک == \"e\" یا ک == \"i\" یا ک == \"o\" یا ک == \"u\":\n            تعداد = تعداد + 1\n        پایان\n    پایان\n    سرچاپ \"تعداد مصوت‌ها در\", س, \"=\", تعداد\nپایان\n" }, { id: "star_triangle", mode: "app", title__en: "Star triangle", title__fa: "مثلث ستاره", code__en: "func main:\n    repeat 1 to 5 in row:\n        mut line := \"\"\n        repeat row: line = line + \"*\" end\n        println line\n    end\nend\n", code__fa: "روال ریشه:\n    تکرار 1 تا 5 در ردیف:\n        ناپایا خط := \"\"\n        تکرار ردیف: خط = خط + \"*\" پایان\n        سرچاپ خط\n    پایان\nپایان\n" }, { id: "multiplication_table", mode: "app", title__en: "Times table", title__fa: "جدول ضرب", code__en: "func main:\n    repeat 1 to 5 in i:\n        mut line := \"\"\n        repeat 1 to 5 in j: line = line + (i * j) + \" \" end\n        println line\n    end\nend\n", code__fa: "روال ریشه:\n    تکرار 1 تا 5 در i:\n        ناپایا خط := \"\"\n        تکرار 1 تا 5 در j: خط = خط + (i * j) + \" \" پایان\n        سرچاپ خط\n    پایان\nپایان\n" }, { id: "dec_to_bin", mode: "app", title__en: "Decimal to binary", title__fa: "تبدیل به دودویی", code__en: "func to_binary(n: int): str:\n    if n == 0: ret \"0\" end\n    mut x := n\n    mut bits := \"\"\n    until x > 0:\n        bits = \"\" + (x % 2) + bits\n        x = x / 2\n    end\n    ret bits\nend\n\nfunc main:\n    nums := [0, 5, 10, 255]\n    repeat 4 in i:\n        println nums[i], \"=\", to_binary(nums[i]), \"in binary\"\n    end\nend\n", code__fa: "روال به دودویی(ن: صحیح): رشته:\n    اگر ن == 0: برگشت \"0\" پایان\n    ناپایا ایکس := ن\n    ناپایا بیتها := \"\"\n    تا ایکس > 0:\n        بیتها = \"\" + (ایکس % 2) + بیتها\n        ایکس = ایکس / 2\n    پایان\n    برگشت بیتها\nپایان\n\nروال ریشه:\n    اعداد := [0, 5, 10, 255]\n    تکرار 4 در i:\n        سرچاپ اعداد[i], \"در مبنای دو =\", به دودویی(اعداد[i])\n    پایان\nپایان\n" }, { id: "prime_factors", mode: "app", title__en: "Prime factors", title__fa: "عوامل اول", code__en: "func main:\n    n := 360\n    mut x := n\n    mut line := \"\"\n    mut d := 2\n    until d * d <= x:\n        until x % d == 0:\n            line = line + d + \" \"\n            x = x / d\n        end\n        d = d + 1\n    end\n    if x > 1: line = line + x + \" \" end\n    println n, \"=\", line\nend\n", code__fa: "روال ریشه:\n    ن := 360\n    ناپایا ایکس := ن\n    ناپایا خط := \"\"\n    ناپایا د := 2\n    تا د * د <= ایکس:\n        تا ایکس % د == 0:\n            خط = خط + د + \" \"\n            ایکس = ایکس / د\n        پایان\n        د = د + 1\n    پایان\n    اگر ایکس > 1: خط = خط + ایکس + \" \" پایان\n    سرچاپ ن, \"=\", خط\nپایان\n" }, { id: "power_iter", mode: "app", title__en: "Integer power", title__fa: "توان صحیح", code__en: "func power(base: int, exp: int): int:\n    mut result := 1\n    repeat exp: result = result * base end\n    ret result\nend\n\nfunc main:\n    repeat 0 to 8 in e:\n        println \"2 ^\", e, \"=\", power(2, e)\n    end\nend\n", code__fa: "روال توان(پایه: صحیح, نما: صحیح): صحیح:\n    ناپایا نتیجه := 1\n    تکرار نما: نتیجه = نتیجه * پایه پایان\n    برگشت نتیجه\nپایان\n\nروال ریشه:\n    تکرار 0 تا 8 در e:\n        سرچاپ \"۲ به توان\", e, \"=\", توان(2, e)\n    پایان\nپایان\n" }, { id: "bank_account", mode: "app", title__en: "Bank account", title__fa: "حساب بانکی", code__en: "struct Account:\n    pub balance: int = 0\n    pub func deposit(n: int): this.balance = this.balance + n end\n    pub func withdraw(n: int):\n        if n <= this.balance: this.balance = this.balance - n\n        else:\n            println \"insufficient funds\"\n        end\n    end\nend\n\nfunc main:\n    mut a := Account { balance = 100 }\n    a.deposit(50)\n    a.withdraw(30)\n    a.withdraw(200)\n    println \"balance =\", a.balance\nend\n", code__fa: "ساختار حساب:\n    همگانی موجودی: صحیح = 0\n    همگانی روال واریز(مبلغ: صحیح): این.موجودی = این.موجودی + مبلغ پایان\n    همگانی روال برداشت(مبلغ: صحیح):\n        اگر مبلغ <= این.موجودی: این.موجودی = این.موجودی - مبلغ\n        وگرنه:\n            سرچاپ \"موجودی کافی نیست\"\n        پایان\n    پایان\nپایان\n\nروال ریشه:\n    ناپایا ح := حساب { موجودی = 100 }\n    ح.واریز(50)\n    ح.برداشت(30)\n    ح.برداشت(200)\n    سرچاپ \"موجودی =\", ح.موجودی\nپایان\n" }, { id: "stack", mode: "app", title__en: "Stack", title__fa: "پشته", code__en: "func main:\n    mut s := Vector {} as Vector<int> s.push(1)\n    s.push(2)\n    s.push(3)\n    println \"size =\", s.len()\n    until s.len() > 0:\n        println \"pop\", s.pop()\n    end\n    println \"size =\", s.len()\nend\n", code__fa: "روال ریشه:\n    ناپایا پشته := وکتور {} برگردان وکتور<صحیح> پشته.بیفزا(1)\n    پشته.بیفزا(2)\n    پشته.بیفزا(3)\n    سرچاپ \"اندازه =\", پشته.طول() برگردان صحیح\n    تا پشته.طول() > 0:\n        سرچاپ \"برداشت\", پشته.دربیاور()\n    پایان\n    سرچاپ \"اندازه =\", پشته.طول() برگردان صحیح\nپایان\n" }, { id: "weekday", mode: "app", title__en: "Weekdays (enum)", title__fa: "روزهای هفته", code__en: "enum Day: Mon, Tue, Wed, Thu, Fri, Sat, Sun end\n\nfunc is weekend(d: Day): bool: ret d == Day.Sat or d == Day.Sun end\n\nfunc main:\n    d := Day.Sat\n    println \"day index =\", d as int\n    if is weekend(d): println \"it is the weekend\"\n    else:\n        println \"it is a weekday\"\n    end\nend\n", code__fa: "جداشمار روز: دوشنبه, سه_شنبه, چهارشنبه, پنجشنبه, جمعه, شنبه, یکشنبه پایان\n\nروال آخرهفته_است(ر: روز): منطقی: برگشت ر == روز.شنبه یا ر == روز.یکشنبه پایان\n\nروال ریشه:\n    ر := روز.شنبه\n    سرچاپ \"شماره‌ی روز =\", ر برگردان صحیح\n    اگر آخرهفته_است(ر): سرچاپ \"آخر هفته است\"\n    وگرنه:\n        سرچاپ \"روز کاری است\"\n    پایان\nپایان\n" }, { id: "counter_closure", mode: "app", title__en: "Counter closure", title__fa: "بستار شمارنده", code__en: "func make counter(): func () int:\n    mut n := 0\n    ret ():\n        n = n + 1\n        ret n\n    end\nend\n\nfunc main:\n    next := make counter()\n    println next(), next(), next(), next()\nend\n", code__fa: "روال ساخت شمارنده(): روال () صحیح:\n    ناپایا ن := 0\n    برگشت ():\n        ن = ن + 1\n        برگشت ن\n    پایان\nپایان\n\nروال ریشه:\n    بعدی := ساخت شمارنده()\n    سرچاپ بعدی(), بعدی(), بعدی(), بعدی()\nپایان\n" }, { id: "acronym", mode: "app", title__en: "Acronym", title__fa: "سرنام", code__en: "func main:\n    phrase := \"salam azad multi platform\"\n    mut words := phrase.split(\" \")\n    mut acro := \"\"\n    repeat words.len() in i:\n        w := words.get(i)\n        acro = acro + w.substr(0, 1)\n    end\n    println phrase, \"->\", acro\nend\n", code__fa: "روال ریشه:\n    عبارت := \"salam azad multi platform\"\n    ناپایا کلمات := عبارت.بشکاف(\" \")\n    ناپایا سرنام := \"\"\n    تکرار کلمات.طول() در i:\n        ک := کلمات.بگیر(i)\n        سرنام = سرنام + ک.زیررشته(0, 1)\n    پایان\n    سرچاپ عبارت, \"->\", سرنام\nپایان\n" }, { id: "sqrt_newton", mode: "app", title__en: "Newton sqrt", title__fa: "جذر نیوتن", code__en: "func sqrt(x: f64): f64:\n    if x <= 0.0: ret 0.0 end\n    mut guess := x\n    repeat 20:\n        guess = (guess + x / guess) / 2.0\n    end\n    ret guess\nend\n\nfunc main:\n    vals := [2.0, 16.0, 50.0]\n    repeat 3 in i:\n        println \"sqrt of\", vals[i], \"~\", sqrt(vals[i])\n    end\nend\n", code__fa: "روال جذر(ایکس: اعشار۶۴): اعشار۶۴:\n    اگر ایکس <= 0.0: برگشت 0.0 پایان\n    ناپایا حدس := ایکس\n    تکرار 20:\n        حدس = (حدس + ایکس / حدس) / 2.0\n    پایان\n    برگشت حدس\nپایان\n\nروال ریشه:\n    مقادیر := [2.0, 16.0, 50.0]\n    تکرار 3 در i:\n        سرچاپ \"جذر\", مقادیر[i], \"تقریباً\", جذر(مقادیر[i])\n    پایان\nپایان\n" }, { id: "range_sum", mode: "app", title__en: "Range sum", title__fa: "مجموع بازه", code__en: "func main:\n    n := 100\n    mut sum := 0\n    repeat 1 to n in i: sum = sum + i end\n    formula := n * (n + 1) / 2\n    println \"loop sum =\", sum\n    println \"formula  =\", formula\nend\n", code__fa: "روال ریشه:\n    ن := 100\n    ناپایا مجموع := 0\n    تکرار 1 تا ن در i: مجموع = مجموع + i پایان\n    فرمول := ن * (ن + 1) / 2\n    سرچاپ \"مجموع حلقه =\", مجموع\n    سرچاپ
