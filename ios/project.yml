---
name: Salam
options:
  bundleIdPrefix: ir.salamlang
  deploymentTarget:
    iOS: '15.0'
  developmentLanguage: fa
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: ${SALAM_VERSION}
    CURRENT_PROJECT_VERSION: ${SALAM_BUILD}
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    DEAD_CODE_STRIPPING: YES
targets:
  Salam:
    type: application
    platform: iOS
    deploymentTarget: '15.0'
    scheme: {}
    sources:
      - path: Salam/Sources
      - path: Salam/Resources
      - path: ../mobile/engine/salam_engine.c
      - path: ../mobile/engine/ios_compat.c
      - path: build/engine/gen
        compilerFlags: '-w -Dmain=salam_engine_main -fno-strict-aliasing -fno-finite-loops -O2'
      - path: build/std
        type: folder
        buildPhase: resources
      - path: build/examples
        type: folder
        buildPhase: resources
      - path: build/cacert.pem
        buildPhase: resources
    dependencies:
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.salamlang.app
        PRODUCT_NAME: Salam
        SWIFT_OBJC_BRIDGING_HEADER: Salam/Sources/Salam-Bridging-Header.h
        HEADER_SEARCH_PATHS: '$(SRCROOT)/../mobile/engine'
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Salam/Info.plist
      properties:
        CFBundleDisplayName: Salam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [fa, en]
        CFBundleDevelopmentRegion: fa
        UILaunchScreen:
          UIImageName: Logo
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
