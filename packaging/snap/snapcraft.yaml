---
name: salam
base: core24
version: '@VERSION@'
summary: General-purpose systems programming language with a built-in DSL
description: |
  Salam is a general-purpose and systems programming language with a built-in
  domain-specific language for describing user interfaces. It ships an
  interpreter, a C backend and an embedded LLVM backend that can cross-compile
  and JIT with no other toolchain installed.

grade: stable
confinement: classic
license: GPL-3.0-or-later
source-code: https://github.com/SalamLang/Salam
issues: https://github.com/SalamLang/Salam/issues

platforms:
  amd64:
  arm64:

apps:
  salam:
    command: bin/salam
    environment:
      SALAM_STD: $SNAP/lib/salam/std

parts:
  salam:
    plugin: nil
    source: https://github.com/SalamLang/Salam/releases/download/v@VERSION@/salam-@VERSION@-linux-$CRAFT_ARCH_BUILD_FOR_RELEASE.tar.gz
    source-type: tar
    override-pull: |
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) rel=x86_64 ;;
        arm64) rel=aarch64 ;;
        *) echo "unsupported arch $CRAFT_ARCH_BUILD_FOR" >&2; exit 1 ;;
      esac
      url="https://github.com/SalamLang/Salam/releases/download/v@VERSION@/salam-@VERSION@-linux-$rel.tar.gz"
      curl -fsSL "$url" -o salam.tar.gz
      tar -xzf salam.tar.gz --strip-components=1
      rm -f salam.tar.gz
    override-build: |
      install -Dm755 salam "$CRAFT_PART_INSTALL/lib/salam/salam"
      mkdir -p "$CRAFT_PART_INSTALL/lib/salam/std"
      cp -a std/. "$CRAFT_PART_INSTALL/lib/salam/std/"
      [ -d sysroots ] && cp -a sysroots "$CRAFT_PART_INSTALL/lib/salam/sysroots"
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      cat > "$CRAFT_PART_INSTALL/bin/salam" <<'EOF'
      #!/bin/sh
      export SALAM_STD="${SALAM_STD:-$SNAP/lib/salam/std}"
      exec "$SNAP/lib/salam/salam" "$@"
      EOF
      chmod 755 "$CRAFT_PART_INSTALL/bin/salam"
    build-packages:
      - curl
    stage-packages:
      - libxml2
      - libtinfo6
