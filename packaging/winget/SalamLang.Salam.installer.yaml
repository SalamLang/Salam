# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
---
PackageIdentifier: SalamLang.Salam
PackageVersion: '@VERSION@'
InstallerType: zip
NestedInstallerType: portable
# salam.exe resolves its standard library from the directory it sits in, so
# the whole extracted folder has to go on PATH rather than a shimmed symlink.
ArchiveBinariesDependOnPath: true
ReleaseDate: '@RELEASE_DATE@'
Installers:
  - Architecture: x64
    NestedInstallerFiles:
      - RelativeFilePath: salam-windows\salam.exe
        PortableCommandAlias: salam
    InstallerUrl: https://github.com/SalamLang/Salam/releases/download/v@VERSION@/salam-@VERSION@-windows-x86_64.zip
    InstallerSha256: '@SHA256_WINDOWS_X86_64@'
  - Architecture: x86
    NestedInstallerFiles:
      - RelativeFilePath: salam-windows-i686\salam.exe
        PortableCommandAlias: salam
    InstallerUrl: https://github.com/SalamLang/Salam/releases/download/v@VERSION@/salam-@VERSION@-windows-i686.zip
    InstallerSha256: '@SHA256_WINDOWS_I686@'
ManifestType: installer
ManifestVersion: 1.12.0
