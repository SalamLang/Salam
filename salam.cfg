# Local development config: resolve std/ from this checkout instead of the
# installed prefix. Only ./salam (built into the repo root) reads this file
# directly - resolve_stdlib_root() looks for salam.cfg next to the exe.
# A binary built into compiler/ (the self-hosted bootstrap) has no cfg of
# its own; it falls through to the built-in candidate list, whose ".."
# entry lands back on this checkout's std/ anyway, so one file here is
# enough for both binary locations.
stdlib = std
