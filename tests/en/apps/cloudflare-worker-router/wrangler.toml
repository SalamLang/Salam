name = "salam-worker-router"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[build]
command = "bash build.sh"
watch_dir = "main.salam"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[vars]
APP_NAME = "salam-worker-router"
ENVIRONMENT = "production"
