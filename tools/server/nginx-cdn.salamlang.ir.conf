# cdn.salamlang.ir -> static mirror of the Salam release downloads, for users
# who cannot reach github.com. Installed as /opt/nginx/conf.d/cdn.salamlang.ir
# on the production server; files are written by tools/server/cdn-sync.py into
# /hosts/cdn.salamlang.ir (the nginx container mounts /hosts).
#
# The tree copies GitHub's paths: /releases/download/<tag>/<asset> is the same
# file as https://github.com/SalamLang/Salam/releases/download/<tag>/<asset>.
# Also served: /releases/latest, /releases/tags.txt, /releases/index.json,
# /std/<commit>.tar.gz with /std/<ref>.commit, and /install.sh, /install.ps1.
#
# GET/HEAD only, no listings, nothing is compressed (archives are already
# compressed and ranges must stay byte exact so downloads resume). nginx drops
# server-level add_header inside a location that has its own, so the headers
# are repeated per location.
#
# TLS: uses the salamlang.ir certificate. That certificate must list
# cdn.salamlang.ir (certbot --cert-name salamlang.ir --expand) or clients see a
# name mismatch and fall back to GitHub.

server {
    listen      80;
    listen      [::]:80;
    server_name cdn.salamlang.ir;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name cdn.salamlang.ir;

    ssl_certificate     /etc/letsencrypt/live/salamlang.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salamlang.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ssl_cdn_salamlang_ir:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    root /hosts/cdn.salamlang.ir;
    autoindex off;
    gzip off;
    charset utf-8;
    default_type application/octet-stream;

    access_log /var/log/nginx/cdn.salamlang.ir.access.log;
    error_log  /var/log/nginx/cdn.salamlang.ir.error.log;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = / {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 "Salam release mirror. These files are copies of https://github.com/SalamLang/Salam/releases, served by the Salam project and not by GitHub. Check the .sha256 files.\n";
    }

    location ~ ^/releases/download/[^/]+/(?<sumfile>SHA256SUMS|[^/]+\.sha256)$ {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/releases/download/[^/]+/(?<asset>[^/]+)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Disposition 'attachment; filename="$asset"' always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/releases/(latest|tags\.txt)$ {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /releases/index.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/std/[^/]+\.commit$ {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "^/std/[0-9a-f]{40}\.tar\.gz\.sha256$" {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "^/std/[0-9a-f]{40}\.tar\.gz$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/install\.(sh|ps1)$ {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
