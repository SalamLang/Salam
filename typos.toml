# Configuration for `typos`, the source-code spell checker.
# https://github.com/crate-ci/typos/blob/v1.49.0/docs/reference.md

[files]
# `prek` passes hidden tracked files explicitly, so direct `typos` runs should
# check them too. Version-control metadata remains ignored by `ignore-vcs`.
ignore-hidden = false

# Keep generated outputs and spell-checker dictionaries out of the scan. The
# latter intentionally contain misspellings and must not validate each other.
extend-exclude = [
  ".github/linters/codespell.txt",
  "_build/",
  "build/",
  "dist/",
  "node_modules/",
  "editor/assets/",
  "design/logo/",
  "extensions/vscode/icons/",
  "books/fonts/",
  "std/doc.html",
]

[default]
# Ignore encoded fixtures, hexadecimal digests, known file names, and valid
# hyphenated `mis-*` words without hiding ordinary identifiers or prose.
extend-ignore-re = [
  '[A-Za-z0-9_-]{40,}={0,2}',
  '(?i)\b[0-9a-f]{16,}\b',
  '\bconfig\.mak\b',
  '\bmis-[A-Za-z]+\b',
  # Hyphenated plural of "catch-all", used for wildcard event listeners.
  '(?i)\bcatch-alls\b',
  # Case-insensitive `sed` character classes, e.g. `[Cc]ontent-[Ll]ength`.
  '\[[A-Za-z]{2}\][A-Za-z]*',
]

# Compiler abbreviations that occur as components of longer identifiers.
extend-ignore-identifiers-re = [
  '(?i)(?:^|_)ba(?:_|$)', # block/matrix A or Barabasi-Albert value
  '(?i)^clos(?:id|_n)?$', # closure identifier / counter
  '(?i)(?:^|_)definit(?:_|$)', # definite-assignment analysis
  '(?i)(?:^|_)lok(?:_|$)', # lexer result is OK
  '^nam_chandgane$', # Persian transliteration used as a test file name
]

[default.extend-identifiers]
# Intentional short identifiers used by the compiler and tests.
eit = "eit" # entry iterator
evn = "evn" # enum value node
iy = "iy"   # image y coordinate
kend = "kend" # key end offset
mak = "mak"   # member-access kind
onn = "onn"   # object-name node
pn = "pn"     # parameter/pattern node
yout = "yout" # y-coordinate output
# IANA time-zone abbreviation for India Standard Time.
IST = "IST"

[default.extend-words]
# Established technical names and standards terminology.
Algorithmi = "Algorithmi" # historical Latin form of al-Khwarizmi's name
arange = "arange" # NumPy-compatible range constructor
fo = "fo"         # XSL Formatting Objects namespace prefix
loca = "loca"     # OpenType glyph-location table
Nd = "Nd"         # Unicode decimal-number category
ODF = "ODF"       # OpenDocument Format
olt = "olt"       # LLVM ordered-less-than predicate
paeth = "paeth"   # Paeth PNG filter
preemptable = "preemptable" # LLVM spelling in `dso_preemptable`
Stoer = "Stoer"   # Stoer-Wagner minimum-cut algorithm
teh = "teh"       # Arabic letter name / transliteration
Tham = "Tham"     # Tai Tham script
Vai = "Vai"       # Vai script
wrk = "wrk"       # HTTP benchmarking tool

[type.tex.extend-words]
# LaTeX tabular column specification (`{@{}cll@{}}`).
cll = "cll"

[type.str_unicode_classify]
extend-glob = ["str_unicode_classify.salam"]

[type.str_unicode_classify.extend-words]
# Deliberately unequal test input paired with `abc`.
abd = "abd"

[type.persian_nam]
# `nam_chandgane` is a Persian transliteration, not an English file name.
extend-glob = ["nam_chandgane.salam", "nam_chandgane.out"]
check-filename = false

[type.matrix_mul_demo]
extend-glob = ["matrix_mul_demo.salam"]

[type.matrix_mul_demo.extend-words]
# Conventional notation for the matrix product B x A.
BA = "BA"
