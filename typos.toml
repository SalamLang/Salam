# Configuration file for `typos`, a source code spell checker.
# https://github.com/crate-ci/typos
#
# Run locally with:
#   cargo install typos-cli
#   typos
#
# Or via the prek hook defined in `prek.toml` (preferred for CI).

[default]
# Identifiers (variable / function / type names) that look like typos
# but are intentional. The patterns are matched as substrings inside
# CamelCase / snake_case identifiers, so they are efficient for short
# tokens.
extend-ignore-identifiers-re = [
  # Short compiler-internal identifiers: `nd` (node/index), `ot` (other),
  # `clen` (length), `notin` (not in), `abd` (and/add). Refactor PR #1206
  # tracks renaming them.
  "^nd$",
  "^ot$",
  "^clen$",
  "^notin$",
  "^abd$",
]

# Words that appear in prose / comments / strings but are not in the
# standard dictionary. Review and prune this list periodically — if a word
# here is clearly a real typo it should be fixed in the source instead.
[default.extend-words]
# Brand: Salam is the language name (سلام in Persian).
Salam = "Salam"
# Also pre-approved by the existing codespell.txt ignore list.
abd = "abd"
algorithmi = "algorithmi"
alph = "alph"
caf = "caf"
clen = "clen"
fo = "fo"
notin = "notin"
numer = "numer"
olt = "olt"
paeth = "paeth"
te = "te"
# Common false positives observed in this codebase.
cll = "cll"     # LaTeX tabular column spec (`{@{}cll@{}}`)
UE = "UE"       # SSL certificate content (intentional base64 typos)
ba = "ba"       # LLVM IR local variable
bb = "bb"       # LLVM IR local variable
pn = "pn"       # Persian numerals
mak = "mak"     # Short variable in compiler
Clos = "Clos"   # CLOS-like acronym
clos = "clos"   # close-related
ODF = "ODF"     # Open Document Format
FIEL = "FIEL"   # Field-related acronym
ser = "ser"     # Serial-number
yout = "yout"   # "you" in phrase fragments
nam = "nam"     # name
mis = "mis"     # miscellaneous
kend = "kend"   # Korean transliteration
evn = "evn"     # even
definit = "definit" # definitive
IIF = "IIF"     # acronym
preemptable = "preemptable" # valid alternative spelling
lok = "lok"     # short identifier
onn = "onn"     # short identifier
Ded = "Ded"     # dedication
ont = "ont"     # short identifier

[type.c]
# C source files
extend-glob = ["*.c", "*.h"]

[type.rust]
# Rust source files
extend-glob = ["*.rs"]

[type.sh]
# Shell scripts
extend-glob = ["*.sh", "*.bash"]

[type.javascript]
extend-glob = ["*.js", "*.ts", "*.mjs", "*.cjs"]

[type.css]
extend-glob = ["*.css", "*.scss", "*.sass"]

[type.html]
extend-glob = ["*.html", "*.htm"]

[type.go]
extend-glob = ["*.go"]

[type.svg]
# SVG files contain embedded path data that get flagged as typos.
extend-glob = ["*.svg"]
check-file = false

[type.json]
# Generated JSON files (manifests, lockfile-dumps, etc.) are noisy.
extend-glob = ["*.json"]
check-file = false

[type.lock]
extend-glob = ["*.lock", "*.lockb"]
check-file = false

[type.bin]
extend-glob = [
  "*.png", "*.jpg", "*.jpeg", "*.gif", "*.webp", "*.ico",
  "*.woff", "*.woff2", "*.ttf", "*.otf", "*.eot",
  "*.pdf", "*.zip", "*.tar", "*.tgz", "*.gz",
  "*.mp4", "*.webm", "*.mp3", "*.wav", "*.wasm",
  "*.min.js", "*.min.css", "*.out",
]
check-file = false

[files]
# Directories that should never be walked by `typos`.
extend-exclude = [
  "_build/",
  "build/",
  "dist/",
  "node_modules/",
  "editor/assets/",
  "design/logo/",
  "extensions/vscode/icons/",
  "books/fonts/",
  "std/doc.html",
  "*.lock",
  "*.lockb",
  "*.min.js",
  "*.min.css",
  "*.wasm",
  "*.pdf",
  "*.ttf",
  "*.woff",
  "*.woff2",
  "*.otf",
  "*.eot",
  "*.zip",
  "*.tar",
  "*.tgz",
  "*.gz",
  "*.out",
  "*.png",
  "*.jpg",
  "*.jpeg",
  "*.gif",
  "*.webp",
  "*.ico",
  "*.mp4",
  "*.webm",
  "*.mp3",
  "*.wav",
]
