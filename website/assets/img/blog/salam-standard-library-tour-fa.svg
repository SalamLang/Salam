<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img">
  <title>گشتی در کتابخانه‌ی استاندارد سلام: از شبکه و رمزنگاری تا پایگاه داده، تصویر و هوش مصنوعی</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="260" fill="#10b981" opacity="0.16"/>
  <circle cx="80" cy="560" r="220" fill="#10b981" opacity="0.12"/>
  <rect x="60" y="60" width="1080" height="510" rx="34" fill="#111827" stroke="#475569"/>
  <rect x="60" y="60" width="18" height="510" rx="8" fill="#10b981"/>
  <rect x="110" y="110" rx="18" ry="18" width="200" height="46" fill="#10b981"/>
  <text x="128" y="141" font-family="Vazirmatn, DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#0f172a">ساختن با سلام</text>
  <circle cx="165" cy="320" r="54" fill="#10b981"/>
  <text x="165" y="340" text-anchor="middle" font-family="Vazirmatn, DejaVu Sans, sans-serif" font-size="56" font-weight="700" fill="#0f172a">س</text>
  <text x="250" y="235" text-anchor="start" font-family="Vazirmatn, DejaVu Sans, sans-serif" font-size="54" font-weight="700" fill="#f8fafc">گشتی در کتابخانه‌ی</text>
  <text x="250" y="303" text-anchor="start" font-family="Vazirmatn, DejaVu Sans, sans-serif" font-size="54" font-weight="700" fill="#f8fafc">استاندارد سلام: از شبکه</text>
  <text x="250" y="371" text-anchor="start" font-family="Vazirmatn, DejaVu Sans, sans-serif" font-size="54" font-weight="700" fill="#f8fafc">و رمزنگاری تا پایگاه</text>
  <text x="250" y="439" text-anchor="start" font-family="Vazirmatn, DejaVu Sans, sans-serif" font-size="54" font-weight="700" fill="#f8fafc">داده، تصویر و هوش مصنوعی</text>
  <text x="250" y="531" text-anchor="start" font-family="Vazirmatn, DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#cbd5e1">سلام بیش از ۱۷۰ بسته را همراه کامپایلر</text>
  <text x="250" y="573" text-anchor="start" font-family="Vazirmatn, DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#cbd5e1">عرضه می‌کند. این گشت آن‌ها را حوزه به</text>
  <text x="110" y="525" font-family="Vazirmatn, DejaVu Sans, sans-serif" font-size="26" fill="#d1fae5">salamlang.ir/blog</text>
  <text x="1090" y="525" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="26" fill="#10b981">تابع ریشه:  •  func main:</text>
