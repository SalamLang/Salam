      <div class="container course">
        <aside class="course-aside">
          {{pkg.sidebar}}
        </aside>
        <article class="lesson-article std-article">
          <nav class="breadcrumb" aria-label="{{learn.breadcrumb}}">
            <a href="/">{{nav.home}}</a>
            <span aria-hidden="true">›</span>
            <a href="/std/">{{nav.std}}</a>
            <span aria-hidden="true">›</span>
            <span aria-current="page">{{pkg.name}}</span>
          </nav>
          <p class="lesson-meta">{{stdref.eyebrow}} · {{pkg.group}}</p>
          <h1>{{pkg.name}}{{#if stdref.alias}} <code class="std-en" dir="ltr">{{pkg.en}}</code>{{/if}}</h1>
          <p class="lead">{{pkg.summary}}</p>
          <pre class="code std-import" dir="{{site.dir}}"><code>{{pkg.import}}</code></pre>
          {{#if pkg.toc}}
          <div class="lesson-toc">
            <strong>{{stdref.toc}}</strong>
            {{pkg.toc}}
          </div>
          {{/if}}
          <div class="lesson-body">
{{pkg.body_html}}
          </div>
        </article>
      </div>
